apiVersion: vendir.k14s.io/v1alpha1
kind: Config
directories:
  - path: charts/1password-connect
    contents:
      - path: .
        helmChart:
          name: connect
          version: 2.0.5
          repository:
            url: https://1password.github.io/connect-helm-charts
  - path: charts/ingress-nginx
    contents:
      - path: .
        helmChart:
          name: ingress-nginx
          version: 4.12.0
          repository:
            url: https://kubernetes.github.io/ingress-nginx
  - path: charts/metallb
    contents:
      - path: .
        helmChart:
          name: metallb
          version: 0.14.8
          repository:
            url: https://metallb.github.io/metallb
  - path: charts/kyverno
    contents:
      - path: .
        helmChart:
          name: kyverno
          version: 3.6.1
          repository:
            url: https://kyverno.github.io/kyverno/
  - path: charts/tailscale-operator
    contents:
      - path: .
        helmChart:
          name: tailscale-operator
          version: 1.90.9
          repository:
            url: https://pkgs.tailscale.com/helmcharts
  # NetBird Kubernetes operator — replaces the Tailscale operator as the overlay
  # network control plane (cross-cluster reachability + kube-apiserver exposure via
  # custom domains). OCI chart from GHCR, pinned to 0.7.0 (app v0.7.0). The operator
  # authenticates to the NetBird management API with a PAT (netbird-mgmt-api-key /
  # NB_API_KEY) and mints setup keys via its own CRDs.
  #
  # PINNED TO 0.7.0 (NOT the newer 0.8.0) on purpose: 0.8.0 regressed sidecar DNS
  # (netbirdio/kubernetes-operator#383 — the mesh-rewritten /etc/resolv.conf is mounted
  # only into the netbird sidecar, never the app container, so a SidecarProfile-injected
  # workload can't resolve mesh domains). 0.7.0 rewrites /etc/resolv.conf in place so the
  # app container inherits the mesh resolver — which the external-secrets sidecar (network
  # cluster) needs to reach OpenBao over the mesh. CRDs are schema-identical across 0.7.0
  # and 0.8.0 (only NetworkEgress is new in 0.8.0, unused here). Bump past 0.8.0 once the
  # fix (PR #389) is released.
  - path: charts/netbird-operator
    contents:
      - path: .
        helmChart:
          name: netbird-operator
          version: 0.7.0
          repository:
            url: oci://ghcr.io/netbirdio/helm-charts
  # Stakater Reloader — lightweight controller that watches Secrets/ConfigMaps and
  # triggers rolling restarts on Deployments/StatefulSets annotated with
  # reloader.stakater.com/auto: "true". Used for zero-downtime secret rotation: when
  # ESO refreshes a dynamic credential from the netbird secrets engine, Reloader
  # detects the Secret change and rolls the consuming workload.
  - path: charts/reloader
    contents:
      - path: .
        helmChart:
          name: reloader
          version: 2.2.17
          repository:
            url: https://stakater.github.io/stakater-charts
  - path: charts/external-dns
    contents:
      - path: .
        helmChart:
          name: external-dns
          version: 1.19.0
          repository:
            url: https://kubernetes-sigs.github.io/external-dns/
  - path: charts/coder
    contents:
      - path: .
        helmChart:
          name: coder
          version: 2.29.7
          repository:
            url: https://helm.coder.com/v2
  - path: charts/coder-logstream-kube
    contents:
      - path: .
        helmChart:
          name: coder-logstream-kube
          version: v0.0.16
          repository:
            url: https://helm.coder.com/logstream-kube
  - path: charts/kro
    contents:
      - path: .
        helmChart:
          name: kro
          version: 0.8.5
          repository:
            url: oci://registry.k8s.io/kro/charts
  - path: charts/vcluster
    contents:
      - path: .
        helmChart:
          name: vcluster
          version: 0.32.1
          repository:
            url: https://charts.loft.sh
  - path: charts/argo-cd
    contents:
      - path: .
        helmChart:
          name: argo-cd
          version: 9.5.14
          repository:
            url: https://argoproj.github.io/argo-helm
  - path: charts/k8s-gateway
    contents:
      - path: .
        helmChart:
          name: k8s-gateway
          version: 3.7.2
          repository:
            # The k8s-gateway.github.io Pages chart repo is gone (index.yaml 404s), which
            # broke `vendir sync` from scratch; upstream publishes the same charts as OCI
            # artifacts. 3.7.2 from here extracts byte-identical to the vendored copy.
            url: oci://ghcr.io/k8s-gateway/charts
  - path: charts/cert-manager
    contents:
      - path: .
        helmChart:
          name: cert-manager
          version: v1.20.3
          repository:
            url: https://charts.jetstack.io
  - path: charts/netdata
    contents:
      - path: .
        helmChart:
          name: netdata
          version: 3.7.173
          repository:
            url: https://netdata.github.io/helmchart
  - path: charts/openbao
    contents:
      - path: .
        helmChart:
          name: openbao
          version: 0.28.4
          repository:
            url: https://openbao.github.io/openbao-helm
  # TP-Link Omada SDN controller (network cluster). OCI chart from Docker Hub;
  # appVersion 6.2.14.11. Runs rootless against an EXTERNAL MongoDB (see below).
  - path: charts/omada-controller-helm
    contents:
      - path: .
        helmChart:
          name: omada-controller-helm
          version: 1.4.1
          repository:
            url: oci://registry-1.docker.io/mbentley
  # Percona Server for MongoDB Operator (network cluster). Provides the EXTERNAL
  # MongoDB for Omada: the operator GENERATES MongoDB credentials in-cluster
  # (no OpenBao path for Mongo). Pinned 1.23.0 — the first release shipping native arm64
  # for ALL images (earlier operators are amd64-only). Since 1.22 the CRDs are a separate
  # chart (psmdb-operator-crds), vendored alongside so the operator + CRDs install as one
  # umbrella bundle (apps/network/src/mongodb-operator).
  - path: charts/psmdb-operator
    contents:
      - path: .
        helmChart:
          name: psmdb-operator
          version: 1.23.1
          repository:
            url: https://percona.github.io/percona-helm-charts
  - path: charts/psmdb-operator-crds
    contents:
      - path: .
        helmChart:
          name: psmdb-operator-crds
          version: 1.23.0
          repository:
            url: https://percona.github.io/percona-helm-charts
  # Crossplane core (v2). Reconciles the OpenBao config via upbound/provider-vault
  # over OpenBao's Kubernetes auth method, replacing terranetes in apps/secret.
  # Pinned to match provider-vault v4.0.0 (which targets crossplane-runtime/v2).
  - path: charts/crossplane
    contents:
      - path: .
        helmChart:
          name: crossplane
          version: 2.3.3
          repository:
            url: https://charts.crossplane.io/stable
  - path: charts/fleet-crd
    contents:
      - path: .
        helmChart:
          name: fleet-crd
          version: 0.15.4
          repository:
            url: https://rancher.github.io/fleet-helm-charts/
  - path: charts/fleet
    contents:
      - path: .
        helmChart:
          name: fleet
          version: 0.15.4
          repository:
            url: https://rancher.github.io/fleet-helm-charts/
  # Envoy Gateway — the data plane behind every mesh-exposed service
  # (apps/platform/src/envoy-gateway + the apps/platform/src/mesh-service chart). One
  # Envoy pod per exposed service, each carrying an injected NetBird client sidecar, so
  # the service is its own mesh peer owning its full TCP/UDP port space.
  #
  # Pinned 1.9.2 for the CRDs it bundles: Gateway API v1.6.1, the first Standard-channel
  # bundle with TCPRoute + UDPRoute (verify with
  # `grep "bundle-version" charts/envoy-gateway/charts/crds/crds/gatewayapi-crds.yaml`).
  # That is the whole reason this replaces both the BYOP reverse proxy (which cannot
  # carry L4 at all — mode=tcp services silently never bind, netbirdio/netbird#6400) and
  # the NBResource path: ONE mechanism terminates HTTPS with a real certificate and
  # forwards raw TCP and UDP.
  #
  # arm64 (both vind clusters run on an arm64 Mac): control plane
  # docker.io/envoyproxy/gateway:v1.9.2 and data plane
  # docker.io/envoyproxy/envoy:distroless-v1.39.1 (resolved by the chart's _helpers.tpl,
  # since values leave the proxy image empty) both publish linux/arm64.
  - path: charts/envoy-gateway
    contents:
      - path: .
        helmChart:
          name: gateway-helm
          version: 1.9.2
          repository:
            url: oci://docker.io/envoyproxy
  # HashiCorp Vault Secrets Operator — the lease-aware consumer for the dynamic secrets
  # engines in libs/openbao-{cloudflare,netbird}-plugin.
  #
  # WHY NOT External Secrets Operator: ESO cannot hold a Vault/OpenBao lease. A secret lease is
  # a CHILD of the auth token that created it, and ESO calls RevokeSelf after every read (its own
  # fix for leaking token leases, external-secrets#376) — so the cascade destroys a leased
  # credential seconds after it lands in the Secret. Measured live: a successfully-synced token
  # answered Cloudflare 9109 twenty seconds later, with zero leases and zero tokens upstream.
  # ESO has no lease management at all and the upstream issue (external-secrets#2198) was closed
  # unfixed. VSO renews leases (renewalPercent), reissues on revoke/expire, revokes on teardown,
  # and restarts target workloads itself via rolloutRestartTargets.
  #
  # WHY NOT the OpenBao agent injector: it renders FILES into pods, so it cannot produce the
  # Kubernetes Secret that cert-manager's `apiTokenSecretRef` requires; env vars are frozen at
  # process start so they can never rotate; and it has no restart-on-change (vault-k8s#196).
  # This repo also disables that injector already — its runtime-patched webhook caBundle makes
  # Fleet's server-side apply conflict on every re-apply (see apps/secret/src/openbao/values.yaml).
  #
  # LICENSING, stated plainly: VSO is HashiCorp-licensed (BUSL), unlike OpenBao itself. It is
  # here because no OSI-licensed operator manages leases today. Re-evaluate if one appears.
  # It speaks the Vault API, so it works against OpenBao via VaultConnection.address — but its
  # issue tracker has zero OpenBao mentions, so treat OpenBao specifics as unverified upstream.
  #
  # arm64 (both vind clusters run on an arm64 Mac): hashicorp/vault-secrets-operator:1.6.0
  # publishes linux/arm64 (verified with `docker buildx imagetools inspect`).
  - path: charts/vault-secrets-operator
    contents:
      - path: .
        helmChart:
          name: vault-secrets-operator
          version: 1.6.0
          repository:
            url: https://helm.releases.hashicorp.com
  - path: shell/zimfw
    contents:
      - path: .
        githubRelease:
          slug: zimfw/zimfw
          tag: v1.18.0
          assetNames:
            - zimfw.zsh
          # No checksums exist within the release
          disableAutoChecksumValidation: true
  - path: shell/docker-in-docker
    contents:
      - path: .
        git:
          url: https://github.com/devcontainers/features
          ref: feature_docker-in-docker_2.14.0
        includePaths:
          - src/docker-in-docker/install.sh
        newRootPath: src/docker-in-docker
  - path: config/cozystack-talos-profiles
    contents:
      - path: .
        git:
          url: https://github.com/cozystack/cozystack
          ref: v1.0.2
        includePaths:
          - packages/core/talos/images/talos/**
        newRootPath: packages/core/talos/images/talos
