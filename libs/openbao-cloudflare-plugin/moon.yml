language: go
layer: library
stack: backend
tags:
  - go
tasks:
  build:
    command: bash -c "cd src && go build -o openbao-plugin-secrets-cloudflare ."
    options:
      runFromWorkspaceRoot: false

  test:
    command: bash -c "cd src && go test -v -count=1 ./..."
    options:
      runFromWorkspaceRoot: false

  docker:
    command: docker buildx build --platform linux/amd64,linux/arm64 -t openbao-plugin-secrets-cloudflare .
    options:
      runFromWorkspaceRoot: false
      runInCI: false

  release:
    command: ./release.sh
    options:
      runFromWorkspaceRoot: false
      runInCI: false

  # Print the per-architecture sha256 of the built binary — the value
  # apps/secret/src/openbao-config/plugin-cloudflare.yaml pins in the plugin catalog.
  # The catalog entry must match the binary the CLUSTER runs, so pass ARCH=amd64 only if the
  # target cluster is amd64; both vind clusters are arm64.
  plugin_sha:
    command: ./plugin-sha.sh
    options:
      runFromWorkspaceRoot: false
      runInCI: false
      cache: false
