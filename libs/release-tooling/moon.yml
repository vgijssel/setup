language: bash
layer: library
# Home for tests of the repo-level release scripts in bin/ — bin/ holds the hermit link farm,
# so it cannot itself be a moon project. The scripts under test are shared by both
# libs/openbao-*-plugin projects and by .github/workflows/publish.yaml, which is why their
# tests live in one place rather than in either consumer.
#
# See openspec/changes/release-please-openbao-plugins/design.md (D5, D6).
tasks:
  # Two scripts, two silent failure modes. registry-tag-exists reading an ambiguous probe as
  # "absent" re-pushes a live tag; openbao-plugin-pin committing one half of a pin leaves
  # Fleet deploying a plugin that fails registration with a bare "checksum mismatch". Neither
  # shows up until long after the commit, so both get tests. regctl and plugin-sha.sh are
  # stubbed, so this needs neither a network nor docker.
  test:
    command: bats tests/registry-tag-exists.bats tests/openbao-plugin-pin.bats
    options:
      runFromWorkspaceRoot: false
      cache: true
    inputs:
      - file: ./tests/registry-tag-exists.bats
      - file: ./tests/openbao-plugin-pin.bats
      - file: /bin/registry-tag-exists
      - file: /bin/openbao-plugin-pin
      - "@group(yq_bin)"
