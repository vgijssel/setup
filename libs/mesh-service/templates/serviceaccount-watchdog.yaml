{{- include "mesh-service.validate" . -}}
{{- if .Values.watchdog.enabled }}
{{/*
RBAC for this service's mesh-client watchdog (cronjob-watchdog.yaml).

The watchdog has to observe the injected NetBird client (pods/exec, to run `netbird status`) and
recycle the Envoy data-plane pod (patch the Deployment, via `kubectl rollout restart`). It also
needs to LIST deployments, because Envoy Gateway generates the Deployment name and the watchdog
finds it by its owning-gateway label rather than by a name it could be told.

Namespaced to this release: one Role per exposure, scoped to the namespace that holds it. No
cluster-scoped permission is involved.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.name }}-mesh-watchdog
  labels:
    {{- include "mesh-service.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.name }}-mesh-watchdog
  labels:
    {{- include "mesh-service.labels" . | nindent 4 }}
rules:
  # Find the Envoy pod and exec into its `netbird` sidecar to read `netbird status`.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
  # `list` to resolve the generated Envoy Deployment by its owning-gateway label; `patch` to
  # roll it out, which re-injects the client and re-enrols it with the setup key.
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.name }}-mesh-watchdog
  labels:
    {{- include "mesh-service.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.name }}-mesh-watchdog
subjects:
  - kind: ServiceAccount
    name: {{ .Values.name }}-mesh-watchdog
    namespace: {{ .Release.Namespace }}
{{- end }}
