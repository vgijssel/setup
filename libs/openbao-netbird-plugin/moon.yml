language: go
layer: library
stack: backend
tags:
  - go
  # Opts into the shared `release` task in .moon/tasks/tag-releasable.yml, and is what
  # `moon run :release --query "tag=releasable"` in publish.yaml selects on.
  - releasable
tasks:
  build:
    command: bash -c "cd src && go build -o openbao-plugin-secrets-netbird ."
    options:
      runFromWorkspaceRoot: false

  test:
    command: bash -c "cd src && go test -v -count=1 ./..."
    options:
      runFromWorkspaceRoot: false

  docker:
    command: docker buildx build --platform linux/amd64,linux/arm64 -t openbao-plugin-secrets-netbird .
    options:
      runFromWorkspaceRoot: false
      runInCI: false

  # Print the per-architecture sha256 of the binary in the published image—the value
  # apps/secret/src/openbao-config/values.yaml pins as plugins.netbird.sha256, and which
  # OpenBao requires. Normally invoked via bin/openbao-plugin-pin from CI; pass ARCH=amd64
  # only if the target cluster is amd64 (both vind clusters are arm64).
  plugin_sha:
    command: ./plugin-sha.sh
    options:
      runFromWorkspaceRoot: false
      runInCI: false
      cache: false
