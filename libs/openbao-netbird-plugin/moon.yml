language: go
layer: library
stack: backend
tags:
  - go
  # Selected by .github/workflows/release.yaml via `moon run :publish --query "tag=publish"`.
  # The tag IS the opt-in: a workflow that lists its targets is a list that goes stale, and a bare
  # `moon run :publish` would also fire the broken fleet-mcp and devcontainer scripts.
  - publish
tasks:
  # Build and push the multi-arch image for the version in version.txt, guarded by
  # bin/registry-tag-exists. Deliberately duplicated in the other plugin rather than inherited
  # from a shared tag task: the three publish targets in this repo now do genuinely different
  # things -- two push a container image, one uploads a release asset -- and a shared task would
  # have to be the union of all three. The ~15 duplicated lines are cheaper to read than a task
  # whose options only make sense for two of its three users.
  publish:
    command: ./publish.sh
    deps:
      # Compile first so a broken plugin fails before a registry probe or a push. The Dockerfile
      # builds its own binary, so this is a fast-fail, not the artifact being shipped.
      - build
    options:
      runFromWorkspaceRoot: false
      # Publishing is driven explicitly by release.yaml, never by `moon ci` on a pull request.
      runInCI: false
      # The REGISTRY is the source of truth for what has shipped, not the task hash. A cache hit
      # would return success without probing, so a tag that went missing from the registry while
      # version.txt stood still would never be re-published.
      cache: false
    # DELIBERATELY NARROW: version.txt and the probe, nothing from src/ or the Dockerfile. Adding
    # those would mean a source change with no version bump re-publishes the SAME tag with
    # different content -- tag mutation, which silently invalidates every plugin_sha256 pinned
    # against the old digest. "I changed the plugin and nothing happened" is the supported
    # outcome; bumping the version is what ships a change.
    inputs:
      - file: ./version.txt
      - file: /bin/registry-tag-exists
      - "@group(regctl_bin)"
  build:
    command: bash -c "cd src && go build -o openbao-plugin-secrets-netbird ."
    options:
      runFromWorkspaceRoot: false

  test:
    command: bash -c "cd src && go test -v -count=1 ./..."
    options:
      runFromWorkspaceRoot: false

  docker:
    command: docker buildx build --platform linux/amd64,linux/arm64 -t openbao-plugin-secrets-netbird .
    options:
      runFromWorkspaceRoot: false
      runInCI: false

  # Print the per-architecture sha256 of the binary in the published image — the value
  # apps/secret/src/openbao-config/values.yaml pins as plugins.netbird.sha256, and which
  # OpenBao requires. Normally invoked via bin/openbao-plugin-pin from CI; pass ARCH=amd64
  # only if the target cluster is amd64 (both vind clusters are arm64).
  plugin_sha:
    command: ./plugin-sha.sh
    options:
      runFromWorkspaceRoot: false
      runInCI: false
      cache: false
