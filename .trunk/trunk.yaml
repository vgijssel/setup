# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
  shell_hooks:
    enforce: true
repo:
  trunk_branch: main
plugins:
  sources:
    - id: trunk
      ref: v1.7.4
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - python@3.10.8
    - go@1.21.0
    - node@22.16.0
    - rust@1.82.0
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  files:
    - name: prose-comments
      regexes:
        - (apps|libs)/.*\.(yaml|yml)$
        - (apps|libs)/.*/templates/.*\.(tpl|txt)$
  definitions:
    - name: vale
      files: [markdown, python, prose-comments]
      tools: [vale, prose-parser]
      commands:
        - name: lint
          files: [markdown, python]
          prepare_run: vale --config .vale.ini --no-global sync
          run: vale --config .vale.ini --no-global --output=libs/prose-lint/line.tmpl ${target}
          output: regex
          parse_regex: (?P<path>.*):(?P<line>\d+):(?P<col>\d+):(?P<severity>[^:]+):(?P<code>[^:]+):(?P<message>.+)
          success_codes: [0, 1]
          read_output_from: stdout
          batch: true
        - name: comments
          files: [prose-comments]
          prepare_run: vale --config .vale.ini --no-global sync
          run: python3 libs/prose-lint/comments.py ${target}
          output: regex
          parse_regex: (?P<path>.*):(?P<line>\d+):(?P<col>\d+):(?P<severity>[^:]+):(?P<code>[^:]+):(?P<message>.+)
          success_codes: [0, 1]
          read_output_from: stdout
          batch: true
      affects_cache:
        - .vale.ini
        - libs/prose-lint/comments.py
        - libs/prose-lint/line.tmpl
  ignore:
    - linters: [vale]
      paths:
        - specs/**
        - third_party/**
        - .vale/**
        - .claude/commands/opsx/**
        - .claude/commands/speckit.*.md
        - .claude/skills/openspec-*/**
        - "**/node_modules/**"
        - "**/vendor/**"
        - "**/vendored/**"
        - "**/charts/**"
        - "**/dist/**"
        - "**/build/**"
        - "**/.venv/**"
        - "**/venv/**"
        - "**/*_pb2.py"
        - "**/*_pb2_grpc.py"
        - libs/prose-lint/tests/fixtures/**
    - linters: [ALL]
      paths:
        # Ignore all files in the tmp directory
        - tmp/**
        # Ignore examples and test files in moved rules directories
        - libs/rules_release/examples/**
        - libs/rules_task/tests/**
        - libs/external-service/tests/**
        # These files are generated by Hermit
        - bin/activate-hermit
        - bin/activate-hermit.fish
        - bin/hermit

        # Generated files from Windmill
        - apps/windmill/f/**/*.script.yaml
        - apps/windmill/f/**/flow.yaml
        - apps/haos/automations.yaml
        - third_party/vendir/charts
        - third_party/vendir/config
        - third_party/vendir/manifests
        - third_party/vendir/vendir.lock.yml
        - third_party/vendir/shell
        - .specify/**
        - libs/devenv/goss.yaml
        # VCR cassettes contain recorded HTTP interactions with secrets
        - libs/fleet-mcp/tests/cassettes/**
        # PiKVM host assets kept byte-for-byte verbatim to docs.pikvm.org for auditability
        - apps/pikvm/files/**
    # Ignore yamllint syntax errors for Helm chart templates
    - linters: [yamllint]
      paths:
        # apps/secret/src/openbao-config is a local Helm chart; its templates carry {{ }}
        - apps/secret/src/openbao-config/templates/**
        - libs/internal-dns/templates/**
        - libs/1password-secrets/templates/**
        - libs/internal-networking/templates/**
        - libs/external-service/templates/**
        - libs/underlay-networking/templates/**
        - libs/registry/templates/**
        - libs/internal-storage/templates/**
        - libs/relay-server/templates/**
        - libs/relay-server/tests/snapshot_expected.yaml
        - libs/devenv/goss.yaml
        - libs/aws-sigv4-proxy/templates/**
        - libs/tenant/templates/**
        - libs/mesh-service/templates/**
        - apps/cluster-networking/coredns-patch/templates/**
        # OpenBao ExternalSecret template embeds Helm-escaped ESO Go-templates
        - apps/secret/src/openbao/templates/**
        - apps/platform/src/netbird-reverse-proxy-shared/templates/**
        - apps/platform/src/envoy-gateway/templates/**
    # Ignore prettier syntax errors for Helm templates with complex syntax
    - linters: [prettier]
      paths:
        - libs/internal-dns/templates/**
        - libs/1password-secrets/templates/**
        - libs/internal-networking/templates/**
        - libs/external-service/templates/**
        - libs/registry/templates/**
        - libs/underlay-networking/templates/**
        - libs/internal-storage/templates/**
        - libs/relay-server/templates/**
        - libs/aws-sigv4-proxy/templates/**
        - libs/tenant/templates/**
        - apps/argocd-apps/manifests/**
        - apps/platform/src/netbird-reverse-proxy-shared/templates/**
  enabled:
    - actionlint@1.7.10
    - black@26.1.0
    - buildifier@8.2.1
    - isort@7.0.0
    - prettier@3.8.1
    - renovate@42.92.4
    - ruff@0.14.14
    - shellcheck@0.11.0
    - taplo@0.10.0
    - vale@3.13.0
    - yamllint@1.38.0
  disabled:
    # Disabled explicitly because I think these break the integration with Trunk and VSCode
    - hadolint
    - trufflehog
    - osv-scanner
    - shfmt
    - checkov
    - bandit
    - git-diff-check
    - nixpkgs-fmt
    # Got CI failure for Trivy https://github.com/vgijssel/setup/actions/runs/12617622581/job/35160087065
    - trivy
    # Use Obsidian Linter
    - markdownlint
actions:
  enabled:
    # Rejects a non-conventional commit message at the point it is written. Version decisions are
    # DERIVED from these types (release-please-config.json), so a wrongly-typed subject does not
    # merely look untidy — it silently ships nothing. Config: commitlint.config.js.
    #
    # This is the local half only. CI lints the PR TITLE instead, because this repo allows squash
    # merges only and `squash_merge_commit_title` is PR_TITLE, so the branch commit messages this
    # hook checks never reach main. See .github/workflows/test.yaml and design.md D12.
    - commitlint
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
  disabled:
    - trunk-announce
tools:
  enabled:
    - prose-parser@0.25.2
  definitions:
    - name: prose-parser
      runtime: python
      package: tree-sitter
      extra_packages: [tree-sitter-yaml==0.7.2]
      shims:
        - name: prose-python
          target: python3
      known_good_version: 0.25.2
  disabled:
    - poetry
  auto_sync: false
