# Attach the uncompressed Home Assistant OS qcow2 to the release release-please cut for it.
#
# WHY A SEPARATE WORKFLOW FROM publish.yaml. That one publishes container images to ghcr and
# selects its work with `moon run :release --query "tag=releasable"`, guarded by
# bin/registry-tag-exists. This publishes a GitHub RELEASE ASSET, guarded by the release's own
# asset list, and needs `contents: write` rather than `packages: write`. Sharing the tag would
# make publish.yaml log in to a registry it does not use and run a probe with nothing to probe.
#
# WHY `release: published` RATHER THAN `push: main`. publish.yaml races release-please: the
# release PR merging is a push to main, and at that moment release-please is still deciding
# whether to cut the tag, so a push-triggered run would usually find no release to attach to and
# would have to wait for the nightly. The `release` event fires after the release exists, which
# removes the race rather than tolerating it. release-please creates the release with
# RELEASES_TOKEN_GITHUB (a PAT), and PAT-triggered events DO start workflow runs — with
# GITHUB_TOKEN they would not, and this would never fire.
#
# The schedule and workflow_dispatch exist for the same reason they do in publish.yaml: the work
# is idempotent (asset present -> skip), so re-running is always safe, and a version that is
# declared but unpublishable alerts every night instead of failing silently once.
name: HAOS Image

on:
  release:
    types:
      - published
  # Nightly convergence. Quiet when every declared version already has its asset.
  schedule:
    - cron: 41 4 * * *
  workflow_dispatch:

permissions:
  contents: read

# Serialise. Two runs would both find the asset absent and both start a 1 GiB upload; the second
# would land on a release that already has it.
concurrency:
  group: haos-image-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the uncompressed HAOS image
    runs-on: ubuntu-latest
    permissions:
      # Upload the asset onto an existing release.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      # `gh` is preinstalled on the runner; GITHUB_TOKEN is enough here because this only uploads
      # to a release in this same repository and triggers nothing downstream.
      - name: Publish
        run: moon run haos-image:release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
