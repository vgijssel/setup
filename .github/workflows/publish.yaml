# Publish whatever each package's version.txt declares and is missing from the registry, then
# propagate the resulting pins to apps/secret.
#
# THIS WORKFLOW READS NONE OF RELEASE-PLEASE'S OUTPUTS, deliberately. release-please is a
# label state machine, not a function of repo state: a merged release PR carries
# `autorelease: pending`, tagging strips it, and on a re-run no candidate PR remains — so
# `releases_created` is false and `paths_released` is empty. Anything gated on them is skipped
# and the workflow GOES GREEN HAVING PUBLISHED NOTHING. Instead this asks the registry what is
# missing and fixes it, which makes three things true:
#
#   - re-running the WHOLE workflow after a failure is correct, not just "re-run failed jobs";
#   - GITHUB_TOKEN's push-event recursion guard stops being fatal — if a release-PR merge does
#     not fire `push`, this converges on the next push or on the nightly run;
#   - the nightly schedule is free, because the work is idempotent.
#
# The release tasks are selected by TAG rather than listed here, because a list in a workflow is
# a list that goes stale. A bare `moon run :release` would also fire the broken fleet-mcp /
# devcontainer release scripts and the carved-out talos-image.
name: Publish

on:
  push:
    branches:
      - main
  # Nightly convergence: anything declared but unpublished gets another attempt, and a healthy
  # repo is a silent no-op. A version that is declared but unpublishable therefore alerts every
  # night, which is the intended behaviour — publishing nothing must never read as success.
  schedule:
    - cron: 17 3 * * *
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Serialise: two runs would race on the pin commit below, and cancelling mid-run could abort
# between a successful push and the commit that records its checksum.
concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  publish:
    name: Publish plugin images and propagate pins
    runs-on: ubuntu-latest
    steps:
      # Fail with a sentence a human can act on. RELEASES_TOKEN_GITHUB is a PAT, PATs expire, and
      # when this one did the runs died at `actions/checkout` with "could not read Username for
      # 'https://github.com': terminal prompts disabled" — which reads like a missing username and
      # is actually an auth rejection. That went unrecognised for months. `gh` is preinstalled on
      # the runner, so this costs one API call and needs no checkout.
      - name: Check the release credential is alive
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN_GITHUB }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::RELEASES_TOKEN_GITHUB is empty or not exposed to this run."
            exit 1
          fi
          if ! login="$(gh api user --jq .login 2>&1)"; then
            echo "::error::RELEASES_TOKEN_GITHUB is set but the API rejected it — it has almost" \
                 "certainly expired. Mint a fresh vgijssel-bot PAT with 'repo' scope and update" \
                 "the secret. The API said: ${login}"
            exit 1
          fi
          echo "Authenticated as ${login}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: release:self_upgrade rebuilds its branch from origin/main, and a
          # shallow clone has no base to build on.
          fetch-depth: 0
          # vgijssel-bot, which pushes the pin branch and opens its PR. It no longer needs to
          # bypass `protected-main` — the pins arrive as a PULL REQUEST, so the ruleset's
          # pull_request and required_signatures rules are satisfied the ordinary way.
          #
          # It cannot be GITHUB_TOKEN, and not because of permissions: events triggered by
          # GITHUB_TOKEN do not start workflow runs, so a pin PR opened with it would get no CI.
          # That loses both halves of the point — the five required status checks would never
          # report, making the PR unmergeable, AND the "does this plugin actually work in the apps
          # that deploy it?" question the PR exists to answer would go unasked. See design.md D13.
          token: ${{ secrets.RELEASES_TOKEN_GITHUB }}

      - uses: ./.github/actions/setup

      # Both the registry PROBE and the push must use the same credentials. ghcr answers
      # `http 404` for a private repository probed anonymously — indistinguishable from
      # absent — so an unauthenticated probe would misread a published private tag.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Selected by TAG, not enumerated. A bare `moon run :release` would also fire the broken
      # fleet-mcp / devcontainer release scripts and the carved-out talos-image; a hand-kept list
      # here would go stale. A project is releasable because its moon.yml says
      # `tags: [releasable]` — see .moon/tasks/tag-releasable.yml.
      - name: Publish plugin images
        run: moon run :release --query "tag=releasable"

      # Only after BOTH publishes succeed. This opens (or updates) ONE pull request carrying the
      # init-container image tags and their matching catalog checksums in a single commit —
      # OpenBao rejects a registration whose checksum does not describe the binary it is handed,
      # and reports only "checksum mismatch", so the two halves can never be split.
      #
      # It is a PR and not a push to main deliberately: this is the point at which the newly
      # published plugin gets validated against the apps that deploy it. Merging the PR is what
      # makes the pins the deployed state. The task is a no-op when the pins already describe
      # what is published, so the nightly run is quiet when healthy.
      - name: Propose consumer pins
        run: |
          git config user.name vgijssel-bot
          git config user.email 147037532+vgijssel-bot@users.noreply.github.com
          moon run release:self_upgrade
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN_GITHUB }}
