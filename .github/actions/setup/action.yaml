name: Setup Environment
description: Composite action to setup environment with checkout, hermit, direnv, and 1Password secrets
runs:
  using: composite
  steps:
    - name: Disk usage before cleanup
      shell: bash
      run: |
        echo "=== Disk usage before cleanup ==="
        df -h

    - name: Free Disk Space for Docker
      uses: endersonmenezes/free-disk-space@v3
      with:
        remove_android: true
        remove_dotnet: true
        remove_haskell: true
        rm_cmd: rmz # Faster cleanup

    - name: Disk usage after cleanup
      shell: bash
      run: |
        echo "=== Disk usage after cleanup ==="
        df -h

    - name: Init Hermit
      uses: cashapp/activate-hermit@v1
      with:
        cache: true

    - name: Setup direnv
      # Pinned to v1.3.7's commit SHA. The floating @v1 tag was moved ahead of
      # the v1.4.0 release to a commit that verifies release-asset digests via an
      # unauthenticated GitHub API call, which rate-limits (HTTP 403) on shared
      # runners. v1.3.7 downloads direnv directly without that call.
      uses: HatsuneMiku3939/direnv-action@5fe57fa0cfa35641b8dcbb724b39b613f32080d7 # v1.3.7
      with:
        direnvVersion: 2.37.1

    - name: Create empty .env
      shell: bash
      run: touch .env

    - name: Set up QEMU for multi-platform builds
      if: runner.os == 'Linux'
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx for multi-platform builds
      if: runner.os == 'Linux'
      uses: docker/setup-buildx-action@v3
