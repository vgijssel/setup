# ingress-nginx (rke2's default controller). Its external controller Service is a
# LoadBalancer with loadBalancerClass=tailscale, so the Tailscale operator fronts
# it on the tailnet and writes the tailnet IP into the Service's loadBalancer
# status — the ONLY way in is via the tailnet. external-dns (source=service) reads
# that IP and the hostname annotation and publishes secret.vgijssel.nl in
# Cloudflare. TLS terminates here on the cert-manager LE cert carried by the
# OpenBao Ingress (apps/secret/config/ingress-openbao.yaml).
ingress-nginx:
  controller:
    replicaCount: 1
    service:
      type: LoadBalancer
      loadBalancerClass: tailscale
      annotations:
        tailscale.com/hostname: secret
        external-dns.alpha.kubernetes.io/hostname: secret.vgijssel.nl
