# Syncs the Netdata Cloud claim token from OpenBao. Requires
# kv/netdata#claim_token to be seeded in OpenBao.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netdata-claim
  namespace: netdata
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: netdata-claim
    creationPolicy: Owner
  data:
    - secretKey: NETDATA_CLAIM_TOKEN
      remoteRef:
        key: netdata
        property: claim_token
