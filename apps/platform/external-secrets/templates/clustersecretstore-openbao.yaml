# Cluster-wide store that all ExternalSecrets read from. Backed by OpenBao
# (Vault-compatible) reachable via the stable Tailscale Service endpoint.
# Authenticates with the operator's ServiceAccount via OpenBao's Kubernetes
# auth method, so no static token is ever written to disk. This store stays
# NotReady until OpenBao is deployed (apps/secret / T4) and initialised with
# the kubernetes auth method + `external-secrets` role (bootstrap init / T5).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: https://secrets.vgijssel.nl
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
