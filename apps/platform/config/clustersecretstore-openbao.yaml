# Cluster-wide store that all ExternalSecrets read from. In-cluster ESO reaches
# OpenBao directly over the ClusterIP service (external tofu consumers use the
# stable Tailscale Service secrets.vgijssel.nl instead) — this breaks the
# bootstrap cycle where reaching OpenBao would otherwise require the Tailscale
# operator, whose own OAuth secret comes from OpenBao. Authenticates with the
# operator's ServiceAccount via OpenBao's Kubernetes auth method, so no static
# token is written to disk. Stays NotReady until OpenBao is deployed
# (apps/secret / T4) and initialised with the kubernetes auth method +
# `external-secrets` role (bootstrap init / T5).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: http://openbao.secret.svc:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
