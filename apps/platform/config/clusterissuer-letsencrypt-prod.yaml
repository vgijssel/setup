# Let's Encrypt production issuer. TLS for the *.vgijssel.nl hostnames is
# solved over Cloudflare DNS-01 (Tailscale's built-in certs only cover the
# tailnet DNS name), so we bring our own cert here. Stays NotReady until the
# cloudflare-api-token ExternalSecret below is populated from OpenBao.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: maarten@vgijssel.nl
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
