# Syncs the Tailscale operator OAuth client from OpenBao into the
# `operator-oauth` secret the operator expects. Requires kv/tailscale with
# `oauth_client_id` and `oauth_client_secret` seeded in OpenBao.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: operator-oauth
  namespace: tailscale
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: operator-oauth
    creationPolicy: Owner
  data:
    - secretKey: client_id
      remoteRef:
        key: tailscale
        property: oauth_client_id
    - secretKey: client_secret
      remoteRef:
        key: tailscale
        property: oauth_client_secret
