# Portable Fleet bundle for terranetes-controller. Fleet detects the umbrella
# Chart.yaml here and deploys it with values.yaml into terranetes-system. The
# controller runs OpenTofu to reconcile the network cluster's Terraform modules.
#
# network-ONLY. The secret cluster migrated off terranetes to Crossplane
# (apps/secret/src/crossplane*), but bin/fleet-apply applies every bundle globally,
# so keeping terranetes off secret is a targeting concern, not an omission: target
# only the network cluster. Declaring targetCustomizations replaces Fleet's implicit
# deploy-everywhere, so the secret cluster gets no terranetes BundleDeployment (and
# the amd64-only controller image never lands there). Leave it deploying for network.
defaultNamespace: terranetes-system
helm:
  releaseName: terranetes-controller
targetCustomizations:
  - name: network
    clusterSelector:
      matchLabels:
        cluster.vgijssel.nl/name: network
