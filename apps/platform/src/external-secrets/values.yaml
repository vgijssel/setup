# external-secrets operator, reduced to the ONE job it still has.
#
# Every OpenBao-backed secret on both clusters moved to Vault Secrets Operator, because ESO
# cannot hold an OpenBao lease: a secret lease is a child of the auth token that created it, and
# ESO calls RevokeSelf after every read (its own fix for leaking token leases,
# external-secrets#376), so a leased credential is destroyed seconds after it lands in the Secret.
#
# What is left is a single ExternalSecret that has nothing to do with OpenBao:
# apps/network/src/omada/templates/externalsecret-mongodb-uri.yaml reads a Percona-generated
# connection string out of the mongodb namespace through ESO's KUBERNETES provider, reshaping it
# on the way. VSO only speaks the Vault API, so it cannot replace that — hence ESO survives, on
# the network cluster only (see fleet.yaml).
external-secrets:
  installCRDs: true

  # The validating webhook is NOT needed and is dropped: the CRDs declare
  # `spec.conversion.strategy: None` (verified live on both clusters), so nothing depends on it
  # for conversion — it only validates resources on admission. With exactly one ExternalSecret,
  # authored in git and reviewed, that validation buys nothing and costs a Deployment plus a
  # webhook in the API request path for every ExternalSecret write.
  webhook:
    create: false

  # The cert-controller exists ONLY to issue and rotate the webhook's serving certificate, so it
  # has nothing left to do once the webhook is gone.
  certController:
    create: false
