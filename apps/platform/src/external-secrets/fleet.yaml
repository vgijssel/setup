# Portable Fleet bundle for the external-secrets operator. Fleet detects the
# umbrella Chart.yaml in this directory and deploys it (its values.yaml is the
# chart's own values, applied automatically). Same file, both worlds: `fleet
# apply` now and a Rancher GitRepo pointed at this path later.
defaultNamespace: external-secrets
helm:
  releaseName: external-secrets
# Multi-cluster: deploys on BOTH the secret and network clusters. Declaring
# targetCustomizations replaces Fleet's implicit deploy-everywhere, so global
# bin/fleet-apply only creates BundleDeployments on these named clusters.
targetCustomizations:
  - name: secret
    clusterSelector:
      matchLabels:
        cluster.vgijssel.nl/name: secret
  - name: network
    clusterSelector:
      matchLabels:
        cluster.vgijssel.nl/name: network
