# Portable Fleet bundle for Netdata. Fleet detects the umbrella Chart.yaml here
# and deploys it with values.yaml. Claiming needs the netdata-claim Secret (synced
# from OpenBao by ../config); until it exists the agents run unclaimed, which is
# the expected bootstrap state.
defaultNamespace: netdata
helm:
  releaseName: netdata
# Multi-cluster: deploys on BOTH the secret and network clusters. Declaring
# targetCustomizations replaces Fleet's implicit deploy-everywhere, so global
# bin/fleet-apply only creates BundleDeployments on these named clusters.
targetCustomizations:
  - name: secret
    clusterSelector:
      matchLabels:
        cluster.vgijssel.nl/name: secret
  - name: network
    clusterSelector:
      matchLabels:
        cluster.vgijssel.nl/name: network
