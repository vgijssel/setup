# vault-config-operator reconciles OpenBao (kv engine, policies, Kubernetes auth
# roles) from the CRs in apps/secret/config. It points at the in-cluster OpenBao
# ClusterIP service; the same address ESO's ClusterSecretStore uses.
#
# The operator adopts whatever the init-openbao.sh seam plants (see T5a), so it
# errors-and-retries while OpenBao is sealed/unconfigured and converges once the
# seam runs — a broken boot state is expected and fine.
vault-config-operator:
  # Metrics ServiceMonitor needs the Prometheus operator CRDs, which the homelab
  # does not run (Netdata handles observability).
  enableMonitoring: false
  # cert-manager (shipped in apps/platform) issues the webhook serving cert. With
  # this false the manager pod hangs waiting on a missing webhook-server-cert.
  enableCertManager: true
  env:
    - name: VAULT_ADDR
      value: http://openbao.secret.svc:8200
