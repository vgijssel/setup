# Portable Fleet bundle for cert-manager. Fleet detects the umbrella Chart.yaml
# here and deploys it with values.yaml (CRDs enabled). The controller runs without
# any secret; only the Cloudflare DNS-01 ClusterIssuer (../config) needs the
# cloudflare token, seeded later.
defaultNamespace: cert-manager
helm:
  releaseName: cert-manager
# Multi-cluster: deploys on BOTH the secret and network clusters. The selectors alone do
# NOT restrict anything under a Rancher GitRepo, which appends its own catch-all target —
# the terminal doNotDeploy entry below is what keeps this off every other cluster.
targetCustomizations:
  - name: secret
    clusterSelector:
      matchLabels:
        cluster.vgijssel.nl/name: secret
  - name: network
    clusterSelector:
      matchLabels:
        cluster.vgijssel.nl/name: network
  # Terminal catch-all. Targets are first-match-wins and a GitRepo APPENDS its own target
  # after these, so without this a non-matching cluster falls through to it and deploys with
  # default values. Keeps this bundle off every cluster not named above. See bin/fleet-lint-targets.
  - name: none
    doNotDeploy: true
    clusterSelector: {}
