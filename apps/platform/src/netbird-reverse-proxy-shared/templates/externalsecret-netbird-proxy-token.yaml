{{- include "netbird-reverse-proxy-shared.validate" . -}}
# Generates a dynamic BYOP proxy management token from the openbao-plugin-secrets-netbird
# engine. Each refresh (every 180 days) mints a fresh proxy token; the previous one remains
# valid in NetBird until its TTL expires (365 days), providing overlap for zero-downtime
# rotation. The vendored netbird-reverse-proxy chart consumes the resulting Secret via
# proxy.managementServer.auth.existingSecret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbird-proxy-token
  namespace: netbird
spec:
  refreshInterval: 4320h
  secretStoreRef:
    name: openbao-netbird
    kind: ClusterSecretStore
  target:
    name: netbird-proxy-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: proxy-token/{{ .Values.tokenKvPath }}
        property: token
