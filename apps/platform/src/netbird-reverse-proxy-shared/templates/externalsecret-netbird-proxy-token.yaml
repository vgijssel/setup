{{- include "netbird-reverse-proxy-shared.validate" . -}}
# Surfaces the BYOP proxy's management token from OpenBao into the `netbird` namespace as a
# Secret named `netbird-proxy-token` (key `token`), which the vendored netbird-reverse-proxy
# chart consumes via proxy.managementServer.auth.existingSecret. The token is minted once via
# POST /api/reverse-proxies/proxy-tokens and written to kv/{{ .Values.tokenKvPath }}#token — it
# is shown only once by the API, so it lives in OpenBao, not in git. Reads via the LOCAL
# `openbao` ClusterSecretStore (in-cluster kubernetes auth against this cluster's OpenBao view —
# the same store the rest of the cluster uses).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbird-proxy-token
  namespace: netbird
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: netbird-proxy-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: {{ .Values.tokenKvPath }}
        property: token
