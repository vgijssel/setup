{{- include "netbird-reverse-proxy-shared.validate" . -}}
# Publicly-trusted TLS cert for the BYOP reverse proxy's client-facing listener. On the private
# (NetBird-Only) path NetBird does NOT auto-provision a cert (that's only for public services on
# the shared cloud cluster), so the proxy must serve its own — cert-manager issues it here.
#
# Wildcard *.{{ .Values.domain }} covers every private service this proxy fronts, so a
# browser/curl over the mesh gets a trusted cert with no name-mismatch warning. Issued over
# Cloudflare DNS-01 by the shared letsencrypt-prod ClusterIssuer (wildcards require DNS-01).
# cert-manager writes the chain into the netbird-reverse-proxy-cert Secret, which the proxy
# mounts at /certs (proxy.tls.source=secret) and hot-reloads on renewal without a restart.
#
# NOTE the secretName is deliberately NOT the vendored chart's own self-signed secret name
# (netbird-reverse-proxy-tls) — sharing it makes Helm and cert-manager both claim ownership, and
# flipping proxy.tls.source to `secret` would have Helm prune the self-signed secret out from
# under cert-manager. A distinct name keeps cert-manager the sole owner.
#
# Wildcard is *.{{ .Values.domain }}, NOT *.vgijssel.nl: TLS wildcards (RFC 6125) match exactly
# one label, so a bare apex wildcard is invalid for a two-label service name. (Distinct from
# Cloudflare's DNS wildcard, which resolves at arbitrary depth.) Every service this proxy fronts
# is <svc>.{{ .Values.domain }}, so one wildcard fits.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: netbird-reverse-proxy
  namespace: netbird
spec:
  secretName: netbird-reverse-proxy-cert
  dnsNames:
    - "*.{{ .Values.domain }}"
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
