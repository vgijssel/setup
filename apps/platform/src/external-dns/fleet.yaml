# Portable Fleet bundle for external-dns. Fleet detects the umbrella Chart.yaml
# here and deploys it with values.yaml. Needs the external-dns-cloudflare-api-token
# Secret (synced from OpenBao by ../config); until that exists external-dns
# crash-loops on the missing token, which is expected during bootstrap.
defaultNamespace: external-dns
helm:
  releaseName: external-dns
# Multi-cluster: both clusters run external-dns against the SAME Cloudflare zone
# (vgijssel.nl), so each MUST use a distinct txtOwnerId or one cluster's external-dns
# would treat the other's records as orphans and delete them (SPEC R7, a hard
# boundary). Each target sets txtOwnerId EXPLICITLY — neither relies on the base
# values.yaml default. A missed/stale default here is not cosmetic: if both clusters
# ever resolve to the same owner id they fight, one deleting the other's records every
# reconcile (observed: `secret` briefly ran the `network-cluster` id and kept deleting
# omada.network.vgijssel.nl). Declaring targetCustomizations also gates membership to
# these two labels (replacing Fleet's implicit deploy-everywhere target).
targetCustomizations:
  - name: secret
    clusterSelector:
      matchLabels:
        cluster.vgijssel.nl/name: secret
    helm:
      values:
        external-dns:
          txtOwnerId: secret-cluster
  - name: network
    clusterSelector:
      matchLabels:
        cluster.vgijssel.nl/name: network
    helm:
      values:
        external-dns:
          txtOwnerId: network-cluster
