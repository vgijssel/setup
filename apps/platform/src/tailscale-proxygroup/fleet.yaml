# Raw-manifest Fleet bundle carrying just the secret-ingress ProxyGroup (a
# cluster-scoped tailscale.com CR). Split out of the tailscale-operator bundle and
# gated on it via dependsOn (label selector, so it stays portable across the
# standalone Fleet -> Rancher GitRepo move): Fleet only deploys this once the
# operator bundle is Ready, guaranteeing the ProxyGroup CRD is established first.
# Without this, a fresh-cluster Helm install of the operator+CR deadlocks (the CR's
# CRD isn't registered yet in the same release).
dependsOn:
  - selector:
      matchLabels:
        fleet.vgijssel.nl/bundle: tailscale-operator
# secret-ONLY. This bundle carries the `secret-ingress` ProxyGroup (a raw CR whose
# name can't be templated per-cluster without switching to Helm, which would add
# Helm metadata and break secret's byte-identical rendering). So it stays gated to
# `secret`; the network cluster gets its own `network-ingress` ProxyGroup as a
# separate bundle under apps/network/src (SPEC: the Omada VIP's ProxyGroup). A single
# secret target replaces Fleet's implicit deploy-everywhere target — no
# BundleDeployment on `network`.
targetCustomizations:
  - name: secret
    clusterSelector:
      matchLabels:
        cluster.vgijssel.nl/name: secret
