# The operator reads its NetBird management API PAT from a precreated Secret named
# `netbird-mgmt-api-key` (key `NB_API_KEY`), populated by the per-cluster
# ExternalSecret in apps/{network,secret}/src/config. Until that Secret exists the
# operator stays not-Ready, which is expected during bootstrap — the same
# chicken-and-egg the prior operator's operator-oauth Secret had.
#
# Values are keyed under the subchart name (`netbird-operator`). `cluster.name` is set
# per-cluster in fleet.yaml's targetCustomizations (it names the NetBird network +
# resources the operator creates), so neither cluster inherits a shared default.
netbird-operator:
  # Default NetBird Cloud management API. Kept explicit (not a scattered literal) so a
  # future self-hosted cutover only edits this one value.
  netbirdAPI:
    keyFromSecret:
      name: netbird-mgmt-api-key
      key: NB_API_KEY
  # Let the operator mint NetBird access policies for NBResources.
  #
  # MUST STAY ON, and the reason is no longer the one this comment used to give. There are no
  # `netbird.io/expose` / `netbird.io/policy*` Service annotations left anywhere in the repo —
  # mesh exposure is the per-service Envoy peer model (apps/platform/src/mesh-service), whose
  # policies are OpenTofu Workspaces and need nothing from this flag.
  #
  # What still needs it is the ONE documented device exception:
  # apps/network/src/omada/templates/nbresource-omada-devices.yaml declares `policyName` +
  # `policySourceGroups`, and the operator mints "Autogenerated policy for resource
  # omada/omada-devices ... TCP/UDP" from them. This flag gates exactly that. Turning it off
  # would silently strip the device path's access policy — Omada's APs and switches cannot be
  # mesh peers, so they have no other route.
  #
  # And there is no alternative on operator v0.7.0: a standalone `NBPolicy` is an AGGREGATOR
  # that creates nothing by itself, so an NBResource's own `policy*` fields are the only working
  # declarative route to a resource-backed policy.
  #
  # Blast radius is therefore bounded to that single resource rather than to every annotated
  # Service, which is strictly narrower than when this flag was first enabled.
  ingress:
    allowAutomaticPolicyCreation: true
  operator:
    podAnnotations:
      reloader.stakater.com/auto: "true"
