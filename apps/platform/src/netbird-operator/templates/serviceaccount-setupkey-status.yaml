# RBAC for the SetupKey status reconciler (cronjob-setupkey-status.yaml).
#
# Scoped as tightly as the job can work with, and the scoping is the reason this approach was
# chosen over the obvious alternative. The other way to make the operator record the generation is
# to delete the Secret it derives (`setup-key-<name>`), which sends it down its create path — but
# SetupKeys live in several namespaces (`netbird`, plus the release namespace of every mesh
# exposure: `secret`, `omada`, ...), RBAC cannot wildcard `resourceNames`, and so that job would
# need cluster-wide `delete` on Secrets. On these clusters that includes the OpenBao seal key.
#
# Patching `setupkeys/status` instead needs no Secret access at all: it can touch exactly one
# subresource of one CRD and nothing else in the cluster.
#
# ClusterRole rather than Role because SetupKeys are not confined to one namespace — the
# mesh-service chart renders one into the namespace of whatever Service it publishes.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: netbird-setupkey-status
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: netbird-setupkey-status
rules:
  # Find SetupKeys whose status lags their spec.
  - apiGroups: [netbird.io]
    resources: [setupkeys]
    verbs: [get, list]
  # Write the one field the operator forgets. Nothing else, and no access to the spec.
  - apiGroups: [netbird.io]
    resources: [setupkeys/status]
    verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: netbird-setupkey-status
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: netbird-setupkey-status
subjects:
  - kind: ServiceAccount
    name: netbird-setupkey-status
    namespace: {{ .Release.Namespace }}
