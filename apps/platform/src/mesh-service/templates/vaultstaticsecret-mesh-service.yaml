{{- include "mesh-service.validate" . -}}
{{/*
This service's TLS material, pulled from OpenBao rather than issued here.

It is ONE wildcard certificate for `*.<domain>`, issued once on the secret cluster
(apps/secret/src/mesh-tls) and published to `kv/mesh-tls`. Every exposure on both clusters reads
that same entry, so adding a service involves no ACME interaction at all.

This template REPLACES a per-service cert-manager `Certificate`. The reasoning for the switch —
Let's Encrypt rate limits across repeated cold starts, keeping mesh service names out of public
Certificate Transparency logs, one ACME interaction instead of N — and the cost it buys them with
(one private key now covers every mesh hostname on both clusters) are recorded in
apps/secret/src/mesh-tls/fleet.yaml. Read that before reverting to per-service issuance.

Consequences worth knowing:

  * The chart no longer depends on cert-manager or on a ClusterIssuer. It depends on Vault Secrets
    Operator and on `kv/mesh-tls` being populated. A fresh cluster will therefore sit without a
    certificate until the secret cluster has issued and published one — Pending, not broken, and
    Fleet reconciles into it.
  * The consuming namespace must be allow-listed for VSO (`allowedNamespaces` in
    ../../vault-secrets-operator/fleet.yaml) AND bound on the OpenBao role for that cluster, with
    a `vault-secrets-operator` ServiceAccount present in the namespace. Miss any of the three and
    this fails with an authentication error that does not mention namespaces.

The Secret name and shape are UNCHANGED from the cert-manager version — `<name>-mesh-tls`,
type `kubernetes.io/tls`, keys `tls.crt`/`tls.key` — so the Gateway's `certificateRefs` and
everything downstream are untouched by the switch.

The Secret is deliberately per-SERVICE rather than one shared Secret per namespace, even though
every copy holds identical bytes. A fixed shared name would collide if two exposures ever landed
in one namespace: both Helm releases would claim the same object. A few duplicated copies cost
nothing; two releases fighting over one Secret costs an outage.

Envoy Gateway reads the Secret itself and delivers the certificate over xDS, so nothing mounts it
and no `rolloutRestartTargets` is needed — unlike cert-manager's DNS-01 solver, which did need a
restart to pick up a rotated token.
*/}}
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ .Values.name }}-mesh-tls
  labels:
    {{- include "mesh-service.labels" . | nindent 4 }}
spec:
  # Uses the cluster's default VaultConnection + VaultAuth: kubernetes auth over the in-cluster
  # ClusterIP on the secret cluster, JWT over the mesh on the network cluster. Naming neither is
  # what lets one chart serve both.
  type: kv-v2
  mount: {{ .Values.tls.mount | quote }}
  path: {{ .Values.tls.path | quote }}
  # Short on purpose. Nothing notifies this when the wildcard is renewed — cert-manager rewrites
  # its Secret, the publishing Workspace copies it to kv on its next reconcile, and this is the
  # last hop. The default refresh would leave a renewed certificate undelivered for far longer
  # than necessary.
  refreshAfter: 1h
  destination:
    name: {{ .Values.name }}-mesh-tls
    create: true
    # Takes over a Secret that already exists. Required here, not defensive: this name was
    # previously created by cert-manager from a per-service Certificate, and cert-manager sets no
    # ownerReference by default (`--enable-certificate-owner-ref` is off), so pruning the
    # Certificate leaves the old Secret behind and VSO's create would be blocked by it. The CRD
    # documents this field for exactly this case — "useful when migrating to VSO from a previous
    # secret deployment strategy".
    #
    # It also makes the handover non-destructive in the right direction: if the kv read fails, VSO
    # leaves the existing Secret untouched rather than emptying it, so the old certificate keeps
    # serving until a new one is genuinely available.
    overwrite: true
    # Gateway API requires the referenced Secret to be a TLS Secret, so this is not cosmetic —
    # with the default (Opaque) the listener rejects the ref instead of serving.
    type: kubernetes.io/tls
    transformation:
      # The kv entry stores `tls.crt` and `tls.key` under exactly those names, so there is nothing
      # to rename — only the operator's own `_raw` field to drop, which would otherwise ship a
      # second copy of the private key into the Secret for no consumer.
      excludeRaw: true
