{{- include "mesh-service.validate" . -}}
{{- if .Values.publicDns.enabled }}
{{/*
RBAC for the `public-dns` publisher sidecar in envoyproxy-mesh-service.yaml, which writes this
service's current overlay address into a DNSEndpoint for external-dns to publish.

THE SUBJECT IS ENVOY GATEWAY'S GENERATED ServiceAccount, not one this chart creates. Envoy
Gateway owns the data-plane Deployment and names its ServiceAccount after the Gateway, so the
sidecar — which runs inside that Deployment's pod — authenticates as `<name>-mesh`. The
EnvoyProxy pins that name explicitly rather than relying on the default (see
`envoyServiceAccount` there), so this binding and that pod cannot drift apart silently: a wrong
name here produces a Forbidden in the sidecar's log, which is at least loud.

Scope is one namespace, one resource, ONE OBJECT BY NAME, and two verbs. The publisher only ever
patches the DNSEndpoint the chart renders for this service, so `get` + `patch` is the whole
requirement.

That narrowing is a direct consequence of the chart owning the object rather than the sidecar
creating it (see dnsendpoint-mesh-service.yaml). `create` is gone — and with it the reason this
Role could not use `resourceNames`, since `create` cannot be constrained by name in Kubernetes
RBAC (the object does not exist yet, so the authorizer has nothing to match). `delete` is gone
too, because teardown is Helm's job now; the sidecar deleting the record on the way out is what
opened an NXDOMAIN window on every rollout.

So a compromised data-plane pod can rewrite the address of the one DNS name it already serves,
and nothing else — not create new names, not delete existing ones, not enumerate them
(`list`/`watch` are deliberately absent).
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "mesh-service.gatewayName" . }}-public-dns
  labels:
    {{- include "mesh-service.labels" . | nindent 4 }}
rules:
  - apiGroups: [externaldns.k8s.io]
    resources: [dnsendpoints]
    resourceNames: [{{ include "mesh-service.gatewayName" . }}]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "mesh-service.gatewayName" . }}-public-dns
  labels:
    {{- include "mesh-service.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "mesh-service.gatewayName" . }}-public-dns
subjects:
  - kind: ServiceAccount
    name: {{ include "mesh-service.gatewayName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
