{{- include "mesh-service.validate" . -}}
{{- if .Values.watchdog.enabled }}
{{/*
Self-heal watchdog for this service's injected mesh client.

WHY: the client logs in ONCE, at pod start, with the setup key. If management later forces a
re-auth — a host VM suspend/resume, or a login expiry — it drops to a terminal state and never
re-auths on its own. The Gateway still reports Programmed and the pod stays Running, so the
service is simply unreachable with nothing reporting an error. Disabling account-wide peer login
expiration removes the dominant cause; this stays as defence in depth because suspend/resume
still triggers it, and this repo has lost services to exactly that more than once.

DETECTION IS ON THE OUTPUT, NOT THE EXIT STATUS. `netbird status` exits 0 while the session is
dead — this is the single most important line in the file. Anything keying off `$?`, a
`status: ok` field, or a probe's success would report healthy for a service that answers nothing.

The Envoy Deployment name is GENERATED by Envoy Gateway, so it is found by its owning-gateway
label rather than hardcoded. A failed exec means the pod is rolling or not yet ready, so the
cycle is skipped — never race an in-flight restart.

THAT LABEL MUST COME FROM `mesh-service.gatewayName`, NOT FROM `.Values.name`. The Gateway is
`<name>-mesh`, not `<name>` (see gateway-mesh-service.yaml for why — a bare `<name>` collides with
the backing workload's own ServiceAccount and Service under `deploy.type: GatewayNamespace`).
Using `.Values.name` here made the selector match nothing, so the watchdog took the
"no Envoy deployment yet" branch and exited 0 FOREVER — a watchdog that reported success every
five minutes while doing nothing at all.

That is not hypothetical: it is how this chart shipped between the 5.2 Gateway rename and
2026-10-06, and it was found the hard way. All three mesh services' peers were reaped (the
enrolment keys are ephemeral and the host slept overnight, so every peer passed NetBird's offline
timeout), every sidecar sat in `Daemon status: SessionExpired`, and three CronJobs kept completing
cleanly. Both halves had been "verified" in isolation — the grep against sample output, the
Gateway rename against the Gateway — and the seam between them was what broke.
*/}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.name }}-mesh-watchdog
  labels:
    {{- include "mesh-service.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.watchdog.schedule | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            {{- include "mesh-service.labels" . | nindent 12 }}
        spec:
          serviceAccountName: {{ .Values.name }}-mesh-watchdog
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: watchdog
              image: {{ .Values.watchdog.image | quote }}
              env:
                - name: HOME
                  value: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              command:
                - /bin/sh
                - -c
                - |
                  set -u
                  ns={{ .Release.Namespace }}
                  # The GATEWAY's name (`<name>-mesh`), not the service name — see the header.
                  # Getting this wrong makes the selector below match nothing and turns the whole
                  # watchdog into a no-op that still exits 0.
                  gw={{ include "mesh-service.gatewayName" . }}

                  # Envoy Gateway generates the data-plane Deployment name, so find it by the
                  # label it stamps with this Gateway's name.
                  dep="$(kubectl -n "$ns" get deploy \
                    -l gateway.envoyproxy.io/owning-gateway-name="$gw" \
                    -o name 2>/dev/null | head -1)"
                  if [ -z "$dep" ]; then
                    # Expected only on a cold start, before Envoy Gateway has built the data
                    # plane. If this repeats, SUSPECT THE SELECTOR rather than the cluster: a
                    # label mismatch is indistinguishable from "not created yet" from here, and
                    # that ambiguity is what hid a broken watchdog for a day.
                    echo "watchdog: no Envoy deployment matching" \
                         "gateway.envoyproxy.io/owning-gateway-name=$gw in $ns;" \
                         "skipping this cycle (if persistent, the selector is wrong)"
                    exit 0
                  fi

                  # `netbird status` EXITS 0 EVEN WHEN THE SESSION IS DEAD, so the decision is
                  # made on the output. A non-zero exec means the pod is rolling / not ready —
                  # skip rather than restart something already restarting.
                  if ! status="$(kubectl -n "$ns" exec "$dep" -c netbird -- netbird status 2>&1)"; then
                    echo "watchdog: cannot reach $dep netbird sidecar (rolling / not ready); skipping this cycle"
                    printf '%s\n' "$status"
                    exit 0
                  fi
                  printf '%s\n' "$status"

                  # Terminal states the daemon cannot leave without re-running `netbird up`,
                  # which only happens at pod start -> recycle the proxy. The new pod re-injects
                  # the client, re-enrols with the setup key and re-claims the DNS label.
                  if printf '%s' "$status" | grep -qE 'Daemon status: (NeedsLogin|SessionExpired|LoginFailed)'; then
                    echo "watchdog: $gw mesh client session is dead -> kubectl rollout restart $dep"
                    kubectl -n "$ns" rollout restart "$dep"
                  else
                    echo "watchdog: $gw mesh client session healthy"
                  fi
          volumes:
            - name: tmp
              emptyDir: {}
{{- end }}
