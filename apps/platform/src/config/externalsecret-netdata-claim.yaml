# Syncs the Netdata Cloud claim parameters from OpenBao into env-var-named keys
# the netdata chart consumes via envFrom (NETDATA_CLAIM_TOKEN / _URL / _ROOMS).
# Requires kv/netdata with claim_token, claim_url, and room_ids seeded in OpenBao.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netdata-claim
  namespace: netdata
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: netdata-claim
    creationPolicy: Owner
  data:
    - secretKey: NETDATA_CLAIM_TOKEN
      remoteRef:
        key: netdata
        property: claim_token
    - secretKey: NETDATA_CLAIM_URL
      remoteRef:
        key: netdata
        property: claim_url
    - secretKey: NETDATA_CLAIM_ROOMS
      remoteRef:
        key: netdata
        property: room_ids
