# Syncs the Cloudflare API token (Zone:Read + DNS:Edit) from OpenBao for
# external-dns to manage the openbao.secret.vgijssel.nl record. Reuses kv/cloudflare#credential
# (the same token cert-manager's DNS-01 solver uses). Requires kv/cloudflare#credential
# seeded in OpenBao.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-dns-cloudflare-api-token
  namespace: external-dns
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: external-dns-cloudflare-api-token
    creationPolicy: Owner
  data:
    - secretKey: api-token
      remoteRef:
        key: cloudflare
        property: credential
