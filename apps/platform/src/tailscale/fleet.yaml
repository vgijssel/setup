# Portable Fleet bundle for the Tailscale operator. Fleet detects the umbrella
# Chart.yaml here and deploys it with values.yaml. The operator reads its OAuth
# client from the precreated `operator-oauth` Secret (synced from OpenBao by
# ../config); until that exists the operator stays not-Ready, which is expected
# during bootstrap.
#
# The `secret-ingress` ProxyGroup lives in the separate tailscale-proxygroup bundle,
# which dependsOn this bundle (via the label below) so the operator's CRDs are
# established before the ProxyGroup CR applies — otherwise a fresh-cluster install
# deadlocks (the CR's CRD isn't registered yet in the same Helm release).
labels:
  fleet.vgijssel.nl/bundle: tailscale-operator
defaultNamespace: tailscale
helm:
  releaseName: tailscale-operator
# Multi-cluster: this one bundle serves both the `secret` and `network` clusters,
# selected on the cluster.vgijssel.nl/name label their apply.sh sets. Declaring
# targetCustomizations replaces Fleet's implicit "deploy everywhere" target, so a
# cluster only gets a BundleDeployment if it matches a selector here. The operator
# registers under a per-cluster device hostname; each target sets `hostname` and its
# tags EXPLICITLY so neither relies on the base values.yaml default (a per-cluster
# identity inherited from a shared default is a drift/collision risk).
targetCustomizations:
  - name: secret
    clusterSelector:
      matchLabels:
        cluster.vgijssel.nl/name: secret
    helm:
      values:
        tailscale-operator:
          # T24: this cluster's operator + proxies register under their OWN tags
          # (was the shared tag:k8s-operator / tag:k8s), so cross-cluster ACLs are
          # directional and each cluster's OAuth client is an independent root of
          # trust. The operator's client (kv/secret-tailscale-operator) owns
          # tag:secret-operator, which owns tag:secret-k8s (see tailscale-config
          # tagOwners).
          operatorConfig:
            hostname: secret-operator
            defaultTags:
              - tag:secret-operator
          proxyConfig:
            defaultTags: tag:secret-k8s
  - name: network
    clusterSelector:
      matchLabels:
        cluster.vgijssel.nl/name: network
    helm:
      values:
        tailscale-operator:
          operatorConfig:
            hostname: network-operator
            # T24: per-cluster tags (was shared tag:k8s-operator / tag:k8s). The
            # operator's client (kv/network-tailscale-operator) owns
            # tag:network-operator, which owns tag:network-k8s.
            defaultTags:
              - tag:network-operator
          proxyConfig:
            defaultTags: tag:network-k8s
          # NOTE: the operator's built-in kube-apiserver ProxyConfig (previously mode:
          # noauth, T17) was removed in T19. OpenBao fetches this cluster's JWKS via the
          # dedicated api-network kube-apiserver ProxyGroup at api-network.tail2c33e2.ts.net
          # (Tailscale-native *.ts.net cert, no cert-manager). See
          # apps/network/src/tailscale-proxygroup/proxygroup-apiserver.yaml.
