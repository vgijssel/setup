# Portable Fleet bundle for ingress-nginx. Fleet detects the umbrella Chart.yaml
# here and deploys it with values.yaml. Its external Service stays <pending> until
# the Tailscale operator assigns a tailnet IP (loadBalancerClass=tailscale), which
# is expected until the operator is up and authenticated.
defaultNamespace: ingress-nginx
helm:
  releaseName: ingress-nginx
# secret-ONLY. The network cluster exposes Omada directly through its own Tailscale
# LoadBalancer Service and runs no ingress-nginx (SPEC Q3). A single secret target
# gates this bundle: on `network` (label cluster.vgijssel.nl/name=network) nothing
# matches, so Fleet produces no BundleDeployment there. `secret` inherits the base
# values.yaml unchanged (byte-for-byte identical rendering).
targetCustomizations:
  - name: secret
    clusterSelector:
      matchLabels:
        cluster.vgijssel.nl/name: secret
