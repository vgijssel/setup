# ingress-nginx (rke2's default controller). ClusterIP-only: OpenBao is no longer exposed on
# the tailnet — it is reached over the NetBird mesh via the BYOP reverse proxy
# (openbao.secret.vgijssel.nl, apps/secret/src/netbird-reverse-proxy). The former tailnet path
# (LoadBalancer loadBalancerClass=tailscale → the `secret-ingress` ProxyGroup / svc:secret VIP,
# with external-dns publishing openbao.secret.vgijssel.nl) is retired: the OpenBao Ingress +
# per-host cert + secret-ingress ProxyGroup were removed, so external-dns (policy: sync) prunes
# the A record. The controller stays as a plain ClusterIP for any remaining in-cluster Ingress
# (e.g. netdata's local host); no tailnet VIP, no public DNS.
ingress-nginx:
  controller:
    replicaCount: 1
    service:
      type: ClusterIP
