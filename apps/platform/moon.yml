language: bash
layer: application
project:
  description: Environment-agnostic Kubernetes platform (external-secrets, cert-manager, Tailscale operator, Netdata)
tags:
  - app
  - kubernetes
  - helm
  - platform
tasks:
  lint:
    command: scripts/lint.sh
    inputs:
      - scripts/lint.sh
      - "*/Chart.yaml"
      - "*/Chart.lock"
      - "*/values.yaml"
      - "*/fleet.yaml"
      - config/**/*
    options:
      runInCI: false
