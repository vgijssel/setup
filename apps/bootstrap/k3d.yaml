# k3d cluster config for the local homelab bootstrap cluster.
# https://k3d.io/stable/usage/configfile/
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: bootstrap
# Single-node control plane is enough for the bootstrap workloads
# (Authentik, OpenBao, sigv4-proxy) that run on the macbook.
servers: 1
agents: 0
# Pin the k3s image (matches k3d v5.9.0's default) rather than tracking latest.
image: docker.io/rancher/k3s:v1.35.5-k3s1
options:
  k3d:
    wait: true
    timeout: 120s
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true
