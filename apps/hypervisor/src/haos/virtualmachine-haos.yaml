# The Home Assistant VM: 4 vCPU, 8 GiB, one 32 GiB boot disk off the haos image, bridged onto
# VLAN 30 through the lan-automation network. Running continuously since 2026-09-25.
#
# THREE OBJECTS THIS VM DEPENDS ON ARE NOT IN GIT, and cannot be:
#
#   - PVC `haos-disk-0-xiq8m` holds the guest's data. Harvester created it from the
#     `volumeClaimTemplates` annotation below at VM-create time, with a generated name. The
#     annotation is kept verbatim so the disk definition survives, but the PVC itself is state,
#     not configuration.
#   - Secret `haos-vsf2n` carries the cloud-init user data and network data. Also generated, and
#     deliberately not committed.
#   - StorageClass `lh-29d272bd-dc3d-4bf4-93d2-6a92ad20ca1e`, generated by Harvester from the
#     VirtualMachineImage's UID. See the warning in virtualmachineimage-haos.yaml.
#
# So this bundle ADOPTS a running VM. It cannot rebuild one on an empty cluster: restoring HAOS
# is a VM restore from backup, and this file is the record of its shape, not a recipe.
#
# Fields that must stay verbatim, because the guest treats them as its hardware identity:
#   - `firmware.uuid` and `firmware.serial` - a change makes Home Assistant see new hardware.
#   - `macAddress` (and the matching `harvesterhci.io/mac-address` annotation) - a change takes a
#     new DHCP lease on VLAN 30, so the address moves and anything pinning it breaks.
#
# `runStrategy: RerunOnFailure` restarts the VM if the guest exits non-zero but honours a guest
# shutdown, which is what lets the shutdown runbook in scripts/shutdown.sh stop it gracefully
# without Fleet or KubeVirt fighting the power-down.
#
# `evictionStrategy: LiveMigrateIfPossible` plus the migratable longhorn-ssd class is what keeps
# rolling node maintenance non-disruptive. The nodeAffinity on `network.harvesterhci.io/mgmt`
# only requires a node attached to the mgmt cluster network, which is all three.
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: haos
  namespace: default
  annotations:
    harvesterhci.io/mac-address: '{"default":"4e:89:35:29:63:28"}'
    harvesterhci.io/vmRunStrategy: RerunOnFailure
    harvesterhci.io/volumeClaimTemplates: '[{"metadata":{"name":"haos-disk-0-xiq8m","annotations":{"harvesterhci.io/imageId":"default/image-j9gz6"}},"spec":{"accessModes":["ReadWriteMany"],"resources":{"requests":{"storage":"32Gi"}},"volumeMode":"Block","storageClassName":"lh-29d272bd-dc3d-4bf4-93d2-6a92ad20ca1e"}}]'
  labels:
    harvesterhci.io/creator: harvester
    harvesterhci.io/os: linux
spec:
  runStrategy: RerunOnFailure
  template:
    metadata:
      # `kubevirt.io/pci-topology-version` is live as v3 and is not declared, because KubeVirt
      # bumps it and pinning it would make an upgrade look like drift. Same reasoning as the restart
      # timestamp and observed API versions, none of which appear in this file.
      annotations:
        harvesterhci.io/sshNames: "[]"
      labels:
        harvesterhci.io/vmName: haos
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: network.harvesterhci.io/mgmt
                    operator: In
                    values:
                      - "true"
      architecture: amd64
      domain:
        cpu:
          cores: 4
          maxSockets: 1
          sockets: 1
          threads: 1
        devices:
          disks:
            - bootOrder: 1
              disk:
                bus: virtio
              name: disk-0
            - disk:
                bus: virtio
              name: cloudinitdisk
          inputs:
            - bus: usb
              name: tablet
              type: tablet
          interfaces:
            - bridge: {}
              macAddress: 4e:89:35:29:63:28
              model: virtio
              name: default
        features:
          acpi:
            enabled: true
        firmware:
          bootloader:
            efi:
              secureBoot: false
          serial: 984f5b01-5097-4104-8a68-fce3145bbe1e
          uuid: a02d5c19-67c3-4639-aadd-71b1d990e9d3
        machine:
          type: q35
        memory:
          guest: 8Gi
        # Requests are deliberately below the limits, because Harvester reserves a fraction of
        # the guest's memory and CPU rather than the whole allocation. That is what lets three
        # nodes host more guest memory than any one node has free.
        resources:
          limits:
            cpu: "4"
            memory: 8Gi
          requests:
            cpu: 400m
            memory: 5461Mi
      evictionStrategy: LiveMigrateIfPossible
      hostname: haos
      networks:
        - multus:
            networkName: default/lan-automation
          name: default
      terminationGracePeriodSeconds: 120
      volumes:
        - name: disk-0
          persistentVolumeClaim:
            claimName: haos-disk-0-xiq8m
        - cloudInitNoCloud:
            networkDataSecretRef:
              name: haos-vsf2n
            secretRef:
              name: haos-vsf2n
          name: cloudinitdisk
