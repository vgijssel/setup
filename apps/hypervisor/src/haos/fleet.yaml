# Fleet bundle for the Home Assistant guest: the VM, the image backing its boot disk, and the
# VLAN 30 network it attaches to. Split from ../harvester-config deliberately, because Fleet
# applies a bundle as ONE atomic unit and these two have opposite risk profiles. A failed
# storage-fabric Setting must not be able to roll back a running VM, and a drifting VM annotation
# must not block a storage class.
#
# WHAT THIS BUNDLE IS. An adoption of a VM that has been running since 2026-09-25, and a record
# of its shape. It is NOT a recipe: the VM's data PVC, its cloud-init Secret, and the per-image
# StorageClass all carry Harvester-generated names and are not in git, and the image itself was
# uploaded rather than fetched from a URL. Rebuilding HAOS on an empty cluster is a restore from
# backup, not a `fleet apply`. The per-file headers spell out which object breaks how.
#
# BEFORE THE FIRST SYNC, confirm Fleet reports this bundle as already-in-sync rather than
# modifying anything. An unintended patch to a running VM's firmware identity or MAC is not a
# config change; it is new hardware under a live Home Assistant install.
#
# takeOwnership: every object here predates the bundle. Fleet installs through Helm, which
# refuses to manage objects carrying no ownership metadata, and the resulting error surfaces on
# the BundleDeployment while the Bundle still shows green.
#
# NO `diff.comparePatches`. KubeVirt and the Harvester controllers rewrite plenty here, including
# the VM's restart timestamp, its current addresses, the observed API versions, and the NAD's
# probed route. Fleet only compares fields the manifest declares, and none of those are. See the
# measured evidence in ../harvester-config/fleet.yaml; the short version is that a new map key is
# invisible to Fleet's drift check, so the fix is to omit controller-owned fields rather than to
# enumerate them as ignores.
#
# dependsOn ../harvester-config: the VM's boot disk resolves through the per-image StorageClass,
# which Harvester derives from longhorn-ssd's parameters, and the image declares longhorn-ssd as
# its target class. Ordering only matters on a cold apply, but it costs nothing to state.
labels:
  fleet.blueora.ng/bundle: hypervisor-haos
defaultNamespace: default
helm:
  releaseName: hypervisor-haos
  takeOwnership: true
dependsOn:
  - selector:
      matchLabels:
        fleet.blueora.ng/bundle: hypervisor-config
# harvester-ONLY. The selector alone restricts nothing under a Rancher GitRepo, which appends
# its own catch-all target. The terminal doNotDeploy entry below is what restricts this.
targetCustomizations:
  - name: harvester
    clusterSelector:
      matchLabels:
        cluster.blueora.ng/name: harvester
  # Terminal catch-all. Targets are first-match-wins and a GitRepo APPENDS its own target
  # after these, so without this a non-matching cluster falls through to it and deploys with
  # default values. Keeps this bundle off every cluster not named here. See bin/fleet-lint-targets.
  - name: none
    doNotDeploy: true
    clusterSelector: {}
