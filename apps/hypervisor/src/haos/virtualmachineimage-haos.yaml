# The Home Assistant OS image backing the HAOS VM's boot disk (haos_ova-18.2.qcow2, 32 GiB
# virtual, imported as a Longhorn backing image).
#
# READ BEFORE TOUCHING. This object is adoptable but NOT reproducible, for two reasons:
#
#   1. `sourceType: upload` with an empty `url` and `checksum`. The bits were pushed through the
#      Harvester UI, so there is no address Harvester could fetch them from again. Delete this
#      object and git cannot put the image back; it would come back empty and the VM would have
#      no boot disk. To make it reproducible the source would have to become a `download` from
#      the Home Assistant release URL, which creates a DIFFERENT image and means migrating the
#      VM's disk onto it. That is a deliberate migration, not an edit.
#
#   2. The name is generated. `image-j9gz6` came from `generateName: image-`, and Harvester
#      derives the per-image StorageClass `lh-<uid>` from this object's UID. The live VM's PVC
#      is bound to `lh-29d272bd-dc3d-4bf4-93d2-6a92ad20ca1e`, which is exactly this image's UID.
#      Recreating the image mints a new UID, so the new StorageClass name no longer matches the
#      one the PVC names, and the disk is stranded. `generateName` is therefore replaced by the
#      fixed `name` below: it pins the adoption and makes an accidental recreate fail loudly
#      instead of silently producing a second image.
#
# `storageClassParameters` duplicate longhorn-ssd's parameters because Harvester snapshots them
# into the per-image class at import time; they are a record of that import, not a live
# reference, so editing longhorn-ssd does not change them.
apiVersion: harvesterhci.io/v1beta1
kind: VirtualMachineImage
metadata:
  name: image-j9gz6
  namespace: default
  annotations:
    field.cattle.io/description: Home Assistant image
    harvesterhci.io/image-name: haos_ova-18.2.qcow2
    harvesterhci.io/storageClassName: longhorn-ssd
  # `harvesterhci.io/os-type` is live as an empty string and is not declared here: the controller
  # populates it once it can detect the guest OS, and a declared empty value would turn that into
  # drift. The two below are static properties of the import.
  labels:
    harvesterhci.io/image-type: raw_qcow2
    harvesterhci.io/imageDisplayName: haos
spec:
  backend: backingimage
  checksum: ""
  displayName: haos
  pvcName: ""
  pvcNamespace: ""
  retry: 3
  sourceType: upload
  storageClassParameters:
    diskSelector: ssd
    encrypted: "false"
    migratable: "true"
    numberOfReplicas: "3"
    staleReplicaTimeout: "30"
  targetStorageClassName: longhorn-ssd
  url: ""
