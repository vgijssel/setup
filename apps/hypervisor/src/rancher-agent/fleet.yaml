# Fleet bundle for the whole agent identity on Rancher: the `agent-user` User, the
# `agent-read-only` cluster RoleTemplate, the GlobalRole that inherits it, and the
# GlobalRoleBinding that grants it. Four objects, one bundle, because they are one thing. Rancher
# management-plane config lives in ../rancher-config, which this bundle no longer depends on.
#
# ONE BUNDLE IS FINE. THE ORDERING FEAR WAS WRONG, and it is worth recording why the prediction
# looked so solid, so nobody re-splits this directory on the strength of it. Two true facts
# pointed at a failure that did not happen:
#
#   - Rancher's webhook does reject a GlobalRole whose inherited RoleTemplate does not already
#     exist. Confirmed against this Rancher with a server-side dry-run:
#
#       admission webhook "rancher.cattle.io.globalroles.management.cattle.io" denied the request:
#       globalrole.inheritedClusterRoles: Invalid value: "": unable to find all roleTemplates
#       unable to get roleTemplate agent-read-only: roletemplates.management.cattle.io
#       "agent-read-only" not found
#
#   - Helm does sort kinds it fails to recognise alphabetically, which orders GlobalRole ahead of
#     RoleTemplate. Confirmed offline with `helm template` over these four kinds fed in reverse:
#     the output came back GlobalRole, GlobalRoleBinding, RoleTemplate, User. Neither file order
#     nor filename affects it.
#
# The conclusion drawn from those two, that the first apply would stop before the RoleTemplate
# existed and every retry would then fail identically, is simply not what the cluster did. All
# four objects were created at 2026-11-25T09:36:06Z, in one pass, with the BundleDeployment
# reporting Installed and Deployed and `resourceCounts.desiredReady: 4`. What Fleet's agent
# actually applies with is not the plain Helm install path those objects imply; they carry
# `objectset.rio.cattle.io/id` alongside the Helm release annotations. The mechanism was not
# chased further, because the behaviour is what matters and the behaviour is: it reconciles.
#
# The lesson generalises past this bundle. `helm template` shows the order Helm RENDERS in, and
# that was treated as the order Fleet APPLIES in. Those are not the same claim, and only the
# second one mattered.
#
# READ THE BUNDLEDEPLOYMENT, NOT THE BUNDLE, when this bundle does misbehave. A Bundle shows
# green while its BundleDeployment holds the real error, and `modifiedStatus[].patch` on the
# BundleDeployment names the exact field in dispute. That is how the `rules: []` drift in
# ./globalrole-agent-read-only.yaml was found rather than guessed at.
#
# NO keepResources, and the meaning of that has CHANGED now that the identity and its grant share
# a bundle. Deleting this bundle no longer revokes access while leaving the account intact; it
# dismantles the identity entirely. That is a clean teardown, not a revocation. To revoke and keep
# the account, delete ./globalrolebinding-agent-user-agent-read-only.yaml alone.
#
# NO takeOwnership. All four objects are new, so nothing here is adopted.
#
# NO TOKEN IS DECLARED, which is what makes an identity safe to keep in git. Token hashing is not
# enabled on this Rancher, so a Token object holds its secret as plaintext. Git holds the durable
# identity and its permissions; the short-lived token is minted out of band. See the header of
# ../rancher-config/fleet.yaml.
labels:
  fleet.blueora.ng/bundle: hypervisor-rancher-agent
# All four objects are cluster-scoped, so this is only a fallback for anything namespaced added
# later.
defaultNamespace: default
helm:
  releaseName: hypervisor-rancher-agent
# NO dependsOn, deliberately. The RoleTemplate this bundle's GlobalRole inherits is a sibling file
# rather than another bundle's object, and the install proved that needs no cross-bundle ordering.
# A dependsOn on ../rancher-config would only add a second reason for this bundle to sit
# un-deployed, and that bundle has a readiness quirk of its own. See its header.
#
# rancher-ONLY. The selector alone restricts nothing under a Rancher GitRepo, which appends
# its own catch-all target. The terminal doNotDeploy entry below is what restricts this.
targetCustomizations:
  - name: rancher
    clusterSelector:
      matchLabels:
        cluster.blueora.ng/name: rancher
  # Terminal catch-all. Targets are first-match-wins and a GitRepo APPENDS its own target
  # after these, so without this a non-matching cluster falls through to it and deploys with
  # default values. Keeps this bundle off every cluster not named here. See bin/fleet-lint-targets.
  - name: none
    doNotDeploy: true
    clusterSelector: {}
