# Lifetime of the token embedded in a kubeconfig downloaded from the Harvester UI.
#
# Harvester's own default is `0`, which means the token never expires. 180 minutes trades that
# standing credential for a 3-hour one, so a kubeconfig copied onto a laptop stops working on its
# own. Break-glass access does not depend on it: the node-local
# /etc/rancher/rke2/rke2.yaml reached over SSH is unaffected by this setting.
apiVersion: harvesterhci.io/v1beta1
kind: Setting
metadata:
  name: kubeconfig-default-token-ttl-minutes
value: "180"
