# Bulk storage: 2-way replicated, NOT migratable, on the SATA-tagged Longhorn disks.
#
# `migratable: "false"` is the operational difference from longhorn-ssd. A VM holding a volume
# on this class cannot live-migrate, so it blocks the rolling node maintenance that the restart
# runbook in apps/network/harvester.md depends on. Keep guest boot disks off this class.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-sata
  annotations:
    field.cattle.io/description: Slow media storage
provisioner: driver.longhorn.io
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: true
parameters:
  dataEngine: v1
  diskSelector: sata
  encrypted: "false"
  migratable: "false"
  numberOfReplicas: "2"
  staleReplicaTimeout: "30"
