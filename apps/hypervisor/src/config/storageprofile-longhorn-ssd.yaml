# CDI's StorageProfile for longhorn-ssd. It exists to pin ONE field: the VolumeSnapshotClass CDI
# uses when it clones a volume on this storage class.
#
# WHY THIS IS NEEDED. CDI clones a PVC from a golden image with `cloneStrategy: snapshot`, which
# takes a CSI VolumeSnapshot of the source. With `spec.snapshotClass` unset, CDI picks a class
# itself and lands on `longhorn` - which is the class Harvester's own `csi-driver-config` setting
# designates as `backupVolumeSnapshotClassName`. It carries no `type` parameter, so Longhorn
# treats it as a BACKUP snapshot and demands a backup target. `backup-target` is empty on this
# cluster, so every clone fails:
#
#   VolumeSnapshotClassSelected  VolumeSnapshotClass selected according to StorageProfile longhorn
#   Failed to check and update snapshot content: failed to take snapshot of the volume
#   pvc-ce42b57c: "rpc error: code = Aborted desc = backup target default is not available"
#
# and the DataVolume sits in `SnapshotForSmartCloneInProgress` forever, with the consuming VM
# stuck `WaitingForVolumeBinding`. Nothing surfaces the cause on the VM or the image; it is only
# visible on the temporary VolumeSnapshot, which CDI names `tmp-snapshot-<uuid>`.
#
# `longhorn-snapshot` is the in-cluster class - its parameters are `{"type":"snap"}` - and it is
# exactly what `csi-driver-config` lists as `volumeSnapshotClassName`. That setting governs
# Harvester's own snapshot and backup code paths, NOT CDI's, which is why Harvester knowing the
# right answer does not stop CDI from choosing the wrong one.
#
# THIS OBJECT IS CREATED BY CDI, not by this bundle. It carries an ownerReference to the CDI CR and the
# label `app.kubernetes.io/managed-by: cdi-controller`, so this manifest ADOPTS it (the bundle
# sets takeOwnership). Deliberately minimal as a result: only `spec.snapshotClass` is declared.
# `spec.cloneStrategy` and everything under `status` - claimPropertySets, provisioner, and the
# resolved snapshotClass - are computed by CDI from the StorageClass and its CSI driver, and
# declaring any of them would turn CDI's own reconciliation into drift. CDI honours a
# user-supplied `spec` and recomputes `status` to match, which is measured: patching this field
# flipped `status.snapshotClass` to `longhorn-snapshot` without CDI reverting it.
#
# SCOPE. Only longhorn-ssd is pinned, because that is the class the smarthome guest's image and
# boot disk use. harvester-longhorn, longhorn-sata, longhorn-static, vmstate-persistence and the
# per-image lh-<uid> classes all still resolve to `longhorn` and would hit the same wall the
# first time anything clones on them. Pin them when something does, or configure a backup target
# and make the question moot.
apiVersion: cdi.kubevirt.io/v1beta1
kind: StorageProfile
metadata:
  name: longhorn-ssd
spec:
  snapshotClass: longhorn-snapshot
