# Fleet bundle for the Rancher management plane itself, the Rancher that runs inside the
# `rancher-k3k` k3k virtual cluster on Harvester and imports Harvester as a downstream cluster.
# Every sibling bundle under ../ targets Harvester. This one targets Rancher.
#
# One object now: the feature flag. The two GitRepos that used to live here moved to
# ../rancher-gitrepos, for a reason worth reading before adding anything back.
#
# WHY A SEPARATE CLUSTER AT ALL. Fleet scopes targets to the GitRepo's workspace. The
# `setup-harvester` GitRepo lives in `fleet-default`, whose only cluster is `c-27cxq`
# (Harvester), so it can never deploy here no matter how its selectors are written. Rancher's
# own cluster is `local`, in the `fleet-local` workspace, reached by the second GitRepo
# (`setup-rancher`). Both point at `apps`, so both build every bundle in this repo, and each
# bundle's label selector plus its terminal doNotDeploy entry is the only thing keeping it on
# the cluster it was written for.
#
# THE CLUSTER LABEL IS `rancher`, NOT `local`. `local` is the Fleet and Rancher cluster NAME,
# which this repo never selects on. It selects on `cluster.blueora.ng/name`, applied by hand to
# the Fleet cluster object:
#
#   kubectl -n fleet-local label clusters.fleet.cattle.io local cluster.blueora.ng/name=rancher
#
# THE FEATURE ALREADY EXISTS, so this bundle ADOPTS rather than creates, and takeOwnership is
# what allows it. Fleet installs a bundle as a Helm release, Helm refuses to manage an object
# carrying no ownership metadata of its own, and without the flag the Bundle shows green while
# its BundleDeployment holds the real error. See ../config/fleet.yaml for the longer version, and
# for why no `diff.comparePatches` appears here either. Fleet compares only fields the manifest
# declares, so the labels and annotations that Rancher's own controllers write onto this object
# are new map keys, and invisible to its drift check.
#
# WHY THE GITREPOS LEFT, in one sentence: a bundle cannot usefully monitor a GitRepo, because a
# GitRepo's Ready condition is the roll-up of every bundle it owns rather than a fact about the
# object, and `ignore.conditions` cannot be scoped to one resource. This bundle learned that
# twice. First as a cycle, when it declared the `setup-rancher` GitRepo that delivers it. Then,
# once that was moved out and the ignore narrowed, as imported noise: it went red on
# `setup-harvester` reporting a stalled Home Assistant disk import on the OTHER cluster. The full
# measurements are in ../rancher-gitrepos/fleet.yaml.
#
# WHAT THAT LEAVES HERE is a bundle whose readiness means something again, and the rule that keeps
# it that way: nothing belongs in this bundle whose Ready condition is an aggregate of other
# things. A GitRepo is the obvious case; so is anything else that rolls up a fleet of children.
#
# ADDING A RESOURCE IS CHEAP, MOVING ONE IS NOT. A resource dropped from a bundle's manifest is
# PRUNED by Helm on the next upgrade, and `keepResources` does not cover that case, only bundle
# deletion. Both GitRepos therefore needed `helm.sh/resource-policy: keep` to reach the cluster
# in an EARLIER sync than their move, because Helm reads the policy off the previous release's
# manifest. That is four merges for what looks like a file rename, and it is why the `correctDrift`
# note below matters: every step here is a commit that a controller applies, not an edit.
#
# correctDrift is enabled on both GitRepos, so Fleet does not merely report a difference between
# a manifest and its object, it rewrites the object, including a difference the manifest
# introduces. A field that cannot be stored at all therefore retries once a minute, forever: see
# ../rancher-agent/globalrole-agent-read-only.yaml for one that cost 98 Helm release revisions in
# an hour.
#
# THE AGENT IDENTITY IS NOT HERE. All four of its objects, the User, the cluster RoleTemplate,
# the GlobalRole that inherits it and the GlobalRoleBinding that grants it, live together in
# ../rancher-agent. This bundle is Rancher's own configuration; that one is an account. They were
# briefly split three ways across two bundles to satisfy a webhook ordering constraint, and the
# ordering is now handled, or not handled, inside that single bundle. Its header carries the
# measurements.
#
# NO TOKEN IS DECLARED ANYWHERE IN GIT, which is the whole point of separating this bundle from a
# kubeconfig. Token hashing is not enabled on this Rancher, so a Token object carries its secret
# as plaintext, and committing one would put a standing credential with cluster-wide read on
# every cluster into the repository. Git holds the durable identity and its permissions. The
# short-lived token is minted out of band when an agent needs one.
labels:
  fleet.blueora.ng/bundle: hypervisor-rancher-config
# The Feature is cluster-scoped, so this is only a fallback for anything namespaced added later.
defaultNamespace: default
# NO `ignore.conditions` here, and that is the point of ../rancher-gitrepos existing: this
# bundle's readiness is a real signal again. See the header.
#
# keepResources, because the Feature is adopted rather than created. Dropping the
# `harvester-baremetal-container-workload` flag is what hides every Harvester-labelled cluster
# from Continuous Delivery, so pruning this bundle must not take it with it.
keepResources: true
helm:
  releaseName: hypervisor-rancher-config
  # Adopt the already-enabled Feature. See the header.
  takeOwnership: true
# rancher-ONLY. The selector alone restricts nothing under a Rancher GitRepo, which appends
# its own catch-all target. The terminal doNotDeploy entry below is what restricts this.
targetCustomizations:
  - name: rancher
    clusterSelector:
      matchLabels:
        cluster.blueora.ng/name: rancher
  # Terminal catch-all. Targets are first-match-wins and a GitRepo APPENDS its own target
  # after these, so without this a non-matching cluster falls through to it and deploys with
  # default values. Keeps this bundle off every cluster not named here. See bin/fleet-lint-targets.
  - name: none
    doNotDeploy: true
    clusterSelector: {}
