# Home for the rancher-k3k Addon, which this bundle does NOT declare because its valuesContent
# embeds a plaintext bootstrapPassword and this repository is public. See fleet.yaml. The
# namespace is declared anyway: it was created by the upstream release manifest rather than by
# Harvester, so a cold apply has nowhere to put the Addon without it, and adopting it now makes
# closing that gap a one-file change.
#
# This is where the addon's Helm release puts the k3k Cluster, its cert-manager, and the Rancher
# install that runs inside it. Deleting the namespace deletes that Rancher.
apiVersion: v1
kind: Namespace
metadata:
  name: rancher-k3k
