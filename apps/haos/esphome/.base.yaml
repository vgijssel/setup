# Enable logging
logger:
  level: DEBUG

debug:
  update_interval: 10s

text_sensor:
  - platform: debug
    device:
      name: device_info

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

ota:
  password: !secret ota_password
  platform: esphome

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
    - ssid: !secret wifi_ssid_new
      password: !secret wifi_password_new

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    password: !secret wifi_password_new

captive_portal:

# From https://community.home-assistant.io/t/shelly-plus-1-esphome-bletracker/363549/38
# Setup a button in home assistant to reboot the shelly into safe mode
button:
  - platform: safe_mode
    name: "${entity_id}_safe_mode_restart"
