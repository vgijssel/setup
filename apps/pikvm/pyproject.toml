[project]
name = "setup-pikvm"
version = "0.0.0"
description = "Bring the PiKVM host onto NetBird via pyinfra, with secrets from OpenBao"
requires-python = ">=3.12"
dependencies = ["pyinfra==3.9.2", "hvac==2.4.0"]

[dependency-groups]
dev = ["ruff==0.14.14"]

# Script-style project: deploy.py / secrets.py / inventories/ are top-level modules
# executed via `uv run pyinfra`, not an installable package.
[tool.uv]
package = false
