# Managed by pyinfra (apps/pikvm/deploy.py, Task 11) -- do NOT edit on the box.
#
# Route ALL name resolution through systemd-resolved's stub listener (127.0.0.53) so
# split-DNS works for EVERY resolver, not just NSS/D-Bus callers. PiKVM ships this file as
# a symlink to resolved's "uplink" resolv.conf (nameserver 192.168.1.1, the LAN router),
# which cannot resolve NetBird/mesh names like *.svc.cluster.local -> resolvers that read
# resolv.conf directly (Go's static resolver in goss/netbird, dig, ...) get NXDOMAIN.
# Pointing at the stub makes resolved apply split-DNS (mesh names -> wt0, public -> upstream)
# uniformly. This supersedes the per-unit resolv.conf bind in goss-serve.service and removes
# its boot-race (that optional bind no-op'd before resolved had created its stub file).
nameserver 127.0.0.53
options edns0 trust-ad
