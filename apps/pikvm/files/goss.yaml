# PiKVM system-health assertions. goss-serve.service parses this file once at startup and
# re-runs the checks on every request (deploy.py restarts the daemon when this file
# changes). `validate` renders these as an rspecish report; netdata scrapes them as one
# prometheus metric per assertion. See apps/pikvm/SPEC.md for the contract.
#
# The dns/addr resources below rely on goss seeing systemd-resolved's stub resolver
# (127.0.0.53) -- goss-serve.service binds the stub resolv.conf into the unit so goss's
# Go resolver sees the box-wide resolution: omada.network.vgijssel.nl is a public Cloudflare
# A record pointing at Omada's pinned in-cluster ClusterIP (published by external-dns), and
# that ClusterIP is routed over NetBird, so the checks exercise real mesh reachability. goss
# manages its own per-check timeouts.
command:
  # 1. NetBird management plane is connected (the mesh is up).
  netbird-connected:
    exec: "netbird status"
    exit-status: 0
    stdout:
      - "Management: Connected"

  # 1b. The netdata dbengine RAM disk is a 2 GiB tmpfs (netdata-db.service). `findmnt -b`
  #     prints the size in bytes; 2 GiB = 2 * 1024^3 = 2147483648. Guards the size so a
  #     mis-mounted (default-sized or resized) tmpfs is caught, complementing the `mount`
  #     resource below (which asserts existence + filesystem type).
  netdata-ramdisk-2gib:
    exec: "findmnt -nb -o SIZE /var/lib/netdatadb"
    exit-status: 0
    stdout:
      - "2147483648"

# 2. Omada's public hostname resolves (Cloudflare A -> pinned ClusterIP, mesh-routed).
dns:
  omada.network.vgijssel.nl:
    resolvable: true

# 3. TCP reachability to the Omada controller on every documented TCP port, reached at its
#    real hostname omada.network.vgijssel.nl over NetBird cross-cluster routing.
#    Ports mirror apps/network/src/omada/templates/service-omada.yaml (TCP only -- the UDP
#    27001/29810/19810 entries are L2-only discovery and cannot be connect-tested).
addr:
  tcp://omada.network.vgijssel.nl:8088:      # manage-http
    reachable: true
  tcp://omada.network.vgijssel.nl:8043:      # manage-https
    reachable: true
  tcp://omada.network.vgijssel.nl:8843:      # portal-https
    reachable: true
  tcp://omada.network.vgijssel.nl:29811:     # manager-v1
    reachable: true
  tcp://omada.network.vgijssel.nl:29812:     # adopt-v1
    reachable: true
  tcp://omada.network.vgijssel.nl:29813:     # upgrade-v1
    reachable: true
  tcp://omada.network.vgijssel.nl:29814:     # manager-v2
    reachable: true
  tcp://omada.network.vgijssel.nl:29815:     # transfer-v2
    reachable: true
  tcp://omada.network.vgijssel.nl:29816:     # rtty
    reachable: true
  tcp://omada.network.vgijssel.nl:29817:     # device-monitor
    reachable: true

# 4. The NetBird systemd instance is enabled (survives reboot) and running.
service:
  netbird@netbird:
    enabled: true
    running: true

# 5. The goss daemon itself is listening on loopback only -- fails if bound to 0.0.0.0,
#    enforcing localhost-only exposure.
port:
  tcp:8080:
    listening: true
    ip:
      - 127.0.0.1

# 6. netdata is claimed to Netdata Cloud and its outbound ACLK link is live. The agent's
#    localhost info endpoint reports both flags; asserting them here turns the health
#    daemon (and its prometheus scrape) red if the Cloud connection ever drops. netdata
#    binds 127.0.0.1:19999 only, so this stays a loopback check.
http:
  http://127.0.0.1:19999/api/v1/info:
    status: 200
    timeout: 5000
    body:
      - '"agent-claimed":true'
      - '"aclk-available":true'
      # The metrics DB is dbengine (not the RAM ring) -- the prerequisite for ML, and the
      # backend that stores its tier files on the RAM disk.
      - '"memory-mode":"dbengine"'
      # ML anomaly detection is actually enabled (auto-resolves to off on a RAM-only db).
      # The info payload is pretty-printed, so a single substring can't span "ml-info":{...
      # "enabled":true, and bare "enabled":true is ambiguous (cloud-/web-/https-enabled all
      # emit it). Assert an ML-ONLY field instead: netdata only emits the anomaly-detection
      # tuning keys when ML is enabled, so this line's presence proves ML is on.
      - '"anomaly-detection-grouping-method":'

# 7. The PiKVM port is a trunk: untagged/native traffic is DHCP and tagged VLAN 10
#    (Management) carries the stable static address 192.168.10.2/24 on the vlan10 netdev.
#    That static address is the Omada static-route next-hop + NetBird site-to-VPN path, so
#    it must be present on the tagged interface (deploy.py Task 8 owns the networkd config).
interface:
  vlan10:
    exists: true
    addrs:
      - 192.168.10.2/24

# 8. /etc/resolv.conf routes ALL resolution through the systemd-resolved stub (127.0.0.53).
#    Regression guard: this file was the root cause of goss's Go resolver querying the LAN
#    router (192.168.1.1) and NXDOMAINing *.svc.cluster.local. It must be a real FILE (not
#    the old resolved "uplink" symlink) whose nameserver is the stub -- so mesh/split-DNS
#    resolves box-wide. deploy.py owns the contents; this asserts they are in place.
file:
  /etc/resolv.conf:
    exists: true
    filetype: file
    contains:
      - "nameserver 127.0.0.53"

# 9. netdata's dbengine metrics DB lives on a dedicated tmpfs "RAM disk"
#    (/var/lib/netdatadb, mounted by netdata-db.service) so the read-only rootfs is never
#    written and netdata can retain ~24h of history for ML. Assert the mount exists and is
#    a tmpfs; the netdata-ramdisk-2gib command above guards its 2 GiB size.
mount:
  /var/lib/netdatadb:
    exists: true
    filesystem: tmpfs
