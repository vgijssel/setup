# Managed by pyinfra (apps/pikvm/deploy.py, Task 11) -- drop-in override for the netdata
# unit the static installer places in /etc/systemd/system/netdata.service.
[Unit]
# Metrics collection wants the network up (and, once claimed in Phase D, the outbound
# ACLK link to Netdata Cloud). Additive to the base unit's ordering.
After=network-online.target
Wants=network-online.target

[Service]
# Create /run/netdata on tmpfs each boot so netdata's cache/lib/log dirs (pointed here
# by netdata.conf) never touch the read-only rootfs. netdata creates + chowns the
# cache/lib/log subdirs to the netdata user during startup.
RuntimeDirectory=netdata
RuntimeDirectoryMode=0755
