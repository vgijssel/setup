# Managed by pyinfra (apps/pikvm/deploy.py, Task 11) -- drop-in override for the netdata
# unit the static installer places in /usr/lib/systemd/system/netdata.service.
[Unit]
# Metrics collection wants the network up (and, once claimed in Phase D, the outbound
# ACLK link to Netdata Cloud). Additive to the base unit's ordering.
After=network-online.target
Wants=network-online.target

[Service]
# netdata's cache/lib/log dirs are redirected to the /run tmpfs by netdata.conf so the
# read-only rootfs is never written at runtime. netdata creates only its LEAF dirs
# (lib/registry, lib/cloud.d) and expects cache/lib/log to already exist -- on a stock
# install the installer pre-creates them under /opt/netdata/var, but on tmpfs they must
# be recreated every boot or netdata aborts (`mkdir /run/netdata/lib/registry` -> ENOENT).
# List them as RuntimeDirectory so systemd creates /run/netdata{,/cache,/lib,/log} on each
# start, owned root:netdata (User/Group of the base unit). The leading empty assignment
# clears the base unit's `RuntimeDirectory=netdata` so this list is exact + authoritative.
RuntimeDirectory=
RuntimeDirectory=netdata netdata/cache netdata/lib netdata/log
RuntimeDirectoryMode=0775
