# Managed by pyinfra (apps/pikvm/deploy.py, Task 11) -- do NOT edit on the box.
#
# PiKVM has a read-only root filesystem, so netdata (a constantly-writing agent) must never
# write metrics to disk at runtime. We still want dbengine (not the RAM ring) because it is
# the ONLY backend netdata's ML anomaly detection runs on -- so instead of disabling the DB
# we give dbengine a dedicated tmpfs "RAM disk":
#   * [db] mode = dbengine     -> real metrics DB (enables ML), 24h tier0 retention.
#   * [directories] cache=...  -> dbengine tier files live on /var/lib/netdatadb, a 2 GiB
#                                 tmpfs mounted each boot by netdata-db.service. Pure RAM,
#                                 nothing on the ro rootfs; recreated empty every boot
#                                 (history is deliberately non-durable).
#   * [directories] log=/run   -> log on the /run tmpfs (RuntimeDirectory in the drop-in).
#   * [directories] lib=...    -> identity ONLY (machine GUID + Cloud claim), a separate
#                                 tmpfs snapshotted to /root/netdata-state by
#                                 netdata-overlay.service. Kept apart from the metrics DB so
#                                 gigabytes of metrics are never snapshotted to the rootfs.
# The static installer's defaults point these at /opt/netdata/var/... (on the ro rootfs),
# so this file overrides them; unknown keys are ignored by netdata (a warning, not fatal).

[global]
	# Collect once per second (netdata default), matching the per-second tier0 below.
	update every = 1

[db]
	# dbengine (not the RAM ring): required for ML anomaly detection. All tier files live on
	# the 2 GiB tmpfs RAM disk (see [directories] cache + netdata-db.service), so nothing is
	# written to the read-only rootfs.
	mode = dbengine
	# Single per-second tier keeps the footprint small on the SBC. 24h retention lets ML
	# train comfortably; the size cap (1800 MiB) stays safely inside the 2 GiB RAM disk,
	# leaving headroom for the journal/WAL + page cache. Time is the binding limit (~24h of
	# 3.7k dimensions is a few hundred MB); the size cap is just a hard backstop.
	storage tiers = 1
	dbengine tier 0 retention time = 24h
	dbengine tier 0 retention size = 1800MiB
	dbengine page cache size = 32MiB

[ml]
	# Enable ML-based anomaly detection (per-dimension KMeans models). Requires the dbengine
	# backend above; the 24h RAM-disk history covers netdata's training window, so models
	# train and the per-dimension anomaly rate + "anomaly-detection" charts become available.
	# On a RAM-only db this auto-resolves to "no" -- which is exactly why it was off before.
	enabled = yes

[directories]
	# Metrics DB (dbengine) on the 2 GiB tmpfs RAM disk mounted by netdata-db.service -- pure
	# RAM, recreated empty each boot. log on the /run tmpfs (RuntimeDirectory in the drop-in).
	# lib holds ONLY netdata's identity (machine GUID + Cloud claim); it is a separate tmpfs
	# (netdata-overlay.service) snapshotted to /root/netdata-state so the Cloud node is stable.
	cache = /var/lib/netdatadb
	lib = /var/lib/netdata
	log = /run/netdata/log

[web]
	# Localhost-only: no LAN/mesh inbound port is opened (strictest posture, matches the
	# goss localhost-only discipline). Netdata Cloud reaches the agent over its OUTBOUND
	# ACLK link (Phase D), so no inbound bind is required.
	bind to = 127.0.0.1
	default port = 19999
