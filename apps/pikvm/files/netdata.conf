# Managed by pyinfra (apps/pikvm/deploy.py, Task 11) -- do NOT edit on the box.
#
# PiKVM has a read-only root filesystem, so netdata (a constantly-writing agent) must
# never write to disk at runtime. Two settings enforce that:
#   * [db] mode = ram         -> the time-series DB lives in RAM, no dbengine files.
#   * [directories] ...=/run  -> cache/lib/log live on the /run tmpfs, created each boot
#                                by the systemd drop-in's RuntimeDirectory=netdata.
# The static installer's defaults point these at /opt/netdata/var/... (on the ro rootfs),
# so this file overrides them; unknown keys are ignored by netdata (a warning, not fatal).

[global]
	# Collect once per second (netdata default), matching the RAM retention below.
	update every = 1

[db]
	# RAM-only DB: nothing is written to the read-only rootfs. Retention is the number
	# of seconds of history kept in RAM per dimension (3600 = 1h). Tune at Checkpoint 2
	# if the SBC's memory footprint is too high.
	mode = ram
	retention = 3600

[directories]
	# All runtime state on the /run tmpfs (RuntimeDirectory=netdata makes /run/netdata).
	# netdata creates + chowns these subdirs to the netdata user at startup.
	cache = /run/netdata/cache
	lib = /run/netdata/lib
	log = /run/netdata/log

[web]
	# Localhost-only: no LAN/mesh inbound port is opened (strictest posture, matches the
	# goss localhost-only discipline). Netdata Cloud reaches the agent over its OUTBOUND
	# ACLK link (Phase D), so no inbound bind is required.
	bind to = 127.0.0.1
	default port = 19999
