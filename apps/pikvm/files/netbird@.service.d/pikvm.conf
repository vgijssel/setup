[Unit]
After=netbird-overlay.service
Requires=netbird-overlay.service

[Service]
ExecStart=
ExecStart=/usr/bin/netbird service run --log-file syslog
# netbird 0.75.0's stock unit declares Cache/Configuration/State/Logs directories, which
# systemd tries to create under the read-only rootfs (/var/cache, /etc, /var/lib,
# /var/log) and aborts the daemon with status=239/CACHE_DIRECTORY. Clear them: netbird
# keeps its profile in /var/lib/netbird/default.json (the writable tmpfs overlay), and
# its control socket at the default /var/run/netbird.sock (tmpfs) -- which the CLI also
# uses, so no --daemon-addr is needed and `netbird up`/`netbird status` reach the daemon.
CacheDirectory=
ConfigurationDirectory=
StateDirectory=
LogsDirectory=
Environment=NB_DISABLE_SSH_CONFIG=true
