# Managed by pyinfra (apps/pikvm/deploy.py, Task 11 Phase C) -- netdata go.d prometheus
# collector job that scrapes the goss health daemon's Prometheus endpoint (goss-serve.service
# serves `--format prometheus` at 127.0.0.1:8080/healthz -- one series per assertion, e.g.
# goss_tests_outcomes_total{outcome=...}). This surfaces the box's declarative health checks
# (NetBird/Omada reachability, the netdata Cloud link, the loopback-only bind) as netdata
# charts + alerts, alongside the system metrics. Loopback-only: goss binds 127.0.0.1 only.
jobs:
  - name: pikvm-goss
    url: http://127.0.0.1:8080/healthz
