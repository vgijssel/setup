# The proxy re-signs incoming (dummy-credential) S3 requests with the real
# Hetzner Object Storage credentials. All AWS config (creds, region, endpoint)
# is read from the terraform-state-s3 secret, which external-secrets syncs from
# OpenBao (kv/s3). The pod stays pending until that secret exists.
aws-sigv4-proxy:
  aws:
    secretName: terraform-state-s3
