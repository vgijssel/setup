language: bash
layer: application
project:
  description: OpenBao (single-node raft) secret/state broker
tags:
  - app
  - kubernetes
  - helm
  - fleet
  - secret
# Entry points. Each manages external cluster / Docker state (not file outputs), so
# none are cached. `start` now runs the full bring-up end-to-end (cluster + apply);
# OpenBao self-initialises + auto-unseals and Crossplane configures it, so there is
# no bootstrap/configure step (those tasks are legacy, removed in the migration's
# final phase).
tasks:
  # Create (or reconnect to) the vind cluster, seed the OpenBao seal key from 1Password
  # (put_openbao_seal_auth — so the key exists before OpenBao boots), then install Fleet
  # + apply every bundle end-to-end. Idempotent. This is the single bring-up command.
  start:
    command: scripts/start.sh
    options:
      runInCI: false
      interactive: true
      cache: false
  # Install the Fleet controller and apply every bundle (bin/fleet-apply). Idempotent.
  # Invoked by `start`; also runnable standalone to re-apply into an existing cluster.
  apply:
    command: scripts/apply.sh
    options:
      runInCI: false
      interactive: true
      cache: false
  # Read the static OpenBao seal key from 1Password (op://enigma-prod/openbao-seal/seal-key)
  # and put it into the secret cluster as the `openbao-seal` Secret BEFORE OpenBao comes up,
  # so it auto-unseals with the durable, externally-managed key (never a cluster-generated one).
  # Invoked by `start` before `apply`; also runnable standalone. Idempotent, and refuses to
  # overwrite a differing existing key (would lock OpenBao out of its data) unless FORCE=1.
  put_openbao_seal_auth:
    command: scripts/put_openbao_seal_auth.sh
    options:
      runInCI: false
      interactive: true
      cache: false
  # Force an on-demand OpenBao Raft snapshot NOW (instead of waiting for the hourly
  # snapshotAgent schedule): triggers the openbao-snapshot CronJob as a one-off Job, waits
  # for it, and reports the S3 upload. Same mechanism as the scheduled backup. Idempotent.
  backup:
    command: scripts/backup.sh
    options:
      runInCI: false
      interactive: true
      cache: false
  # Mint a short-lived (1h) OpenBao admin token for break-glass / human admin tasks
  # (seed kv secrets, recovery-key rotation, ...). Works for anyone with kubectl admin
  # on the secret cluster; prints export lines for BAO_ADDR + BAO_TOKEN.
  get_openbao_auth:
    command: scripts/get_openbao_auth.sh
    options:
      runInCI: false
      interactive: true
      cache: false
  # NOTE: `put_netbird_proxy_auth` and `put_netbird_pikvm_proxy_auth` lived here. Both minted a
  # NetBird BYOP reverse-proxy token into kv (secret-netbird-proxy / network-netbird-pikvm-proxy)
  # for the two proxy fleets to authenticate with. The proxies are gone — services are exposed as
  # their own mesh peers now (apps/platform/src/mesh-service) — so there is no proxy token to mint
  # and no manual pre-step before a proxy bundle comes online. Nothing replaced them: a mesh
  # exposure's identity is a SetupKey the operator mints from a CR, with no out-of-band value.
  #
  # Port-forward the OpenBao service to localhost:8200 to enter the human-only seed
  # kv secrets (Cloudflare / Tailscale OAuth / Netdata) via CLI or UI. Long-running.
  forward:
    command: scripts/forward.sh
    options:
      runInCI: false
      interactive: true
      cache: false
  # Delete the vind vcluster.
  stop:
    command: scripts/stop.sh
    options:
      runInCI: false
      interactive: true
      cache: false
