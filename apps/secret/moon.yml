language: bash
layer: application
project:
  description: OpenBao (single-node raft) + aws-sigv4-proxy secret/state broker
tags:
  - app
  - kubernetes
  - helm
  - secret
tasks:
  # Cluster lifecycle manages external (Docker) state, not file outputs, so it
  # must never be cached — always run the idempotent script.
  cluster-up:
    command: scripts/cluster.sh up
    options:
      runInCI: false
      interactive: true
      cache: false
  cluster-down:
    command: scripts/cluster.sh down
    options:
      runInCI: false
      interactive: true
      cache: false
  # Install the throwaway single-cluster Fleet controller (helm; cannot itself be
  # a Fleet bundle). Manages external cluster state, so never cached.
  fleet-install:
    command: scripts/fleet-install.sh
    options:
      runInCI: false
      interactive: true
      cache: false
  # Apply all Fleet bundles (apps/secret + apps/platform) into the fleet-local
  # workspace. Manages external cluster state, so never cached.
  up:
    command: scripts/up.sh
    options:
      runInCI: false
      interactive: true
      cache: false
  lint:
    command: scripts/lint.sh
    inputs:
      - scripts/lint.sh
      - "*/Chart.yaml"
      - "*/Chart.lock"
      - "*/values.yaml"
      - config/**/*
    options:
      runInCI: false
  # Initialise + unseal OpenBao, store unseal keys/root token in 1Password, and
  # configure the kubernetes auth method + kv engine. Prints the secrets you then
  # add via the OpenBao UI. Idempotent.
  init:
    command: scripts/init-openbao.sh
    options:
      runInCI: false
      interactive: true
      cache: false
