language: bash
layer: application
project:
  description: OpenBao (single-node raft) + aws-sigv4-proxy secret/state broker
tags:
  - app
  - kubernetes
  - helm
  - secret
tasks:
  lint:
    command: scripts/lint.sh
    inputs:
      - scripts/lint.sh
      - "*/Chart.yaml"
      - "*/Chart.lock"
      - "*/values.yaml"
      - config/**/*
    options:
      runInCI: false
