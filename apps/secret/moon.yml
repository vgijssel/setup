language: bash
layer: application
project:
  description: OpenBao (single-node raft) secret/state broker
tags:
  - app
  - kubernetes
  - helm
  - secret
# Four entry points, run in order for a full bring-up. Each manages external
# cluster / Docker / 1Password state (not file outputs), so none are cached.
tasks:
  # 1. Create (or reconnect to) the standalone vind cluster. Idempotent.
  start:
    command: scripts/start.sh
    options:
      runInCI: false
      interactive: true
      cache: false
  # 2. Install the Fleet controller and apply every src/ bundle. Idempotent.
  apply:
    command: scripts/apply.sh
    options:
      runInCI: false
      interactive: true
      cache: false
  # 3. Seed the static seal key and initialise OpenBao (keys -> 1Password).
  #    Prints how to add the remaining kv secrets via the UI. Idempotent.
  bootstrap:
    command: scripts/bootstrap.sh
    options:
      runInCI: false
      interactive: true
      cache: false
  # 4. Apply the OpenTofu OpenBao-config module with the root token into the
  #    shared kubernetes-backend state terranetes reconciles. Idempotent.
  configure:
    command: scripts/configure.sh
    options:
      runInCI: false
      interactive: true
      cache: false
  # Delete the vind vcluster.
  stop:
    command: scripts/stop.sh
    options:
      runInCI: false
      interactive: true
      cache: false
  # Port-forward the child's OpenBao to localhost:8200 (via the cluster-gateway
  # proxy) to log in + add kv secrets. Long-running; Ctrl-C to stop.
  forward:
    command: scripts/forward.sh
    options:
      runInCI: false
      interactive: true
      cache: false

  # ── openbao-config: the `-config` convention (SPEC §5/§6) ─────────────────
  # generate: embed src/openbao-config/terraform/*.tf inline into a committed
  # component/ ComponentDefinition (reusable libs/kubevela-tf-component script).
  generate:
    command: >-
      ../../libs/kubevela-tf-component/generate-component.sh
      src/openbao-config/terraform
      src/openbao-config/component/openbao-config.yaml
      openbao-config vault
      "OpenBao configuration for the secret child (kv, kubernetes auth, ESO + executor policies)"
    inputs:
      - src/openbao-config/terraform/**/*
      - /libs/kubevela-tf-component/generate-component.sh
    outputs:
      - src/openbao-config/component/openbao-config.yaml
    options:
      cache: true
  # generator_test: fail when component/ is stale relative to terraform/.
  generator_test:
    command: git diff --exit-code src/openbao-config/component/
    deps:
      - ~:generate
    inputs:
      - src/openbao-config/terraform/**/*
      - src/openbao-config/component/**/*
      - /libs/kubevela-tf-component/generate-component.sh
    options:
      cache: true
  # validate: `tofu validate` the source-of-truth HCL (providers installed with
  # -backend=false so no cluster/state is touched).
  validate:
    command: >-
      bash -c 'cd src/openbao-config/terraform &&
      tofu init -backend=false -input=false >/dev/null &&
      tofu validate'
    inputs:
      - src/openbao-config/terraform/**/*
    options:
      cache: true
