language: bash
layer: application
project:
  description: OpenBao (single-node raft) + aws-sigv4-proxy secret/state broker
tags:
  - app
  - kubernetes
  - helm
  - secret
tasks:
  lint:
    command: scripts/lint.sh
    inputs:
      - scripts/lint.sh
      - "*/Chart.yaml"
      - "*/Chart.lock"
      - "*/values.yaml"
      - config/**/*
    options:
      runInCI: false
  # Initialise + unseal OpenBao, store unseal keys/root token in 1Password, and
  # configure the kubernetes auth method + kv engine. Prints the secrets you then
  # add via the OpenBao UI. Idempotent.
  init:
    command: scripts/init-openbao.sh
    options:
      runInCI: false
      interactive: true
      cache: false
