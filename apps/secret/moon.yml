language: bash
layer: application
project:
  description: OpenBao (single-node raft) secret/state broker
tags:
  - app
  - kubernetes
  - helm
  - secret
# Entry points. Each manages external cluster / Docker state (not file outputs), so
# none are cached. `start` now runs the full bring-up end-to-end (cluster + apply);
# OpenBao self-initialises + auto-unseals and Crossplane configures it, so there is
# no bootstrap/configure step (those tasks are legacy, removed in the migration's
# final phase).
tasks:
  # Create (or reconnect to) the vind cluster, then install Fleet + apply every
  # bundle end-to-end. Idempotent. This is the single bring-up command.
  start:
    command: scripts/start.sh
    options:
      runInCI: false
      interactive: true
      cache: false
  # Install the Fleet controller and apply every bundle (bin/fleet-apply). Idempotent.
  # Invoked by `start`; also runnable standalone to re-apply into an existing cluster.
  apply:
    command: scripts/apply.sh
    options:
      runInCI: false
      interactive: true
      cache: false
  # Mint a short-lived (1h) OpenBao admin token for break-glass / human admin tasks
  # (seed kv secrets, recovery-key rotation, ...). Works for anyone with kubectl admin
  # on the secret cluster; prints export lines for BAO_ADDR + BAO_TOKEN.
  auth:
    command: scripts/auth.sh
    options:
      runInCI: false
      interactive: true
      cache: false
  # Mint the NetBird reverse-proxy proxy token this cluster's BYOP proxy authenticates with and
  # stash it in OpenBao (kv/secret-netbird-proxy#token) for ESO to surface. Mints via the
  # in-cluster NetBird PAT and writes kv through an openbao-0 exec (admin login, like `auth`).
  # Idempotent (skips if already set; FORCE=1 re-mints). Standalone; run once before/after the
  # BYOP proxy bundle applies. See scripts/netbird_proxy_auth.sh.
  netbird_proxy_auth:
    command: scripts/netbird_proxy_auth.sh
    options:
      runInCI: false
      interactive: true
      cache: false
  # Port-forward the OpenBao service to localhost:8200 to enter the human-only seed
  # kv secrets (Cloudflare / Tailscale OAuth / Netdata) via CLI or UI. Long-running.
  forward:
    command: scripts/forward.sh
    options:
      runInCI: false
      interactive: true
      cache: false
  # Delete the vind vcluster.
  stop:
    command: scripts/stop.sh
    options:
      runInCI: false
      interactive: true
      cache: false
