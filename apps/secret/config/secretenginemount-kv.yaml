# The kv v2 secret engine external-secrets reads from. Created by the operator
# (the seam no longer enables kv). Mounts at `{spec.path}/{metadata.name}`, so an
# empty spec.path + name `kv` yields the single-segment `kv/`. `version: "2"`
# selects kv v2 (matching the ClusterSecretStore's `version: v2`).
apiVersion: redhatcop.redhat.io/v1alpha1
kind: SecretEngineMount
metadata:
  name: kv
  namespace: vault-config-operator
spec:
  authentication:
    path: kubernetes
    role: vault-config-operator
    serviceAccount:
      name: controller-manager
  type: kv
  path: ""
  options:
    version: "2"
