# Kubernetes auth method mount. Mirrors the `bao auth enable kubernetes` planted
# by the init-openbao.sh seam, which the operator adopts on first reconcile
# (spike-validated: adopting an already-enabled mount reports success, accessor
# unchanged, no "path already in use" error). The seam also writes the method's
# `config` (kubernetes_host) — that one-time foothold config stays in the script;
# this CR owns only the mount.
#
# SecretEngineMount/AuthEngineMount land at `{spec.path}/{metadata.name}`;
# spec.path is omitted (the operator strips an empty string, which Fleet would
# otherwise flag as perpetual drift), so name `kubernetes` yields `kubernetes/`.
apiVersion: redhatcop.redhat.io/v1alpha1
kind: AuthEngineMount
metadata:
  name: kubernetes
  namespace: vault-config-operator
spec:
  authentication:
    path: kubernetes
    role: vault-config-operator
    serviceAccount:
      name: controller-manager
  type: kubernetes
