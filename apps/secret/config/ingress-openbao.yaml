# Exposes the OpenBao UI/API at https://secret.vgijssel.nl. ingress-nginx
# terminates TLS on the cert-manager LE cert (secret-vgijssel-nl-tls) and proxies
# to the plain-HTTP OpenBao ClusterIP service (tls_disable listener on :8200). The
# ingress-nginx controller is only reachable on the tailnet (loadBalancerClass
# tailscale), so this endpoint is tailnet-only; in-cluster ESO keeps using the
# openbao ClusterIP directly. In the `secret` ns (explicit) to sit alongside the
# openbao Service it routes to.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openbao
  namespace: secret
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - secret.vgijssel.nl
      secretName: secret-vgijssel-nl-tls
  rules:
    - host: secret.vgijssel.nl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openbao
                port:
                  number: 8200
