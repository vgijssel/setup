# S3 credentials for the sigv4-proxy, synced from OpenBao. Requires kv/s3 with
# access_key_id, secret_access_key, region and endpoint seeded in OpenBao.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: terraform-state-s3
  namespace: secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: terraform-state-s3
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: s3
        property: access_key_id
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: s3
        property: secret_access_key
    - secretKey: region
      remoteRef:
        key: s3
        property: region
    - secretKey: endpoint
      remoteRef:
        key: s3
        property: endpoint
