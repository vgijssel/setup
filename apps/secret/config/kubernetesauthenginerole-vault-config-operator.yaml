# The operator's own login role: binds the operator's ServiceAccount
# (controller-manager in the vault-config-operator namespace) to its admin policy.
# Mirrors the role planted by the init-openbao.sh seam so the operator adopts it
# on first reconcile. Because the content matches the planted object, adopting it
# does not lock the operator out of its own login path (spike-validated).
apiVersion: redhatcop.redhat.io/v1alpha1
kind: KubernetesAuthEngineRole
metadata:
  name: vault-config-operator
  namespace: vault-config-operator
spec:
  authentication:
    path: kubernetes
    role: vault-config-operator
    serviceAccount:
      name: controller-manager
  path: kubernetes
  policies:
    - vault-config-operator
  targetServiceAccounts:
    - controller-manager
  targetNamespaces:
    targetNamespaces:
      - vault-config-operator
