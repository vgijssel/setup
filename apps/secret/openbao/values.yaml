# OpenBao as a single-node raft cluster on a PersistentVolume (no HA), matching
# the gateway topology. TLS is disabled on the listener (global.tlsDisable
# default) since in-cluster consumers reach it over the ClusterIP service and
# external consumers terminate TLS at the Tailscale Service front-end.
#
# OpenBao boots sealed and uninitialised; it is initialised/unsealed out of band
# (keys -> 1Password) and its kubernetes auth method + kv engine are configured
# during bootstrap init (T5). Until then it stays sealed (pod Running, not Ready).
openbao:
  server:
    ha:
      enabled: true
      replicas: 1
      raft:
        enabled: true
        setNodeId: true
    dataStorage:
      enabled: true
      size: 1Gi
