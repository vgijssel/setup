{{- /*
  openbao-seal — the 32-byte static auto-unseal key exposed to OpenBao as
  env://SEAL_KEY (see values.yaml extraSecretEnvironmentVars + the `seal "static"`
  stanza). Replaces the old scripts/bootstrap.sh + 1Password seeding.

  Generate-once: on first apply the key is minted with randBytes (sprig returns a
  base64 string, equivalent to `openssl rand -base64 32`, then b64enc'd for the
  Secret data field). On every later apply we `lookup` the existing Secret and reuse
  its stored value verbatim, so the key NEVER rotates — rotating it would leave
  OpenBao unable to unseal the existing raft data.

  The `lookup` call MUST stay directly in this manifest template. Fleet only renders
  against the live cluster when its hasLookupFunction() detector sees `lookup`, and
  historically it did not traverse _helpers.tpl `define` blocks (rancher/fleet#5198),
  so a helper-wrapped lookup would silently render empty and rotate the key.
*/}}
{{- $ns := .Release.Namespace -}}
{{- $existing := (lookup "v1" "Secret" $ns "openbao-seal") -}}
{{- $sealKey := "" -}}
{{- if and $existing $existing.data (hasKey $existing.data "seal-key") -}}
{{-   $sealKey = index $existing.data "seal-key" -}}
{{- else -}}
{{-   $sealKey = (randBytes 32 | b64enc) -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: openbao-seal
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: openbao
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    # Never let a re-render wipe or rotate the key; the value is intentionally
    # generate-once and reused via lookup above.
    "helm.sh/resource-policy": keep
type: Opaque
data:
  seal-key: {{ $sealKey | quote }}
