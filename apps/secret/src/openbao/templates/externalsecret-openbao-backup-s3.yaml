# Materializes the `openbao-backup-s3` Secret the snapshotAgent CronJob consumes
# (snapshotAgent.s3CredentialsSecret + extraSecretEnvironmentVars, see values.yaml).
#
# ALL S3 connection settings come from the SHARED kv/s3-backup secret — the SAME
# credentials + bucket Omada's backup uses — so nothing S3-connection-related is
# hardcoded in git. The ONLY git-side, job-specific string is the `openbao/` prefix
# baked into S3_URI below (it can't live in the shared secret without coupling it to
# Omada). Read via the LOCAL `openbao` ClusterSecretStore (in-cluster kubernetes auth
# against this cluster's own OpenBao — same store the rest of the cluster uses).
#
# The store path is `kv`, so remoteRef.key is `s3-backup` (NOT `kv/s3-backup`).
#
# target.template composes the exact env keys the agent's s3cmd expects:
#   - AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY — s3cmd credentials.
#   - S3_HOST — a BARE host; the shared `endpoint` may carry an https:// scheme for
#     Omada's rclone, but s3cmd wants no scheme, so it is stripped here.
#   - S3_BUCKET — the shared bucket name.
#   - S3_URI — s3://<bucket>/openbao/, the only place the git-side `openbao/` prefix
#     appears (keeps OpenBao snapshots under their own prefix in the shared bucket).
#
# Helm-escaped: this file is rendered by the openbao umbrella chart, so each ESO
# Go-template is wrapped in a Helm backtick raw-string ({{ `...` }}) — Helm emits the
# inner template verbatim and ESO (not Helm) evaluates it at sync time. Same pattern
# as apps/network/src/omada/templates/externalsecret-mongodb-uri.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openbao-backup-s3
  namespace: secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: openbao-backup-s3
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        AWS_ACCESS_KEY_ID: '{{ `{{ .access_key_id }}` }}'
        AWS_SECRET_ACCESS_KEY: '{{ `{{ .secret_access_key }}` }}'
        # s3cmd S3_HOST must be a bare host — strip any scheme the shared value carries.
        S3_HOST: '{{ `{{ .endpoint | trimPrefix "https://" | trimPrefix "http://" }}` }}'
        S3_BUCKET: '{{ `{{ .bucket }}` }}'
        # Only the openbao/ prefix is git-side; the bucket comes from the shared secret.
        S3_URI: '{{ `s3://{{ .bucket }}/openbao/` }}'
  data:
    - secretKey: access_key_id
      remoteRef:
        key: s3-backup
        property: access_key_id
    - secretKey: secret_access_key
      remoteRef:
        key: s3-backup
        property: secret_access_key
    - secretKey: endpoint
      remoteRef:
        key: s3-backup
        property: endpoint
    - secretKey: bucket
      remoteRef:
        key: s3-backup
        property: bucket
