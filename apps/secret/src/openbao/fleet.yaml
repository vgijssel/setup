# Portable Fleet bundle for OpenBao (single-node raft, static auto-unseal,
# self-initializing). Fleet detects the umbrella Chart.yaml in this directory and
# deploys it (its values.yaml is the chart's own values, applied automatically).
# Same file, both worlds: `fleet apply` now and a Rancher GitRepo pointed at this
# path later.
#
# No bootstrap step: the openbao-seal Secret is generated declaratively by
# templates/secret-openbao-seal.yaml (generate-once via Helm lookup+randBytes), and
# OpenBao self-initializes on first boot (values.yaml `initialize` stanza). Helm's
# install order creates the Secret before the StatefulSet, so the pod finds
# env://SEAL_KEY on start and auto-unseals with no manual step.
#
# This bundle is the foothold Crossplane logs in against: crossplane-provider
# dependsOn it so the `crossplane` k8s-auth role exists before the provider logs in.
defaultNamespace: secret
helm:
  releaseName: openbao
