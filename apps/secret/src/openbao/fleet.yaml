# Portable Fleet bundle for OpenBao (single-node raft, static auto-unseal,
# self-initializing). Fleet detects the umbrella Chart.yaml in this directory and
# deploys it (its values.yaml is the chart's own values, applied automatically).
# Same file, both worlds: `fleet apply` now and a Rancher GitRepo pointed at this
# path later.
#
# Seal key: the openbao-seal Secret is seeded from 1Password by
# secret:put_openbao_seal_auth, which secret:start runs BEFORE this bundle applies, so
# the Secret exists before the StatefulSet starts and OpenBao finds env://SEAL_KEY and
# auto-unseals with no manual step. The key is never generated on-cluster. OpenBao then
# self-initializes on first boot (values.yaml `initialize` stanza).
#
# This bundle is the foothold Crossplane logs in against: crossplane-provider
# dependsOn it (via the label below) so the `crossplane` k8s-auth role exists
# before the provider logs in.
labels:
  fleet.vgijssel.nl/bundle: openbao
defaultNamespace: secret
helm:
  releaseName: openbao
# secret-ONLY. Declaring targetCustomizations replaces Fleet's implicit
# deploy-everywhere, so global bin/fleet-apply only deploys this on the secret cluster.
targetCustomizations:
  - name: secret
    clusterSelector:
      matchLabels:
        cluster.vgijssel.nl/name: secret
