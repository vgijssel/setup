# Portable Fleet bundle for OpenBao (single-node raft, static auto-unseal). Fleet
# detects the umbrella Chart.yaml in this directory and deploys it (its values.yaml
# is the chart's own values, applied automatically). Same file, both worlds:
# `fleet apply` now and a Rancher GitRepo pointed at this path later.
#
# The openbao-seal Secret must exist in the `secret` namespace before the pod
# can start (seeded by secret:bootstrap, which restarts the pod once the key is
# in place — the pod stays in CreateContainerConfigError until then).
defaultNamespace: secret
helm:
  releaseName: openbao
