# OpenBao as a single-node raft cluster on a PersistentVolume (no HA). TLS is
# disabled on the listener since in-cluster consumers reach it over the ClusterIP
# service and external consumers terminate TLS at the NetBird BYOP reverse proxy
# (apps/secret/src/netbird-reverse-proxy) fronting openbao.secret.vgijssel.nl.
#
# Static auto-unseal: OpenBao boots UNSEALED with no manual unseal dance. The
# 32-byte seal key lives in the `openbao-seal` K8s Secret, seeded from 1Password
# (op://enigma-prod/openbao-seal/seal-key) by `moon run secret:put_openbao_seal_auth`,
# which secret:start runs BEFORE apply so the Secret exists before OpenBao boots. The
# key is NEVER generated on-cluster — 1Password is the single source of truth, so the
# same key is always available to restore a barrier-encrypted Raft snapshot. It is
# injected as env://SEAL_KEY, so it never lands in the config ConfigMap or in git.
#
# Self-initialization: the `initialize` stanza (see the config below) makes OpenBao
# init ITSELF on first boot — no `bao operator init`, no scripts/bootstrap.sh. With a
# static/auto seal, self-init generates NO recovery keys and REVOKES the root token
# after running. It installs only the MINIMAL foothold that lets Crossplane take over
# from inside Kubernetes: the kubernetes auth method + the `crossplane` policy/role.
# Crossplane (upbound/provider-vault) then reconciles the FULL config; see
# apps/secret/src/openbao-config.
openbao:
  # This cluster delivers secrets via External Secrets Operator + Crossplane
  # (provider-vault), NOT the OpenBao agent-injector sidecar — no workload carries a
  # vault.hashicorp.com/agent-inject annotation. The chart enables the injector by
  # default, and its webhook's caBundle is patched at runtime by the injector's own
  # `vault-k8s` process; Fleet's server-side apply then conflicts on that field on
  # every re-apply, failing the Helm upgrade (and blocking dependsOn bundles like
  # openbao-config). Disable the unused injector to remove that recurring conflict.
  injector:
    enabled: false
  server:
    updateStrategy:
      type: RollingUpdate
    volumes:
      - name: plugins
        emptyDir: {}
    volumeMounts:
      - name: plugins
        mountPath: /openbao/plugins
    extraInitContainers:
      - name: plugin-netbird
        image: ghcr.io/vgijssel/setup/openbao-plugin-secrets-netbird:0.1.2
        command: [cp, /openbao-plugin-secrets-netbird, /plugins/]
        volumeMounts:
          - name: plugins
            mountPath: /plugins
    # Inject the base64 static seal key from the out-of-band Secret. Referenced as
    # env://SEAL_KEY in the seal stanza below.
    extraSecretEnvironmentVars:
      - envName: SEAL_KEY
        secretName: openbao-seal
        secretKey: seal-key
    ha:
      enabled: true
      replicas: 1
      raft:
        enabled: true
        setNodeId: true
        config: |
          ui = true
          plugin_directory = "/openbao/plugins"

          listener "tcp" {
            tls_disable = 1
            address = "[::]:8200"
            cluster_address = "[::]:8201"
          }

          storage "raft" {
            path = "/openbao/data"
          }

          service_registration "kubernetes" {}

          # Static auto-unseal. The 32-byte key comes from env://SEAL_KEY
          # (extraSecretEnvironmentVars -> openbao-seal Secret), never the
          # ConfigMap or git. Rotating the key means adding previous_key_id /
          # previous_key here (ask-first per SPEC).
          seal "static" {
            current_key_id = "secret-2026-07"
            current_key    = "env://SEAL_KEY"
          }

          # Declarative self-initialization (OpenBao 2.5+). Runs ONCE on first boot
          # while OpenBao is uninitialized, as root, then REVOKES the root token; with
          # the static seal above no recovery keys are produced. This is the MINIMAL
          # foothold only — enable kubernetes auth and create the `crossplane`
          # policy+role so Crossplane can log in and own the rest. Everything else
          # (kv mount, external-secrets + network jwt grants) is a Crossplane managed
          # resource under src/openbao-config, NOT here. Requests run in order.
          #
          # ┌─────────────────────────────────────────────────────────────────────────┐
          # │ INVARIANT: this `initialize` stanza is the IRREDUCIBLE, MINIMAL foothold   │
          # │ whose ONLY job is to let Crossplane authenticate. Keep it tiny.            │
          # │                                                                           │
          # │ It seeds exactly four things: enable + configure the kubernetes auth      │
          # │ method, and create the `crossplane` policy + role that provider-vault logs │
          # │ in with. It runs ONCE on first boot and never reconciles. Once Crossplane  │
          # │ can log in, CROSSPLANE provisions everything else (admin, kv, external-   │
          # │ secrets, network jwt, ...) under src/openbao-config/.                      │
          # │                                                                           │
          # │ init ⊂ crossplane (one-directional): everything here is ALSO a Crossplane  │
          # │ MR (so it is reconciled/owned continuously), but most of Crossplane is NOT │
          # │ here. Mirrors (keep semantically identical):                              │
          # │   enable kubernetes auth  <-> src/openbao-config/authbackend-kubernetes.yaml       │
          # │   configure kubernetes    <-> src/openbao-config/authbackendconfig-kubernetes.yaml │
          # │   crossplane policy       <-> src/openbao-config/policy-crossplane.yaml            │
          # │   crossplane role         <-> src/openbao-config/role-crossplane.yaml              │
          # │                                                                           │
          # │ DO NOT add anything here that Crossplane doesn't need to authenticate     │
          # │ (e.g. admin, kv, app grants). See apps/secret/CLAUDE.md for the full rule. │
          # └─────────────────────────────────────────────────────────────────────────┘
          initialize "crossplane_foothold" {
            # 1. Enable the kubernetes auth method at auth/kubernetes.
            request "enable_k8s_auth" {
              operation = "update"
              path      = "sys/auth/kubernetes"
              data = {
                type = "kubernetes"
              }
            }

            # 2. Configure it. In-cluster OpenBao reviews SA tokens with its own
            #    ServiceAccount (system:auth-delegator) and auto-reads the cluster CA
            #    + reviewer JWT from its pod, so kubernetes_host is all that is needed.
            request "configure_k8s_auth" {
              operation = "update"
              path      = "auth/kubernetes/config"
              data = {
                kubernetes_host = "https://kubernetes.default.svc:443"
              }
            }

            # 3. The `crossplane` admin policy: broad enough for the provider to manage
            #    every resource in src/openbao-config (mounts, auth methods, ACL
            #    policies, kubernetes + jwt-network roles) AND to always re-grant
            #    itself (sys/policies/acl/* + auth/kubernetes/*), so a bad apply can
            #    never lock the provider out. Crossplane reconciles this SAME policy
            #    (src/openbao-config/policy-crossplane.yaml) — keep the two byte-identical
            #    to avoid reconcile drift. Renamed from the old `terranetes` policy.
            request "write_crossplane_policy" {
              operation = "update"
              path      = "sys/policies/acl/crossplane"
              data = {
                policy = <<-POLICY
                  # secret engine mounts (kv)
                  path "sys/mounts" {
                    capabilities = ["read", "list"]
                  }
                  path "sys/mounts/*" {
                    capabilities = ["create", "read", "update", "delete"]
                  }
                  # auth method mounts (kubernetes, jwt-network)
                  path "sys/auth" {
                    capabilities = ["read", "list"]
                  }
                  path "sys/auth/*" {
                    capabilities = ["create", "read", "update", "delete", "sudo"]
                  }
                  # ACL policies (external-secrets, network-read, and crossplane itself)
                  path "sys/policy" {
                    capabilities = ["read", "list"]
                  }
                  path "sys/policy/*" {
                    capabilities = ["create", "read", "update", "delete", "list"]
                  }
                  path "sys/policies/acl" {
                    capabilities = ["list"]
                  }
                  path "sys/policies/acl/*" {
                    capabilities = ["create", "read", "update", "delete", "list"]
                  }
                  # kubernetes auth method config + roles
                  path "auth/kubernetes/*" {
                    capabilities = ["create", "read", "update", "delete", "list"]
                  }
                  # network cluster JWT auth method config + roles
                  path "auth/jwt-network/*" {
                    capabilities = ["create", "read", "update", "delete", "list"]
                  }
                  # plugin catalog (register custom secret engine binaries)
                  path "sys/plugins/catalog/*" {
                    capabilities = ["create", "read", "update", "delete", "list", "sudo"]
                  }
                  # netbird secrets engine configuration (role configs + root config)
                  path "netbird/config/*" {
                    capabilities = ["create", "read", "update", "delete", "list"]
                  }
                  # provider-vault creates a short-lived child token per reconcile via
                  # the terraform vault provider's auth_login flow. skip_child_token in
                  # the ProviderConfig is NOT honoured on that path (verified live), and
                  # OpenBao's `default` policy does not grant token creation, so the
                  # reconciler login token must be allowed to mint child tokens itself.
                  path "auth/token/create" {
                    capabilities = ["create", "update"]
                  }
                POLICY
              }
            }

            # 4. The login role bound to the Crossplane provider-vault pod's stable
            #    ServiceAccount (provider-vault in crossplane-system — pinned via the
            #    DeploymentRuntimeConfig in src/crossplane-provider). token_policies is
            #    a comma-separated string per the self-init request API.
            request "create_crossplane_role" {
              operation = "update"
              path      = "auth/kubernetes/role/crossplane"
              data = {
                bound_service_account_names      = "provider-vault"
                bound_service_account_namespaces = "crossplane-system"
                token_policies                   = "crossplane"
              }
            }
          }
          # NOTE: that's the ENTIRE foothold — nothing else belongs here. The `admin`
          # policy+role (break-glass), the kv mount, external-secrets, and the network
          # jwt grants are all provisioned by Crossplane AFTER it authenticates (see
          # src/openbao-config/). Do not grow this stanza beyond what Crossplane needs to
          # log in.
    dataStorage:
      enabled: true
      size: 1Gi
  # ── OpenBao Raft snapshot backups to Hetzner S3 ──────────────────────────────
  # The chart's built-in snapshot agent runs an hourly CronJob (openbao-snapshot)
  # that logs in via kubernetes auth as the least-privilege `snapshot` role
  # (src/openbao-config/{policy,role}-snapshot.yaml), takes a point-in-time Raft
  # snapshot via OpenBao's API, and uploads it to s3://enigma-s3-backup/openbao/
  # with s3cmd. This backs the secret broker's state OFF the single OrbStack VM
  # disk so it survives the vind disk-pressure loss mode. Additive only — the
  # seal/raft/self-init config above is load-bearing and untouched.
  #
  # DISASTER RECOVERY (drill-verified 2026-07-31): snapshots are barrier-encrypted,
  # so a restore REQUIRES the SAME static seal key (the `openbao-seal` Secret,
  # current_key_id secret-2026-07). Record that seal key out-of-band; NEVER store it
  # in the snapshot bucket (snapshot + seal key together = full plaintext compromise).
  # Restore into a fresh OpenBao that mounts the same seal key:
  #   bao operator init -recovery-shares=1 -recovery-threshold=1   # auto-unseals
  #   bao operator raft snapshot restore <downloaded.snap>         # stays unsealed
  # then log in via the restored `admin` kubernetes-auth role to read kv back.
  snapshotAgent:
    enabled: true
    schedule: 0 * * * * # hourly
    restartPolicy: OnFailure
    image:
      repository: ghcr.io/openbao/openbao-snapshot-agent
      # Pinned by tag AND @sha256 digest (multi-arch index: amd64 + arm64). The
      # chart renders repository:tag verbatim, so the digest rides on the tag.
      tag: 0.3.0@sha256:d7a8ca9d26b12cf226ce093b9051f243c53aefbb8a419b3dc0b554e7575c931c
    serviceAccount:
      create: true # creates SA `openbao-snapshot` in ns secret (role binds this name)
    s3CredentialsSecret: openbao-backup-s3 # ExternalSecret target (AWS_* + S3_* from kv)
    # ALL S3 connection settings come from the SECRET, not git. Container `env:`
    # overrides `envFrom` ConfigMap values in Kubernetes, so these win over the empty
    # config.s3* placeholders below (which exist only to blank the chart's AWS defaults).
    extraSecretEnvironmentVars:
      - envName: S3_HOST
        secretName: openbao-backup-s3
        secretKey: S3_HOST
      - envName: S3_BUCKET
        secretName: openbao-backup-s3
        secretKey: S3_BUCKET
      - envName: S3_URI
        secretName: openbao-backup-s3
        secretKey: S3_URI
    config:
      s3Host: "" # overridden by extraSecretEnvironmentVars (from kv)
      s3Bucket: "" # overridden (from kv)
      s3Uri: "" # overridden (from kv + openbao/ prefix)
      s3ExpireDays: "14" # rotating retention (job behavior, not a shared secret)
      baoAuthPath: kubernetes # job behavior
      baoRole: snapshot # job behavior — matches role-snapshot.yaml
    # Hardened pod/container securityContext. NOTE: the chart REPLACES (not merges)
    # this block with its defaults, and the snapshot-agent image ships no non-root
    # USER (runs as root by default), so runAsUser MUST be set — runAsNonRoot alone
    # would be a CreateContainerError. uid/gid mirror the chart's own hardened
    # defaults (100/1000) so nothing is weakened.
    securityContext:
      pod:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      container:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
