# OpenBao as a single-node raft cluster on a PersistentVolume (no HA). TLS is
# disabled on the listener since in-cluster consumers reach it over the ClusterIP
# service and external consumers terminate TLS at the Tailscale Service front-end.
#
# Static auto-unseal: OpenBao boots UNSEALED with no manual unseal dance. The
# 32-byte seal key is seeded out-of-band from 1Password into the `openbao-seal`
# K8s Secret (see scripts/bootstrap.sh) and injected as env://SEAL_KEY, so it
# never lands in the config ConfigMap or in git. Because auto-unseal is active,
# `bao operator init` yields recovery keys + a root token (also in scripts/bootstrap.sh).
openbao:
  server:
    # Inject the base64 static seal key from the out-of-band Secret. Referenced as
    # env://SEAL_KEY in the seal stanza below.
    extraSecretEnvironmentVars:
      - envName: SEAL_KEY
        secretName: openbao-seal
        secretKey: seal-key
    ha:
      enabled: true
      replicas: 1
      raft:
        enabled: true
        setNodeId: true
        config: |
          ui = true

          listener "tcp" {
            tls_disable = 1
            address = "[::]:8200"
            cluster_address = "[::]:8201"
          }

          storage "raft" {
            path = "/openbao/data"
          }

          service_registration "kubernetes" {}

          # Static auto-unseal. The 32-byte key comes from env://SEAL_KEY
          # (extraSecretEnvironmentVars -> openbao-seal Secret), never the
          # ConfigMap or git. Rotating the key means adding previous_key_id /
          # previous_key here (ask-first per SPEC).
          seal "static" {
            current_key_id = "secret-2026-07"
            current_key    = "env://SEAL_KEY"
          }
    dataStorage:
      enabled: true
      size: 1Gi
