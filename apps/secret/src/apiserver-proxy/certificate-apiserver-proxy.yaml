# Let's Encrypt cert for api.secret.vgijssel.nl, issued over Cloudflare DNS-01 by the
# shared letsencrypt-prod ClusterIssuer (apps/platform/src/config). cert-manager writes
# the chain into api-secret-vgijssel-nl-tls, which the reverse proxy
# (deployment-apiserver-proxy.yaml) mounts at /tls and serves on 8443 — so tailnet
# clients hitting the svc:api-secret VIP get a valid public cert (no *.ts.net in the
# path), exactly like api-network (T18) and the OpenBao endpoint.
#
# Stays NotReady until the cloudflare-api-token Secret is synced from OpenBao
# (platform-config ExternalSecret).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: api-secret-vgijssel-nl
  namespace: apiserver-proxy
spec:
  secretName: api-secret-vgijssel-nl-tls
  dnsNames:
    - api.secret.vgijssel.nl
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
