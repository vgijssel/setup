# Tailnet exposure for this cluster's Kubernetes API: a single Tailscale LoadBalancer
# Service fronted by the secret-ingress ProxyGroup (a stable VIP), advertising the
# svc:api-secret Service. external-dns publishes the VIP as the A record for
# api.secret.vgijssel.nl. The backing Pod (nginx, apiserver-proxy) terminates the LE
# cert and reverse-proxies to the in-cluster kube-apiserver — this is the secret
# analogue of api-network (T18), reusing the existing secret-ingress ProxyGroup (one
# ProxyGroup can advertise several Service VIPs, alongside the "secret"/OpenBao VIP).
#
# L3/TCP only (port 443 -> 8443): TLS is terminated by nginx with the public LE cert, so
# no *.ts.net cert ever appears in the path.
#
# Requires the tailnet policy (apps/network/src/tailscale-config — the whole tailnet
# policy is reconciled by terranetes on the network cluster): the svc:api-secret
# autoApprover (so the ProxyGroup may advertise the VIP) + a group:admin grant (kubectl
# over the tailnet). Unlike api-network there is NO tag:k8s grant — this endpoint has no
# cross-cluster JWKS consumer. Without the autoApprover the VIP is never advertised.
apiVersion: v1
kind: Service
metadata:
  name: apiserver-proxy
  namespace: apiserver-proxy
  annotations:
    tailscale.com/hostname: api-secret
    tailscale.com/proxy-group: secret-ingress
    external-dns.alpha.kubernetes.io/hostname: api.secret.vgijssel.nl
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app.kubernetes.io/name: apiserver-proxy
  ports:
    - name: https
      port: 443
      targetPort: 8443
      protocol: TCP
