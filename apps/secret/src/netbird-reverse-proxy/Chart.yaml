# Thin per-cluster bundle for the secret cluster's NetBird BYOP reverse proxy (fronts OpenBao).
#
# Two single-`file://`-level dependencies (S1 decision, tasks/plan.md Phase 0):
#   - netbird-reverse-proxy (vendored, third_party): the proxy Deployment/Service workload.
#     Values under key `netbird-reverse-proxy:` in values.yaml (proxy.domain, tls, securityContext).
#   - netbird-reverse-proxy-shared (first-party, apps/platform): the reusable cert + ESO proxy
#     token + self-heal watchdog + Cloudflare/domain-link Workspace. Parameterized via
#     `netbird-reverse-proxy-shared.{domain,tokenKvPath}` set in fleet.yaml helm.values.
#
# The cert/ESO/watchdog templates + the reverse-proxy-dns-secret domain Workspace used to live
# here (and in cloudflare-config); they moved verbatim into the shared chart so the network
# cluster reuses them. releaseName stays `netbird-reverse-proxy` (fleet.yaml) so the live Helm
# release is upgraded/adopted, not reinstalled (tasks/plan.md Phase 2 adoption gate).
#
# Fleet builds both file:// deps at apply time; Chart.lock + charts/*.tgz are gitignored under
# apps/secret/src (never committed).
apiVersion: v2
name: netbird-reverse-proxy
description: NetBird BYOP reverse proxy (secret cluster) — vendored proxy workload + shared cert/ESO/watchdog/domain
version: 1.0.0
appVersion: 0.72.4
dependencies:
  - name: netbird-reverse-proxy
    version: 0.1.0
    repository: file://../../../../third_party/vendir/charts/netbird-reverse-proxy
  - name: netbird-reverse-proxy-shared
    version: 1.0.0
    repository: file://../../../platform/src/netbird-reverse-proxy-shared
