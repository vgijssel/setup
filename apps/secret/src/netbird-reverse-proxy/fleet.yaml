# Fleet bundle for the NetBird BYOP reverse proxy (secret cluster only). Fleet detects the
# umbrella Chart.yaml and deploys it with values.yaml, plus the sibling ExternalSecret that
# feeds the proxy its management token and the Certificate that gives it a trusted cert.
# Deployed into the `netbird` namespace (owned by the netbird-operator bundle), so it dependsOn
# that bundle — both so the namespace exists and so the overlay control plane is up first.
#
# Once this proxy connects to NetBird Cloud it registers as a Private-capable proxy cluster,
# which is what unlocks the NetBird-Only (private, mesh-only) reverse-proxy service that exposes
# OpenBao at openbao.secret.vgijssel.nl without a public interstitial.
#
# Fleet builds the umbrella file:// chart dep at apply time, so Chart.lock and charts/*.tgz are
# gitignored under apps/secret/src (never committed).
labels:
  fleet.vgijssel.nl/bundle: netbird-reverse-proxy
defaultNamespace: netbird
helm:
  releaseName: netbird-reverse-proxy
dependsOn:
  - selector:
      matchLabels:
        fleet.vgijssel.nl/bundle: netbird-operator
# secret-ONLY. bin/fleet-apply applies every bundle globally, so target the secret cluster
# explicitly to keep the BYOP proxy off the network cluster.
targetCustomizations:
  - name: secret
    clusterSelector:
      matchLabels:
        cluster.vgijssel.nl/name: secret
