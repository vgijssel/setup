# Fleet bundle for the NetBird BYOP reverse proxy (secret cluster only). The umbrella Chart.yaml
# now deps TWO charts — the vendored proxy workload + the first-party netbird-reverse-proxy-shared
# chart (cert, ESO proxy-token, self-heal watchdog, and the reverse-proxy-dns-secret domain
# Workspace). The proxy's own values live in values.yaml under `netbird-reverse-proxy:`; the shared
# chart's two params are set here under its subchart key.
#
# Once this proxy connects to NetBird Cloud it registers as a Private-capable proxy cluster
# (secret.vgijssel.nl), which unlocks the NetBird-Only service exposing OpenBao at
# openbao.secret.vgijssel.nl.
#
# dependsOn:
#   - netbird-operator     : owns the `netbird` namespace + overlay control plane.
#   - crossplane-provider  : installs the opentofu.upbound.io CRDs the domain Workspace needs
#                            (Fleet atomic-release rule: a CR can't share a bundle with its CRD).
#   - cloudflare-config    : provides ProviderConfig `default` + the crossplane-system secrets
#                            (netbird-mgmt-api-token, cloudflare-credentials) the domain Workspace
#                            reads. Ordered AFTER it so the ProviderConfig/secrets exist first —
#                            also makes the domain-workspace move a clean prune-then-create (the
#                            old cloudflare-config copy is pruned first; Orphan keeps the live
#                            NetBird domain, and this bundle recreates the CR which re-adopts state).
#
# releaseName pinned so the live secret release is UPGRADED, not reinstalled (adoption gate).
# Chart.lock + charts/*.tgz are gitignored under apps/secret/src (built at apply time).
labels:
  fleet.vgijssel.nl/bundle: netbird-reverse-proxy
defaultNamespace: netbird
helm:
  releaseName: netbird-reverse-proxy
  values:
    # Params for the shared chart (keyed under its subchart name). The proxy workload's values
    # stay in values.yaml under `netbird-reverse-proxy:`.
    netbird-reverse-proxy-shared:
      domain: secret.vgijssel.nl
      tokenKvPath: secret-netbird-proxy
dependsOn:
  - selector:
      matchLabels:
        fleet.vgijssel.nl/bundle: netbird-operator
  - selector:
      matchLabels:
        fleet.vgijssel.nl/bundle: crossplane-provider
  - selector:
      matchLabels:
        fleet.vgijssel.nl/bundle: cloudflare-config
# secret-ONLY. bin/fleet-apply applies every bundle globally, so target the secret cluster
# explicitly to keep the BYOP proxy off the network cluster.
targetCustomizations:
  - name: secret
    clusterSelector:
      matchLabels:
        cluster.vgijssel.nl/name: secret
