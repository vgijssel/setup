# Surfaces the BYOP proxy's management token from OpenBao into the `netbird` namespace as a
# Secret named `netbird-proxy-token` (key `token`), which the netbird-reverse-proxy chart
# consumes via proxy.managementServer.auth.existingSecret. The token was minted once via
# POST /api/reverse-proxies/proxy-tokens (name secret-byop-proxy) and written to
# kv/secret-netbird-proxy#token — it is shown only once by the API, so it lives in OpenBao,
# not in git. Reads via the LOCAL `openbao` ClusterSecretStore (in-cluster kubernetes auth
# against the secret cluster's own OpenBao — same store the rest of this cluster uses).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbird-proxy-token
  namespace: netbird
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: netbird-proxy-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: secret-netbird-proxy
        property: token
