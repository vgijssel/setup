# Publicly-trusted TLS cert for the BYOP reverse proxy's client-facing listener. On the private
# (NetBird-Only) path NetBird does NOT auto-provision a cert (that's only for public services on
# the shared cloud cluster), so the proxy must serve its own — cert-manager issues it here.
#
# Wildcard *.secret.vgijssel.nl covers every private service this proxy fronts on the secret
# cluster (openbao.secret.vgijssel.nl today), so a browser/curl over the mesh gets a trusted cert
# with no name-mismatch warning. Issued over Cloudflare DNS-01 by the shared letsencrypt-prod
# ClusterIssuer (wildcards require DNS-01). cert-manager writes the chain into the
# netbird-reverse-proxy-cert Secret, which the chart mounts at /certs (proxy.tls.source=secret);
# the proxy hot-reloads on renewal without a restart.
#
# NOTE the secretName is deliberately NOT the chart's own self-signed secret name
# (netbird-reverse-proxy-tls) — sharing it makes Helm and cert-manager both claim ownership, and
# flipping proxy.tls.source to `secret` would have Helm prune the self-signed secret out from
# under cert-manager. A distinct name keeps cert-manager the sole owner.
#
# Wildcard is *.secret.vgijssel.nl, NOT *.vgijssel.nl: TLS wildcards (RFC 6125) match exactly
# one label, so *.vgijssel.nl is invalid for the two-label openbao.secret.vgijssel.nl. (Distinct
# from Cloudflare's DNS wildcard, which resolves at arbitrary depth.) Every service this proxy
# fronts is <svc>.secret.vgijssel.nl, so one wildcard fits.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: netbird-reverse-proxy
  namespace: netbird
spec:
  secretName: netbird-reverse-proxy-cert
  dnsNames:
    - "*.secret.vgijssel.nl"
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
