# Syncs the secret cluster's NetBird management PAT from OpenBao into crossplane-system so the
# reverse-proxy Workspaces can read it as the NB_PAT / TF_VAR_nb_pat env vars (the netbirdio/
# netbird provider's admin token + the restapi Authorization header). Same source the operator
# uses (kv/secret-netbird-operator#access_token — a per-cluster admin PAT); synced into
# crossplane-system (not reused from the netbird namespace) so the provider-opentofu SA's RBAC —
# scoped to crossplane-system — can read it. Read via the LOCAL `openbao` ClusterSecretStore
# (in-cluster kubernetes auth against this cluster's own OpenBao).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbird-mgmt-api-token
  namespace: crossplane-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: netbird-mgmt-api-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: secret-netbird-operator
        property: access_token
