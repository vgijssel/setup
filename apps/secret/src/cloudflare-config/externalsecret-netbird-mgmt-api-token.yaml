# Generates a dynamic NetBird PAT for the secret cluster's Crossplane Workspaces (reverse-proxy
# domain registration, service creation) via the openbao-plugin-secrets-netbird engine. The
# Workspaces read it as NB_PAT / TF_VAR_nb_pat env var (netbirdio/netbird TF provider token +
# restapi Authorization header). Synced into crossplane-system so the provider-opentofu SA's
# RBAC can read it.
#
# refreshInterval 360h (15 days) = new PAT halfway through the 30-day TTL, so the old PAT
# stays valid as overlap while the Workspace picks up the new one.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbird-mgmt-api-token
  namespace: crossplane-system
spec:
  refreshInterval: 360h
  secretStoreRef:
    name: openbao-netbird
    kind: ClusterSecretStore
  target:
    name: netbird-mgmt-api-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: pat/secret-operator
        property: access_token
