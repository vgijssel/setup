# Syncs the Cloudflare API token from OpenBao (kv/cloudflare#credential) into a Secret the
# opentofu Workspace injects as the CLOUDFLARE_API_TOKEN env var. The cloudflare/cloudflare
# TF provider reads that env var directly, so the token never appears in the inline HCL or in a
# ProviderConfig. Same kv path this cluster's external-dns/cert-manager DNS-01 solver uses
# (apps/platform/src/config), read via the LOCAL `openbao` ClusterSecretStore. Lives in
# crossplane-system where the provider pod runs the workspace.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-credentials
  namespace: crossplane-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: cloudflare-credentials
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: cloudflare
        property: credential
