# Raw-manifest Fleet bundle: the shared provider-opentofu `default` ProviderConfig (state in the
# kubernetes backend) plus the NetBird management PAT the Workspaces authenticate with.
#
# The bundle NAME is now a misnomer and is kept on purpose. It used to own this cluster's
# NetBird reverse-proxy registration end to end — the `secret.vgijssel.nl` reverse-proxy domain,
# its Cloudflare `*.secret.vgijssel.nl` CNAME, and the `openbao.secret.vgijssel.nl` private
# service (Mastercard/restapi). All of that went with the BYOP reverse proxy, replaced by the
# mesh exposure in ../mesh-openbao, and the Cloudflare credential they needed went with them;
# nothing here touches Cloudflare any more. Renaming the directory would rename the Fleet bundle,
# which prunes and re-creates the `default` ProviderConfig that EVERY Workspace on this cluster
# references (../mesh-openbao, ../mesh-tls, ../openbao-config) — a self-inflicted outage window
# for a cosmetic gain, so the name stays.
#
# dependsOn crossplane-provider (label selector): the opentofu.upbound.io CRDs (ProviderConfig,
# Workspace) are registered by provider-opentofu, so it must be installed before these CRs apply
# — else the atomic Helm release fails on unknown CRDs. (Same split/ordering as openbao-config ->
# crossplane-provider.) The Workspaces only reconcile once OpenBao is unsealed and this cluster
# can reach api.netbird.io.
dependsOn:
  - selector:
      matchLabels:
        fleet.vgijssel.nl/bundle: vault-secrets-operator
  - selector:
      matchLabels:
        fleet.vgijssel.nl/bundle: crossplane-provider
labels:
  fleet.vgijssel.nl/bundle: cloudflare-config
defaultNamespace: crossplane-system
# secret-ONLY. bin/fleet-apply applies every bundle globally, so target the secret cluster
# explicitly (the network cluster has its own cloudflare-config bundle).
targetCustomizations:
  - name: secret
    clusterSelector:
      matchLabels:
        cluster.vgijssel.nl/name: secret
  # Terminal catch-all. Targets are first-match-wins and a GitRepo APPENDS its own target
  # after these, so without this a non-matching cluster falls through to it and deploys with
  # default values. Keeps this bundle off every cluster not named above. See bin/fleet-lint-targets.
  - name: none
    doNotDeploy: true
    clusterSelector: {}
