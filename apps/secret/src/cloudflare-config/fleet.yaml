# Raw-manifest Fleet bundle: the provider-opentofu ProviderConfig + the ESO ExternalSecrets
# feeding it the NetBird + Cloudflare tokens, and the inline-OpenTofu Workspace MRs that register
# THIS cluster's NetBird reverse proxy end-to-end (kept local to secret so the proxy's config
# lives with its consumer):
#   - reverse-proxy-dns-secret.yaml : secret.vgijssel.nl reverse-proxy domain + Cloudflare
#                                     *.secret.vgijssel.nl CNAME (netbird + cloudflare v5).
#   - reverse-proxy-services.yaml   : the OpenBao NetBird-only private service
#                                     (Mastercard/restapi), openbao.secret.vgijssel.nl.
#
# dependsOn crossplane-provider (label selector): the opentofu.upbound.io CRDs (ProviderConfig,
# Workspace) are registered by provider-opentofu, so it must be installed before these CRs apply
# — else the atomic Helm release fails on unknown CRDs. (Same split/ordering as openbao-config ->
# crossplane-provider.) The ESOs read the LOCAL `openbao` ClusterSecretStore and the Workspaces
# only reconcile once OpenBao is unsealed + this cluster can reach api.netbird.io / Cloudflare.
dependsOn:
  - selector:
      matchLabels:
        fleet.vgijssel.nl/bundle: crossplane-provider
labels:
  fleet.vgijssel.nl/bundle: cloudflare-config
defaultNamespace: crossplane-system
# secret-ONLY. bin/fleet-apply applies every bundle globally, so target the secret cluster
# explicitly (the network cluster has its own cloudflare-config bundle).
targetCustomizations:
  - name: secret
    clusterSelector:
      matchLabels:
        cluster.vgijssel.nl/name: secret
