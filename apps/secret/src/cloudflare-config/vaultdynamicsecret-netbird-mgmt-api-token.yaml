# NetBird management PAT for the provider-opentofu Workspaces, minted from netbird/pat/secret-operator.
#
# Migrated from External Secrets Operator to Vault Secrets Operator. Nothing about the resulting
# Secret changes -- same name, namespace and key -- so the consumer needs no edit.
#
# WHY THIS ONE HAD TO MOVE: ESO cannot hold a lease. A secret lease is a CHILD of the auth token
# that created it, and ESO calls RevokeSelf after every read (its own fix for leaking token
# leases, external-secrets#376), so a leased credential is destroyed seconds after it lands in
# the Secret. That is why the netbird engine's roles are still `manage_lease = false` -- see
# ../openbao-config/plugin-netbird.yaml.
#
# refreshAfter is set BECAUSE those roles are unleased: with no lease TTL to drive renewal, VSO
# has nothing to schedule from, and this interval is the only thing causing a re-read. Once the
# netbird plugin is re-released with leasing and its roles flip, the lease takes over and this
# becomes the fallback it is documented as.
#
# The login ServiceAccount is defined once per cluster in ../config/serviceaccounts-vso.yaml.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultDynamicSecret
metadata:
  name: netbird-mgmt-api-token
  namespace: crossplane-system
spec:
  mount: netbird
  path: pat/secret-operator
  # NOTE allowStaticCreds is deliberately NOT set. It defaults to false, which is what a
  # lease-backed dynamic credential wants (true is for Vault static-roles, which these engines do
  # not have) — and stating `false` explicitly makes Fleet report perpetual drift
  # (`modified {"spec":{"allowStaticCreds":false}}`), because server-side apply drops an explicit
  # boolean that equals the zero value and Fleet then re-diffs it forever.
  # Hand the lease back on deletion so the credential disappears from NetBird immediately. A
  # no-op while the role is unleased, and correct the moment it is not.
  revoke: true
  refreshAfter: 360h
  destination:
    name: netbird-mgmt-api-token
    create: true
    transformation:
      templates:
        token:
          text: '{{ get .Secrets "access_token" }}'
      excludeRaw: true
      excludes:
        - .*
