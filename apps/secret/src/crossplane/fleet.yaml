# Portable Fleet bundle for Crossplane core. Fleet detects the umbrella Chart.yaml
# here and deploys it with values.yaml into crossplane-system, resolving the
# file:// chart dependency against the vendored chart at build time.
#
# This is the reconciler that replaces terranetes for apps/secret: once core is
# Ready its pkg.crossplane.io CRDs (Provider, DeploymentRuntimeConfig, ...) exist,
# so the crossplane-provider bundle dependsOn this one (label below).
labels:
  fleet.vgijssel.nl/bundle: crossplane
defaultNamespace: crossplane-system
helm:
  releaseName: crossplane
# secret-ONLY. apps/secret owns the OpenBao config reconciler; the network cluster
# runs its own crossplane bundle (out of scope). Under bin/fleet-apply the selector alone is
# enough, but a Rancher GitRepo appends its own catch-all target — so the terminal
# doNotDeploy entry below is what yields no BundleDeployment unless labelled `secret`.
targetCustomizations:
  - name: secret
    clusterSelector:
      matchLabels:
        cluster.vgijssel.nl/name: secret
  # Terminal catch-all. Targets are first-match-wins and a GitRepo APPENDS its own target
  # after these, so without this a non-matching cluster falls through to it and deploys with
  # default values. Keeps this bundle off every cluster not named above. See bin/fleet-lint-targets.
  - name: none
    doNotDeploy: true
    clusterSelector: {}
