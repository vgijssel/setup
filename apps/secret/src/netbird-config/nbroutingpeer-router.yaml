# NetBird routing peer for the secret cluster (operator v1 stack). Mirrors the network
# cluster's ../../../network/src/netbird-config/nbroutingpeer-router.yaml. Deploys a
# netbird client that (a) enrolls this cluster into NetBird under the operator's
# --cluster-name group "secret" — the SOURCE group the network cluster's jwks-mirror
# expose policy (netbird.io/policy-source-groups: "secret") already references — and
# (b) routes traffic for domain-type NBResources this peer has policy access to (the
# network cluster's jwks-mirror.netbird.svc.cluster.local) into the cluster, so the
# secret cluster's OpenBao jwt-network backend can fetch the network JWKS over NetBird.
#
# The operator auto-creates the backing NetBird Network + group "secret" + reusable
# setup key and writes the setup key to a Secret named after this CR. Single replica is
# plenty for the homelab.
apiVersion: netbird.io/v1
kind: NBRoutingPeer
metadata:
  name: router
  namespace: netbird
spec:
  replicas: 1
