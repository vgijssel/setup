# Reusable SetupKey that auto-joins the `secret-k8s` group. Used to enroll this
# cluster's ClusterProxy proxy peer(s) so the apiserver ClusterProxy (api-secret) can
# advertise over the mesh. Non-ephemeral (peers persist across restarts). The operator
# creates the key in NetBird via the management API and records the id in
# status.setupKeyID — a live proof the operator's PAT has write scope.
apiVersion: netbird.io/v1alpha1
kind: SetupKey
metadata:
  name: secret-k8s
  namespace: netbird
spec:
  name: secret-k8s
  ephemeral: false
  allowExtraDnsLabels: true
  autoGroups:
    - localRef:
        name: secret-k8s
