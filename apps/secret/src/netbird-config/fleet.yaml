# Raw-manifest Fleet bundle carrying the secret cluster's NetBird account config
# (netbird.io CRs the operator reconciles into NetBird Cloud via the management API):
#   - group-secret-k8s.yaml     : the `secret-k8s` Group (isolated; does not touch shared
#     policy or other peers like PiKVM). It is ALSO the source group of the network cluster's
#     mesh JWKS exposure (../../../network/src/mesh-jwks), so it is load-bearing beyond the
#     ClusterProxy that originally justified it.
#   - setupkey-secret-k8s.yaml  : a reusable SetupKey auto-joining `secret-k8s`, used to
#     enroll this cluster's ClusterProxy proxy peer(s).
# The ClusterProxy (clusterproxy-api-secret.yaml) fronts the kube-apiserver over the mesh
# with per-caller impersonation (serviceaccount-clusterproxy.yaml), consumed via `netbird
# kubernetes write-kubeconfig` — no custom domain (NetBird ClusterProxy does not support a
# custom endpoint for it yet). Replaces the retired tailnet api-secret kube-apiserver exposure.
#
# NO ROUTING PEER HERE, deliberately — and the asymmetry with the network cluster is the point.
# `nbroutingpeer-router.yaml` plus its watchdog lived here to serve ONE consumer: OpenBao's
# jwt-network backend fetching the network cluster's JWKS over the old `netbird.io/expose`
# NBResource path, which named the operator-auto-created group `secret` as its source. That path
# is gone — the JWKS mirror is its own mesh peer now (`jwks-network.vpn.blueora.ng`) and the
# forwarder in ../jwks-gateway carries its own mesh client — so the peer had no remaining
# consumer. Checked before deleting, because an unused-looking routing peer is exactly what the
# NETWORK cluster's turned out not to be: nothing on this cluster resolves a `*.vpn.blueora.ng`
# name from an ordinary pod. OpenBao reaches the JWKS through a CoreDNS override to an in-cluster
# ClusterIP, this cluster's Vault Secrets Operator reaches OpenBao over a ClusterIP in plain HTTP,
# and the ClusterProxy and the mesh exposure each run their own client. Deleting it also took the
# account-side `secret` network and group with it, which is why ../jwks-gateway's SetupKey no
# longer lists `secret` in autoGroups.
#
# dependsOn the netbird-operator bundle (label selector, portable across the standalone
# Fleet -> Rancher GitRepo move) so Fleet only deploys it once the operator's CRDs are
# established — otherwise a fresh-cluster install deadlocks (the CR's CRD isn't
# registered yet).
defaultNamespace: netbird
dependsOn:
  - selector:
      matchLabels:
        fleet.vgijssel.nl/bundle: netbird-operator
labels:
  fleet.vgijssel.nl/bundle: netbird-config
# secret-ONLY. bin/fleet-apply applies every bundle globally, so target the secret
# cluster explicitly — this keeps the bundle off the network cluster.
targetCustomizations:
  - name: secret
    clusterSelector:
      matchLabels:
        cluster.vgijssel.nl/name: secret
  # Terminal catch-all. Targets are first-match-wins and a GitRepo APPENDS its own target
  # after these, so without this a non-matching cluster falls through to it and deploys with
  # default values. Keeps this bundle off every cluster not named above. See bin/fleet-lint-targets.
  - name: none
    doNotDeploy: true
    clusterSelector: {}
