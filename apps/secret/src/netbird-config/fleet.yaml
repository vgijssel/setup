# Raw-manifest Fleet bundle carrying the secret cluster's NetBird account config
# (netbird.io CRs the operator reconciles into NetBird Cloud via the management API):
#   - nbroutingpeer-router.yaml : the secret cluster's routing peer (operator v1 stack),
#     which enrolls this cluster under the group "secret" and routes domain-type
#     NBResources it has policy access to (the network cluster's jwks-mirror) into the
#     cluster. This is the CONSUMER half of the cross-cluster JWKS path — the network
#     cluster's jwks-mirror expose policy names group "secret" as its source.
#   - group-secret-k8s.yaml     : the `secret-k8s` Group (isolated; does not touch shared
#     policy or other peers like PiKVM).
#   - setupkey-secret-k8s.yaml  : a reusable SetupKey auto-joining `secret-k8s`, used to
#     enroll this cluster's ClusterProxy proxy peer(s).
#   - serviceaccount-router-watchdog.yaml + cronjob-router-watchdog.yaml: a self-heal
#     watchdog that recycles the NBRoutingPeer (deploy/router) when its netbird daemon
#     wedges in NeedsLogin/SessionExpired (e.g. after a host VM suspend/resume), which the
#     daemon cannot recover from on its own and the CR does not surface.
# The ClusterProxy (clusterproxy-api-secret.yaml) fronts the kube-apiserver over the mesh
# with per-caller impersonation (serviceaccount-clusterproxy.yaml), consumed via `netbird
# kubernetes write-kubeconfig` — no custom domain (NetBird ClusterProxy does not support
# api.secret.vgijssel.nl yet). Replaces the retired tailnet api-secret kube-apiserver exposure.
#
# dependsOn the netbird-operator bundle (label selector, portable across the standalone
# Fleet -> Rancher GitRepo move) so Fleet only deploys it once the operator's CRDs are
# established — otherwise a fresh-cluster install deadlocks (the CR's CRD isn't
# registered yet).
defaultNamespace: netbird
dependsOn:
  - selector:
      matchLabels:
        fleet.vgijssel.nl/bundle: netbird-operator
labels:
  fleet.vgijssel.nl/bundle: netbird-config
# secret-ONLY. bin/fleet-apply applies every bundle globally, so target the secret
# cluster explicitly — this keeps the bundle off the network cluster.
targetCustomizations:
  - name: secret
    clusterSelector:
      matchLabels:
        cluster.vgijssel.nl/name: secret
