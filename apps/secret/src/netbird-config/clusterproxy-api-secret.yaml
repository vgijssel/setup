# NetBird ClusterProxy exposing this cluster's kube-apiserver over the mesh, replacing
# the retired tailnet api-secret kube-apiserver exposure. The operator provisions a
# Deployment of NetBird proxy peers (group secret-k8s) that front the apiserver with
# per-caller impersonation (see serviceaccount-clusterproxy.yaml). Reachable NetBird-
# natively via `netbird kubernetes write-kubeconfig`. NOTE: NetBird ClusterProxy does not
# support custom domains yet, so there is NO api.secret.vgijssel.nl endpoint — kubectl
# uses the write-kubeconfig endpoint only. clusterName is immutable.
#
# Unlike the network cluster there is no cross-cluster JWKS consumer here, so there is no
# anonymous OIDC-discovery binding fronted by this proxy.
apiVersion: netbird.io/v1alpha1
kind: ClusterProxy
metadata:
  name: api-secret
  namespace: netbird
spec:
  clusterName: secret
  apiServer: https://kubernetes.default.svc.cluster.local/
  serviceAccountName: netbird-clusterproxy
  groups:
    - localRef:
        name: secret-k8s
