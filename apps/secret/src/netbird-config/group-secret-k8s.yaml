# The `secret-k8s` NetBird group — this cluster's kube-apiserver-proxy identity in
# NetBird ACLs. A new, isolated group scoped to this cluster (the directional replacement
# for the former tag:secret-k8s); it does not modify shared policy or affect other
# peers (e.g. PiKVM). The operator creates it in NetBird via the management API and records
# the id in status.groupID.
#
# Distinct from the auto-created "secret" group the NBRoutingPeer (nbroutingpeer-router)
# enrolls under: `secret-k8s` gates the ClusterProxy proxy peers (kubectl), "secret" gates
# the routing peer that consumes the network JWKS mirror.
apiVersion: netbird.io/v1alpha1
kind: Group
metadata:
  name: secret-k8s
  namespace: netbird
spec:
  name: secret-k8s
