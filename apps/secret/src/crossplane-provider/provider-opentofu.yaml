# upbound/provider-opentofu — runs OpenTofu (Terraform-compatible) inside Crossplane via
# Workspace CRs with inline HCL. On the secret cluster it now backs:
#   - the NetBird + Cloudflare secrets-engine registration and role config (src/openbao-config,
#     which needs plugin-catalog and generic-endpoint writes provider-vault has no types for);
#   - the mesh wildcard certificate publish into kv/mesh-tls (src/mesh-tls);
#   - the mesh exposures' NetBird access policies (src/mesh-openbao, via the shared
#     mesh-service chart — one netbird_policy per protocol).
# It used to manage this cluster's BYOP reverse-proxy registration as well (the OpenBao
# NetBird-only service via Mastercard/restapi, plus the secret.vgijssel.nl reverse-proxy domain
# and its Cloudflare wildcard CNAME); that went with the proxy, and the restapi provider with it.
#
# Multi-arch (arm64 + amd64), Upbound-official; it just runs `tofu`, which pulls the arm64
# provider plugins (netbird, vault) at init time. Pinned by tag + multi-arch index digest (same
# pin as the network cluster's provider-opentofu).
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-opentofu
spec:
  package: xpkg.upbound.io/upbound/provider-opentofu:v1.1.5@sha256:3b5580b52acc0b33b882ff48521b68f4d717c9151636f7f7617debce2416921d
  runtimeConfigRef:
    apiVersion: pkg.crossplane.io/v1beta1
    kind: DeploymentRuntimeConfig
    name: provider-opentofu
---
# Pin the provider pod's ServiceAccount to a STABLE name so the RBAC (rbac-opentofu-backend.yaml,
# which grants the Kubernetes-backend state permissions) keeps binding across provider upgrades.
# Without this Crossplane names the SA after the ProviderRevision hash.
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-opentofu
spec:
  serviceAccountTemplate:
    metadata:
      name: provider-opentofu
