# upbound/provider-opentofu — runs OpenTofu (Terraform-compatible) inside Crossplane via
# Workspace CRs with inline HCL. On the secret cluster it manages this cluster's OWN NetBird
# reverse-proxy registration (src/cloudflare-config): the OpenBao NetBird-only service
# (Mastercard/restapi) and the secret.vgijssel.nl reverse-proxy domain + Cloudflare wildcard
# CNAME. Kept local to secret so the proxy's config lives with its consumer (isolation) rather
# than on the network cluster.
#
# Multi-arch (arm64 + amd64), Upbound-official; it just runs `tofu`, which pulls the arm64
# provider plugins (restapi, netbird, cloudflare) at init time. Pinned by tag + multi-arch
# index digest (same pin as the network cluster's provider-opentofu).
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-opentofu
spec:
  package: xpkg.upbound.io/upbound/provider-opentofu:v1.1.5@sha256:3b5580b52acc0b33b882ff48521b68f4d717c9151636f7f7617debce2416921d
  runtimeConfigRef:
    apiVersion: pkg.crossplane.io/v1beta1
    kind: DeploymentRuntimeConfig
    name: provider-opentofu
---
# Pin the provider pod's ServiceAccount to a STABLE name so the RBAC (rbac-opentofu-backend.yaml,
# which grants the Kubernetes-backend state permissions) keeps binding across provider upgrades.
# Without this Crossplane names the SA after the ProviderRevision hash.
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-opentofu
spec:
  serviceAccountTemplate:
    metadata:
      name: provider-opentofu
