# needed on this host). runtimeConfigRef points at the DeploymentRuntimeConfig that
# fixes the pod's ServiceAccount name to `provider-vault`.
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-vault
spec:
  package: xpkg.upbound.io/upbound/provider-vault:v4.0.0@sha256:e0873d6a4407d41a87f783310db559f50ddbfa9e033514af8184fce6d554ac4a
  runtimeConfigRef:
    apiVersion: pkg.crossplane.io/v1beta1
    kind: DeploymentRuntimeConfig
    name: provider-vault
