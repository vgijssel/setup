# Pin the provider-vault pod's ServiceAccount to a STABLE name. Without this,
# Crossplane names the provider SA after the ProviderRevision hash
# (provider-vault-<hash>), which changes on every provider upgrade — and OpenBao's
# `crossplane` kubernetes-auth role binds a fixed SA name/namespace. Setting the
# serviceAccountTemplate name makes Crossplane create + own an SA called exactly
# `provider-vault` in crossplane-system (and bind the provider RBAC to it), which is
# the SA self-init grants in auth/kubernetes/role/crossplane.
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-vault
spec:
  serviceAccountTemplate:
    metadata:
      name: provider-vault
