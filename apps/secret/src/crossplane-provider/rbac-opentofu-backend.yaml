# RBAC for provider-opentofu's OpenTofu Kubernetes state backend. The provider does NOT
# persist state itself (upstream docs: "modules must use remote state"), so the
# ProviderConfig configures `backend "kubernetes"`, which stores each workspace's tofu
# state in a Secret and takes a Lease for locking — both in crossplane-system, using the
# provider pod's in-cluster SA. Crossplane's rbac-manager does not grant these, so bind
# them explicitly to the stable `provider-opentofu` SA (DeploymentRuntimeConfig).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: provider-opentofu-tf-backend
  namespace: crossplane-system
rules:
  # tfstate storage: the kubernetes backend creates/reads/updates one Secret per workspace
  # (tfstate-<workspace>-<secret_suffix>).
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch, create, update, patch, delete]
  # state locking: the kubernetes backend acquires a Lease (lock-<secret_suffix>).
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: provider-opentofu-tf-backend
  namespace: crossplane-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: provider-opentofu-tf-backend
subjects:
  - kind: ServiceAccount
    name: provider-opentofu
    namespace: crossplane-system
