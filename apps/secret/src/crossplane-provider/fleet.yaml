# Raw-manifest Fleet bundle: the provider-vault Provider (+ its
# DeploymentRuntimeConfig) and the OpenBao ProviderConfig.
#
# dependsOn (label selectors, portable to a Rancher GitRepo later):
#   - crossplane: the pkg.crossplane.io CRDs (Provider, DeploymentRuntimeConfig)
#     must exist before these CRs apply.
#   - openbao: the `crossplane` kubernetes-auth role (created by OpenBao self-init)
#     must exist before the ProviderConfig can log in.
# The ProviderConfig's own CRD (vault.upbound.io) is installed by the provider once
# it is healthy, so Fleet retries the ProviderConfig apply until it succeeds — which
# also correctly gates openbao-config (which dependsOn this bundle) until login works.
dependsOn:
  - selector:
      matchLabels:
        fleet.vgijssel.nl/bundle: crossplane
  - selector:
      matchLabels:
        fleet.vgijssel.nl/bundle: openbao
labels:
  fleet.vgijssel.nl/bundle: crossplane-provider
defaultNamespace: crossplane-system
# secret-ONLY (see crossplane bundle): the network cluster stays on terranetes.
targetCustomizations:
  - name: secret
    clusterSelector:
      matchLabels:
        cluster.vgijssel.nl/name: secret
