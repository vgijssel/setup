# Raw-manifest Fleet bundle: the Crossplane Providers this cluster runs + their
# DeploymentRuntimeConfigs (all pkg.crossplane.io kinds, whose CRDs come from crossplane core).
# Installing a provider is what registers its managed-resource CRDs.
#   - provider-vault    : reconciles the OpenBao config (src/openbao-config) — vault.upbound.io.
#   - provider-opentofu : runs the inline-OpenTofu Workspaces that register this cluster's OWN
#                         NetBird reverse-proxy + Cloudflare DNS (src/cloudflare-config) —
#                         opentofu.upbound.io. Plus rbac-opentofu-backend.yaml for its
#                         Kubernetes tfstate backend (Secret + Lease in crossplane-system).
#
# Each provider's downstream CRs (the vault ProviderConfig; the opentofu ProviderConfig +
# Workspaces) deliberately live in SEPARATE, dependsOn-ordered bundles (openbao-config,
# cloudflare-config), NOT here: Fleet deploys each bundle as one atomic Helm release, so a CR
# whose CRD this bundle installs would fail the whole release (CRD not yet registered) and the
# Provider would never get created. Splitting lets each bundle apply cleanly.
#
# dependsOn crossplane (label selector): the pkg.crossplane.io CRDs (Provider,
# DeploymentRuntimeConfig) must exist before these CRs apply.
dependsOn:
  - selector:
      matchLabels:
        fleet.vgijssel.nl/bundle: crossplane
labels:
  fleet.vgijssel.nl/bundle: crossplane-provider
defaultNamespace: crossplane-system
# secret-ONLY (see crossplane bundle): the network cluster runs its own crossplane +
# provider bundles.
targetCustomizations:
  - name: secret
    clusterSelector:
      matchLabels:
        cluster.vgijssel.nl/name: secret
