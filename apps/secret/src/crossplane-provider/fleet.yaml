# Raw-manifest Fleet bundle: the provider-vault Provider + its DeploymentRuntimeConfig
# (both pkg.crossplane.io kinds, whose CRDs come from crossplane core). Installing the
# provider is what registers the vault.upbound.io CRDs.
#
# The OpenBao ProviderConfig (a vault.upbound.io CR) deliberately lives in the
# openbao-config bundle, NOT here: Fleet deploys each bundle as one atomic Helm
# release, so a ProviderConfig in the same bundle as the Provider would fail the whole
# release (its CRD doesn't exist until the Provider is installed) and the Provider
# would never get created. Splitting lets this bundle apply cleanly; openbao-config
# then dependsOn it and carries the ProviderConfig + managed resources.
#
# dependsOn crossplane (label selector): the pkg.crossplane.io CRDs (Provider,
# DeploymentRuntimeConfig) must exist before these CRs apply.
dependsOn:
  - selector:
      matchLabels:
        fleet.vgijssel.nl/bundle: crossplane
labels:
  fleet.vgijssel.nl/bundle: crossplane-provider
defaultNamespace: crossplane-system
# secret-ONLY (see crossplane bundle): the network cluster stays on terranetes.
targetCustomizations:
  - name: secret
    clusterSelector:
      matchLabels:
        cluster.vgijssel.nl/name: secret
