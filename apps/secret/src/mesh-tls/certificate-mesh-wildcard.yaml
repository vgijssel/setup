# The single publicly-trusted certificate every mesh service hostname is served with.
#
# This is what reconciles two requirements that read as contradictory: a certificate a standard
# client validates against the public root store, on names that do not resolve publicly. A DNS-01
# challenge needs only a temporary TXT record — here exactly one, at
# `_acme-challenge.vpn.blueora.ng` — and no A or CNAME for any mesh hostname is created at any
# point. HTTP-01 could not do this at all: it would require the name to resolve from the internet
# to a reachable listener.
#
# ONE SAN, and it is a wildcard: `*.vpn.blueora.ng`. See the rate-limit / CT-leak / single-ACME
# reasoning and the shared-private-key cost in fleet.yaml — the trade is deliberate.
#
# A wildcard matches exactly ONE label, which is all the capability needs: the mesh namespace is
# FLAT by design (`openbao.vpn.blueora.ng`, never `openbao.secret.vpn.blueora.ng`), so every
# hostname this must cover is a single label under the peer DNS domain. If a nested name is ever
# introduced it will NOT be covered and will fail with a name mismatch rather than silently — add
# its own SAN here at that point, and note that nesting was rejected for other reasons too.
#
# The apex `vpn.blueora.ng` is deliberately not a SAN: nothing is exposed at the bare domain.
#
# This Secret is NOT consumed by any Gateway. It is the source that
# workspace-mesh-tls-publish.yaml copies into `kv/mesh-tls`; exposures — including the ones on
# THIS cluster — read it back through Vault Secrets Operator. That round trip is redundant on the
# secret cluster and kept anyway, because it gives the mesh-service chart exactly ONE code path
# for obtaining a certificate on both clusters instead of a per-cluster special case.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mesh-wildcard
  namespace: secret
spec:
  secretName: mesh-wildcard-tls
  dnsNames:
    - "*.vpn.blueora.ng"
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
