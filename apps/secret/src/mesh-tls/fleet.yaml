# The ONE certificate behind every mesh service hostname, issued here and published into OpenBao
# for both clusters to consume.
#
#   certificate-mesh-wildcard.yaml  cert-manager issues `*.vpn.blueora.ng` (DNS-01, one challenge)
#   workspace-mesh-tls-publish.yaml copies the issued keypair into `kv/mesh-tls`
#
# Every exposure then reads `kv/mesh-tls` through Vault Secrets Operator — see
# ../../../platform/src/mesh-service/templates/vaultstaticsecret-mesh-service.yaml. The
# mesh-service chart has no cert-manager dependency at all any more.
#
# ── WHY ONE WILDCARD INSTEAD OF ONE CERTIFICATE PER SERVICE ─────────────────────────────────
# The chart used to issue a single-SAN certificate per exposure. Three reasons it does not now:
#
#   1. LET'S ENCRYPT RATE LIMITS. Both vind clusters are destroyed and recreated wholesale
#      (`moon run {secret,network}:stop && :start`), and an empty cluster re-issues every
#      certificate it needs. Per-service issuance multiplies that by the number of exposures, and
#      the duplicate-certificate limit (5 per identical SAN set per week) is per NAME — so a week
#      of cold-start testing could lock out the exact name a service needs. One wildcard is one
#      budget for the whole mesh, and it survives cluster recreation because it lives in OpenBao,
#      not in cert-manager's Secret.
#   2. SERVICE NAMES STOP LEAKING INTO CERTIFICATE TRANSPARENCY. Every publicly-trusted
#      certificate is logged publicly, so per-service issuance published `openbao.vpn.blueora.ng`,
#      `omada.vpn.blueora.ng` and the rest to CT — a searchable list of this mesh's internal
#      service names, which quietly undercut the point of names that do not resolve publicly. A
#      wildcard logs only `*.vpn.blueora.ng`: the service names never appear.
#   3. ONE ACME INTERACTION. A new exposure now needs no DNS-01 challenge, no issuer and no
#      waiting — just the kv read it already does.
#
# THE COST, STATED PLAINLY: one private key now covers every mesh hostname on both clusters, so
# compromising any single Envoy pod exposes the key for all of them. Per-service certificates kept
# that blast radius to one service. This is a deliberate trade for the three benefits above; it is
# the reason the chart's old certificate template argued for single-SAN certificates, and anyone
# reversing this decision should reverse it for that reason and not by accident.
#
# ── WHAT THIS DOES *NOT* DO: it creates no wildcard DNS RECORD ──────────────────────────────
# Easy to misread, so: a wildcard CERTIFICATE and a wildcard DNS record are unrelated here. A
# DNS-01 challenge for `*.vpn.blueora.ng` needs exactly one TXT record at
# `_acme-challenge.vpn.blueora.ng` and no address record of any kind. The capability's hard
# constraint — no wildcard record in `blueora.ng`, because Cloudflare wildcards answer at
# arbitrary label depth and would make every mesh hostname publicly resolvable — is untouched.
# Verify it stays that way: `dig +short '*.blueora.ng' @1.1.1.1` must return nothing.
#
# secret cluster ONLY, and that is the whole point: a single issuance site. The network cluster has
# the same cert-manager and the same `letsencrypt-prod` issuer, so it COULD issue its own — and
# that is exactly what must not happen, because two independent issuers of the same SAN set race
# each other straight into the duplicate-certificate limit.
#
# dependsOn:
#   - crossplane-provider : owns the opentofu.upbound.io Provider + its `default` ProviderConfig.
#   - openbao-config      : owns the `kv` mount this writes to and the `crossplane` policy grant
#                           that permits the write. Without it the Workspace authenticates and is
#                           then denied on the path.
# cert-manager and the `letsencrypt-prod` ClusterIssuer are deliberately NOT listed: the shared
# platform bundles that own them carry no `fleet.vgijssel.nl/bundle` label to select on, and a
# Certificate is allowed to sit Pending until its issuer exists.
labels:
  fleet.vgijssel.nl/bundle: mesh-tls
defaultNamespace: secret
dependsOn:
  - selector:
      matchLabels:
        fleet.vgijssel.nl/bundle: crossplane-provider
  - selector:
      matchLabels:
        fleet.vgijssel.nl/bundle: openbao-config
# secret-ONLY. bin/fleet-apply applies every bundle globally, so target the secret cluster
# explicitly.
targetCustomizations:
  - name: secret
    clusterSelector:
      matchLabels:
        cluster.vgijssel.nl/name: secret
  # Terminal catch-all. Targets are first-match-wins and a GitRepo APPENDS its own target
  # after these, so without this a non-matching cluster falls through to it and deploys with
  # default values. See bin/fleet-lint-targets.
  - name: none
    doNotDeploy: true
    clusterSelector: {}
