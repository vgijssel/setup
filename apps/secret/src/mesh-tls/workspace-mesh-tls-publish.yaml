# Publishes the issued wildcard keypair into `kv/mesh-tls`, which is where every exposure on both
# clusters reads its certificate from.
#
# Direction is worth naming, because it is the opposite of everything else in this repo: normally
# OpenBao is the source and Kubernetes the destination. Here cert-manager mints the material and
# OpenBao is the DISTRIBUTION point — it is the only thing both clusters can already reach and
# authenticate to, so it is what turns one certificate into one certificate everywhere.
#
# ── HOW THE KEYPAIR GETS IN HERE WITHOUT A KUBERNETES PROVIDER ──────────────────────────────
# Through `env[].secretKeyRef`, which provider-opentofu resolves itself — the same mechanism
# ../openbao-config/plugin-cloudflare-config.yaml uses for its parent credential. So this needs no
# `kubernetes` provider, no in-cluster provider config, and no new RBAC: the values arrive as
# ordinary TF variables. (The provider's ServiceAccount already holds cluster-wide secret read.)
#
# The field names are `tls.crt` / `tls.key` because that is what cert-manager writes and what a
# `kubernetes.io/tls` Secret requires, so the kv entry is a byte-for-byte mirror and the consuming
# VaultStaticSecret needs no key renaming on the way out.
#
# ── RENEWAL PROPAGATION ─────────────────────────────────────────────────────────────────────
# cert-manager renews at 2/3 of lifetime and rewrites `mesh-wildcard-tls`. Nothing notifies this
# Workspace; it notices on its next reconcile, when the resolved env values differ from state and
# the plan shows a diff. Consumers then pick it up on their own `refreshAfter`. So renewal
# propagates on the order of a poll interval plus a refresh interval — fine against a 30-day
# renewal window, but it is why the consuming VaultStaticSecrets set a short `refreshAfter` rather
# than relying on the default.
#
# ── SECURITY ────────────────────────────────────────────────────────────────────────────────
# Writing here is as powerful as serving every mesh hostname, so the grant is scoped to this ONE
# path (`kv/data/mesh-tls`) in the `crossplane` policy rather than to `kv/data/*` — see
# ../openbao-config/policy-crossplane.yaml.
#
# Reading it is NOT equally narrow: the `vault-secrets-operator` policy grants `kv/data/*`, so any
# namespace allow-listed for VSO on either cluster can read this private key, not only the ones
# hosting an exposure. That is inherited from the shared policy, not introduced here, and is the
# thing to tighten first if the shared-key blast radius ever needs reducing.
#
# State lives in the shared kubernetes backend, keyed per-workspace.
apiVersion: opentofu.upbound.io/v1beta1
kind: Workspace
metadata:
  name: mesh-tls-publish
spec:
  forProvider:
    source: Inline
    env:
      - name: TF_VAR_tls_crt
        secretKeyRef:
          namespace: secret
          name: mesh-wildcard-tls
          key: tls.crt
      - name: TF_VAR_tls_key
        secretKeyRef:
          namespace: secret
          name: mesh-wildcard-tls
          key: tls.key
    module: |
      terraform {
        required_providers {
          vault = {
            source  = "hashicorp/vault"
            version = "4.6.0"
          }
        }
      }

      variable "tls_crt" {
        type      = string
        sensitive = true
      }

      variable "tls_key" {
        type      = string
        sensitive = true
      }

      provider "vault" {
        address          = "http://openbao.secret.svc:8200"
        skip_child_token = true
        auth_login {
          path = "auth/kubernetes/login"
          parameters = {
            role = "crossplane"
            jwt  = file("/var/run/secrets/kubernetes.io/serviceaccount/token")
          }
        }
      }

      # kv v2, so this is `kv/data/mesh-tls` in policy terms and `kv/mesh-tls` to a reader.
      # Keys mirror a kubernetes.io/tls Secret exactly: tls.crt and tls.key.
      resource "vault_kv_secret_v2" "mesh_tls" {
        mount = "kv"
        name  = "mesh-tls"
        data_json = jsonencode({
          "tls.crt" = var.tls_crt
          "tls.key" = var.tls_key
        })

        # RETAIN ONE VERSION. kv v2 keeps history, and the mount default is 10 — so without this
        # every renewal would leave the SUPERSEDED PRIVATE KEY readable at `kv/mesh-tls?version=N`
        # for the next nine renewals, to anyone holding `kv/data/mesh-tls` read (which the shared
        # `vault-secrets-operator` policy grants broadly, via `kv/data/*`). Rotating a key is
        # pointless if the old one stays fetchable, so history is capped at the live version.
        custom_metadata {
          max_versions = 1
        }
      }

      # A fingerprint of the certificate half only — never the key — so a human can confirm WHICH
      # certificate is currently published without reading kv.
      #
      # `nonsensitive()` is required and is safe here. OpenTofu propagates sensitivity through
      # every expression, so a plain `sha256(var.tls_crt)` fails the plan outright with
      # "Output refers to sensitive values" rather than just redacting it. Unwrapping is correct
      # because the input is the PUBLIC half of the keypair and this is a one-way hash of it;
      # never do the same for var.tls_key.
      output "certificate_sha256" {
        value = nonsensitive(sha256(var.tls_crt))
      }
  providerConfigRef:
    name: default
