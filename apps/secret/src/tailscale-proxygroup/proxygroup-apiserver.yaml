# The secret cluster's kube-apiserver ProxyGroup — the Tailscale-native replacement
# for the old nginx apiserver-proxy bundle (retired). Instead of terminating a Let's
# Encrypt cert for api.secret.vgijssel.nl and reverse-proxying to the kube-apiserver,
# the operator exposes THIS cluster's Kubernetes API directly on the tailnet at
#   https://api-secret.tail2c33e2.ts.net
# with a Tailscale-provisioned (publicly-trusted *.ts.net) cert — so there is NO
# cert-manager / Cloudflare dependency (mirrors network's api-network ProxyGroup).
#
# NAME IS LOAD-BEARING: the operator provisions a Tailscale Service named after the
# hostname (svc:api-secret), and the tailnet ACL's autoApprovers.services + grants
# already reference `api-secret` (inherited from the retired nginx proxy). Naming it
# anything else advertises a Service the ACL does NOT auto-approve, so the proxies
# never advertise and the kube-apiserver stays unreachable ("0/2 proxy backends ready
# and advertising"). Keep it `api-secret`.
#
# mode: noauth -> the proxy terminates the tailnet TLS and forwards every request to the
# in-cluster apiserver unchanged; the apiserver applies its OWN authn/authz (kubectl over
# the tailnet with a valid kubeconfig). Unlike the network cluster there is NO
# oidc-discovery ClusterRoleBinding here, so anonymous callers can read nothing — this
# endpoint has no cross-cluster JWKS consumer.
#
# hostname pins the MagicDNS label (must be tailnet-unique); the *.ts.net cert follows it.
# Separate from secret-ingress (which fronts OpenBao's Service VIP) — one ProxyGroup per role.
apiVersion: tailscale.com/v1alpha1
kind: ProxyGroup
metadata:
  name: api-secret
spec:
  type: kube-apiserver
  replicas: 2
  kubeAPIServer:
    mode: noauth
    hostname: api-secret
