# Raw-manifest Fleet bundle carrying the secret cluster's ProxyGroup (cluster-scoped
# tailscale.com CR): api-secret (type: kube-apiserver — exposes the kube-apiserver on the
# tailnet at api-secret.tail2c33e2.ts.net, replacing the retired nginx apiserver-proxy). The
# former secret-ingress (type: ingress) ProxyGroup that fronted OpenBao's tailnet VIP was
# removed — OpenBao is now reached over the NetBird mesh, not the tailnet. Split out
# of the tailscale-operator bundle and gated on it via dependsOn (label selector, so it
# stays portable across the standalone Fleet -> Rancher GitRepo move): Fleet only deploys
# this once the operator bundle is Ready, guaranteeing the ProxyGroup CRD is established
# first. Without this, a fresh-cluster Helm install of the operator+CR deadlocks (the CR's
# CRD isn't registered yet in the same release).
dependsOn:
  - selector:
      matchLabels:
        fleet.vgijssel.nl/bundle: tailscale-operator
# secret-ONLY. This bundle carries the `api-secret` ProxyGroup (a raw CR whose name can't be
# templated per-cluster without switching to Helm, which would add Helm metadata and break
# secret's byte-identical rendering). So it stays gated to `secret`. A single secret target
# replaces Fleet's implicit deploy-everywhere target — no BundleDeployment on `network`.
targetCustomizations:
  - name: secret
    clusterSelector:
      matchLabels:
        cluster.vgijssel.nl/name: secret
