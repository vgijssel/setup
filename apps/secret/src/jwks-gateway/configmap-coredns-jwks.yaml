# CoreDNS override resolving the published JWKS hostname to the in-cluster forwarder.
#
# ╔══════════════════════════════════════════════════════════════════════════════════════════╗
# ║ THE SPLIT HORIZON IS INTENTIONAL, AND IT DOES NOT WEAKEN VALIDATION.                     ║
# ║                                                                                          ║
# ║ `jwks-network.vpn.blueora.ng` resolves to TWO different addresses depending on who asks: ║
# ║   * inside this cluster  -> 10.96.0.21, the jwks-gateway Service (this file);             ║
# ║   * on the NetBird mesh  -> the publishing peer's overlay address.                        ║
# ║                                                                                          ║
# ║ BOTH PATHS TERMINATE AT THE SAME CERTIFICATE FOR THE SAME NAME. The forwarder behind      ║
# ║ 10.96.0.21 is a RAW TCP relay (socat, see deployment-jwks-gateway.yaml) — it copies bytes and    ║
# ║ never terminates TLS. So an OpenBao request to https://jwks-network.vpn.blueora.ng/       ║
# ║ completes its TLS handshake with the publishing peer's Envoy at the far end, presenting   ║
# ║ the correct SNI and validating that peer's publicly-trusted certificate against the       ║
# ║ public root store. That is WHY this override needs no `jwksCaPem`, no                     ║
# ║ `tls_skip_verify`, and no certificate of its own: nothing in the path is impersonating    ║
# ║ the hostname, it is only being told which door to walk through.                           ║
# ║                                                                                          ║
# ║ This is the property that makes the override legitimate rather than a lie, and it is the  ║
# ║ reason the relay must stay L4. Turning it into an HTTP proxy, or terminating TLS here,    ║
# ║ would make the two horizons end at DIFFERENT certificates and force verification off.     ║
# ╚══════════════════════════════════════════════════════════════════════════════════════════╝
#
# OpenBao is the consumer that cannot join the mesh (its own startup would depend on a
# failurePolicy: Fail webhook that depends on OpenBao — see deployment-jwks-gateway.yaml), so it uses
# ordinary cluster DNS and gets the answer below. The forwarder pod itself does NOT: its
# /etc/resolv.conf is rewritten in place by the netbird client sidecar, and the mesh resolver is
# authoritative for `vpn.blueora.ng`, so it resolves the real peer. The relay cannot loop.
#
# WHY `coredns-custom` IN kube-system: the cluster's Corefile ends with
# `import /etc/coredns/custom/*.server`, so a ConfigMap of that name is the supported extension
# point. It is a cluster-wide SINGLETON keyed by filename — this bundle owns the whole ConfigMap,
# so a second override on this cluster must be added as another key HERE rather than as a second
# ConfigMap, or the two bundles will fight over one object.
#
# `:1053` is deliberate, not a typo: CoreDNS in a vcluster listens on 1053, and a server block on
# the wrong port is silently never consulted.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  jwks-network.server: |
    jwks-network.vpn.blueora.ng:1053 {
        errors
        hosts {
            10.96.0.21 jwks-network.vpn.blueora.ng
            fallthrough
        }
        cache 30
    }
