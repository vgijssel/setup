# The JWKS relay, and its mesh client run EXPLICITLY rather than injected.
#
# ── WHY THIS IS NOT A BARE POD WITH AN INJECTED SIDECAR ──────────────────────────────────────
# It was exactly that until 2026-10-08, and it failed SILENTLY during a cold-start drill: the pod
# came up `1/1` with only `socat`, no mesh peer, and no error anywhere. Every object reported
# Ready while OpenBao's `jwt-network` JWKS fetch — i.e. the whole cross-cluster auth leg — was
# dead.
#
# Cause: this bundle ships the Pod, its `SidecarProfile` and its `SetupKey` TOGETHER, so Helm
# applies them in one pass and the pod can be admitted before the operator has reconciled the
# SetupKey or cached the profile in its informer. The webhook is then consulted, finds nothing
# matching, and ALLOWS the pod un-mutated. `dependsOn: netbird-operator` cannot help — it
# guarantees the operator is RUNNING, not that it has processed this bundle's own CRs, which by
# construction do not exist until this same apply.
#
# And note `failurePolicy: Fail` does NOT catch this. It fires only when the webhook is
# UNREACHABLE; a reachable webhook answering "allowed, no patch" is a success. Verified by
# experiment: with the operator scaled to 0, a pod in this namespace IS rejected
# (`connection refused`), so the namespace is genuinely in scope — the pod slipped through
# precisely because the webhook was healthy and merely unhelpful.
#
# Worse, nothing repaired it: Fleet saw a pod matching its manifest and no-op'd, and a bare Pod
# has no controller, so deleting the pod recreated nothing. It needed a hand-rolled
# dump/strip/re-apply.
#
# Running the client as a declared container removes the whole failure mode by construction —
# there is no admission timing to lose, because the container is in the spec. This mirrors what
# apps/platform/src/mesh-service does for the same reason (openspec group 5, defect B).
#
# ── WHY A DEPLOYMENT, AND WHY RollingUpdate (NOT Recreate) ───────────────────────────────────
# A Deployment makes the pod self-healing: deleted, evicted or unschedulable, it comes back, and
# the watchdog beside this file can `rollout restart` it when the client wedges. A bare Pod could
# do neither.
#
# `RollingUpdate` with `maxUnavailable: 0` is a DELIBERATE difference from mesh-service, which
# uses `Recreate`. Recreate is load-bearing there only because those pods claim an extra DNS
# label and two peers holding one hostname splits resolution. This relay claims NO DNS label —
# it is addressed by the Service's pinned ClusterIP, never by a mesh name — so a second peer
# during a roll is harmless, and surging first means the JWKS path (and therefore every
# network-cluster VSO read) never has a gap.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jwks-gateway
  namespace: netbird
  labels:
    app: jwks-gateway
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: jwks-gateway
  template:
    metadata:
      # `app: jwks-gateway` is what service-jwks-gateway.yaml selects. It is ALSO what the
      # now-deleted SidecarProfile selected; keep it, but know nothing injects on it any more.
      labels:
        app: jwks-gateway
    spec:
      containers:
        - name: socat
          image: alpine/socat:1.8.1.3
          args:
            - -d
            - TCP-LISTEN:443,fork,reuseaddr
            - TCP:jwks-network.vpn.blueora.ng:443
          ports:
            - containerPort: 443
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      initContainers:
        # A NATIVE sidecar: an initContainer with `restartPolicy: Always` starts before the main
        # container, keeps running alongside it, and terminates after it. That ordering is what
        # lets the preStop deregister below run while the relay is already stopped.
        - name: netbird
          image: ghcr.io/netbirdio/netbird:0.72.4@sha256:6c6c20baffae4a3ec50f29ec9361608a420625185505e8cd6f0c44d71c5d4798
          restartPolicy: Always
          securityContext:
            capabilities:
              add:
                # Required to create the WireGuard interface. Nothing else is granted.
                - NET_ADMIN
          env:
            # Minted by the operator from setupkey-jwks-gateway.yaml into Secret
            # `setup-key-jwks-gateway` under key `setup-key`. Reusable, which is what lets a
            # replacement pod re-enrol after the preStop deregister.
            - name: NB_SETUP_KEY
              valueFrom:
                secretKeyRef:
                  name: setup-key-jwks-gateway
                  key: setup-key
            - name: NB_MANAGEMENT_URL
              value: https://api.netbird.io
          # No NB_EXTRA_DNS_LABELS on purpose: this peer is a CLIENT, dialled through the
          # Service's ClusterIP. It needs group membership (`secret-k8s`, for the
          # `svc-jwks-network-tcp` policy), not a name.
          lifecycle:
            preStop:
              exec:
                # Removes this peer from the management service instead of leaving a dead
                # registration behind. The injected sidecar had NO preStop, and openspec task 1.3
                # measured the result: five stale `jwks-gateway` peers accumulated since August,
                # because this setup key is deliberately non-ephemeral so NetBird never reaped
                # them. Running the client ourselves is what makes this reachable at all —
                # `SidecarProfile.containerOverride` has no `lifecycle` field.
                command: [netbird, deregister]
          # ── MAKES A WEDGED CLIENT LOUD INSTEAD OF SILENT ──────────────────────────────────
          # Decided on the OUTPUT, never the exit status: `netbird status` exits 0 with a dead
          # session, so anything keyed off `$?` reports healthy for a relay that answers nothing.
          # A sidecar's readiness counts toward POD readiness, so a client that cannot reach
          # management drops this pod out of the Service endpoints rather than quietly relaying
          # into a tunnel that is not there.
          #
          # READINESS, NOT LIVENESS, and that distinction matters: `NeedsLogin` is also what a
          # healthy daemon prints for its first few seconds, indistinguishably from a wedged one.
          # A liveness probe on that ambiguity would restart-loop a pod that was about to be
          # fine — the exact failure the watchdog's confirm-before-restart exists to avoid. So
          # readiness reports it, and the watchdog (which re-samples) is what acts on it.
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                # MUST stay quoted: the `: ` in the grep pattern makes an unquoted plain scalar
                # parse as a YAML MAP, not a string. `yaml.safe_load` accepts that silently and
                # only the apiserver rejects it ("cannot unmarshal object into ... exec.command
                # of type string"), so a local YAML check will not catch it.
                - "netbird status 2>&1 | grep -q 'Management: Connected'"
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
