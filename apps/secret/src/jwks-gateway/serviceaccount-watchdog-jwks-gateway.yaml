# RBAC for the jwks-gateway mesh-client watchdog (cronjob-watchdog-jwks-gateway.yaml).
#
# It observes the client (`pods/exec`, to run `netbird status`) and recycles the relay (`patch`
# on deployments, via `kubectl rollout restart`). `get`/`list` on deployments is needed because
# the script resolves the Deployment by name and verifies it exists before acting.
#
# Namespaced to `netbird` — no cluster-scoped permission is involved. Mirrors
# apps/platform/src/mesh-service/templates/serviceaccount-watchdog.yaml, which is the same
# pattern for the mesh EXPOSURES; this is the one for the cross-cluster CLIENT.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jwks-gateway-watchdog
  namespace: netbird
  labels:
    app: jwks-gateway
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jwks-gateway-watchdog
  namespace: netbird
  labels:
    app: jwks-gateway
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jwks-gateway-watchdog
  namespace: netbird
  labels:
    app: jwks-gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jwks-gateway-watchdog
subjects:
  - kind: ServiceAccount
    name: jwks-gateway-watchdog
    namespace: netbird
