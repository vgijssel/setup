# JWKS gateway — a socat TCP forwarder that re-serves the network cluster's JWKS mirror
# (reachable only over the NetBird mesh) on a plain in-cluster port, so the secret
# cluster's OpenBao jwt-network backend can fetch it via NORMAL cluster DNS
# (http://jwks-gateway.netbird.svc.cluster.local) without OpenBao itself being a netbird
# client.
#
# A bare Pod (not a Deployment) ON PURPOSE: the netbird operator's mutating webhook adds
# its own `resolv-conf` volume, which collides with a Deployment pod template that must
# pre-declare the volume to pass apps-API validation ("Duplicate value: resolv-conf"). A
# bare Pod is admitted through the pod webhook first, so the socat container can mount the
# webhook-added volume without pre-declaring it. Acceptable here: this is a single-node
# throwaway vind cluster recreated wholesale by `secret:start`, and container crashes
# self-heal via restartPolicy. See [[netbird-crosscluster-routing]].
#
# The socat container shares the netbird sidecar's mesh resolver by mounting the shared
# `resolv-conf` volume at /etc/resolv.conf (subPath resolv.conf) — the netbird
# native-sidecar starts before socat and writes the mesh nameserver into it, so socat
# resolves jwks-mirror.netbird.svc.cluster.local over NetBird instead of cluster DNS.
apiVersion: v1
kind: Pod
metadata:
  name: jwks-gateway
  namespace: netbird
  labels:
    app: jwks-gateway
spec:
  containers:
    - name: socat
      image: alpine/socat:1.8.1.3
      args:
        - -d
        - TCP-LISTEN:8080,fork,reuseaddr
        - TCP:jwks-mirror.netbird.svc.cluster.local:80
      ports:
        - containerPort: 8080
      volumeMounts:
        - name: resolv-conf
          mountPath: /etc/resolv.conf
          subPath: resolv.conf
