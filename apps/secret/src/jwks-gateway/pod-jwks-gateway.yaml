# JWKS gateway — a RAW TCP socat forwarder that relays OpenBao's JWKS fetch over the NetBird
# mesh to the network cluster's published `jwks-network.vpn.blueora.ng` peer, so OpenBao can
# validate network-cluster service-account tokens without OpenBao itself being a mesh client.
#
# WHY OPENBAO MUST NOT BE A MESH CLIENT (this is the whole reason this pod exists): the NetBird
# operator's mutating webhook runs failurePolicy: Fail and the operator reads its own management
# PAT out of OpenBao. Injecting a sidecar into OpenBao makes OpenBao's startup depend on a webhook
# that depends on OpenBao — a cold-start deadlock, previously diagnosed, not hypothetical. So the
# mesh membership is delegated to this throwaway pod instead.
#
# RAW TCP, NOT HTTP — the load-bearing property. socat copies bytes; it does not terminate TLS.
# OpenBao opens an https:// connection to `jwks-network.vpn.blueora.ng`, that TLS session is
# established with the PUBLISHING PEER's Envoy at the far end, and OpenBao validates the
# certificate for that hostname against the public root store. This leg used to run as plain HTTP
# precisely because the relay had no way to preserve the name; forwarding L4 instead of L7 is what
# makes end-to-end TLS possible, which is why nothing in this path disables verification.
# Corollary: do NOT "upgrade" this to an HTTP proxy or add TLS here. Both would break the property.
#
# PORT 443 ON BOTH SIDES. The listener port must equal the published service's port because the
# hostname OpenBao dials is the mesh hostname, and the certificate is only valid for that name —
# there is no URL rewriting anywhere in the path to absorb a port shift. See
# service-jwks-gateway.yaml, whose pinned ClusterIP the CoreDNS override resolves this same
# hostname to inside the cluster (configmap-coredns-jwks.yaml).
#
# A bare Pod (not a Deployment): acceptable here since this is a single-node throwaway vind
# cluster recreated wholesale by `secret:start`, and container crashes self-heal via
# restartPolicy. See [[netbird-crosscluster-routing]].
#
# DNS: the injected netbird sidecar (SidecarProfile) rewrites the pod's /etc/resolv.conf IN
# PLACE with the mesh resolver. On operator v0.7.0 /etc/resolv.conf is the per-pod bind-mount
# shared across all containers, so the socat container inherits the mesh nameserver
# automatically and resolves jwks-network.vpn.blueora.ng to the publishing peer's overlay
# address — with NO extra volume or mount. Do NOT re-add a `resolv-conf` volumeMount: v0.7.0 does
# not create that volume (the volume-based scheme was the v0.8.0 sidecar-DNS regression #383 the
# operator is pinned away from — see third_party/vendir/vendir.yml). A mount referencing that
# absent volume would wedge the pod on (re)creation.
#
# Note the asymmetry that makes this safe: the mesh resolver is authoritative for
# `vpn.blueora.ng`, so THIS pod resolves the hostname to the real peer, while every other pod in
# the cluster goes through CoreDNS and gets the forwarder's ClusterIP. The relay therefore cannot
# loop back on itself.
apiVersion: v1
kind: Pod
metadata:
  name: jwks-gateway
  namespace: netbird
  labels:
    app: jwks-gateway
spec:
  containers:
    - name: socat
      image: alpine/socat:1.8.1.3
      args:
        - -d
        - TCP-LISTEN:443,fork,reuseaddr
        - TCP:jwks-network.vpn.blueora.ng:443
      ports:
        - containerPort: 443
