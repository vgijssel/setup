# JWKS gateway — a socat TCP forwarder that re-serves the network cluster's JWKS mirror
# (reachable only over the NetBird mesh) on a plain in-cluster port, so the secret
# cluster's OpenBao jwt-network backend can fetch it via NORMAL cluster DNS
# (http://jwks-gateway.netbird.svc.cluster.local) without OpenBao itself being a netbird
# client.
#
# A bare Pod (not a Deployment): acceptable here since this is a single-node throwaway vind
# cluster recreated wholesale by `secret:start`, and container crashes self-heal via
# restartPolicy. See [[netbird-crosscluster-routing]].
#
# DNS: the injected netbird sidecar (SidecarProfile) rewrites the pod's /etc/resolv.conf IN
# PLACE with the mesh resolver. On operator v0.7.0 /etc/resolv.conf is the per-pod bind-mount
# shared across all containers, so the socat container inherits the mesh nameserver
# automatically and resolves jwks-mirror.netbird.svc.cluster.local over NetBird — with NO extra
# volume or mount. Do NOT re-add a `resolv-conf` volumeMount: v0.7.0 does not create that volume
# (the volume-based scheme was the v0.8.0 sidecar-DNS regression #383 the operator is pinned
# away from — see third_party/vendir/vendir.yml). A mount referencing that absent volume would
# wedge the pod on (re)creation.
apiVersion: v1
kind: Pod
metadata:
  name: jwks-gateway
  namespace: netbird
  labels:
    app: jwks-gateway
spec:
  containers:
    - name: socat
      image: alpine/socat:1.8.1.3
      args:
        - -d
        - TCP-LISTEN:8080,fork,reuseaddr
        - TCP:jwks-mirror.netbird.svc.cluster.local:80
      ports:
        - containerPort: 8080
