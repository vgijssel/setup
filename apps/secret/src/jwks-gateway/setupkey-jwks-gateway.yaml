# SetupKey enrolling the JWKS gateway's injected netbird sidecar. Referenced by the
# SidecarProfile alongside via setupKeyRef (which points at THIS SetupKey CR, not the raw Secret).
# Non-ephemeral so the gateway peer persists across pod restarts. autoGroups references groups by
# name.
#
# ONE group: `secret-k8s`, the durable per-cluster group owned by a Group CR
# (../netbird-config/group-secret-k8s.yaml) and the source group of the mesh JWKS exposure this
# forwarder consumes (../../../network/src/mesh-jwks -> jwks-network.vpn.blueora.ng). It was
# briefly two — `secret` as well — while the migration was still additive, because `secret` was
# the source group of the OLD jwks-mirror NBResource expose policy. Both are gone: the annotation
# path was removed, and deleting this cluster's routing peer took the `secret` group with it. A
# real Group CR was always the right choice precisely because it does NOT disappear with a routing
# peer.
#
# ┌─ TRAP: changing this spec in place leaves the bundle permanently NotReady ─────────────────┐
# │ Operator v0.7.0 writes `status.observedGeneration` on the CREATE path only. Its reconciler │
# │ checks "is the key up to date?" in a closure that itself PUTs the new auto_groups to the   │
# │ management API and returns true — and the true branch returns early, before the            │
# │ `patch.WithStatusObservedGeneration{}` call at the end of Reconcile                        │
# │ (internal/controller/setupkey_controller.go, v0.7.0). So an edited key is applied to        │
# │ NetBird correctly while `observedGeneration` stays at whatever it was, and Fleet's          │
# │ readiness summary reports forever:                                                          │
# │     SetupKey generation is N, but latest observed generation is N-1                         │
# │ The desired state IS live; only the status lies. Restarting the operator does not clear it,  │
# │ and Fleet has no knob to ignore it (diff.comparePatches affects drift, not readiness).      │
# │                                                                                             │
# │ REMEDY after editing this file — force the operator down its create path by deleting the    │
# │ key Secret it derives (`setup-key-` + metadata.name):                                       │
# │     kubectl -n netbird delete secret setup-key-jwks-gateway                                 │
# │ The reconciler then mints a fresh account-side key, rewrites the Secret, deletes the old key │
# │ and patches observedGeneration. Harmless to the enrolled peer (a setup key is only read at  │
# │ enrolment) and it is the step this change needs anyway: autoGroups apply at ENROLMENT ONLY,  │
# │ so the pod must also be recreated for a group change to reach the running peer.             │
# │                                                                                             │
# │ Cosmetic here — nothing dependsOn the jwks-gateway bundle — but under `dependsOn` a stuck    │
# │ NotReady blocks every dependent bundle, so treat any netbird.io CR spec edit this way.       │
# └─────────────────────────────────────────────────────────────────────────────────────────────┘
apiVersion: netbird.io/v1alpha1
kind: SetupKey
metadata:
  name: jwks-gateway
  namespace: netbird
spec:
  name: jwks-gateway
  ephemeral: false
  autoGroups:
    - name: secret-k8s
