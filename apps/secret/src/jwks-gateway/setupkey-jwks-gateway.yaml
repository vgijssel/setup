# SetupKey enrolling the JWKS gateway's injected netbird sidecar into group `secret`
# (the group this cluster's NBRoutingPeer auto-creates, and the source group the network
# cluster's jwks-mirror expose policy grants). Referenced by the SidecarProfile below via
# setupKeyRef (which points at THIS SetupKey CR, not the raw Secret). Non-ephemeral so the
# gateway peer persists across pod restarts. autoGroups references the group by name.
apiVersion: netbird.io/v1alpha1
kind: SetupKey
metadata:
  name: jwks-gateway
  namespace: netbird
spec:
  name: jwks-gateway
  ephemeral: false
  autoGroups:
    - name: secret
