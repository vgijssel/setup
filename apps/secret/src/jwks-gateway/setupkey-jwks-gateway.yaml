# SetupKey enrolling the JWKS gateway's netbird client. The operator mints it into Secret
# `setup-key-jwks-gateway` (key `setup-key`), which deployment-jwks-gateway.yaml reads directly
# via NB_SETUP_KEY. Nothing references this CR by `setupKeyRef` any more -- the SidecarProfile
# that did was deleted on 2026-10-08 when the client stopped being injected.
# Non-ephemeral so the peer persists across pod restarts, and REUSABLE so a replacement pod
# re-enrols after the preStop deregister. autoGroups references groups by name.
#
# ONE group: `secret-k8s`, the durable per-cluster group owned by a Group CR
# (../netbird-config/group-secret-k8s.yaml) and the source group of the mesh JWKS exposure this
# forwarder consumes (../../../network/src/mesh-jwks -> jwks-network.vpn.blueora.ng). It was
# briefly two — `secret` as well — while the migration was still additive, because `secret` was
# the source group of the OLD jwks-mirror NBResource expose policy. Both are gone: the annotation
# path was removed, and deleting this cluster's routing peer took the `secret` group with it. A
# real Group CR was always the right choice precisely because it does NOT disappear with a routing
# peer.
#
# ┌─ Editing this spec used to wedge the bundle NotReady forever. Now handled automatically. ──┐
# │ Operator v0.7.0 records `status.observedGeneration` on the CREATE path only: its "is the   │
# │ key up to date?" closure itself PUTs the new auto_groups and returns true, and that branch │
# │ returns early, before the one `patch.WithStatusObservedGeneration{}` call at the end of    │
# │ Reconcile (internal/controller/setupkey_controller.go, v0.7.0). So an edited key is        │
# │ applied to NetBird correctly while the status keeps reporting the old generation, and      │
# │ Fleet's readiness summary says, permanently:                                                │
# │     SetupKey generation is N, but latest observed generation is N-1                         │
# │                                                                                             │
# │ You should no longer have to do anything about it:                                          │
# │ apps/platform/src/netbird-operator/templates/cronjob-setupkey-status.yaml reconciles the    │
# │ field on both clusters every 10 min, gated on the operator's own Ready=True so it can never │
# │ mask a reconcile that genuinely failed. Verified end to end against this exact trigger.     │
# │ If you want it fixed immediately rather than within 10 min, run that job on demand.         │
# │                                                                                             │
# │ STILL YOUR JOB when you change `autoGroups`: the peer does NOT pick them up until it        │
# │ re-enrols, because autoGroups apply at ENROLMENT ONLY. Delete the consuming pod — and note  │
# │ a bare Pod in a Fleet bundle is not recreated by `fleet apply` (nothing in the release       │
# │ changed), so `kubectl delete bundledeployment` is what brings it back.                      │
# └─────────────────────────────────────────────────────────────────────────────────────────────┘
apiVersion: netbird.io/v1alpha1
kind: SetupKey
metadata:
  name: jwks-gateway
  namespace: netbird
spec:
  name: jwks-gateway
  ephemeral: false
  autoGroups:
    - name: secret-k8s
