# SetupKey enrolling the JWKS gateway's injected netbird sidecar. Referenced by the
# SidecarProfile alongside via setupKeyRef (which points at THIS SetupKey CR, not the raw Secret).
# Non-ephemeral so the gateway peer persists across pod restarts. autoGroups references groups by
# name.
#
# TWO groups, deliberately, because this pod consumes the network cluster's JWKS over BOTH
# exposure paths while the mesh migration is still additive:
#   - `secret`     : auto-created by this cluster's NBRoutingPeer, and the source group of the OLD
#                    jwks-mirror NBResource expose policy. Keeps the current path working.
#   - `secret-k8s` : the durable per-cluster group owned by a Group CR (group-secret-k8s.yaml), and
#                    the source group of the NEW mesh exposure
#                    (apps/network/src/mesh-jwks -> jwks-network.vpn.blueora.ng). It is a real CR
#                    rather than a routing-peer side effect, so it survives that routing peer being
#                    deleted in the demolition phase — which `secret` would not.
#
# autoGroups apply at ENROLMENT, so an already-registered peer does not gain a newly added group
# until its pod is recreated. That recreation happens when the forwarder is re-pointed at the mesh
# hostname; until then the new mesh policy has no effective source (harmless — the old path is what
# is in use). Drop `secret` once the old NBResource path is gone.
apiVersion: netbird.io/v1alpha1
kind: SetupKey
metadata:
  name: jwks-gateway
  namespace: netbird
spec:
  name: jwks-gateway
  ephemeral: false
  autoGroups:
    - name: secret
    - name: secret-k8s
