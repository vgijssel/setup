# SidecarProfile that injects a netbird client sidecar into the JWKS gateway Pod (matched
# by podSelector app=jwks-gateway). The netbird operator's mutating webhook adds a
# `netbird` native-sidecar container (enrolled with the referenced SetupKey → group
# `secret`) plus a shared `resolv-conf` emptyDir it rewrites with the mesh DNS resolver.
# This is what turns the gateway into a NetBird mesh CONSUMER: only a netbird-client pod
# can resolve/reach a remote domain NBResource (the network cluster's jwks-mirror), so the
# gateway proxies it for OpenBao, which is NOT a netbird client. See
# [[netbird-crosscluster-routing]].
apiVersion: netbird.io/v1alpha1
kind: SidecarProfile
metadata:
  name: jwks-gateway
  namespace: netbird
spec:
  setupKeyRef:
    name: jwks-gateway
  podSelector:
    matchLabels:
      app: jwks-gateway
  injectionMode: Sidecar
