# JWKS gateway bundle (secret cluster, CONSUMER side of the cross-cluster JWKS path).
# A socat Pod carrying an injected netbird sidecar (SidecarProfile) relays RAW TCP to
# `jwks-network.vpn.blueora.ng:443` on a plain ClusterIP, so OpenBao's jwt-network backend can
# fetch the network JWKS over NetBird via normal cluster DNS — with end-to-end TLS, because the
# relay never terminates it. The publishing half is apps/network/src/mesh-jwks; the source group
# `secret-k8s` is a Group CR in ../netbird-config.
#
# This bundle is why OpenBao itself never becomes a mesh client: the operator's mutating webhook
# runs failurePolicy: Fail and the operator needs a PAT out of OpenBao, so injecting a sidecar
# into OpenBao is a cold-start deadlock. The forwarder takes the peer identity instead.
#
# dependsOn the netbird-operator bundle so the SidecarProfile/SetupKey CRDs + the mutating
# webhook exist before these resources apply (otherwise the webhook denies the Pod, or the
# CRs have no CRD).
labels:
  fleet.vgijssel.nl/bundle: jwks-gateway
defaultNamespace: netbird
dependsOn:
  - selector:
      matchLabels:
        fleet.vgijssel.nl/bundle: netbird-operator
# secret-ONLY. bin/fleet-apply applies every bundle globally, so target the secret
# cluster explicitly — this keeps the bundle off the network cluster.
targetCustomizations:
  - name: secret
    clusterSelector:
      matchLabels:
        cluster.vgijssel.nl/name: secret
  # Terminal catch-all. Targets are first-match-wins and a GitRepo APPENDS its own target
  # after these, so without this a non-matching cluster falls through to it and deploys with
  # default values. Keeps this bundle off every cluster not named above. See bin/fleet-lint-targets.
  - name: none
    doNotDeploy: true
    clusterSelector: {}
