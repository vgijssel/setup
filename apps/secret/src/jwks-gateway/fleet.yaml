# JWKS gateway bundle (secret cluster, CONSUMER side of the cross-cluster JWKS path).
# A socat Pod carrying an injected netbird sidecar (SidecarProfile) re-serves the network
# cluster's mesh-only jwks-mirror on a plain ClusterIP, so OpenBao's jwt-network backend
# can fetch the network JWKS over NetBird via normal cluster DNS. The mirror-producer half
# lives in apps/network/src/jwks-mirror; the routing peer + group `secret` in
# ../netbird-config. See [[netbird-crosscluster-routing]].
#
# dependsOn the netbird-operator bundle so the SidecarProfile/SetupKey CRDs + the mutating
# webhook exist before these resources apply (otherwise the webhook denies the Pod, or the
# CRs have no CRD).
labels:
  fleet.vgijssel.nl/bundle: jwks-gateway
defaultNamespace: netbird
dependsOn:
  - selector:
      matchLabels:
        fleet.vgijssel.nl/bundle: netbird-operator
# secret-ONLY. bin/fleet-apply applies every bundle globally, so target the secret
# cluster explicitly — this keeps the bundle off the network cluster.
targetCustomizations:
  - name: secret
    clusterSelector:
      matchLabels:
        cluster.vgijssel.nl/name: secret
