# JWKS gateway bundle (secret cluster, CONSUMER side of the cross-cluster JWKS path).
# A socat Deployment carrying its own netbird client relays RAW TCP to
# `jwks-network.vpn.blueora.ng:443` on a plain ClusterIP, so OpenBao's jwt-network backend can
# fetch the network JWKS over NetBird via normal cluster DNS — with end-to-end TLS, because the
# relay never terminates it. The publishing half is apps/network/src/mesh-jwks; the source group
# `secret-k8s` is a Group CR in ../netbird-config.
#
# This bundle is why OpenBao itself never becomes a mesh client: the operator's mutating webhook
# runs failurePolicy: Fail and the operator needs a PAT out of OpenBao, so injecting a sidecar
# into OpenBao is a cold-start deadlock. The forwarder takes the peer identity instead.
#
# ── THE CLIENT IS DECLARED, NOT INJECTED (changed 2026-10-08) ────────────────────────────────
# This was a bare Pod plus a `SidecarProfile` until a cold-start drill caught it coming up with
# NO sidecar, NO peer and NO error — the pod was admitted before the operator had reconciled this
# bundle's own SetupKey/profile, so the webhook allowed it un-mutated, and nothing repaired it.
# Full reasoning in deployment-jwks-gateway.yaml's header; the short version is that
# `dependsOn` cannot order a bundle against its own contents, and `failurePolicy: Fail` only
# catches an UNREACHABLE webhook, not a reachable one that declines to patch.
# The SidecarProfile is DELETED, not disabled — keeping it would inject a SECOND client beside
# the declared one. It was the last SidecarProfile in the repo, so the operator's mutating
# webhook now has no consumers at all.
#
# dependsOn the netbird-operator bundle because the SetupKey CRD must exist before the SetupKey
# here applies, and the operator must be running to mint it into `setup-key-jwks-gateway` (the
# Secret the client reads). The pod tolerates that Secret arriving late — it retries — which is
# the other half of why the declared client is more robust than the injected one.
labels:
  fleet.vgijssel.nl/bundle: jwks-gateway
defaultNamespace: netbird
dependsOn:
  - selector:
      matchLabels:
        fleet.vgijssel.nl/bundle: netbird-operator
# secret-ONLY. bin/fleet-apply applies every bundle globally, so target the secret
# cluster explicitly — this keeps the bundle off the network cluster.
targetCustomizations:
  - name: secret
    clusterSelector:
      matchLabels:
        cluster.vgijssel.nl/name: secret
  # Terminal catch-all. Targets are first-match-wins and a GitRepo APPENDS its own target
  # after these, so without this a non-matching cluster falls through to it and deploys with
  # default values. Keeps this bundle off every cluster not named above. See bin/fleet-lint-targets.
  - name: none
    doNotDeploy: true
    clusterSelector: {}
