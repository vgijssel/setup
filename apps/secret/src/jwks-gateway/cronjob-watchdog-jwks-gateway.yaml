# Self-heal watchdog for the jwks-gateway mesh client.
#
# WHY: the client logs in ONCE, at pod start, with the setup key. If management later forces a
# re-auth — a host VM suspend/resume, or a login expiry — it drops to a terminal state and never
# re-auths on its own. The pod stays Running and the relay keeps listening, so OpenBao's
# jwt-network JWKS fetch simply times out with nothing reporting an error. This is not
# hypothetical for this cluster: the overnight host sleep on 2026-10-08 wedged every mesh client
# in both clusters at once.
#
# The relay's readinessProbe now makes that state visible (pod drops out of the Service), but
# visible is not the same as fixed — only a restart re-runs `netbird up`. This is what restarts
# it. The same division of labour as apps/platform/src/mesh-service: probe reports, watchdog acts.
#
# DETECTION IS ON THE OUTPUT, NOT THE EXIT STATUS. `netbird status` exits 0 while the session is
# dead — the single most important line in this file. Anything keying off `$?` or a probe's
# success would report healthy for a relay that answers nothing.
#
# Simpler than the mesh-service original in exactly one way, and it is worth knowing why: that
# one has to discover an Envoy-Gateway-GENERATED Deployment name by label, and using the wrong
# label silently turned the whole watchdog into a no-op that still exited 0 for a day. Here the
# Deployment name is ours and fixed, so it is named directly — no selector to get wrong. The
# existence check below is kept anyway, so a rename fails loudly rather than passing vacuously.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: jwks-gateway-watchdog
  namespace: netbird
  labels:
    app: jwks-gateway
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  # Deliberately omitted: startingDeadlineSeconds. With Forbid plus a short deadline, a cluster
  # that pauses (laptop sleep) can leave the controller believing it missed too many starts and
  # it stops scheduling entirely — which is precisely when this watchdog is needed most.
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 180
      template:
        metadata:
          labels:
            app: jwks-gateway-watchdog
        spec:
          serviceAccountName: jwks-gateway-watchdog
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: watchdog
              image: alpine/kubectl:1.35.0@sha256:862d86046bbcad03c252bbc10ab8bf893e7aa50aa7a20de8bfc46727dd645883
              env:
                - name: HOME
                  value: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              command:
                - /bin/sh
                - -c
                - |
                  set -u
                  ns=netbird
                  dep=deployment/jwks-gateway
                  if ! kubectl -n "$ns" get "$dep" >/dev/null 2>&1; then
                    echo "watchdog: $dep not found in $ns -- it was RENAMED or removed, not merely" \
                         "absent; this watchdog is doing nothing until that is reconciled"
                    exit 1
                  fi
                  # ── PICK A POD EXPLICITLY, NEWEST FIRST ─────────────────────────────────────
                  # NOT `exec deploy/<x>`: that resolves to an arbitrary matching pod, and during
                  # a roll a TERMINATING pod still reports status.phase=Running. Sampling a dying
                  # daemon and "recovering" it restarts the deployment again, which is how one
                  # spurious verdict becomes a loop. Newest wins.
                  pod="$(kubectl -n "$ns" get pods -l app=jwks-gateway \
                    --field-selector=status.phase=Running \
                    --sort-by=.metadata.creationTimestamp -o name 2>/dev/null | tail -1)"
                  if [ -z "$pod" ]; then
                    echo "watchdog: no Running jwks-gateway pod yet; skipping this cycle"
                    exit 0
                  fi
                  # A non-zero exec means the pod is rolling / not ready -- skip rather than
                  # restart something already restarting.
                  if ! status="$(kubectl -n "$ns" exec "$pod" -c netbird -- netbird status 2>&1)"; then
                    echo "watchdog: cannot reach $pod netbird sidecar (rolling / not ready); skipping"
                    printf '%s\n' "$status"
                    exit 0
                  fi
                  printf '%s\n' "$status"
                  # Terminal states the daemon cannot leave without re-running `netbird up`,
                  # which only happens at pod start -> recycle the relay.
                  dead='Daemon status: (NeedsLogin|SessionExpired|LoginFailed)'
                  if ! printf '%s' "$status" | grep -qE "$dead"; then
                    echo "watchdog: jwks-gateway mesh client session healthy"
                    exit 0
                  fi
                  # ╔═══════════════════════════════════════════════════════════════════════════╗
                  # ║ ONE BAD SAMPLE IS NOT A DEAD SESSION -- CONFIRM BEFORE RESTARTING.        ║
                  # ║ `NeedsLogin` is ALSO what a healthy daemon reports in its first seconds,  ║
                  # ║ before it finishes logging in with the setup key -- same block, same      ║
                  # ║ "use a setup-key" hint. No field distinguishes "never logged in yet" from ║
                  # ║ "logged in and lost it", so acting on one sample recycles a pod that was  ║
                  # ║ about to be fine, whose replacement is also young at the next tick: a     ║
                  # ║ self-sustaining loop. Observed for real on omada-mesh, 2026-10-06.        ║
                  # ╚═══════════════════════════════════════════════════════════════════════════╝
                  echo "watchdog: jwks-gateway reports a dead session; re-checking in 45s"
                  sleep 45
                  pod2="$(kubectl -n "$ns" get pods -l app=jwks-gateway \
                    --field-selector=status.phase=Running \
                    --sort-by=.metadata.creationTimestamp -o name 2>/dev/null | tail -1)"
                  if [ "$pod2" != "$pod" ]; then
                    echo "watchdog: pod changed ($pod -> ${pod2:-none}) during the re-check; skipping"
                    exit 0
                  fi
                  if ! status2="$(kubectl -n "$ns" exec "$pod" -c netbird -- netbird status 2>&1)"; then
                    echo "watchdog: cannot reach $pod on re-check; skipping this cycle"
                    exit 0
                  fi
                  printf '%s\n' "$status2"
                  if printf '%s' "$status2" | grep -qE "$dead"; then
                    echo "watchdog: session dead on BOTH samples -> kubectl rollout restart $dep"
                    kubectl -n "$ns" rollout restart "$dep"
                  else
                    echo "watchdog: was mid-login, not wedged; recovered on its own (no restart)"
                  fi
          volumes:
            - name: tmp
              emptyDir: {}
