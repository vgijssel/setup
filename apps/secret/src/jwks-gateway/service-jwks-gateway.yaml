# ClusterIP fronting the JWKS gateway Pod, on a PINNED static-band address.
#
# This is the in-cluster half of a deliberate split horizon. OpenBao points its jwt-network
# `jwksUrl` at `https://jwks-network.vpn.blueora.ng/openid/v1/jwks`; inside this cluster that
# hostname resolves — via the CoreDNS override in configmap-coredns-jwks.yaml — to the address
# pinned below, which is this Service, which forwards raw TCP to the publishing peer. On the mesh
# the same hostname resolves to that peer directly.
#
# 443 -> 443 with no translation: the relay is raw TCP and the certificate is valid only for the
# mesh hostname, so there is nowhere in the path to absorb a port shift. See
# pod-jwks-gateway.yaml.
#
# WHY THE ClusterIP IS PINNED: the CoreDNS override has to name an address literally, and a
# ConfigMap cannot read a Service's allocated IP. Pinning it makes the two sides verifiable
# against each other instead of coupled by luck. 10.96.0.21 is in the low static band of the
# 10.96.0.0/12 service CIDR (the network cluster pins Omada at .20 by the same convention).
#
# clusterIP IS IMMUTABLE. Changing it, or adopting a Service that was created without it, needs a
# delete + recreate — an in-place apply fails with "field is immutable" and, under Fleet, wedges
# the whole bundle while still reporting Ready (see the 7.2 writeup for that failure shape).
apiVersion: v1
kind: Service
metadata:
  name: jwks-gateway
  namespace: netbird
  labels:
    app: jwks-gateway
spec:
  type: ClusterIP
  # Pinned — must match the address in configmap-coredns-jwks.yaml.
  clusterIP: 10.96.0.21
  selector:
    app: jwks-gateway
  ports:
    - name: https
      port: 443
      targetPort: 443
