# ClusterIP fronting the JWKS gateway Pod. OpenBao's jwt-network backend points its
# jwksUrl at http://jwks-gateway.netbird.svc.cluster.local/openid/v1/jwks — resolved by
# NORMAL cluster DNS to this Service, which forwards to the socat gateway, which relays
# over NetBird to the network cluster's jwks-mirror. Port 80 → the gateway's 8080.
apiVersion: v1
kind: Service
metadata:
  name: jwks-gateway
  namespace: netbird
  labels:
    app: jwks-gateway
spec:
  selector:
    app: jwks-gateway
  ports:
    - name: http
      port: 80
      targetPort: 8080
