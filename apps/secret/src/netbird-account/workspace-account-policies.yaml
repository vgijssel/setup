# Account-wide NetBird access policies that are NOT tied to one exposed service.
#
# Per-service policies are not here — the shared mesh-service chart renders one Workspace per
# exposure (`svc-openbao-tcp`, `svc-omada-tcp/udp`, `svc-jwks-network-tcp`). What is left is the
# device-peer access that used to ride the account's built-in `Default` policy.
#
# ╔═══════════════════════════════════════════════════════════════════════════════════════════╗
# ║ THE BUILT-IN `Default` POLICY MUST BE GONE (OR DISABLED) FOR ANY OF THIS TO MEAN ANYTHING.║
# ║                                                                                           ║
# ║ NetBird bootstraps every account with a policy named `Default`: All <-> All, protocol      ║
# ║ `all`, bidirectional, every port. While it is enabled, EVERY policy in this repo is        ║
# ║ decoration — every peer can already reach every port of every other peer, so a            ║
# ║ too-narrow `svc-*` policy looks like it works and a missing one does too. That is not      ║
# ║ hypothetical: it is why the mesh exposures verified green for days while their own         ║
# ║ policies were a silent no-op.                                                             ║
# ║                                                                                           ║
# ║ It is NOT managed here, because it cannot be: a resource NetBird created cannot be adopted ║
# ║ by `netbird_policy` without a one-shot `import`, and an `import` block left in config      ║
# ║ errors on every subsequent plan ("resource already managed") — which in a Crossplane       ║
# ║ Workspace means a permanently un-reconciling bundle.                                      ║
# ║                                                                                           ║
# ║ So on a FRESH ACCOUNT this is a bootstrap step, in the same category as seeding the        ║
# ║ OpenBao seal key and the operator PAT — find it by name and delete it:                     ║
# ║   id=$(curl -s -H "Authorization: Token $NB_PAT" https://api.netbird.io/api/policies \     ║
# ║        | jq -r '.[] | select(.name=="Default") | .id')                                     ║
# ║   curl -X DELETE -H "Authorization: Token $NB_PAT" \                                       ║
# ║        "https://api.netbird.io/api/policies/$id"                                           ║
# ║ (A `PUT` with `"enabled": false` is the reversible half-step, and is what was done first   ║
# ║ here before deleting it outright once the replacements below were verified.)                ║
# ║ Verify with: a peer must FAIL to reach a port no policy grants it — e.g. from a `homelab`  ║
# ║ peer, `jwks-network.vpn.blueora.ng:443` must be refused, since only `secret-k8s` is a      ║
# ║ source for it. If that SUCCEEDS, something still grants blanket access.                    ║
# ╚═══════════════════════════════════════════════════════════════════════════════════════════╝
#
# `homelab-devices` restores, explicitly, what `Default` used to give the device peers — and only
# them. Without it, disabling `Default` takes out PiKVM's web UI on 443, Home Assistant and the
# phone, because nothing else granted homelab-to-homelab traffic (`pikvm-ssh` below covers only
# netbird-ssh/22). Scoping it to `homelab` is the entire point: the `svc-*` groups and the
# per-cluster `*-k8s` groups are NOT in it, so the mesh exposures stay gated by their own
# per-protocol policies. This does not weaken the capability's access requirement, which
# constrains EXPOSED SERVICES — each of which sits in its own `svc-*` group. PiKVM, Home
# Assistant and a phone are plain device peers, not exposures.
#
# protocol `all` + bidirectional mirrors `Default`'s shape on purpose rather than guessing a port
# list for a pile of home devices. Narrowing it is a real improvement and a separate decision;
# inventing it here would have silently broken whichever device port was omitted.
#
# `pikvm-ssh` targets the PiKVM PEER rather than a group (`destination_resource` with
# `type = "peer"`), and `authorized_groups` maps the source group to the single local user `root`
# — the NetBird-SSH server authorises per local user, so without it any permitted peer could ask
# for any account on the box. The peer is resolved BY NAME through `data "netbird_peer"` rather
# than by its id: the id is regenerated if the box is ever re-enrolled, and a hardcoded one would
# leave the policy pointing at a peer that no longer exists. That data source only exists from
# provider 0.0.10 — this is why the version floor matters.
# `apps/pikvm`'s pyinfra apply runs over this policy (NetBird-SSH as root), so breaking it breaks
# that deploy path, not just interactive access.
apiVersion: opentofu.upbound.io/v1beta1
kind: Workspace
metadata:
  name: netbird-account-policies
spec:
  forProvider:
    source: Inline
    env:
      # Admin PAT for the management API — see the sibling account-settings Workspace.
      - name: NB_PAT
        secretKeyRef:
          namespace: crossplane-system
          name: netbird-mgmt-api-token
          key: token
    vars:
      # The NetBird peer NAME of the PiKVM box, resolved to an id at plan time.
      - key: pikvm_peer_name
        value: pikvm
    module: |
      terraform {
        required_providers {
          netbird = {
            source  = "netbirdio/netbird"
            version = "0.0.10"
          }
        }
      }

      provider "netbird" {}

      variable "pikvm_peer_name" { type = string }

      # Groups are looked up by name because netbird_policy takes group IDs and the ids are
      # assigned by NetBird. `All` is the built-in group every peer joins.
      data "netbird_group" "homelab" {
        name = "homelab"
      }

      data "netbird_group" "all" {
        name = "All"
      }

      data "netbird_peer" "pikvm" {
        name = var.pikvm_peer_name
      }

      # Device-to-device access inside homelab. Replaces the built-in `Default` for device peers.
      resource "netbird_policy" "homelab_devices" {
        name        = "homelab-devices"
        description = "Device-to-device access inside homelab (PiKVM UI, Home Assistant, phone). Replaces the built-in Default policy for device peers; deliberately excludes the svc-* and *-k8s groups so the mesh exposures stay gated by their own policies. Managed by apps/secret/src/netbird-account - do not edit in the dashboard."
        enabled     = true

        # Exactly one rule: the provider accepts at most one per policy.
        rule {
          name          = "homelab-devices"
          action        = "accept"
          enabled       = true
          bidirectional = true
          protocol      = "all"
          sources       = [data.netbird_group.homelab.id]
          destinations  = [data.netbird_group.homelab.id]
        }
      }

      # NetBird-SSH into the PiKVM box as root. Targets the peer directly, not a group.
      resource "netbird_policy" "pikvm_ssh" {
        name        = "pikvm-ssh"
        description = "Allow ALL to ssh into the pikvm as \"root\" (NetBird-SSH). Used interactively and by apps/pikvm's pyinfra apply. Managed by apps/secret/src/netbird-account - do not edit in the dashboard."
        enabled     = true

        rule {
          name          = "pikvm-ssh"
          action        = "accept"
          enabled       = true
          bidirectional = false
          protocol      = "netbird-ssh"
          # `ports` is a list of STRINGS in this provider, not integers.
          ports         = ["22"]
          sources       = [data.netbird_group.all.id]

          destination_resource = {
            id   = data.netbird_peer.pikvm.id
            type = "peer"
          }

          # NetBird-SSH authorises per LOCAL USER; without this any permitted peer could request
          # any account on the box.
          authorized_groups = {
            (data.netbird_group.all.id) = ["root"]
          }
        }
      }

      # ── Transit to the network cluster's routing peer ───────────────────────────────────────
      # A ROUTED RESOURCE NEEDS TWO SEPARATE AUTHORISATIONS, and missing the second one is
      # invisible until the built-in `Default` policy stops covering it. Measured, not guessed:
      #
      #   leg 1  client -> the routing peer            <- THIS policy
      #   leg 2  client -> the resource behind it      <- the operator's autogenerated
      #                                                  `homelab -> omada-devices` policy, from
      #                                                  ../../../network/src/omada/templates/nbresource-omada-devices.yaml
      #
      # The Omada DEVICE path (`omada.blueora.ng` -> pinned ClusterIP 10.96.0.20) is forwarded by
      # the network cluster's `router` peer, which sits in the operator-created `network` group.
      # Nothing granted `homelab -> network`, so when `Default` was removed the device path broke
      # while every check that mattered still looked fine: the resource policy was correct and
      # enabled, the route was `Selected` on the client and resolved to the right ClusterIP, and
      # the controller answered 200 from inside the cluster. Only the overlay hop was dead.
      #
      # Why the LAN subnet resources (`cidr-*`) did NOT break and so hid the problem: their
      # routing peer is the PiKVM, which is itself in `homelab` — so `homelab-devices` above
      # happens to authorise their leg 1 by accident. That coincidence is the whole reason this
      # policy is easy to forget.
      #
      # `protocol = all` with NO port list, deliberately — this is not laziness and it does not
      # widen the port space. Verified: with this policy wide open, the DECLARED device ports
      # (8043, 29811, ...) are reachable while UNDECLARED ones (9999, 8200) are still refused,
      # because leg 2 gates the ports on the real destination. Restating the port list here would
      # therefore add no security and would create a third copy of it to keep in sync with the
      # Service and the NBResource. The destination is a forwarding peer that runs nothing but the
      # mesh client, so "every port of the peer itself" is close to an empty set anyway.
      data "netbird_group" "network" {
        name = "network"
      }

      resource "netbird_policy" "omada_devices_transit" {
        name        = "homelab-to-network-router"
        description = "Leg 1 of the Omada DEVICE path: lets homelab peers traverse the network cluster's routing peer. Leg 2 (the ports) is the operator's autogenerated omada-devices policy. Removing this silently breaks device access while the resource policy still looks correct. Managed by apps/secret/src/netbird-account - do not edit in the dashboard."
        enabled     = true

        rule {
          name          = "homelab-to-network-router"
          action        = "accept"
          enabled       = true
          bidirectional = false
          protocol      = "all"
          sources       = [data.netbird_group.homelab.id]
          destinations  = [data.netbird_group.network.id]
        }
      }

      output "homelab_devices_policy_id" {
        value = netbird_policy.homelab_devices.id
      }
      output "omada_devices_transit_policy_id" {
        value = netbird_policy.omada_devices_transit.id
      }
      output "pikvm_ssh_policy_id" {
        value = netbird_policy.pikvm_ssh.id
      }
      output "pikvm_peer_id" {
        value = data.netbird_peer.pikvm.id
      }
  providerConfigRef:
    name: default
