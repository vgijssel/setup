# Account-wide NetBird settings: the peer DNS domain, and peer-login expiration.
#
# These were tasks 2.5 and 2.6 of the mesh migration and were applied as a single hand-run
# `PUT /api/accounts/<id>`. They are the foundation the whole exposure design rests on, so having
# them live only in the account was the weakest link in the story: `vpn.blueora.ng` is the domain
# every mesh hostname and the shared wildcard certificate are built on, and nothing in git said so.
#
# dns_domain = vpn.blueora.ng
#   Peers resolve as `<label>.vpn.blueora.ng` instead of `<label>.netbird.cloud`. Changing it
#   renames EVERY peer FQDN account-wide in one step (measured: all 19 at the time), and would
#   instantly invalidate the `*.vpn.blueora.ng` certificate in kv/mesh-tls plus every consumer
#   hostname. It is a one-line edit with a very long blast radius — treat it as such.
#   `blueora.ng` is used rather than `vgijssel.nl` because the latter carries a Cloudflare
#   wildcard that answers at ARBITRARY label depth, which would make every mesh hostname publicly
#   resolvable and let public DNS override NetBird's own resolver. `blueora.ng` must therefore
#   never gain a wildcard A/CNAME record. (A wildcard CERTIFICATE is fine and is what we use —
#   it publishes no address record.)
#
# peer_login_expiration_enabled = false
#   Interactive-SSO peers otherwise force a re-auth every 24 h, and a peer that cannot re-auth
#   itself wedges in NeedsLogin/SessionExpired with its routes gone. That was the documented root
#   cause of repeated outages of the routing peer, the old ESO sidecar and the reverse-proxy peer.
#   Disabling it removes the DOMINANT cause but not the only one — host suspend/resume still wedges
#   a client independently of login expiry, which is why the per-service watchdog CronJobs stay as
#   defence in depth rather than being deleted alongside this.
#   Note it applies only to peers added by a user via SSO; setup-key peers (every cluster peer
#   here) were never subject to it.
#
# WHY THIS ADOPTS INSTEAD OF NEEDING AN IMPORT, which is what makes it safe to add to a live
# account: `netbird_account_settings` is a singleton whose Create lists the account and PUTs the
# settings, so a first apply adopts whatever is already there rather than colliding with it. Its
# Delete is a deliberate no-op, so removing this file from the repo leaves the live settings
# untouched — it stops managing them, it does not reset the account.
#
# Only the two fields this repo has an opinion about are set. Every other attribute the resource
# supports (JWT group propagation, inactivity expiration, traffic logs, peer approval, ...) is
# left unmanaged on purpose: naming one here would silently assert a value for it.
apiVersion: opentofu.upbound.io/v1beta1
kind: Workspace
metadata:
  name: netbird-account-settings
spec:
  forProvider:
    source: Inline
    env:
      # Admin PAT for the management API. Delivered by Vault Secrets Operator into
      # crossplane-system (../config/vaultdynamicsecret-netbird-mgmt-api-key.yaml). The PAT needs
      # NetBird role `admin` — account settings are not writable by a lesser role.
      - name: NB_PAT
        secretKeyRef:
          namespace: crossplane-system
          name: netbird-mgmt-api-token
          key: token
    vars:
      - key: dns_domain
        value: vpn.blueora.ng
    module: |
      terraform {
        required_providers {
          netbird = {
            source  = "netbirdio/netbird"
            version = "0.0.10"
          }
        }
      }

      # management_url defaults to https://api.netbird.io; the token comes from NB_PAT.
      provider "netbird" {}

      variable "dns_domain" { type = string }

      resource "netbird_account_settings" "this" {
        dns_domain                    = var.dns_domain
        peer_login_expiration_enabled = false
      }

      output "dns_domain" {
        value = netbird_account_settings.this.dns_domain
      }
  providerConfigRef:
    name: default
