# NetBird ACCOUNT-WIDE state, in code.
#
# Everything here was previously set by hand against the management API and existed nowhere in
# git, so a fresh account could not be rebuilt from this repo and nothing detected drift:
#   - the peer DNS domain `vpn.blueora.ng` and the disabled peer-login expiration (tasks 2.5/2.6
#     of the mesh migration, both recorded as one-off `PUT /api/accounts/<id>` calls);
#   - the `homelab-devices` policy that replaced the built-in `Default` for device peers;
#   - the `pikvm-ssh` policy.
# These are account-GLOBAL, not per-cluster, which is the one thing to understand before editing:
# two clusters reconciling the same account objects would fight, so this bundle is deliberately
# secret-ONLY. Same single-writer reasoning as ../mesh-tls, for the same reason — the network
# cluster has an identical provider-opentofu and NetBird PAT and therefore COULD manage these,
# which is exactly what must not happen.
#
# NOT in here, and deliberately so:
#   - the four `cidr-*` policies and the `lan-*` networks/resources/routers they target. Those
#     are the home-LAN routing stack: the policies cannot be codified alone without hardcoding
#     generated resource ids, so they belong with a `netbird_network`/`netbird_network_resource`
#     migration of the whole stack, not half-done here. Still hand-managed; see apps/network/network.md.
#   - the per-service mesh policies (`svc-*`), which the shared mesh-service chart already owns
#     as its own Workspace per exposure.
#   (there used to be a third exclusion here — the `omada-devices` resource policies the operator
#   generated from an NBResource. Both the resource and the operator's policy-creation flag are
#   gone as of 2026-10-07, so every policy in the account is now declared in git.)
#
# dependsOn:
#   - crossplane-provider : owns the opentofu.upbound.io Provider + its `default` ProviderConfig.
#   - secret-config       : owns the VaultDynamicSecret that puts the NetBird admin PAT in
#                           crossplane-system, which every Workspace here authenticates with.
labels:
  fleet.vgijssel.nl/bundle: netbird-account
defaultNamespace: crossplane-system
dependsOn:
  - selector:
      matchLabels:
        fleet.vgijssel.nl/bundle: crossplane-provider
  - selector:
      matchLabels:
        fleet.vgijssel.nl/bundle: secret-config
# secret-ONLY. bin/fleet-apply applies every bundle globally, so target the secret cluster
# explicitly — and here that targeting is load-bearing rather than tidy, because these objects
# are account-global and a second reconciler would flap them.
targetCustomizations:
  - name: secret
    clusterSelector:
      matchLabels:
        cluster.vgijssel.nl/name: secret
  # Terminal catch-all. Targets are first-match-wins and a GitRepo APPENDS its own target
  # after these, so without this a non-matching cluster falls through to it and deploys with
  # default values. See bin/fleet-lint-targets.
  - name: none
    doNotDeploy: true
    clusterSelector: {}
