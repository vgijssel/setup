# Least-privilege policy for the OpenBao snapshot-agent CronJob (chart
# `snapshotAgent`, src/openbao/values.yaml). It backs up the integrated Raft state
# off-cluster to Hetzner S3 so the homelab's secret broker survives loss of the
# single OrbStack VM disk (the vind disk-pressure failure mode).
#
# Scope is exactly one path: read `sys/storage/raft/snapshot`, which streams a
# point-in-time Raft snapshot. Nothing else — a snapshot job needs no other access.
# If a live run returns `permission denied` here, the path may be sudo-protected on
# this OpenBao version; widening to ["read", "sudo"] is an ask-first change (SPEC).
#
# Crossplane-owned (NOT self-init): the snapshot job is not part of the auth
# bootstrap, so per the `init ⊂ crossplane` invariant it lives here, like `admin`.
# deletionPolicy: Orphan — deleting this MR must never delete the live OpenBao policy.
apiVersion: vault.vault.upbound.io/v1alpha1
kind: Policy
metadata:
  name: snapshot
spec:
  deletionPolicy: Orphan
  providerConfigRef:
    name: openbao
  forProvider:
    name: snapshot
    policy: |
      path "sys/storage/raft/snapshot" {
        capabilities = ["read"]
      }
