apiVersion: v2
name: openbao-config
description: >-
  Crossplane-managed OpenBao configuration for the secret cluster — the full, reconciled source
  of truth that the self-init stanza in ../openbao/values.yaml seeds only a minimal subset of.
version: 1.0.0
# A plain LOCAL chart with no dependencies. It is a chart at all only so that the OpenBao plugin
# pins live in values.yaml instead of being buried inside the inline Terraform of the plugin
# registration Workspaces, where nothing but textual substitution could reach them. Every other
# manifest under templates/ is a verbatim static file. See
# openspec/changes/release-please-openbao-plugins/design.md (D11).
