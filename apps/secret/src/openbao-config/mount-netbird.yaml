# netbird custom secrets engine — dynamically generates and manages NetBird
# credentials (PATs, proxy tokens, setup keys) with lease-tracked revocation.
# The plugin binary is loaded from the plugin_directory via the init-container
# in src/openbao/values.yaml.
#
# deletionPolicy: Orphan mirrors the kv mount protection — deleting this MR
# must NEVER destroy the OpenBao mount/data.
apiVersion: vault.vault.upbound.io/v1alpha1
kind: Mount
metadata:
  name: netbird
  annotations:
    crossplane.io/external-name: netbird
spec:
  deletionPolicy: Orphan
  providerConfigRef:
    name: openbao
  forProvider:
    path: netbird
    type: openbao-plugin-secrets-netbird
    description: NetBird secrets engine for dynamic credential generation
