# The `crossplane` reconciler's own admin policy. DUPLICATED from the OpenBao self-init
# `crossplane` policy in apps/secret/src/openbao/values.yaml — keep the two in sync.
# self-init SEEDS this at first boot (so the provider can log in and take over);
# Crossplane then OWNS it and reconciles it continuously (drift correction), overwriting
# the seed. OpenBao stores policy text verbatim, so no perpetual diff.
#
# Broad by necessity: the reconciler must always be able to re-grant itself
# (sys/policies/acl/* + auth/kubernetes/*), so a bad apply can't lock it out; if it ever
# does, `moon run secret:get_openbao_auth` (break-glass admin) fixes it. deletionPolicy: Orphan so
# removing this MR never deletes the live policy (which would lock the provider out).
apiVersion: vault.vault.upbound.io/v1alpha1
kind: Policy
metadata:
  name: crossplane
spec:
  deletionPolicy: Orphan
  providerConfigRef:
    name: openbao
  forProvider:
    name: crossplane
    policy: |
      # secret engine mounts (kv)
      path "sys/mounts" {
        capabilities = ["read", "list"]
      }
      path "sys/mounts/*" {
        capabilities = ["create", "read", "update", "delete"]
      }
      # auth method mounts (kubernetes, jwt-network)
      path "sys/auth" {
        capabilities = ["read", "list"]
      }
      path "sys/auth/*" {
        capabilities = ["create", "read", "update", "delete", "sudo"]
      }
      # ACL policies (external-secrets, network-read, and crossplane itself)
      path "sys/policy" {
        capabilities = ["read", "list"]
      }
      path "sys/policy/*" {
        capabilities = ["create", "read", "update", "delete", "list"]
      }
      path "sys/policies/acl" {
        capabilities = ["list"]
      }
      path "sys/policies/acl/*" {
        capabilities = ["create", "read", "update", "delete", "list"]
      }
      # kubernetes auth method config + roles
      path "auth/kubernetes/*" {
        capabilities = ["create", "read", "update", "delete", "list"]
      }
      # network cluster JWT auth method config + roles
      path "auth/jwt-network/*" {
        capabilities = ["create", "read", "update", "delete", "list"]
      }
      # provider-vault mints a short-lived child token per reconcile (skip_child_token
      # is not honoured on the auth_login path); OpenBao's default policy grants no token
      # creation, so allow it here.
      path "auth/token/create" {
        capabilities = ["create", "update"]
      }
