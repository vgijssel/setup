# The `crossplane` reconciler's own admin policy. DUPLICATED from the OpenBao self-init
# `crossplane` policy in apps/secret/src/openbao/values.yaml — keep the two in sync.
# self-init SEEDS this at first boot (so the provider can log in and take over);
# Crossplane then OWNS it and reconciles it continuously (drift correction), overwriting
# the seed. OpenBao stores policy text verbatim, so no perpetual diff.
#
# Broad by necessity: the reconciler must always be able to re-grant itself
# (sys/policies/acl/* + auth/kubernetes/*), so a bad apply can't lock it out; if it ever
# does, `moon run secret:get_openbao_auth` (break-glass admin) fixes it. deletionPolicy: Orphan so
# removing this MR never deletes the live policy (which would lock the provider out).
apiVersion: vault.vault.upbound.io/v1alpha1
kind: Policy
metadata:
  name: crossplane
spec:
  deletionPolicy: Orphan
  providerConfigRef:
    name: openbao
  forProvider:
    name: crossplane
    policy: |
      # secret engine mounts (kv)
      path "sys/mounts" {
        capabilities = ["read", "list"]
      }
      path "sys/mounts/*" {
        capabilities = ["create", "read", "update", "delete"]
      }
      # auth method mounts (kubernetes, jwt-network)
      path "sys/auth" {
        capabilities = ["read", "list"]
      }
      path "sys/auth/*" {
        capabilities = ["create", "read", "update", "delete", "sudo"]
      }
      # ACL policies (vault-secrets-operator and crossplane itself)
      path "sys/policy" {
        capabilities = ["read", "list"]
      }
      path "sys/policy/*" {
        capabilities = ["create", "read", "update", "delete", "list"]
      }
      path "sys/policies/acl" {
        capabilities = ["list"]
      }
      path "sys/policies/acl/*" {
        capabilities = ["create", "read", "update", "delete", "list"]
      }
      # kubernetes auth method config + roles
      path "auth/kubernetes/*" {
        capabilities = ["create", "read", "update", "delete", "list"]
      }
      # network cluster JWT auth method config + roles
      path "auth/jwt-network/*" {
        capabilities = ["create", "read", "update", "delete", "list"]
      }
      # plugin catalog (register custom secret engine binaries)
      path "sys/plugins/catalog/*" {
        capabilities = ["create", "read", "update", "delete", "list", "sudo"]
      }
      # netbird secrets engine configuration (role configs + root config)
      path "netbird/config/*" {
        capabilities = ["create", "read", "update", "delete", "list"]
      }
      # cloudflare secrets engine configuration (role configs + root config).
      # Scoped to config/ only: this grants writing the PARENT token and the roles, not reading
      # minted tokens out of cloudflare/token/* — the reconciler never needs a live credential.
      path "cloudflare/config/*" {
        capabilities = ["create", "read", "update", "delete", "list"]
      }
      # The mesh wildcard certificate, published here by ../mesh-tls/workspace-mesh-tls-publish.yaml
      # and read back by every exposure through Vault Secrets Operator.
      #
      # Scoped to this ONE key, not `kv/data/*`. Writing it is as powerful as being able to serve
      # every mesh hostname on both clusters, and this policy is the reconciler's broad admin
      # policy — so the narrow path is what keeps "can write a Workspace" from meaning "can
      # replace any secret in kv". `read` is included because the provider diffs against the
      # current value, and `delete` so destroying the Workspace is not left half-done.
      path "kv/data/mesh-tls" {
        capabilities = ["create", "read", "update", "delete"]
      }
      # create/update as well as read: `custom_metadata` (max_versions) is written to the
      # METADATA endpoint, not the data one. Granting only read here fails in the worst possible
      # way — the data write succeeds and then the metadata write is denied, so every retry of the
      # failed reconcile leaves ANOTHER version of the private key behind. Observed exactly that,
      # 1 -> 9 versions in three minutes, which is the opposite of what max_versions is for.
      path "kv/metadata/mesh-tls" {
        capabilities = ["create", "read", "update", "list", "delete"]
      }
      # provider-vault mints a short-lived child token per reconcile (skip_child_token
      # is not honoured on the auth_login path); OpenBao's default policy grants no token
      # creation, so allow it here.
      path "auth/token/create" {
        capabilities = ["create", "update"]
      }
