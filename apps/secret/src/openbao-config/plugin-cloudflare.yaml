# Declaratively register the openbao-plugin-secrets-cloudflare binary in the plugin catalog and
# mount it at `cloudflare/`. Built from libs/openbao-cloudflare-plugin.
#
# WHY A DYNAMIC ENGINE AT ALL: the previous arrangement held one long-lived Cloudflare token as a
# static kv entry (kv/cloudflare#credential) shared by cert-manager's DNS-01 solver and
# external-dns on both clusters. When that token went invalid, every certificate renewal and
# every DNS record on both clusters failed at once, with the only symptom a 9109 in an
# external-dns crash loop. This engine replaces it with one short-lived, per-consumer token
# minted on demand and revoked with its lease.
#
# THIS FILE DOES NOT CONFIGURE THE ENGINE — registration and mount only, deliberately.
# The parent token (`cloudflare/config/root`) and the roles (`cloudflare/config/token/<name>`)
# are a separate manifest, because a Workspace whose env references an absent Secret cannot
# reconcile at all, and this bundle is a dependsOn target — a stuck Workspace here stalls every
# bundle downstream of openbao-config. So the credential-dependent half only lands once
# kv/cloudflare#api_token is seeded. Registration and mount need no Cloudflare credential and
# are safe to apply now.
#
# Uses provider-opentofu Workspace with inline HCL since provider-vault has no native
# plugin-catalog resource type (same reason as plugin-netbird.yaml).
#
# THE plugin_sha256 BELOW IS BOT-WRITTEN. bin/openbao-plugin-pin rewrites it from CI after a
# successful publish, in the SAME commit as the init-container image tag in
# src/openbao/values.yaml — the two describe the same binary, and a state where they disagree
# makes registration fail with nothing but a bare "checksum mismatch". Hand-editing it will be
# overwritten on the next publish; to ship a new build, bump
# libs/openbao-cloudflare-plugin/version.txt (release-please does this from a `fix:`/`feat:`
# commit) and let the pipeline propagate it.
#
# OpenBao requires the field — a registration without it is rejected `400 missing SHA-256
# value` — and it is per-ARCHITECTURE, both clusters being arm64 (`uname -m` = aarch64).
# libs/openbao-cloudflare-plugin/plugin-sha.sh computes the arm64 value. (Do NOT crib the
# `docker run <image> sha256sum <binary>` form: the image ENTRYPOINT is the plugin binary, so
# that command runs the PLUGIN with those arguments and prints nothing useful. plugin-sha.sh
# passes --entrypoint sha256sum.)
#
# Unlike plugin-netbird.yaml there is no `import` block for the mount: Terraform creates this
# mount itself. If the tfstate Secret is ever lost while the mount survives, the create fails
# with "path already in use" — recover by adding a temporary import block, as the netbird
# workspace has.
#
# State lives in the shared kubernetes backend (keyed per-workspace).
apiVersion: opentofu.upbound.io/v1beta1
kind: Workspace
metadata:
  name: cloudflare-plugin
spec:
  forProvider:
    source: Inline
    vars:
      - key: plugin_sha256
        value: f2517f1b5ea495b44a26a4f4fbed9cc6aee0a177a4a03eea930bd8bfbad785ac
    module: |
      terraform {
        required_providers {
          vault = {
            source  = "hashicorp/vault"
            version = "4.6.0"
          }
        }
      }

      variable "plugin_sha256" {
        type = string
      }

      provider "vault" {
        address         = "http://openbao.secret.svc:8200"
        skip_child_token = true
        auth_login {
          path = "auth/kubernetes/login"
          parameters = {
            role = "crossplane"
            jwt  = file("/var/run/secrets/kubernetes.io/serviceaccount/token")
          }
        }
      }

      resource "vault_generic_endpoint" "plugin_register" {
        path                 = "sys/plugins/catalog/secret/openbao-plugin-secrets-cloudflare"
        disable_read         = true
        disable_delete       = true
        ignore_absent_fields = true
        data_json = jsonencode({
          sha256  = var.plugin_sha256
          command = "openbao-plugin-secrets-cloudflare"
        })
      }

      resource "vault_mount" "cloudflare" {
        depends_on  = [vault_generic_endpoint.plugin_register]
        path        = "cloudflare"
        type        = "openbao-plugin-secrets-cloudflare"
        description = "Cloudflare secrets engine minting scoped, leased API tokens"
      }
  providerConfigRef:
    name: default
