# The ProviderConfig every OpenBao managed resource references. It logs in to
# OpenBao over the in-cluster Kubernetes auth method: source: Kubernetes makes the
# provider present its own pod ServiceAccount token (provider-vault) to
# auth/kubernetes/login as role `crossplane` (created by OpenBao self-init). This is
# the native k8s-auth path — no static token, no Vault-Agent sidecar.
#
# skip_child_token expresses intent (mirrors the old terranetes provider.tf), but it
# is NOT honoured by provider-vault on the auth_login/kubernetes path — the provider
# still mints a short-lived child token per reconcile. So the `crossplane` policy
# grants auth/token/create (see src/openbao/values.yaml self-init + the future
# policy-crossplane MR); the two must stay in sync.
#
# NOTE: this CR's CRD (vault.upbound.io) only exists once provider-vault is healthy;
# it therefore lives in this openbao-config bundle (downstream of crossplane-provider),
# never in the same bundle as the Provider — Fleet applies a bundle as one atomic Helm
# release, so a ProviderConfig alongside the Provider would fail the whole release.
apiVersion: vault.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: openbao
spec:
  address: http://openbao.secret.svc:8200
  skip_child_token: true
  mountPath: kubernetes
  role: crossplane
  credentials:
    source: Kubernetes
