# The break-glass `admin` policy (full access incl. sudo) used by `moon run secret:auth`.
# DUPLICATED from the OpenBao self-init `admin` policy in
# apps/secret/src/openbao/values.yaml — keep the two in sync. self-init SEEDS it at
# first boot (so break-glass works even before/without Crossplane); Crossplane then OWNS
# it and reconciles it continuously. deletionPolicy: Orphan so removing this MR never
# deletes the live policy.
apiVersion: vault.vault.upbound.io/v1alpha1
kind: Policy
metadata:
  name: admin
spec:
  deletionPolicy: Orphan
  providerConfigRef:
    name: openbao
  forProvider:
    name: admin
    policy: |
      path "*" {
        capabilities = ["create", "read", "update", "delete", "list", "patch", "sudo"]
      }
