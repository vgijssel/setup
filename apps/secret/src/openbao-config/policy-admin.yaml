# The break-glass `admin` policy (full access incl. sudo) used by `moon run secret:get_openbao_auth`.
#
# CROSSPLANE-ONLY — self-init does NOT seed this, and the distinction matters most in the
# situation you would reach for break-glass in. Per the `init ⊂ crossplane` invariant
# (apps/secret/CLAUDE.md), the `initialize` stanza in apps/secret/src/openbao/values.yaml seeds
# exactly four things — enable + configure kubernetes auth, and the `crossplane` policy + role —
# and admin is deliberately not among them. So on a FRESH cluster `secret:get_openbao_auth`
# fails until Crossplane has reconciled this MR and role-admin.yaml. That is not a deadlock:
# provider-vault authenticates with the self-init `crossplane` role and needs nothing out of kv,
# so admin appears shortly after the openbao-config bundle applies. If the Crossplane controller
# itself is down, break-glass by logging in as the `crossplane` role with the provider's SA token
# (CLAUDE.md, "Break-glass / human admin").
#
# deletionPolicy: Orphan so removing this MR never deletes the live policy.
apiVersion: vault.vault.upbound.io/v1alpha1
kind: Policy
metadata:
  name: admin
spec:
  deletionPolicy: Orphan
  providerConfigRef:
    name: openbao
  forProvider:
    name: admin
    policy: |
      path "*" {
        capabilities = ["create", "read", "update", "delete", "list", "patch", "sudo"]
      }
