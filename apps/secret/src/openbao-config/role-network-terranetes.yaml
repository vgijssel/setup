# network cluster terranetes-runner JWT login role. Crossplane replacement for
# vault_jwt_auth_backend_role.network_terranetes (main.tf). The runner presents its
# DEFAULT SA token (not an audience-scoped projected token like ESO), whose `aud` is
# the cluster's default API audience — which in the network cluster equals the OIDC
# issuer, so bind that. Reads kv/network-tailscale-config via network-read.
# PARITY-CRITICAL for the network cluster.
apiVersion: jwt.vault.upbound.io/v1alpha1
kind: AuthBackendRole
metadata:
  name: network-terranetes
spec:
  deletionPolicy: Orphan
  providerConfigRef:
    name: openbao
  forProvider:
    backend: jwt-network
    roleName: network-terranetes
    roleType: jwt
    boundAudiences:
      - https://kubernetes.default.svc.cluster.local
    boundSubject: system:serviceaccount:terranetes-system:terranetes-executor
    userClaim: sub
    tokenPolicies:
      - network-read
    tokenTtl: 3600
