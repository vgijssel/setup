# Kubernetes-auth login role for the OpenBao snapshot-agent CronJob. Binds the
# ServiceAccount the chart creates (`openbao-snapshot` in ns `secret`, from
# snapshotAgent.serviceAccount.create) to the least-privilege `snapshot` policy
# (policy-snapshot.yaml), so each hourly run logs in via auth/kubernetes as role
# `snapshot`, mints a short-lived token, takes a Raft snapshot, and exits.
#
# References the `kubernetes` auth backend by its path string (backend: kubernetes) —
# the backend itself is created by OpenBao self-init and adopted by
# authbackend-kubernetes.yaml; no separate Backend MR is needed here (same pattern as
# role-external-secrets.yaml).
#
# Crossplane-owned (NOT self-init): per the `init ⊂ crossplane` invariant the snapshot
# role is Crossplane-only, like `admin`. deletionPolicy: Orphan — deleting this MR must
# never delete the live OpenBao role.
apiVersion: kubernetes.vault.upbound.io/v1alpha1
kind: AuthBackendRole
metadata:
  name: snapshot
spec:
  deletionPolicy: Orphan
  providerConfigRef:
    name: openbao
  forProvider:
    backend: kubernetes
    roleName: snapshot
    boundServiceAccountNames:
      - openbao-snapshot
    boundServiceAccountNamespaces:
      - secret
    tokenPolicies:
      - snapshot
    tokenTtl: 900
    tokenMaxTtl: 3600
