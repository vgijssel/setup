# vault-secrets-operator kubernetes-auth login role, bound to VSO's own ServiceAccount.
#
# Deliberately separate from the `external-secrets` role rather than reusing it: the two
# consumers need different capabilities (VSO additionally manages leases) and separating them
# keeps either one revocable without touching the other. It is also what lets ESO and VSO run
# side by side during the migration.
#
# ── TOKEN TTL MATTERS HERE, UNLIKE FOR ESO ──────────────────────────────────────────────────
# A secret lease is a CHILD of the auth token that created it, so when this login token dies,
# every lease it created is revoked and the upstream credential is deleted. For ESO that is
# academic (it revokes its own token immediately anyway, which is the bug). For VSO it is the
# ceiling on how long a credential can survive.
#
# tokenPeriod makes the token PERIODIC: VSO can keep renewing it indefinitely in 24h increments
# and it never hits a max_ttl wall. A plain token_ttl/token_max_ttl pair would hard-expire,
# taking every live dynamic credential with it — which is exactly the failure mode described in
# external-secrets#2198, just on a longer fuse.
apiVersion: kubernetes.vault.upbound.io/v1alpha1
kind: AuthBackendRole
metadata:
  name: vault-secrets-operator
spec:
  deletionPolicy: Orphan
  providerConfigRef:
    name: openbao
  forProvider:
    backend: kubernetes
    roleName: vault-secrets-operator
    # Bound to the ServiceAccount in each CONSUMING namespace, not the operator's own. VSO sends
    # a token for a SA that "must reside in the consuming secret's namespace" (VaultAuth CRD), so
    # a VaultDynamicSecret in cert-manager logs in as cert-manager/vault-secrets-operator.
    # Add a namespace here when a new consumer migrates off ESO.
    boundServiceAccountNames:
      - vault-secrets-operator
    boundServiceAccountNamespaces:
      - cert-manager
    tokenPolicies:
      - vault-secrets-operator
    # Periodic token — renewable forever, never hard-expires. See the header.
    tokenPeriod: 86400
