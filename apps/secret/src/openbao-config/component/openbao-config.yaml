apiVersion: core.oam.dev/v1beta1
kind: ComponentDefinition
metadata:
  annotations:
    definition.oam.dev/description: OpenBao configuration for the secret child (kv, kubernetes auth, ESO + executor policies)
  labels:
    type: terraform
  name: openbao-config
  namespace: vela-system
spec:
  schematic:
    terraform:
      configuration: |
        # OpenBao configuration as one flat OpenTofu module — the declarative definition of
        # the secret child's OpenBao: the kv engine external-secrets reads, the kubernetes
        # auth method, and the ACL policies/roles for its two in-cluster consumers (ESO and
        # this module's own terraform executor). Reconciled child-local by the KubeVela
        # terraform-controller against a kubernetes-backend state Secret (SPEC §3.2).
        #
        # Cross-cluster access (the network child reading this OpenBao over the tailnet) is
        # re-established in Phase 3 (Task 3.1) with the new tailnet mechanism — it is NOT
        # part of this module now that the api.<cluster>.vgijssel.nl kube-API proxy (and the
        # live-JWKS-over-proxy JWT auth it enabled) is removed (SPEC §3).

        # ── kv v2 secret engine ──────────────────────────────────────────────────────
        # The engine external-secrets reads from. Mounts at `kv/`; version "2" matches the
        # ClusterSecretStore's `version: v2`.
        resource "vault_mount" "kv" {
          path        = "kv"
          type        = "kv"
          options     = { version = "2" }
          description = "kv v2 engine external-secrets reads cloudflare/tailscale/netdata from"
        }

        # ── kubernetes auth method ───────────────────────────────────────────────────
        # OpenBao runs in-cluster and reviews tokens with its own ServiceAccount
        # (system:auth-delegator), so kubernetes_host is all that is required.
        resource "vault_auth_backend" "kubernetes" {
          type = "kubernetes"
          path = "kubernetes"
        }

        resource "vault_kubernetes_auth_backend_config" "kubernetes" {
          backend         = vault_auth_backend.kubernetes.path
          kubernetes_host = "https://kubernetes.default.svc:443"
        }

        # ── external-secrets: read-only over kv ──────────────────────────────────────
        # Policy + login role for ESO's ClusterSecretStore (mountPath kubernetes, role
        # external-secrets). ESO reads kv/* to sync Secrets in the child.
        resource "vault_policy" "external_secrets" {
          name   = "external-secrets"
          policy = <<-EOT
            path "kv/data/*" {
              capabilities = ["read"]
            }
            path "kv/metadata/*" {
              capabilities = ["read", "list"]
            }
          EOT
        }

        resource "vault_kubernetes_auth_backend_role" "external_secrets" {
          backend                          = vault_auth_backend.kubernetes.path
          role_name                        = "external-secrets"
          bound_service_account_names      = ["external-secrets"]
          bound_service_account_namespaces = ["external-secrets"]
          token_policies                   = ["external-secrets"]
        }

        # ── terraform executor: the runner's own login ───────────────────────────────
        # The admin policy + login role the KubeVela terraform-controller executor uses to
        # reconcile THIS module child-local (kubernetes auth). Scoped to exactly what the
        # module manages: the kv + kubernetes auth-method mounts, ACL policies
        # (external-secrets AND this policy itself), and the kubernetes auth method's config
        # + roles. It grants NO kv data access — ESO reads that, not the executor.
        #
        # Because the executor manages the very role/policy it logs in with, this policy MUST
        # stay broad enough to always re-grant itself (sys/policies/acl/* + auth/kubernetes/*):
        # a narrower policy could lock the executor out on a bad apply. The OpenBao bring-up
        # Workflow (Task 2.4), holding the root token, is the recovery / seeding path.
        resource "vault_policy" "openbao_config" {
          name   = "openbao-config"
          policy = <<-EOT
            # secret engine mounts (kv)
            path "sys/mounts" {
              capabilities = ["read", "list"]
            }
            path "sys/mounts/*" {
              capabilities = ["create", "read", "update", "delete"]
            }
            # auth method mounts (kubernetes)
            path "sys/auth" {
              capabilities = ["read", "list"]
            }
            path "sys/auth/*" {
              capabilities = ["create", "read", "update", "delete", "sudo"]
            }
            # ACL policies (external-secrets, and this policy itself). Grant the legacy
            # sys/policy endpoint plus the modern sys/policies/acl alias.
            path "sys/policy" {
              capabilities = ["read", "list"]
            }
            path "sys/policy/*" {
              capabilities = ["create", "read", "update", "delete", "list"]
            }
            path "sys/policies/acl" {
              capabilities = ["list"]
            }
            path "sys/policies/acl/*" {
              capabilities = ["create", "read", "update", "delete", "list"]
            }
            # kubernetes auth method config + roles (external-secrets + this executor)
            path "auth/kubernetes/*" {
              capabilities = ["create", "read", "update", "delete", "list"]
            }
            # jwt auth method config + roles for the network cluster (jwt-network backend)
            path "auth/jwt-network/*" {
              capabilities = ["create", "read", "update", "delete", "list"]
            }
          EOT
        }

        resource "vault_kubernetes_auth_backend_role" "openbao_config" {
          backend                          = vault_auth_backend.kubernetes.path
          role_name                        = var.k8s_auth_role
          bound_service_account_names      = [var.executor_service_account]
          bound_service_account_namespaces = [var.executor_namespace]
          token_policies                   = ["openbao-config"]
        }

        # ── network cluster: remote JWT auth (a REMOTE consumer of this OpenBao) ──────
        # The network child runs no OpenBao of its own; its external-secrets reads kv/*
        # from THIS OpenBao over the tailnet (secret.tail2c33e2.ts.net) using JWT auth.
        # OpenBao validates network SA-token signatures against the network cluster's JWKS,
        # fetched LIVE from network_jwks_url — the network kube-apiserver's OIDC discovery
        # exposed on the tailnet as svc:api-network (Task 3.1d, public .ts.net cert) — so no
        # static key copy, and a vind recreate needs no key re-extraction. jwks_url is
        # decoupled from bound_issuer: the `iss` claim stays the in-cluster issuer, while the
        # keys are fetched over the tailnet. The network cluster is always part of this setup,
        # so these resources are unconditional (SPEC §3: JWT auth, live JWKS).
        resource "vault_jwt_auth_backend" "network" {
          path         = "jwt-network"
          type         = "jwt"
          description  = "JWT auth for the network cluster's external-secrets (live JWKS over the tailnet)"
          bound_issuer = var.network_oidc_issuer
          jwks_url     = var.network_jwks_url

          # Configuring the backend writes auth/jwt-network/config — a path this very apply is
          # adding to the openbao-config executor policy. Force that policy broadening to land
          # first so the in-cluster executor (whose token re-reads the policy live) isn't 403'd.
          depends_on = [vault_policy.openbao_config]
        }

        # Read-only over kv, mirroring external-secrets. Least privilege: the network cluster
        # gets NOTHING beyond read on kv/* (SPEC Boundaries).
        resource "vault_policy" "network_read" {
          name   = "network-read"
          policy = <<-EOT
            path "kv/data/*" {
              capabilities = ["read"]
            }
            path "kv/metadata/*" {
              capabilities = ["read", "list"]
            }
          EOT
        }

        # The ONE write the network cluster gets: create/update on exactly kv/data/mongodb.
        # The network child owns MongoDB (a network workload) but has no local secret store,
        # so it self-provisions the DB's root credentials into THIS OpenBao via an ESO
        # Password generator + PushSecret (updatePolicy=IfNotExists) — generate-once-and-store
        # so kv/mongodb is the durable source of truth both the mongodb-credentials and
        # mongodb-uri ExternalSecrets read back from. Scoped to the single path so the read-only
        # posture (network-read) holds everywhere else; IfNotExists needs read too, already
        # granted by network-read.
        resource "vault_policy" "network_mongodb_write" {
          name   = "network-mongodb-write"
          policy = <<-EOT
            path "kv/data/mongodb" {
              capabilities = ["create", "update", "read"]
            }
            # ESO PushSecret also PUTs kv/metadata/mongodb (custom metadata) and reads it for
            # the IfNotExists existence check, so it needs write here too — still one path.
            path "kv/metadata/mongodb" {
              capabilities = ["create", "update", "read"]
            }
          EOT
        }

        # The login role bound to the network cluster's external-secrets ServiceAccount. ESO
        # mints a projected SA token with audience "openbao" and posts it to jwt-network;
        # OpenBao checks the signature (live JWKS over the tailnet), issuer, audience, and
        # subject, then issues a token carrying network-read.
        resource "vault_jwt_auth_backend_role" "network_eso" {
          backend         = vault_jwt_auth_backend.network.path
          role_name       = "network-eso"
          role_type       = "jwt"
          bound_audiences = ["openbao"]
          bound_subject   = "system:serviceaccount:external-secrets:external-secrets"
          user_claim      = "sub"
          token_policies  = ["network-read", "network-mongodb-write"]
          token_ttl       = 3600

          depends_on = [vault_policy.openbao_config]
        }
        # The module owns the single `vault` provider block. Steady state uses plain
        # in-cluster Kubernetes auth — the child's own ServiceAccount — like the original
        # terranetes `kubernetes` mode (SPEC §3.2). A single BOOTSTRAP escape hatch
        # (var.use_token) remains for the one-shot first apply, where the kubernetes auth
        # backend this module itself creates does not exist yet: the OpenBao bring-up
        # Workflow (Task 2.4) applies once with use_token=true and a temporary root token
        # (injected by the `vault` Provider Secret), then deletes the token and lets
        # steady-state reconciles fall back to kubernetes auth (use_token=false).
        provider "vault" {
          address = var.bao_address

          # The vault provider mints a short-lived CHILD token after auth by default; the
          # executor's kubernetes-auth login token is not granted auth/token/create, so
          # that 403s. The login/root token is already suitable, so use it directly.
          skip_child_token = true

          # Kubernetes auth (steady state). The v5 vault provider has no dedicated
          # kubernetes block, so use the generic auth_login. Gated OFF during bootstrap so
          # the provider falls back to the VAULT_TOKEN env the Provider Secret injects.
          dynamic "auth_login" {
            for_each = var.use_token ? [] : [1]
            content {
              path   = "auth/kubernetes/login"
              method = "kubernetes"
              parameters = {
                role = var.k8s_auth_role
                # `try(file(...), "")` so `tofu validate` (which eagerly evaluates this and
                # runs off-cluster where the token file is absent) does not error; the
                # provider is not configured at validate, so an empty jwt is harmless. At
                # apply the executor pod mounts the token and the real value is read.
                jwt = try(file("/var/run/secrets/kubernetes.io/serviceaccount/token"), "")
              }
            }
          }
        }
        variable "bao_address" {
          description = "OpenBao API address. Defaults to the pod's headless-service DNS (openbao-internal), which is stable for the single-node HA raft; the `openbao` active Service flaps during leader-election settle."
          type        = string
          default     = "http://openbao-0.openbao-internal.secret.svc:8200"
        }

        variable "use_token" {
          description = <<-EOT
            Auth mode for the vault provider:
              false (default, steady state) - in-cluster kubernetes auth (§3.2); the
                     executor logs in with k8s_auth_role using its ServiceAccount token.
              true  (one-shot bootstrap)    - no auth_login; the provider reads the
                     temporary root VAULT_TOKEN injected by the `vault` Provider Secret.
                     The OpenBao bring-up Workflow (Task 2.4) uses this for the FIRST apply
                     (the kubernetes auth backend does not exist yet), then deletes the
                     token; subsequent reconciles run with use_token=false.
          EOT
          type        = bool
          default     = false
        }

        variable "k8s_auth_role" {
          description = "kubernetes auth role the terraform executor logs in with (the executor's own login role, created by this module)."
          type        = string
          default     = "openbao-config"
        }

        variable "executor_service_account" {
          description = "ServiceAccount name the terraform-controller executor pod runs as; bound by the executor's kubernetes auth role."
          type        = string
          default     = "tf-executor"
        }

        variable "executor_namespace" {
          description = "Namespace the terraform-controller executor pod runs in — the child's vela-system, co-located with the child terraform-controller and its kubernetes-backend state Secret."
          type        = string
          default     = "vela-system"
        }

        # ── network cluster: remote JWT auth inputs (Task 3.1) ────────────────────────
        variable "network_oidc_issuer" {
          description = "The network cluster's OIDC issuer — the `iss` claim on its ServiceAccount tokens, and the bound_issuer for the jwt-network backend. In-cluster and stable across vind recreation."
          type        = string
          default     = "https://kubernetes.default.svc.cluster.local"
        }

        variable "network_jwks_url" {
          description = <<-EOT
            URL OpenBao fetches the network cluster's JWKS from to validate its JWTs. The
            network kube-apiserver's OIDC discovery is exposed on the tailnet as the
            `svc:api-network` Tailscale Service (Task 3.1d) with a public .ts.net cert, so
            this is a plain public HTTPS name (no custom CA). Decoupled from bound_issuer:
            the `iss` claim stays the in-cluster issuer; only the key-fetch is over the tailnet.
          EOT
          type        = string
          default     = "https://api-network.tail2c33e2.ts.net/openid/v1/jwks"
        }
        # Provider pins for the openbao-config module. Source of truth for the inline HCL
        # that `moon run secret:generate` embeds into ../component/openbao-config.yaml.
        #
        # No `backend {}` block: terraform-controller injects a kubernetes-backend Secret
        # (tfstate-<workspace>-openbao-config, inside the child that runs the Configuration)
        # with Lease locking. A committed backend would collide with the injected one.
        #
        # No `null` provider anymore: the old terranetes trick injected a provider block
        # from the referenced Provider CR (hence a throwaway `null`). KubeVela's
        # terraform-controller with a `custom` Provider injects ENV VARS only (VAULT_ADDR,
        # VAULT_TOKEN during bootstrap) — it does NOT inject a provider block — so this
        # module owns its single `provider "vault"` block with no duplication (SPEC §3.3).
        terraform {
          required_version = ">= 1.10.0"

          required_providers {
            # OpenBao is API-compatible with HashiCorp Vault; there is no OpenBao-native
            # provider, so the hashicorp/vault provider manages it. Pinned exactly.
            vault = {
              source  = "hashicorp/vault"
              version = "5.10.1"
            }
          }
        }
      providerRef:
        name: vault
        namespace: default
  workload:
    definition:
      apiVersion: terraform.core.oam.dev/v1beta2
      kind: Configuration
