# vault-secrets-operator: read dynamic credentials AND manage their leases.
#
# This is the policy that makes LEASED dynamic secrets possible at all. ESO's policy
# (policy-external-secrets.yaml) grants only `read` on the engine paths, which is all it can use —
# it holds no lease and in fact destroys the ones it creates by revoking its own auth token after
# every read. VSO instead keeps the lease alive, so it needs the lease endpoints too.
#
# Why each grant exists:
#   cloudflare/token/*   mint a token. Read-only, and NOTHING under cloudflare/config/* — a
#                        consumer may obtain a credential but must never redefine what a role
#                        grants (role write is at least as powerful as the parent credential).
#   netbird/pat/*        same, for when the netbird engine's roles are switched to leased. Granted
#                        now so the migration is a role flip rather than a policy change.
#   sys/leases/renew     extend a lease before it expires (VSO renews at ~67% of its duration).
#                        Without this VSO must discard the credential and mint a replacement every
#                        cycle, which defeats the point of leasing.
#   sys/leases/revoke    hand the credential back when the VaultDynamicSecret is deleted, so the
#                        token disappears upstream immediately instead of lingering to its TTL.
#   sys/leases/lookup    read a lease's remaining TTL to decide when to renew.
#
# NOTE on blast radius: OpenBao's ACLs do not scope the lease endpoints per-lease, so these three
# grants let VSO renew or revoke ANY lease whose id it knows. It only ever knows its own, but the
# capability is account-wide — worth remembering before widening who can assume this role.
apiVersion: vault.vault.upbound.io/v1alpha1
kind: Policy
metadata:
  name: vault-secrets-operator
spec:
  deletionPolicy: Orphan
  providerConfigRef:
    name: openbao
  forProvider:
    name: vault-secrets-operator
    policy: |
      # Mint Cloudflare API tokens (one role per consumer).
      path "cloudflare/token/*" {
        capabilities = ["read"]
      }
      # Mint NetBird credentials. Unused until the netbird engine's roles go leased, but granted
      # up front so that switch needs no policy change.
      path "netbird/pat/*" {
        capabilities = ["read"]
      }
      path "netbird/setup-key/*" {
        capabilities = ["read"]
      }
      # Lease lifecycle. This is the whole difference from the external-secrets policy.
      path "sys/leases/renew" {
        capabilities = ["update"]
      }
      path "sys/leases/revoke" {
        capabilities = ["update"]
      }
      path "sys/leases/lookup" {
        capabilities = ["update"]
      }
