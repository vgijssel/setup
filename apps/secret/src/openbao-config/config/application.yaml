# P2.3 — instantiates the generated `openbao-config` ComponentDefinition
# (../component/openbao-config.yaml) as a terraform-controller Configuration and
# dispatches it into the `secret` child via `topology -> secret` (SPEC §3.2/§5).
#
# The component type `openbao-config` must be registered in the root
# (`vela def apply ../component/openbao-config.yaml`) before this Application
# renders. The module's inline HCL carries `providerRef: vault`, so the executor
# gets VAULT_ADDR (+ the bootstrap temp token) from the `vault` Provider's Secret.
#
# Variables are omitted here — every module variable has an in-cluster default
# (bao_address, k8s_auth_role, executor_service_account, executor_namespace). Set
# them under `properties` only to override for a non-default child.
#
# NOTE (Task 2.4): this Application is APPLIED ONCE by the OpenBao bring-up Workflow
# after OpenBao is initialised and its kubernetes auth backend + executor login role
# are seeded with the temporary root token. It is not part of the always-on platform
# dispatch (application-secret-platform.yaml).
apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: openbao-config
  namespace: vela-system
spec:
  components:
    - name: openbao-config
      type: openbao-config
      properties:
        # Where terraform-controller writes the OpenTofu outputs (none sensitive
        # here) — keep the connection secret in the child alongside the executor.
        writeConnectionSecretToRef:
          name: openbao-config-outputs
          namespace: secret
  policies:
    - name: to-secret
      type: topology
      properties:
        clusters: [secret]
