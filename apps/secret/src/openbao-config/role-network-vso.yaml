# network cluster Vault Secrets Operator JWT login role.
#
# OpenBao cannot reach the network cluster's API server to review a ServiceAccount token, so VSO
# there mints a projected SA token with audience "openbao" and posts it to the jwt-network
# backend; OpenBao checks signature (against that cluster's live JWKS), issuer, audience and
# subject. Same mechanism as role-network-eso.yaml, which is the ESO equivalent.
#
# ── WHY tokenPeriod AND NOT tokenTtl ────────────────────────────────────────────────────────
# This is the single most important line here. A secret lease is a CHILD of the auth token that
# created it, so when this login token dies, every lease VSO holds is revoked and the upstream
# credential deleted. role-network-eso.yaml uses `tokenTtl: 3600`, which is harmless only because
# ESO holds no leases (it revokes its own token immediately anyway). Giving VSO a 1h hard TTL
# would destroy every dynamic credential on this cluster once an hour.
#
# A PERIODIC token renews indefinitely in 24h increments and never hits a max_ttl wall, so the
# ceiling on a credential's life is its own lease, not VSO's session.
#
# ── SUBJECT ─────────────────────────────────────────────────────────────────────────────────
# boundSubject names the ServiceAccount VSO sends a token for. Per the VaultAuth CRD that SA
# "must reside in the consuming secret's namespace", so there is one per consuming namespace and
# each needs its own role — a single boundSubject cannot cover several. This role serves
# external-dns only; cert-manager on this cluster stays on ESO (reading the unleased
# `cert-manager-network` role) until it gets a VaultAuth and role of its own.
apiVersion: jwt.vault.upbound.io/v1alpha1
kind: AuthBackendRole
metadata:
  name: network-vso
spec:
  deletionPolicy: Orphan
  providerConfigRef:
    name: openbao
  forProvider:
    backend: jwt-network
    roleName: network-vso
    roleType: jwt
    boundAudiences:
      - openbao
    boundSubject: system:serviceaccount:external-dns:vault-secrets-operator
    userClaim: sub
    tokenPolicies:
      - vault-secrets-operator
    # Periodic — renewable forever, never hard-expires. See the header.
    tokenPeriod: 86400
