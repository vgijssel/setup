# network cluster Vault Secrets Operator JWT login role.
#
# OpenBao cannot reach the network cluster's API server to review a ServiceAccount token, so VSO
# there mints a projected SA token with audience "openbao" and posts it to the jwt-network
# backend; OpenBao checks signature (against that cluster's live JWKS), issuer, audience and
# subject. Same mechanism as role-network-eso.yaml, which is the ESO equivalent.
#
# ── WHY tokenPeriod AND NOT tokenTtl ────────────────────────────────────────────────────────
# This is the single most important line here. A secret lease is a CHILD of the auth token that
# created it, so when this login token dies, every lease VSO holds is revoked and the upstream
# credential deleted. role-network-eso.yaml uses `tokenTtl: 3600`, which is harmless only because
# ESO holds no leases (it revokes its own token immediately anyway). Giving VSO a 1h hard TTL
# would destroy every dynamic credential on this cluster once an hour.
#
# A PERIODIC token renews indefinitely in 24h increments and never hits a max_ttl wall, so the
# ceiling on a credential's life is its own lease, not VSO's session.
#
# ── SUBJECT ─────────────────────────────────────────────────────────────────────────────────
# Per the VaultAuth CRD the login SA "must reside in the consuming secret's namespace", so every
# consuming namespace has its own `vault-secrets-operator` ServiceAccount. boundSubject takes a
# single value, so this role uses boundClaims to match the `sub` claim against all of them at
# once — see the field below.
#
# ⚠ ONE-TIME MANUAL STEP IF THIS ROLE EVER HAD boundSubject SET. Removing the field from this
# spec does NOT clear it: server-side apply drops an empty string, so Fleet's desired state simply
# omits the field and both the Crossplane object and OpenBao keep the old value. The symptom is
# brutally misleading — the ONE namespace that was in boundSubject keeps working while every other
# fails login with "error validating token: invalid subject (sub) claim", which reads like a
# boundClaims problem. Clear it by hand, once:
#
#   kubectl patch authbackendroles.jwt.vault.upbound.io network-vso --type=json \
#     -p '[{"op":"remove","path":"/spec/forProvider/boundSubject"}]'
#   # then, inside openbao-0:
#   bao write auth/jwt-network/role/network-vso bound_subject="" <all other fields...>
apiVersion: jwt.vault.upbound.io/v1alpha1
kind: AuthBackendRole
metadata:
  name: network-vso
spec:
  deletionPolicy: Orphan
  providerConfigRef:
    name: openbao
  forProvider:
    backend: jwt-network
    roleName: network-vso
    roleType: jwt
    boundAudiences:
      - openbao
    # boundSubject takes ONE value, which would mean one role (and one VaultAuth) per consuming
    # namespace. boundClaims accepts a COMMA-SEPARATED list for the same `sub` claim, so one role
    # and one default VaultAuth serve every namespace on this cluster — matching what the secret
    # cluster gets for free from boundServiceAccountNamespaces.
    #
    # Each namespace needs a ServiceAccount named `vault-secrets-operator`, created next to its
    # VaultStaticSecret/VaultDynamicSecret, because the login SA must reside in the CONSUMING
    # namespace (VaultAuth CRD).
    # NO boundSubject. It is absent on purpose — see the warning below about clearing it.
    boundClaims:
      sub: system:serviceaccount:external-dns:vault-secrets-operator,system:serviceaccount:cert-manager:vault-secrets-operator,system:serviceaccount:crossplane-system:vault-secrets-operator,system:serviceaccount:netbird:vault-secrets-operator,system:serviceaccount:netdata:vault-secrets-operator,system:serviceaccount:omada:vault-secrets-operator
    userClaim: sub
    tokenPolicies:
      - vault-secrets-operator
    # Periodic — renewable forever, never hard-expires. See the header.
    tokenPeriod: 86400
