# The kubernetes auth method config. DUPLICATED from the OpenBao self-init
# `configure_k8s_auth` request in apps/secret/src/openbao/values.yaml — keep in sync.
# self-init seeds it at first boot; this MR owns/reconciles it. In-cluster OpenBao reviews
# SA tokens with its own ServiceAccount (chart authDelegator → system:auth-delegator) and
# auto-reads the cluster CA + reviewer JWT from its pod, so kubernetesHost is all that is
# required.
apiVersion: kubernetes.vault.upbound.io/v1alpha1
kind: AuthBackendConfig
metadata:
  name: kubernetes
spec:
  deletionPolicy: Orphan
  providerConfigRef:
    name: openbao
  forProvider:
    backend: kubernetes
    kubernetesHost: https://kubernetes.default.svc:443
