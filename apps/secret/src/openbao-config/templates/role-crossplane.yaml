# The `crossplane` kubernetes-auth login role — binds both Crossplane provider pods
# (provider-vault and provider-opentofu in crossplane-system) to the `crossplane` policy.
# provider-opentofu needs OpenBao access for the plugin-netbird Workspace (vault backend
# for its state). MIRRORS the self-init `create_crossplane_role` in values.yaml, but
# self-init only seeds provider-vault (enough to bootstrap); this MR reconciles the full
# binding. deletionPolicy: Orphan so removing this MR never deletes the role.
apiVersion: kubernetes.vault.upbound.io/v1alpha1
kind: AuthBackendRole
metadata:
  name: crossplane
spec:
  deletionPolicy: Orphan
  providerConfigRef:
    name: openbao
  forProvider:
    backend: kubernetes
    roleName: crossplane
    boundServiceAccountNames:
      - provider-vault
      - provider-opentofu
    boundServiceAccountNamespaces:
      - crossplane-system
    tokenPolicies:
      - crossplane
