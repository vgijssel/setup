# The break-glass `admin` kubernetes-auth login role used by `moon run secret:get_openbao_auth`.
# Crossplane-OWNED (NOT in self-init): once Crossplane can authenticate it provisions the
# administrator path itself. Binds the `openbao-admin` ServiceAccount (ns secret,
# `src/config/serviceaccount-openbao-admin.yaml`) to the `admin` policy, capping issued
# tokens at 1 h (tokenTtl/tokenMaxTtl = 3600 s).
#
# Only a kubectl administrator can mint the `openbao-admin` SA token, and a Kubernetes administrator already has
# full cluster access—so this grants nothing beyond kubectl administrator; the 1 h TTL bounds a
# leaked token. `deletionPolicy: Orphan`.
apiVersion: kubernetes.vault.upbound.io/v1alpha1
kind: AuthBackendRole
metadata:
  name: admin
spec:
  deletionPolicy: Orphan
  providerConfigRef:
    name: openbao
  forProvider:
    backend: kubernetes
    roleName: admin
    boundServiceAccountNames:
      - openbao-admin
    boundServiceAccountNamespaces:
      - secret
    tokenPolicies:
      - admin
    tokenTtl: 3600
    tokenMaxTtl: 3600
