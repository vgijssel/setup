# network cluster JWT auth backend. Crossplane replacement for
# vault_jwt_auth_backend.network (main.tf). The network cluster runs no OpenBao of its own; its
# Vault Secrets Operator reads kv/* from THIS OpenBao using JWT auth. OpenBao validates network
# SA-token signatures against the network cluster's JWKS, fetched LIVE from jwksUrl.
#
# jwksUrl is now **HTTPS to the published mesh hostname** `jwks-network.vpn.blueora.ng`, which the
# network cluster exposes as its own mesh peer (apps/network/src/mesh-jwks). OpenBao is not and
# must not be a mesh client, so it reaches that name through the raw-TCP forwarder in
# apps/secret/src/jwks-gateway/: a CoreDNS override maps the hostname to the forwarder's pinned
# ClusterIP inside this cluster, and the forwarder relays bytes — it does not terminate TLS.
#
# SO THE TLS IS END-TO-END AND FULLY VALIDATED, which is the upgrade over what this backend used
# to do. The previous arrangement had to run this leg as plain `http://` to the gateway's own
# in-cluster name, because the relay could not preserve the hostname the certificate was issued
# for. Now the handshake completes against the publishing peer's Envoy with the correct SNI and
# its publicly-trusted certificate, so there is still **no jwksCaPem and no skipped verification**
# — this time because none is needed, not because the hop was unverified.
#
# jwksUrl stays decoupled from boundIssuer: the `iss` claim is the network cluster's in-cluster
# issuer, while the keys come from the mesh URL.
#
# PARITY-CRITICAL for the network cluster — only the JWKS transport changed (tailnet → NetBird
# NBResource → published mesh peer over HTTPS); keys, issuer, and adoption stay identical.
#
# This reconciles only when the network cluster is reachable over the mesh, so on a cold start the
# secret cluster must come up first and this MR error-and-retries until mesh-jwks is serving.
apiVersion: jwt.vault.upbound.io/v1alpha1
kind: AuthBackend
metadata:
  name: jwt-network
  # Adopt the existing OpenBao auth path instead of re-enabling it. Without this,
  # provider-vault tries to CREATE the backend and OpenBao rejects it with
  # "path is already in use at jwt-network/" (same class as the kubernetes-auth
  # mount adoption documented in apps/secret/CLAUDE.md). The external-name for a
  # vault_jwt_auth_backend is its mount path.
  annotations:
    crossplane.io/external-name: jwt-network
spec:
  deletionPolicy: Orphan
  providerConfigRef:
    name: openbao
  forProvider:
    path: jwt-network
    type: jwt
    description: JWT auth for the network cluster's Vault Secrets Operator (live JWKS over the mesh)
    boundIssuer: https://kubernetes.default.svc.cluster.local
    jwksUrl: https://jwks-network.vpn.blueora.ng/openid/v1/jwks
