# kv v2 secret engine — the engine external-secrets reads cloudflare/netbird/
# netdata from. Crossplane replacement for the terranetes `vault_mount.kv` resource
# (main.tf). Mounts at kv/; version "2" matches the ClusterSecretStore's version: v2.
#
# deletionPolicy: Orphan mirrors the terranetes orphan protection — deleting this MR
# must NEVER destroy the OpenBao mount/data (treat OpenBao raft state as durable).
#
# crossplane.io/external-name: kv makes provider-vault ADOPT an existing kv/ mount
# instead of trying to re-create it — creating a mount at a path already in use errors
# "path is already in use". This matters whenever the MR is re-created against a live
# OpenBao that already has the mount (e.g. after an Orphan delete, or a Fleet
# re-selection following a cluster-label flip). Same adoption pattern as
# authbackend-kubernetes.yaml / authbackend-jwt-network.yaml.
apiVersion: vault.vault.upbound.io/v1alpha1
kind: Mount
metadata:
  name: kv
  annotations:
    crossplane.io/external-name: kv
spec:
  deletionPolicy: Orphan
  providerConfigRef:
    name: openbao
  forProvider:
    path: kv
    type: kv
    options:
      version: "2"
    description: kv v2 engine external-secrets reads cloudflare/netbird/netdata from
