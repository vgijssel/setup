# The kubernetes auth METHOD mount. DUPLICATED from the OpenBao self-init `enable_k8s_auth`
# request in apps/secret/src/openbao/values.yaml — keep in sync. self-init enables it at
# first boot (Crossplane logs in through it, so it must exist before Crossplane runs);
# this MR then OWNS/reconciles it.
#
# crossplane.io/external-name: kubernetes makes provider-vault ADOPT the existing mount
# (observe, not create) — enabling an already-enabled auth path errors "path already in
# use", so adoption is required. deletionPolicy: Orphan so removing this MR never disables
# the auth method Crossplane itself logs in through.
apiVersion: auth.vault.upbound.io/v1alpha1
kind: Backend
metadata:
  name: kubernetes
  annotations:
    crossplane.io/external-name: kubernetes
spec:
  deletionPolicy: Orphan
  providerConfigRef:
    name: openbao
  forProvider:
    type: kubernetes
    path: kubernetes
