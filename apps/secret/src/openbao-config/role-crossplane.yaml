# The `crossplane` kubernetes-auth login role — binds the provider-vault pod's stable
# ServiceAccount (provider-vault in crossplane-system) to the `crossplane` policy.
# DUPLICATED from the OpenBao self-init `create_crossplane_role` request in
# apps/secret/src/openbao/values.yaml — keep in sync. self-init seeds it (so Crossplane
# can log in on first boot); this MR then owns/reconciles it. References the kubernetes
# auth backend by path string. deletionPolicy: Orphan so removing this MR never deletes
# the role Crossplane logs in with.
apiVersion: kubernetes.vault.upbound.io/v1alpha1
kind: AuthBackendRole
metadata:
  name: crossplane
spec:
  deletionPolicy: Orphan
  providerConfigRef:
    name: openbao
  forProvider:
    backend: kubernetes
    roleName: crossplane
    boundServiceAccountNames:
      - provider-vault
    boundServiceAccountNamespaces:
      - crossplane-system
    tokenPolicies:
      - crossplane
