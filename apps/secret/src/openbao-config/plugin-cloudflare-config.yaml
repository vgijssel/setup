# Configures the Cloudflare secrets engine: the PARENT credential plus one role per consumer.
# The engine itself (catalog registration + mount) is plugin-cloudflare.yaml.
#
# Split from that file because this half needs a credential and that half does not. On a cold
# start kv is empty (OpenBao's raft dies with the vind cluster), so the ExternalSecret this reads
# cannot sync until a human re-seeds kv/cloudflare — at which point this Workspace reconciles on
# its own. Registration and mount stay independent of that. Same shape, and the same cold-start
# requirement, as netbird-plugin-config.
#
# ── ONE ROLE PER CONSUMER ────────────────────────────────────────────────────────────────────
# Each consumer reads its own role path, so each holds a separately-scoped, separately-revocable
# token. A leak or a misbehaving consumer is contained to one role; revoking one does not touch
# the other. Note the ROLE is a template, not a credential: every read of
# `cloudflare/token/<role>` mints a NEW token, so two clusters reading one role still get
# distinct tokens.
#
#   cert-manager   DNS Write only. Solves DNS-01 by writing a temporary
#                  _acme-challenge TXT record, and needs nothing else.
#   external-dns   DNS Write + Zone Read. It enumerates zones at startup; that call is what
#                  failed with 9109 for 393 restarts when the old static token went invalid.
#
# Both roles cover BOTH zones because both consumers manage records in both. Scoping is by zone
# id, which is globally unique — so one user-scoped engine spans the two accounts without either
# role naming an account. Verified live: a token from this role shape wrote and deleted an
# _acme-challenge TXT in blueora.ng AND vgijssel.nl, and was refused on a zone not listed.
#
# ── LEASES: PER-ROLE, FOLLOWING THE CONSUMER ────────────────────────────────────────────────
# The engine attaches a renewable OpenBao lease by default, which revokes the token upstream when
# the lease ends. Whether a role can use that depends entirely on which operator reads it:
#
#   cert-manager          LEASED. Read by Vault Secrets Operator on the SECRET cluster
#                         (apps/secret/src/config/vaultdynamicsecret-cloudflare-api-token.yaml),
#                         which renews the lease, reissues on revoke/expire, revokes on teardown.
#   cert-manager-network  UNLEASED. Same permissions, read by ESO on the NETWORK cluster, which
#                         cannot hold a lease. A SEPARATE role rather than sharing the one above:
#                         a role is read by both clusters, so flipping the shared one to leased
#                         would have handed the network cluster a token that is destroyed seconds
#                         later. Delete this role when that cluster moves to VSO.
#   external-dns          UNLEASED. Read by ESO on the network cluster.
#
# ESO CANNOT hold a lease: an OpenBao secret lease is a child of the auth token that created it,
# and ESO calls RevokeSelf after every read (its own fix for leaking token leases,
# external-secrets#376). The cascade deletes the token seconds after it lands in the Secret —
# measured exactly that, with zero leases and zero tokens left in Cloudflare. ESO has no lease
# management at all and the upstream issue (external-secrets#2198) was closed unfixed. For an
# unleased role Cloudflare's own expires_on is the only bound, which is why ttl == max_ttl there
# rather than leaving renewal headroom.
#
# Drop the remaining manage_lease line when external-dns moves to VSO on the network cluster.
#
# ── TTL AND ROTATION ────────────────────────────────────────────────────────────────────────
# ttl == max_ttl == 48h, and the consuming ExternalSecrets refresh every 24h. So each token
# lives 48h, a fresh one arrives every 24h, and the two OVERLAP by 24h. The overlap is the point:
# the outgoing token stays valid long after the incoming one lands, so a consumer that has not
# yet reloaded is never holding a dead credential. Setting ttl to 24h instead would revoke the
# old token at the exact moment the new one appears, turning every rotation into a race.
#
# max_ttl also sets Cloudflare's own `expires_on`, so a token whose lease OpenBao somehow loses
# (storage restored from a snapshot, mount deleted) still dies by itself within 48h.
#
# ── SECURITY ────────────────────────────────────────────────────────────────────────────────
# Write access to these role paths is at least as powerful as the parent credential: verified
# live that Cloudflare does NOT cap a minted token to a subset of its parent, so whoever can
# write a role can mint anything the parent's accounts permit. The `crossplane` policy grants
# cloudflare/config/* and deliberately nothing under cloudflare/token/*; the consumers' policies
# grant the reverse.
#
# State lives in the shared kubernetes backend (keyed per-workspace).
apiVersion: opentofu.upbound.io/v1beta1
kind: Workspace
metadata:
  name: cloudflare-plugin-config
spec:
  forProvider:
    source: Inline
    env:
      - name: TF_VAR_cloudflare_api_token
        secretKeyRef:
          namespace: crossplane-system
          name: cloudflare-admin-token
          key: credential
    vars:
      # Non-secret zone ids, recorded here as the single source of truth for which zones this
      # repo manages. blueora.ng is in Maarten@vgijssel.nl's Account, vgijssel.nl in
      # Piet@vgijssel.nl's Account.
      - key: zone_blueora_ng
        value: b763644969bac446062ef24eef5565f0
      - key: zone_vgijssel_nl
        value: 8e5a9db0a62108e5fff87072dbb939d0
    module: |
      terraform {
        required_providers {
          vault = {
            source  = "hashicorp/vault"
            version = "4.6.0"
          }
        }
      }

      variable "cloudflare_api_token" {
        type      = string
        sensitive = true
      }

      variable "zone_blueora_ng" {
        type = string
      }

      variable "zone_vgijssel_nl" {
        type = string
      }

      locals {
        # Both consumers manage records in both zones.
        all_zones = [var.zone_blueora_ng, var.zone_vgijssel_nl]
      }

      provider "vault" {
        address         = "http://openbao.secret.svc:8200"
        skip_child_token = true
        auth_login {
          path = "auth/kubernetes/login"
          parameters = {
            role = "crossplane"
            jwt  = file("/var/run/secrets/kubernetes.io/serviceaccount/token")
          }
        }
      }

      # The parent credential. token_scope=user is REQUIRED (not inferred): a user token is the
      # only kind that can mint for zones in more than one account, and account_id must be
      # omitted entirely in this scope.
      resource "vault_generic_endpoint" "cloudflare_root_config" {
        path                 = "cloudflare/config/root"
        disable_read         = true
        disable_delete       = true
        ignore_absent_fields = true
        data_json = jsonencode({
          token_scope = "user"
          api_token   = var.cloudflare_api_token
        })
      }

      # cert-manager: DNS-01 only, so DNS Write and nothing more.
      resource "vault_generic_endpoint" "token_role_cert_manager" {
        depends_on           = [vault_generic_endpoint.cloudflare_root_config]
        path                 = "cloudflare/config/token/cert-manager"
        disable_read         = true
        disable_delete       = true
        ignore_absent_fields = true
        data_json = jsonencode({
          token_name_prefix = "openbao-cert-manager"
          permissions       = ["DNS Write"]
          zone_ids          = local.all_zones
          # LEASED: this role's consumer is Vault Secrets Operator on the secret cluster, which
          # renews the lease and reissues if it is revoked. ttl is the lease duration and max_ttl
          # the renewal ceiling AND Cloudflare's expires_on, so VSO can keep one token alive for
          # up to 48h and the token dies by itself at 48h even if OpenBao forgets it.
          #
          ttl               = "24h"
          max_ttl           = "48h"
          manage_lease      = true
        })
      }

      # Same grants as cert-manager, but UNLEASED, for the network cluster's cert-manager while it
      # is still on ESO. Exists only because a role is global: both clusters read the same path,
      # so the leased role above cannot also serve a consumer that destroys its own leases.
      # DELETE this once the network cluster moves to VSO.
      resource "vault_generic_endpoint" "token_role_cert_manager_network" {
        depends_on           = [vault_generic_endpoint.cloudflare_root_config]
        path                 = "cloudflare/config/token/cert-manager-network"
        disable_read         = true
        disable_delete       = true
        ignore_absent_fields = true
        data_json = jsonencode({
          token_name_prefix = "openbao-cert-manager-network"
          permissions       = ["DNS Write"]
          zone_ids          = local.all_zones
          ttl               = "48h"
          max_ttl           = "48h"
          manage_lease      = false # ESO cannot hold a lease -- see the header
        })
      }

      # external-dns additionally enumerates zones at startup, hence Zone Read.
      resource "vault_generic_endpoint" "token_role_external_dns" {
        depends_on           = [vault_generic_endpoint.cloudflare_root_config]
        path                 = "cloudflare/config/token/external-dns"
        disable_read         = true
        disable_delete       = true
        ignore_absent_fields = true
        data_json = jsonencode({
          token_name_prefix = "openbao-external-dns"
          permissions       = ["DNS Write", "Zone Read"]
          zone_ids          = local.all_zones
          ttl               = "48h"
          max_ttl           = "48h"
          manage_lease      = false # ESO cannot hold a lease -- see the header
        })
      }
  providerConfigRef:
    name: default
