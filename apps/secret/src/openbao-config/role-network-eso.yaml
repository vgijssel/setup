# network cluster external-secrets JWT login role. Crossplane replacement for
# vault_jwt_auth_backend_role.network_eso (main.tf). The network ESO mints a
# projected SA token with audience "openbao" and posts it to jwt-network; OpenBao
# checks signature (live JWKS), issuer, audience, and subject, then issues a token
# carrying network-read. PARITY-CRITICAL for the network cluster.
apiVersion: jwt.vault.upbound.io/v1alpha1
kind: AuthBackendRole
metadata:
  name: network-eso
spec:
  deletionPolicy: Orphan
  providerConfigRef:
    name: openbao
  forProvider:
    backend: jwt-network
    roleName: network-eso
    roleType: jwt
    boundAudiences:
      - openbao
    boundSubject: system:serviceaccount:external-secrets:external-secrets
    userClaim: sub
    tokenPolicies:
      - network-read
    tokenTtl: 3600
