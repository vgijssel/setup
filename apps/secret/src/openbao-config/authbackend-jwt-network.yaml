# network cluster JWT auth backend. Crossplane replacement for
# vault_jwt_auth_backend.network (main.tf). The network cluster runs no OpenBao of
# its own; its external-secrets read kv/* from THIS OpenBao using JWT auth. OpenBao
# validates network SA-token signatures against the network cluster's JWKS, fetched LIVE
# from jwksUrl — now the in-cluster JWKS gateway (apps/secret/src/jwks-gateway/), which
# re-serves the network cluster's jwks-mirror over the NetBird mesh on a plain ClusterIP.
# OpenBao reaches it via ordinary cluster DNS; the gateway's netbird sidecar relays over
# NetBird to the network cluster. jwksUrl is decoupled from boundIssuer: the `iss` claim
# stays the in-cluster issuer while keys come from the gateway URL. Plain HTTP (no
# jwksCaPem): the mirror serves public, signed JWKS and the NetBird overlay encrypts the
# cross-cluster hop. Replaces the retired Tailscale api-network ProxyGroup URL
# (https://api-network.tail2c33e2.ts.net/openid/v1/jwks).
#
# PARITY-CRITICAL for the network cluster — only the JWKS transport (Tailscale → NetBird)
# changed; keys, issuer, and adoption stay identical.
apiVersion: jwt.vault.upbound.io/v1alpha1
kind: AuthBackend
metadata:
  name: jwt-network
  # Adopt the existing OpenBao auth path instead of re-enabling it. Without this,
  # provider-vault tries to CREATE the backend and OpenBao rejects it with
  # "path is already in use at jwt-network/" (same class as the kubernetes-auth
  # mount adoption documented in apps/secret/CLAUDE.md). The external-name for a
  # vault_jwt_auth_backend is its mount path.
  annotations:
    crossplane.io/external-name: jwt-network
spec:
  deletionPolicy: Orphan
  providerConfigRef:
    name: openbao
  forProvider:
    path: jwt-network
    type: jwt
    description: JWT auth for the network cluster's external-secrets (live JWKS over NetBird)
    boundIssuer: https://kubernetes.default.svc.cluster.local
    jwksUrl: http://jwks-gateway.netbird.svc.cluster.local/openid/v1/jwks
