# network cluster JWT auth backend. Crossplane replacement for
# vault_jwt_auth_backend.network (main.tf). The network cluster runs no OpenBao of
# its own; its external-secrets read kv/* from THIS OpenBao
# over the tailnet using JWT auth. OpenBao validates network SA-token signatures
# against the network cluster's JWKS, fetched LIVE from jwksUrl — the network cluster's
# kube-apiserver ProxyGroup on the tailnet (svc:api-network), which serves a
# Tailscale-provisioned publicly-trusted *.ts.net cert (no cert-manager/Cloudflare dep).
# jwksUrl is decoupled from boundIssuer: the `iss` claim stays the in-cluster issuer
# while keys come from the tailnet URL. jwksCaPem omitted (endpoint presents a
# publicly-trusted cert). The host MUST match the ProxyGroup service name api-network
# (apps/network/src/tailscale-proxygroup/proxygroup-apiserver.yaml).
#
# PARITY-CRITICAL for the network cluster — keep byte-for-behaviour identical.
apiVersion: jwt.vault.upbound.io/v1alpha1
kind: AuthBackend
metadata:
  name: jwt-network
  # Adopt the existing OpenBao auth path instead of re-enabling it. Without this,
  # provider-vault tries to CREATE the backend and OpenBao rejects it with
  # "path is already in use at jwt-network/" (same class as the kubernetes-auth
  # mount adoption documented in apps/secret/CLAUDE.md). The external-name for a
  # vault_jwt_auth_backend is its mount path.
  annotations:
    crossplane.io/external-name: jwt-network
spec:
  deletionPolicy: Orphan
  providerConfigRef:
    name: openbao
  forProvider:
    path: jwt-network
    type: jwt
    description: JWT auth for the network cluster's external-secrets (live JWKS over the tailnet)
    boundIssuer: https://kubernetes.default.svc.cluster.local
    jwksUrl: https://api-network.tail2c33e2.ts.net/openid/v1/jwks
