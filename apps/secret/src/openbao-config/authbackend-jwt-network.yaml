# network cluster JWT auth backend. Crossplane replacement for
# vault_jwt_auth_backend.network (main.tf). The network cluster runs no OpenBao of
# its own; its external-secrets (and terranetes runner) read kv/* from THIS OpenBao
# over the tailnet using JWT auth. OpenBao validates network SA-token signatures
# against the network cluster's JWKS, fetched LIVE from jwksUrl (the network
# apiserver reverse-proxy on the tailnet, valid public LE cert) — no static key copy.
# jwksUrl is decoupled from boundIssuer: the `iss` claim stays the in-cluster issuer
# while keys come from the tailnet URL. Values are the terranetes variables.tf
# defaults. jwksCaPem omitted (endpoint presents a publicly-trusted cert).
#
# PARITY-CRITICAL for the network cluster — keep byte-for-behaviour identical.
apiVersion: jwt.vault.upbound.io/v1alpha1
kind: AuthBackend
metadata:
  name: jwt-network
spec:
  deletionPolicy: Orphan
  providerConfigRef:
    name: openbao
  forProvider:
    path: jwt-network
    type: jwt
    description: JWT auth for the network cluster's external-secrets (live JWKS over the tailnet)
    boundIssuer: https://kubernetes.default.svc.cluster.local
    jwksUrl: https://api.network.vgijssel.nl/openid/v1/jwks
