# external-secrets kubernetes-auth login role. Crossplane replacement for
# vault_kubernetes_auth_backend_role.external_secrets (main.tf). References the
# kubernetes auth backend created by OpenBao self-init by its path string
# (backend: kubernetes) — no Crossplane-managed Backend needed for the foothold.
apiVersion: kubernetes.vault.upbound.io/v1alpha1
kind: AuthBackendRole
metadata:
  name: external-secrets
spec:
  deletionPolicy: Orphan
  providerConfigRef:
    name: openbao
  forProvider:
    backend: kubernetes
    roleName: external-secrets
    boundServiceAccountNames:
      - external-secrets
    boundServiceAccountNamespaces:
      - external-secrets
    tokenPolicies:
      - external-secrets
