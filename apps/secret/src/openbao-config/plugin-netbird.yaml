# Declaratively register the openbao-plugin-secrets-netbird binary in the plugin
# catalog AND write the root configuration (api_url + service account token).
# Uses provider-opentofu Workspace with inline HCL since provider-vault has no
# native plugin-catalog resource type.
#
# The SHA256 is pinned to the binary at the SAME image tag as the init-container
# in src/openbao/values.yaml — update both together on each release. Compute with:
#   docker run --rm --platform linux/amd64 <image> sha256sum /openbao-plugin-secrets-netbird
#
# The root config service_account_token comes from kv/netbird (one manually-seeded
# admin token that bootstraps all dynamic credential generation). Synced into
# crossplane-system by externalsecret-netbird-admin-token.yaml.
# State lives in the shared kubernetes backend (keyed per-workspace).
apiVersion: opentofu.upbound.io/v1beta1
kind: Workspace
metadata:
  name: netbird-plugin-config
spec:
  forProvider:
    source: Inline
    env:
      - name: TF_VAR_netbird_service_account_token
        secretKeyRef:
          namespace: crossplane-system
          name: netbird-admin-token
          key: service_account_token
    vars:
      - key: plugin_sha256
        value: 900d8b94b939c8791159b412b0d95c4913c624d5dd3499883d177a9ad3275d74
      - key: netbird_api_url
        value: https://api.netbird.io
      - key: netbird_service_user_id
        value: 0e1cdcd0-1cdc-478a-9ed1-fe4fb07b4090
    module: |
      terraform {
        required_providers {
          vault = {
            source  = "hashicorp/vault"
            version = "4.6.0"
          }
        }
      }

      variable "plugin_sha256" {
        type = string
      }

      variable "netbird_api_url" {
        type = string
      }

      variable "netbird_service_account_token" {
        type      = string
        sensitive = true
      }

      variable "netbird_service_user_id" {
        type = string
      }

      provider "vault" {
        address         = "http://openbao.secret.svc:8200"
        skip_child_token = true
        auth_login {
          path = "auth/kubernetes/login"
          parameters = {
            role = "crossplane"
            jwt  = file("/var/run/secrets/kubernetes.io/serviceaccount/token")
          }
        }
      }

      resource "vault_generic_endpoint" "plugin_register" {
        path                 = "sys/plugins/catalog/secret/openbao-plugin-secrets-netbird"
        disable_read         = true
        disable_delete       = true
        ignore_absent_fields = true
        data_json = jsonencode({
          sha256  = var.plugin_sha256
          command = "openbao-plugin-secrets-netbird"
        })
      }

      import {
        to = vault_mount.netbird
        id = "netbird"
      }

      resource "vault_mount" "netbird" {
        depends_on  = [vault_generic_endpoint.plugin_register]
        path        = "netbird"
        type        = "openbao-plugin-secrets-netbird"
        description = "NetBird secrets engine for dynamic credential generation"
      }

      resource "vault_generic_endpoint" "netbird_root_config" {
        depends_on           = [vault_mount.netbird]
        path                 = "netbird/config/root"
        disable_read         = true
        disable_delete       = true
        ignore_absent_fields = true
        data_json = jsonencode({
          api_url               = var.netbird_api_url
          service_account_token = var.netbird_service_account_token
        })
      }

      # PAT role for the secret cluster's netbird-operator
      resource "vault_generic_endpoint" "pat_role_secret_operator" {
        depends_on           = [vault_generic_endpoint.netbird_root_config]
        path                 = "netbird/config/pat/secret-operator"
        disable_read         = true
        disable_delete       = true
        ignore_absent_fields = true
        data_json = jsonencode({
          user_id           = var.netbird_service_user_id
          token_name_prefix = "bao-secret-operator"
          ttl               = "720h"
          max_ttl           = "1440h"
        })
      }

      # PAT role for the network cluster's netbird-operator
      resource "vault_generic_endpoint" "pat_role_network_operator" {
        depends_on           = [vault_generic_endpoint.netbird_root_config]
        path                 = "netbird/config/pat/network-operator"
        disable_read         = true
        disable_delete       = true
        ignore_absent_fields = true
        data_json = jsonencode({
          user_id           = var.netbird_service_user_id
          token_name_prefix = "bao-network-operator"
          ttl               = "720h"
          max_ttl           = "1440h"
        })
      }

      # Proxy token role for the secret cluster's reverse-proxy
      resource "vault_generic_endpoint" "proxy_token_role_secret" {
        depends_on           = [vault_generic_endpoint.netbird_root_config]
        path                 = "netbird/config/proxy-token/secret-proxy"
        disable_read         = true
        disable_delete       = true
        ignore_absent_fields = true
        data_json = jsonencode({
          proxy_name = "bao-secret-proxy"
          ttl        = "8760h"
          max_ttl    = "17520h"
        })
      }

      # Proxy token role for the network cluster's pikvm reverse-proxy
      resource "vault_generic_endpoint" "proxy_token_role_network_pikvm" {
        depends_on           = [vault_generic_endpoint.netbird_root_config]
        path                 = "netbird/config/proxy-token/network-pikvm-proxy"
        disable_read         = true
        disable_delete       = true
        ignore_absent_fields = true
        data_json = jsonencode({
          proxy_name = "bao-network-pikvm-proxy"
          ttl        = "8760h"
          max_ttl    = "17520h"
        })
      }
  providerConfigRef:
    name: default
