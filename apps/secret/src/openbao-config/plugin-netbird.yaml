# Declaratively register the openbao-plugin-secrets-netbird binary in the plugin
# catalog AND write the root configuration (api_url + service account token).
# Uses provider-opentofu Workspace with inline HCL since provider-vault has no
# native plugin-catalog resource type.
#
# The SHA256 is pinned to the binary at the SAME image tag as the init-container in
# src/openbao/values.yaml — update both together on each release. It is per-ARCHITECTURE and both
# clusters are arm64 (`uname -m` = aarch64), so take the arm64 value:
#   docker run --rm --platform linux/arm64 --entrypoint sha256sum <image> /openbao-plugin-secrets-netbird
# `--entrypoint sha256sum` is required: the image's ENTRYPOINT is the plugin binary itself, so
# `docker run <image> sha256sum ...` runs the PLUGIN with those arguments and prints nothing.
#
# The root config service_account_token comes from kv/netbird (one manually-seeded
# admin token that bootstraps all dynamic credential generation). Synced into
# crossplane-system by externalsecret-netbird-admin-token.yaml.
#
# ⚠ EVERY ROLE BELOW SETS manage_lease = false, AND IT MUST STAY THAT WAY UNTIL ESO IS REPLACED.
# The engine attaches a renewable OpenBao lease by default (which deletes the credential in
# NetBird when the lease ends), but these roles are consumed by External Secrets Operator, which
# CANNOT hold a lease: a secret lease is a child of the auth token that created it, and ESO calls
# RevokeSelf after every read (its fix for leaking token leases, external-secrets#376). The
# cascade would delete the operator's PAT seconds after it lands in the Secret — proven live on
# the sibling cloudflare engine, where a successfully-synced token answered 9109 twenty seconds
# later. Releasing this plugin WITHOUT these lines would take the NetBird operator down on both
# clusters.
#
# The flip side, visible today: nothing revokes these credentials, so they accumulate in NetBird
# (22 PATs, 11 still valid, oldest from August). NetBird's own `expires_in` — set from ttl while
# unleased — is the only bound. Remove the manage_lease lines once the consumers move to a
# lease-aware operator (VSO), and the engine will start cleaning up after itself.
#
# NOTE the sha256 below still pins the OLD binary, which predates all of this: it issues no lease
# at all and does not know the manage_lease field (OpenBao answers an unrecognised parameter with
# a warning, not an error, so the lines above are inert until the plugin is re-released). The
# release and the ESO replacement should land together — see libs/openbao-netbird-plugin.
#
# State lives in the shared kubernetes backend (keyed per-workspace).
apiVersion: opentofu.upbound.io/v1beta1
kind: Workspace
metadata:
  name: netbird-plugin-config
spec:
  forProvider:
    source: Inline
    env:
      - name: TF_VAR_netbird_service_account_token
        secretKeyRef:
          namespace: crossplane-system
          name: netbird-admin-token
          key: service_account_token
    vars:
      - key: plugin_sha256
        value: 900d8b94b939c8791159b412b0d95c4913c624d5dd3499883d177a9ad3275d74
      - key: netbird_api_url
        value: https://api.netbird.io
      - key: netbird_service_user_id
        value: 0e1cdcd0-1cdc-478a-9ed1-fe4fb07b4090
    module: |
      terraform {
        required_providers {
          vault = {
            source  = "hashicorp/vault"
            version = "4.6.0"
          }
        }
      }

      variable "plugin_sha256" {
        type = string
      }

      variable "netbird_api_url" {
        type = string
      }

      variable "netbird_service_account_token" {
        type      = string
        sensitive = true
      }

      variable "netbird_service_user_id" {
        type = string
      }

      provider "vault" {
        address         = "http://openbao.secret.svc:8200"
        skip_child_token = true
        auth_login {
          path = "auth/kubernetes/login"
          parameters = {
            role = "crossplane"
            jwt  = file("/var/run/secrets/kubernetes.io/serviceaccount/token")
          }
        }
      }

      resource "vault_generic_endpoint" "plugin_register" {
        path                 = "sys/plugins/catalog/secret/openbao-plugin-secrets-netbird"
        disable_read         = true
        disable_delete       = true
        ignore_absent_fields = true
        data_json = jsonencode({
          sha256  = var.plugin_sha256
          command = "openbao-plugin-secrets-netbird"
        })
      }

      import {
        to = vault_mount.netbird
        id = "netbird"
      }

      resource "vault_mount" "netbird" {
        depends_on  = [vault_generic_endpoint.plugin_register]
        path        = "netbird"
        type        = "openbao-plugin-secrets-netbird"
        description = "NetBird secrets engine for dynamic credential generation"
      }

      resource "vault_generic_endpoint" "netbird_root_config" {
        depends_on           = [vault_mount.netbird]
        path                 = "netbird/config/root"
        disable_read         = true
        disable_delete       = true
        ignore_absent_fields = true
        data_json = jsonencode({
          api_url               = var.netbird_api_url
          service_account_token = var.netbird_service_account_token
        })
      }

      # PAT role for the secret cluster's netbird-operator
      resource "vault_generic_endpoint" "pat_role_secret_operator" {
        depends_on           = [vault_generic_endpoint.netbird_root_config]
        path                 = "netbird/config/pat/secret-operator"
        disable_read         = true
        disable_delete       = true
        ignore_absent_fields = true
        data_json = jsonencode({
          user_id           = var.netbird_service_user_id
          token_name_prefix = "bao-secret-operator"
          ttl               = "720h"
          max_ttl           = "1440h"
          manage_lease      = false # ESO cannot hold a lease -- see the header
        })
      }

      # PAT role for the network cluster's netbird-operator
      resource "vault_generic_endpoint" "pat_role_network_operator" {
        depends_on           = [vault_generic_endpoint.netbird_root_config]
        path                 = "netbird/config/pat/network-operator"
        disable_read         = true
        disable_delete       = true
        ignore_absent_fields = true
        data_json = jsonencode({
          user_id           = var.netbird_service_user_id
          token_name_prefix = "bao-network-operator"
          ttl               = "720h"
          max_ttl           = "1440h"
          manage_lease      = false # ESO cannot hold a lease -- see the header
        })
      }

      # Proxy token role for the secret cluster's reverse-proxy
      resource "vault_generic_endpoint" "proxy_token_role_secret" {
        depends_on           = [vault_generic_endpoint.netbird_root_config]
        path                 = "netbird/config/proxy-token/secret-proxy"
        disable_read         = true
        disable_delete       = true
        ignore_absent_fields = true
        data_json = jsonencode({
          proxy_name = "bao-secret-proxy"
          ttl        = "8760h"
          max_ttl    = "17520h"
          manage_lease = false # ESO cannot hold a lease -- see the header
        })
      }

      # Proxy token role for the network cluster's pikvm reverse-proxy
      resource "vault_generic_endpoint" "proxy_token_role_network_pikvm" {
        depends_on           = [vault_generic_endpoint.netbird_root_config]
        path                 = "netbird/config/proxy-token/network-pikvm-proxy"
        disable_read         = true
        disable_delete       = true
        ignore_absent_fields = true
        data_json = jsonencode({
          proxy_name = "bao-network-pikvm-proxy"
          ttl        = "8760h"
          max_ttl    = "17520h"
          manage_lease = false # ESO cannot hold a lease -- see the header
        })
      }
  providerConfigRef:
    name: default
