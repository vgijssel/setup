# Policy granting read access to the netbird secrets engine — consumers can
# generate credentials (PAT, proxy-token, setup-key) but cannot modify role
# configuration. Bound to the external-secrets role so ESO can mint credentials
# on demand.
apiVersion: vault.vault.upbound.io/v1alpha1
kind: Policy
metadata:
  name: netbird-read
  annotations:
    crossplane.io/external-name: netbird-read
spec:
  deletionPolicy: Orphan
  providerConfigRef:
    name: openbao
  forProvider:
    name: netbird-read
    policy: |
      # Read (generate) credentials from all netbird roles
      path "netbird/pat/*" {
        capabilities = ["read"]
      }
      path "netbird/proxy-token/*" {
        capabilities = ["read"]
      }
      path "netbird/setup-key/*" {
        capabilities = ["read"]
      }
      # Read role configurations (no write)
      path "netbird/config/pat/*" {
        capabilities = ["read", "list"]
      }
      path "netbird/config/proxy-token/*" {
        capabilities = ["read", "list"]
      }
      path "netbird/config/setup-key/*" {
        capabilities = ["read", "list"]
      }
