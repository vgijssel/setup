# Syncs the single manually-managed Cloudflare PARENT token from kv/cloudflare into
# crossplane-system so the cloudflare-plugin-config Workspace can inject it as the engine's
# root api_token. This is the ONE Cloudflare credential a human holds — every token the
# consumers actually use is minted on demand by the plugin from this one and revoked with
# its lease.
#
# It must be a USER token (`cfut_` prefix) carrying `User API Tokens Edit`, because the two
# zones this repo manages live in DIFFERENT Cloudflare accounts:
#   blueora.ng   -> Maarten@vgijssel.nl's Account
#   vgijssel.nl  -> Piet@vgijssel.nl's Account
# An account token (`cfat_` prefix, `Account API Tokens Write`) can only mint for its own
# account, so it cannot cover both. See token_scope in
# libs/openbao-cloudflare-plugin/src/client.go.
#
# The parent needs NO DNS or zone permission of its own — verified live that it lists zero
# zones and zero accounts yet mints children that reach both. Cloudflare does not cap a
# minted token to a subset of its parent.
#
# Seed it once (kv dies with the cluster, so re-seed after a `secret:stop`):
#   bao kv put kv/cloudflare credential=<user API token with User API Tokens Edit>
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-admin-token
  namespace: crossplane-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: cloudflare-admin-token
    creationPolicy: Owner
  data:
    - secretKey: credential
      remoteRef:
        key: cloudflare
        property: credential
