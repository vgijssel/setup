# network-read: read-only over kv, mirroring external-secrets. Crossplane
# replacement for vault_policy.network_read (main.tf). Least privilege: the network
# cluster gets NOTHING beyond read on kv/* (SPEC Boundaries).
apiVersion: vault.vault.upbound.io/v1alpha1
kind: Policy
metadata:
  name: network-read
spec:
  deletionPolicy: Orphan
  providerConfigRef:
    name: openbao
  forProvider:
    name: network-read
    policy: |
      path "kv/data/*" {
        capabilities = ["read"]
      }
      path "kv/metadata/*" {
        capabilities = ["read", "list"]
      }
      # netbird secrets engine — generate credentials on demand
      path "netbird/pat/*" {
        capabilities = ["read"]
      }
      path "netbird/proxy-token/*" {
        capabilities = ["read"]
      }
      path "netbird/setup-key/*" {
        capabilities = ["read"]
      }
      # cloudflare secrets engine — mint a scoped, leased Cloudflare API token per consumer.
      # Read-only on token/* and NOT on config/*: a consumer may obtain a credential but must
      # never be able to redefine what a role grants (role write == the parent's own reach).
      path "cloudflare/token/*" {
        capabilities = ["read"]
      }
