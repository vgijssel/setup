# Fleet bundle for the Crossplane-managed OpenBao configuration — the declarative
# replacement for the terranetes OpenTofu module (main.tf) in this directory. Each
# manifest is a provider-vault managed resource reconciled against the `openbao`
# ProviderConfig (k8s-auth). Phase 1 ships only the kv Mount (walking skeleton);
# Phase 2 fans out the full parity set (auth backends, roles, policies).
#
# dependsOn crossplane-provider (label selector): the provider must be healthy and
# its ProviderConfig logged in before any managed resource can reconcile. The
# provider's own CRDs (vault.vault.upbound.io, ...) are installed by that bundle.
#
# A .fleetignore in this directory keeps the legacy Terraform files/artifacts out of
# the bundle until they are deleted in Phase 4.
dependsOn:
  - selector:
      matchLabels:
        fleet.vgijssel.nl/bundle: crossplane-provider
labels:
  fleet.vgijssel.nl/bundle: openbao-config
# secret-ONLY: this configures the secret cluster's OpenBao. The network cluster
# stays on terranetes and keeps reading kv/* over the tailnet (out of scope).
targetCustomizations:
  - name: secret
    clusterSelector:
      matchLabels:
        cluster.vgijssel.nl/name: secret
