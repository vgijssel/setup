# Fleet bundle for the Crossplane-managed OpenBao configuration — the declarative
# replacement for the terranetes OpenTofu module (main.tf) in this directory. It
# carries the OpenBao ProviderConfig (k8s-auth login as role `crossplane`) plus every
# provider-vault managed resource reconciled against it. Phase 1 ships the
# ProviderConfig + the kv Mount (walking skeleton); Phase 2 fans out the full parity
# set (auth backends, roles, policies).
#
# The ProviderConfig lives here (not in crossplane-provider) because Fleet deploys a
# bundle as one atomic Helm release: a vault.upbound.io CR can only apply once the
# provider has registered its CRDs, so it must be downstream of the Provider install.
#
# dependsOn (label selectors):
#   - crossplane-provider: the provider must be installed so the vault.upbound.io
#     CRDs (ProviderConfig, Mount, ...) exist. Fleet retries this bundle until they
#     are registered.
#   - openbao: the `crossplane` kubernetes-auth role (created by OpenBao self-init)
#     must exist before the ProviderConfig can log in.
#
# A .fleetignore in this directory keeps the legacy Terraform files/artifacts out of
# the bundle until they are deleted in Phase 4.
#
# This bundle is a LOCAL HELM CHART (Fleet auto-detects it from Chart.yaml) rather than flat
# manifests, for one reason: the OpenBao plugin pins belong in values.yaml, not buried inside the
# inline Terraform of the plugin-registration Workspaces where only textual substitution could
# reach them. Everything under templates/ except plugin-{netbird,cloudflare}.yaml is a verbatim
# static manifest — verified at conversion time that all 17 rendered objects were byte-identical
# to the flat files they replaced. See
# openspec/changes/release-please-openbao-plugins/design.md (D11).
helm:
  releaseName: openbao-config
dependsOn:
  - selector:
      matchLabels:
        fleet.vgijssel.nl/bundle: crossplane-provider
  - selector:
      matchLabels:
        fleet.vgijssel.nl/bundle: openbao
labels:
  fleet.vgijssel.nl/bundle: openbao-config
# secret-ONLY: this configures the secret cluster's OpenBao. The network cluster
# reads kv/* over the tailnet via ESO (out of scope).
targetCustomizations:
  - name: secret
    clusterSelector:
      matchLabels:
        cluster.vgijssel.nl/name: secret
  # Terminal catch-all. Targets are first-match-wins and a GitRepo APPENDS its own target
  # after these, so without this a non-matching cluster falls through to it and deploys with
  # default values. Keeps this bundle off every cluster not named above. See bin/fleet-lint-targets.
  - name: none
    doNotDeploy: true
    clusterSelector: {}
