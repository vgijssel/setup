# The break-glass `admin` kubernetes-auth login role used by `moon run secret:auth`.
# Crossplane-OWNED (NOT in self-init): once Crossplane can authenticate it provisions the
# admin path itself. Binds the `openbao-admin` ServiceAccount (ns secret,
# src/config/serviceaccount-openbao-admin.yaml) to the `admin` policy, capping issued
# tokens at 1h (tokenTtl/tokenMaxTtl = 3600s).
#
# Only a kubectl admin can mint the openbao-admin SA token, and a k8s admin already has
# full cluster access — so this grants nothing beyond kubectl admin; the 1h TTL bounds a
# leaked token. deletionPolicy: Orphan.
apiVersion: kubernetes.vault.upbound.io/v1alpha1
kind: AuthBackendRole
metadata:
  name: admin
spec:
  deletionPolicy: Orphan
  providerConfigRef:
    name: openbao
  forProvider:
    backend: kubernetes
    roleName: admin
    boundServiceAccountNames:
      - openbao-admin
    boundServiceAccountNamespaces:
      - secret
    tokenPolicies:
      - admin
    tokenTtl: 3600
    tokenMaxTtl: 3600
