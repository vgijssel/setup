# First-party OpenBao secrets-engine plugin pins.
#
# ⚠️ BOT-WRITTEN. `moon run release:self_upgrade` rewrites these after a successful publish and
# opens a PR with the result; hand edits are overwritten on the next publish. To ship a new
# plugin build, land a `fix:`/`feat:` commit touching its directory under libs/—release-please
# bumps its version.txt, publish.yaml pushes the image, and self_upgrade proposes these values.
#
# WHY version AND sha256 TOGETHER. OpenBao v2.5.5 requires `sha256` on `sys/plugins/catalog` (a
# registration without it is rejected `400 missing SHA-256 value`) and hashes the plugin BINARY
# it finds on disk—so `sha256` here is the checksum of the file inside the image, not the
# image's manifest digest, and it is per-ARCHITECTURE. Both clusters are arm64. A `version` that
# does not describe the pinned `sha256` makes plugin registration fail with nothing but a bare
# `checksum mismatch`, so the two are always written in a single commit.
#
# `version` is also what ties this file to the init container that actually delivers the binary:
# ../openbao/values.yaml pins the same version as an image tag, in a different Fleet bundle (Fleet
# cannot share values across bundles, and an image tag cannot come from a ConfigMap, so the
# version genuinely has to appear twice). `moon run release:self_upgrade_check` fails CI if the
# two ever disagree.
plugins:
  netbird:
    version: 0.1.4
    sha256: 46c6c0e836eca5ae53045857791f1779f935bae0255e69a5bc5e86a4e293b077
  cloudflare:
    version: 0.1.0
    sha256: c042e51e0abc3e0d57b0b5e139fe415fc27f18c9005b37f59fe3d9c344253a09
