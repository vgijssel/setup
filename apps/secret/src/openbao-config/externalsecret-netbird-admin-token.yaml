# Syncs the single manually-managed NetBird admin token from kv/netbird into
# crossplane-system so the netbird-plugin-config Workspace can inject it as the
# plugin's root service_account_token. This is the ONE token that bootstraps all
# dynamic credential generation — every other NetBird token (PATs, proxy tokens,
# setup keys) is minted on-demand by the plugin using this admin token.
#
# Seed it once:
#   bao kv put kv/netbird service_account_token=<admin-scoped NetBird token>
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbird-admin-token
  namespace: crossplane-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: netbird-admin-token
    creationPolicy: Owner
  data:
    - secretKey: service_account_token
      remoteRef:
        key: netbird
        property: service_account_token
