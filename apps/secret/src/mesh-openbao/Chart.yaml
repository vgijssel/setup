# Thin per-service bundle: publishes OpenBao into the NetBird mesh as `openbao.vpn.blueora.ng`.
#
# All of the machinery (Envoy data plane with its mesh-client sidecar, DNS-01 certificate,
# NetBird Group/SetupKey, access policy, self-heal watchdog) comes from the shared chart. This
# bundle contributes ONLY the declaration — name, domain, allowed source groups, listeners —
# which lives in fleet.yaml under the subchart key. There are no templates/ here on purpose:
# anything service-specific beyond those four knobs belongs in the shared chart as a parameter.
#
# ONE single-level `file://` dependency, never a nested umbrella (same constraint as the
# netbird-reverse-proxy-shared chart this replaces): `.gitignore` ignores `apps/**/charts/`, and
# `bin/fleet-apply` builds only the TOP-LEVEL bundle chart — helm does not recurse into a
# subchart's own `file://` deps, so a wrapped subchart would silently vanish from the package.
#
# Chart.lock + charts/*.tgz are gitignored under apps/secret/src (Fleet builds the dep at apply
# time); do not commit them.
apiVersion: v2
name: mesh-openbao
description: OpenBao exposed on the NetBird mesh at openbao.vpn.blueora.ng (mesh-service chart)
type: application
version: 1.0.0
dependencies:
  - name: mesh-service
    version: 1.0.0
    repository: file://../../../platform/src/mesh-service
