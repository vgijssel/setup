# Fleet bundle exposing OpenBao on the mesh at `openbao.vpn.blueora.ng` — the first service on
# the mesh-service chart, and the one every other cluster's secret consumption depends on.
#
# It replaces the BYOP reverse proxy that served `openbao.secret.vgijssel.nl`: no proxy fleet, no
# proxy token, no `proxy_cluster` binding, no wildcard certificate, and no cluster name in the
# hostname. OpenBao itself is untouched — it does NOT become a mesh client (the operator's
# mutating webhook runs failurePolicy: Fail and the operator needs a PAT out of OpenBao, so
# injecting a sidecar into OpenBao is a cold-start deadlock). The Envoy pod this bundle creates is
# the peer; OpenBao stays an ordinary ClusterIP backend behind it.
#
# The whole declaration is the `mesh-service` block below. Everything else — certificate, Envoy
# data plane, NetBird identity, access policy, watchdog — is derived from it.
#
# defaultNamespace `secret` (not `netbird`): the SidecarProfile selects pods in its OWN namespace
# and the Gateway's backendRefs resolve in the release namespace, so the exposure has to live
# where the backing Service does — same pattern as apps/network/src/eso-sidecar, which sits in
# `external-secrets` for the same reason.
#
# dependsOn:
#   - netbird-operator : owns the netbird.io CRDs (Group/SetupKey/SidecarProfile/NBPolicy) and the
#                        mutating webhook that injects the client. Fleet applies a bundle as one
#                        atomic Helm release, so a CR cannot land before its CRD is established.
#   - envoy-gateway    : owns the Gateway API v1.6.1 CRDs and the `envoy` GatewayClass this
#                        Gateway names. Without it the Gateway is an unknown kind.
# cert-manager and the `letsencrypt-prod` ClusterIssuer are NOT listed: the shared platform
# cert-manager/config bundles carry no `fleet.vgijssel.nl/bundle` label to select on, and a
# Certificate is allowed to sit Pending until the issuer exists (Fleet reconciles continuously).
labels:
  fleet.vgijssel.nl/bundle: mesh-openbao
defaultNamespace: secret
helm:
  releaseName: mesh-openbao
  values:
    # The entire per-service declaration, keyed under the subchart name. See
    # apps/platform/src/mesh-service/values.yaml for the documented contract.
    mesh-service:
      # Flat and cluster-agnostic: `openbao`, never `openbao.secret`. Consumers configure
      # https://openbao.vpn.blueora.ng and keep working if OpenBao ever moves cluster.
      name: openbao
      domain: vpn.blueora.ng
      # Who may reach it:
      #   homelab    - human/workstation peers (the Mac, phone) for the UI and CLI
      #   network-k8s - the network cluster's ESO sidecar, which reads secrets over the mesh
      # Nothing else, including peers enrolled in the account under any other group.
      sourceGroups:
        - homelab
        - network-k8s
      # HTTPS only. OpenBao speaks plain HTTP in-cluster (tls_disable), so Envoy terminates the
      # publicly-trusted mesh certificate on :443 and forwards HTTP to the ClusterIP on :8200 —
      # which is exactly what the reverse proxy did with direct_upstream, minus the proxy.
      #
      # :443 is the OBSERVED port, not a shifted one. See the port-shift block in the shared
      # chart's envoyproxy-mesh-service.yaml.
      listeners:
        - name: https
          protocol: HTTPS
          port: 443
          backend:
            name: openbao
            port: 8200
dependsOn:
  - selector:
      matchLabels:
        fleet.vgijssel.nl/bundle: netbird-operator
  - selector:
      matchLabels:
        fleet.vgijssel.nl/bundle: envoy-gateway
# secret-ONLY. bin/fleet-apply applies every bundle globally, so target the secret cluster
# explicitly — OpenBao only exists here.
targetCustomizations:
  - name: secret
    clusterSelector:
      matchLabels:
        cluster.vgijssel.nl/name: secret
  # Terminal catch-all. Targets are first-match-wins and a GitRepo APPENDS its own target
  # after these, so without this a non-matching cluster falls through to it and deploys with
  # default values. Keeps this bundle off every cluster not named above. See bin/fleet-lint-targets.
  - name: none
    doNotDeploy: true
    clusterSelector: {}
