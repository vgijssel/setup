# Fleet bundle for Vault Secrets Operator. SECRET CLUSTER ONLY for now — this is phase 1 of
# replacing ESO for dynamic secrets, and the network cluster keeps ESO until this is proven here.
#
# The split is temporary and visible: cert-manager's Cloudflare token is the one consumer that
# used to live in the SHARED apps/platform/src/config bundle, so it has been moved into the
# per-cluster config bundles (VSO here, ESO on network) rather than gated inside a raw-manifest
# bundle that cannot vary per cluster. Converge them again once the network cluster moves.
#
# defaultNamespace `vault-secrets-operator`: the operator's default VaultConnection and VaultAuth
# are created in its own namespace, and the OpenBao auth role is bound to a ServiceAccount in it
# (../openbao-config/role-vault-secrets-operator.yaml), so the namespace name is part of the auth
# contract — changing it means changing that role.
#
# dependsOn:
#   - openbao-config : the `vault-secrets-operator` policy and kubernetes-auth role must exist
#                      before the operator tries to log in. Without them its VaultAuth fails with
#                      a permission error that looks like a connection problem.
labels:
  fleet.vgijssel.nl/bundle: vault-secrets-operator
defaultNamespace: vault-secrets-operator
helm:
  releaseName: vault-secrets-operator
dependsOn:
  - selector:
      matchLabels:
        fleet.vgijssel.nl/bundle: openbao-config
# secret-ONLY. bin/fleet-apply applies every bundle globally, so target the secret cluster
# explicitly.
targetCustomizations:
  - name: secret
    clusterSelector:
      matchLabels:
        cluster.vgijssel.nl/name: secret
  # Terminal catch-all. Targets are first-match-wins and a GitRepo APPENDS its own target
  # after these, so without this a non-matching cluster falls through to it and deploys with
  # default values. Keeps this bundle off every cluster not named above. See bin/fleet-lint-targets.
  - name: none
    doNotDeploy: true
    clusterSelector: {}
