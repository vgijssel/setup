# Values are keyed under the subchart name, mirroring the other umbrella bundles.
vault-secrets-operator:
  # The default VaultConnection, created in the operator's own namespace and used by any
  # VaultDynamicSecret that names no connection of its own.
  #
  # Plain HTTP to the in-cluster ClusterIP: OpenBao runs with tls_disable on this single-node vind
  # cluster (see ../openbao/values.yaml) and this traffic never leaves the node. The same address
  # the `openbao` and `openbao-cloudflare` ClusterSecretStores already use.
  defaultVaultConnection:
    enabled: true
    address: http://openbao.secret.svc:8200

  # The default VaultAuth, likewise created in the operator's namespace.
  #
  # Kubernetes auth as role `vault-secrets-operator`, which is deliberately NOT the
  # `external-secrets` role: VSO additionally needs the lease endpoints (sys/leases/renew,
  # revoke, lookup) that make leasing possible, and separate roles keep either consumer
  # revocable without touching the other. Role + policy live in
  # ../openbao-config/{role,policy}-vault-secrets-operator.yaml.
  defaultAuthMethod:
    enabled: true
    method: kubernetes
    mount: kubernetes
    kubernetes:
      role: vault-secrets-operator
      # The ServiceAccount whose token is sent to OpenBao at login. Per the VaultAuth CRD this
      # "must reside in the consuming secret's namespace" — NOT the operator's. So for a
      # VaultDynamicSecret in `cert-manager`, VSO requests a token for
      # cert-manager/vault-secrets-operator, and OpenBao's auth role binds exactly that
      # (../openbao-config/role-vault-secrets-operator.yaml).
      #
      # A dedicated SA rather than `default`: binding `default` would let anything able to mint a
      # default-SA token in that namespace log in as this role, which has the lease-management
      # grants. Each consuming namespace gets its own SA, created alongside its
      # VaultDynamicSecret.
      serviceAccount: vault-secrets-operator
    # Namespaces allowed to use this default auth. Explicit rather than a wildcard, so adding a
    # consumer is a visible change here — an empty list would confine it to the operator's own
    # namespace and a VaultDynamicSecret elsewhere would fail with a puzzling auth error.
    allowedNamespaces:
      - cert-manager

  controller:
    manager:
      # Pinned by the vendored chart (1.6.0). Verified linux/arm64 — both vind clusters are arm64.
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi
    # kube-rbac-proxy fronts the metrics endpoint. This chart has NO switch to disable it — the
    # container is rendered unconditionally — so it is sized down rather than removed. Verified
    # linux/arm64/v8 (quay.io/brancz/kube-rbac-proxy:v0.18.1).
    kubeRbacProxy:
      resources:
        requests:
          cpu: 5m
          memory: 32Mi
        limits:
          memory: 64Mi

  # CSI provider: another delivery mechanism (secrets as mounted volumes) that nothing in this
  # repo uses — every consumer wants a Kubernetes Secret. Off to keep the footprint small.
  csi:
    enabled: false
