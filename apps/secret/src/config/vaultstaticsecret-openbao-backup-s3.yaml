# S3 credentials for the OpenBao Raft snapshot CronJob, from kv/s3-backup.
#
# Migrated from External Secrets Operator to Vault Secrets Operator. Nothing about the resulting
# Secret changes -- same name, namespace and keys -- so the consumer needs no edit.
#
# refreshAfter replaces ESO's refreshInterval. There is no lease on a kv entry, so this interval
# is the only thing driving a re-read.
#
# The login ServiceAccount is defined once per cluster in serviceaccounts-vso.yaml, beside this
# file.
#
# ── WHY IT LIVES IN THE config BUNDLE, NOT BESIDE THE CronJob THAT READS IT ──────────────────
# It was in apps/secret/src/openbao/templates/ first, and that DEADLOCKED Fleet: openbao-config
# dependsOn openbao, so putting a VSO resource in the openbao bundle meant openbao could not go
# ready until VSO could log in, VSO could not log in until openbao-config updated the OpenBao
# auth role, and openbao-config was waiting on openbao. A bundle that gates another must not
# contain a resource whose readiness depends on that other bundle's contents.
#
# S3_HOST must be a BARE host for s3cmd, so the scheme the shared kv value carries is stripped
# here. Only the openbao/ prefix in S3_URI is git-side; the bucket comes from the secret.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: openbao-backup-s3
  namespace: secret
spec:
  type: kv-v2
  mount: kv
  path: s3-backup
  refreshAfter: 1h
  destination:
    name: openbao-backup-s3
    create: true
    transformation:
      templates:
        AWS_ACCESS_KEY_ID:
          text: '{{ `{{ get .Secrets "access_key_id" }}` }}'
        AWS_SECRET_ACCESS_KEY:
          text: '{{ `{{ get .Secrets "secret_access_key" }}` }}'
        S3_BUCKET:
          text: '{{ `{{ get .Secrets "bucket" }}` }}'
        S3_HOST:
          text: '{{ `{{ get .Secrets "endpoint" | trimPrefix "https://" | trimPrefix "http://" }}` }}'
        S3_URI:
          text: '{{ `s3://{{ get .Secrets "bucket" }}/openbao/` }}'
      excludeRaw: true
      excludes:
        - .*
