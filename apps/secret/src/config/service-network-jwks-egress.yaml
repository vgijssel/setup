# In-cluster tailnet egress to the NETWORK cluster's kube-apiserver reverse proxy, so
# this cluster's OpenBao can fetch the network cluster's JWKS live (jwt-network backend,
# jwks_url). This is the mirror of apps/network/src/config/service-openbao-egress.yaml
# (which points the other way, network -> secret's OpenBao) and now works identically:
# both target a plain public HTTPS name backed by a valid Let's Encrypt cert.
#
# The Tailscale operator provisions the egress path from this Service: the `tailnet-fqdn`
# annotation makes it stand up an egress proxy that transparently forwards TCP to the
# tailnet node behind api.network.vgijssel.nl (the network cluster's apiserver-proxy VIP,
# T18), so the client's TLS handshake — including SNI api.network.vgijssel.nl — passes
# straight through and the reverse proxy serves the matching LE cert. OpenBao's
# network_jwks_url therefore keeps the real hostname
# (https://api.network.vgijssel.nl/openid/v1/jwks), resolved in-cluster here.
#
# Because api.network.vgijssel.nl is a public name with a publicly-trusted cert, NO
# CoreDNS rewrite is needed (the old configmap-coredns-custom.yaml was retired in T19) —
# the SNI is naturally correct, exactly like the openbao egress.
#
# Requires ACL-D: the tailnet policy must grant this cluster's egress proxy (tag:k8s)
# access to the api-network Service VIP (svc:api-network) on tcp:443, otherwise the
# egress node is not approved and this stays pending.
#
# NOTE: the tailnet-fqdn below MUST match the host in network_jwks_url
# (configuration-openbao.yaml).
apiVersion: v1
kind: Service
metadata:
  name: network-jwks
  namespace: secret
  annotations:
    tailscale.com/tailnet-fqdn: api.network.vgijssel.nl
spec:
  type: ExternalName
  # Placeholder; the Tailscale operator rewrites this to the egress proxy target.
  externalName: placeholder.tailnet-fqdn.ts.net
