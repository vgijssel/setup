# In-cluster tailnet egress to the NETWORK cluster's kube-apiserver, so this cluster's
# OpenBao can fetch the network cluster's JWKS live (jwt-network backend, jwks_url).
# This is the mirror of apps/network/src/config/service-openbao-egress.yaml (which points
# the other way, network -> secret's OpenBao).
#
# The Tailscale operator provisions the egress path from this Service: the `tailnet-fqdn`
# annotation makes it stand up an egress proxy that transparently forwards TCP to the
# tailnet device behind the network operator's API-server proxy, preserving SNI so the
# operator's serving cert for network-operator.<tailnet>.ts.net stays valid. OpenBao's
# network_jwks_url therefore keeps the real hostname
# (https://network-operator.<tailnet>.ts.net/openid/v1/jwks), resolved in-cluster here.
#
# Requires ACL-C: the tailnet policy must grant this cluster's egress proxy (tag:k8s)
# access to the network operator device (tag:k8s-operator) on tcp:443, otherwise the
# egress node is not approved and this stays pending.
#
# NOTE: the tailnet-fqdn below is the network operator's MagicDNS name; it MUST match the
# host in network_jwks_url (configuration-openbao.yaml).
apiVersion: v1
kind: Service
metadata:
  name: network-jwks
  namespace: secret
  annotations:
    tailscale.com/tailnet-fqdn: network-operator.tail2c33e2.ts.net
spec:
  type: ExternalName
  # Placeholder; the Tailscale operator rewrites this to the egress proxy target.
  externalName: placeholder.tailnet-fqdn.ts.net
