# cert-manager's Cloudflare DNS-01 token, delivered by Vault Secrets Operator with a LIVE
# OpenBao lease. This is the first consumer migrated off External Secrets Operator.
#
# WHY IT MOVED: ESO cannot hold a lease. A secret lease is a CHILD of the auth token that created
# it, and ESO calls RevokeSelf after every read (its own fix for leaking token leases,
# external-secrets#376), so the cascade deleted the Cloudflare token seconds after it landed in
# the Secret — measured here, a successfully-synced token answering 9109 twenty seconds later.
# The ESO workaround was to mint the token UNLEASED (manage_lease=false) and rely only on
# Cloudflare's own expires_on, which means nothing could revoke a leaked token early. VSO renews
# the lease instead, reissues if it is revoked or expires, and hands the credential back when
# this resource is deleted.
#
# WHY IT LIVES HERE and not in the shared apps/platform/src/config: that bundle is raw manifests
# deployed to BOTH clusters, so it cannot deliver this via VSO on the secret cluster and ESO on
# the network cluster. The network cluster keeps an ESO copy
# (apps/network/src/config/externalsecret-cloudflare-api-token.yaml) until VSO lands there too;
# converge these back into one bundle at that point.
#
# The target Secret name, namespace and `api-token` key are UNCHANGED from the ESO version, so
# the ClusterIssuer in apps/platform/src/config keeps working without edits. Note that takes a
# transformation: the engine returns the field as `api_token` and ESO renamed it via `secretKey`,
# which VSO has no equivalent for — see destination.transformation below.
#
# GOTCHA when inspecting this: ESO ALSO defines a CRD called VaultDynamicSecret
# (vaultdynamicsecrets.generators.external-secrets.io), so while both operators are installed
# `kubectl get vaultdynamicsecret` resolves to ESO's and reports "not found". Use the fully
# qualified `vaultdynamicsecrets.secrets.hashicorp.com`.
---
# The identity VSO logs in to OpenBao as. It must live in THIS namespace, not the operator's —
# the VaultAuth CRD requires the ServiceAccount to "reside in the consuming secret's namespace".
# OpenBao's auth role binds exactly cert-manager/vault-secrets-operator
# (../openbao-config/role-vault-secrets-operator.yaml).
#
# A dedicated SA rather than `default`, because that role carries the lease-management grants
# (sys/leases/renew|revoke|lookup) and binding `default` would hand them to anything able to mint
# a default-SA token in this namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets-operator
  namespace: cert-manager
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultDynamicSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
spec:
  # Uses the operator's default VaultConnection + VaultAuth, created in its own namespace by the
  # chart (../vault-secrets-operator/values.yaml). This namespace is allow-listed there.
  mount: cloudflare
  path: token/cert-manager
  # false = a genuinely dynamic, lease-backed credential (the default, stated for clarity).
  # VSO renews the lease at ~67% of its duration and reissues when it is revoked or expires.
  # `true` would be for Vault static-roles, which this engine does not have.
  allowStaticCreds: false
  # Hand the lease back when this resource is deleted, so the Cloudflare token disappears
  # upstream immediately rather than lingering until expires_on. This is the capability ESO
  # could never provide.
  revoke: true
  destination:
    name: cloudflare-api-token
    # VSO creates and owns the Secret.
    #
    # There is no adopt-vs-create conflict to avoid, which is worth recording for the remaining
    # migrations: ESO's ExternalSecret used `creationPolicy: Owner`, so pruning it from the shared
    # bundle DELETED the Secret along with it. Observed here — `create: false` then left this
    # resource stuck on "Destination secret does not exist" while cert-manager had no token at
    # all. The handover is therefore a brief gap, not an overlap: expect the Secret to vanish and
    # be recreated, and sequence accordingly (the 48h token overlap does not help, because the
    # Secret itself is gone).
    create: true
    transformation:
      # The engine returns `api_token`; cert-manager's ClusterIssuer reads `api-token`. ESO did
      # this rename with `secretKey`, which VSO has no direct equivalent for, so it is a template.
      # Keeping the key identical is what lets the ClusterIssuer stay untouched.
      templates:
        api-token:
          text: '{{ get .Secrets "api_token" }}'
      # Drop `_raw`, which otherwise ships the whole engine response — including a second copy of
      # the token — into the Secret for no consumer.
      excludeRaw: true
      # Only the templated key is wanted. Without this the Secret also carries token_id and
      # expires_on, which nothing reads.
      excludes:
        - .*
  # Restart cert-manager when the token rotates. cert-manager needs this — measured, not assumed:
  # after the Secret was updated with a valid token, a pending challenge kept failing against the
  # PREVIOUS one for over 10 minutes while the new token worked by hand, and a rollout restart
  # issued the certificate in 105 seconds. The solver keeps the credential it read when the
  # challenge began.
  #
  # This REPLACES the Reloader annotation the ESO path relied on. Reloader still watches this
  # Secret (it is annotated for the network cluster's sake, in
  # apps/platform/src/cert-manager/values.yaml), so during the transition both may fire — a
  # duplicate restart is harmless, and the annotation goes away when the network cluster migrates.
  rolloutRestartTargets:
    - kind: Deployment
      name: cert-manager
