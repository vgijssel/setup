# Portable Fleet bundle for the declarative OpenBao config. Two overlapping owners
# live here during the terranetes migration (Phase 5):
#   - terranetes (new): the Configuration (openbao-config, ns secret) + cluster-scoped
#     Provider + the executor's state RBAC in ns secret. terranetes reconciles the
#     OpenTofu module apps/secret/src/openbao-config against the shared kubernetes
#     state (see SPEC → Configuration management).
#   - vault-config-operator (retiring): the redhatcop CRs (SecretEngineMount, Policy,
#     KubernetesAuthEngineRole, AuthEngineMount). Kept here until T16 removes the
#     operator — they manage the SAME OpenBao objects the module does (identical, no
#     conflict). Removing them before the operator is scaled down would trip its
#     finalizers and delete the live objects out from under ESO, so removal is gated.
#
# Also carries the OpenBao Ingress + cert-manager Certificate (ns secret). Depends on
# the redhatcop + terraform.appvia.io CRDs and on OpenBao being initialised
# (secret:bootstrap); until then Fleet error-and-retries, which is expected.
defaultNamespace: vault-config-operator
