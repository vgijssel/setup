# Portable Fleet bundle for the secret cluster's ESO wiring + OpenBao exposure:
#   - clustersecretstore-openbao.yaml : the LOCAL ClusterSecretStore `openbao` — ESO
#     reaches OpenBao over the in-cluster ClusterIP service (http://openbao.secret.svc:8200)
#     and authenticates with its ServiceAccount via OpenBao's kubernetes auth method
#     (role external-secrets). No mesh hop, no static token.
#
# OpenBao is no longer exposed via an Ingress/VIP: it is reached over the NetBird mesh at
# openbao.secret.vgijssel.nl (BYOP reverse proxy, apps/secret/src/netbird-reverse-proxy). The
# former ingress-openbao.yaml + certificate-secret.yaml (Ingress + per-host LE cert) were
# removed with the tailnet exposure.
#
# The OpenBao configuration itself (mounts, auth methods, roles, policies) is owned by
# Crossplane (src/openbao-config) + self-init, NOT terranetes — the terranetes
# Configuration/Provider/state-RBAC that used to live here were removed in the migration.
#
# Also carries vaultdynamicsecret-cloudflare-api-token.yaml: cert-manager's Cloudflare DNS-01
# token, the first consumer migrated from ESO to Vault Secrets Operator so that the credential
# is backed by a live, renewable OpenBao lease.
#
# Namespaced resources set their namespace explicitly (secret or cert-manager); defaultNamespace
# is a harmless fallback.
defaultNamespace: secret
# dependsOn the vault-secrets-operator bundle, which installs the secrets.hashicorp.com CRDs.
# Fleet applies a bundle as ONE atomic unit, so a VaultDynamicSecret here cannot land before the
# CRD that defines it exists — without this the bundle fails with "no matches for kind
# VaultDynamicSecret", the same rule that keeps Crossplane CRs out of the provider's bundle.
labels:
  fleet.vgijssel.nl/bundle: secret-config
dependsOn:
  - selector:
      matchLabels:
        fleet.vgijssel.nl/bundle: vault-secrets-operator
# secret-ONLY. The selector alone restricts nothing under a Rancher GitRepo, which appends
# its own catch-all target — the terminal doNotDeploy entry below is what restricts this.
targetCustomizations:
  - name: secret
    clusterSelector:
      matchLabels:
        cluster.vgijssel.nl/name: secret
  # Terminal catch-all. Targets are first-match-wins and a GitRepo APPENDS its own target
  # after these, so without this a non-matching cluster falls through to it and deploys with
  # default values. Keeps this bundle off every cluster not named above. See bin/fleet-lint-targets.
  - name: none
    doNotDeploy: true
    clusterSelector: {}
