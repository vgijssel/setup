# Portable Fleet bundle for the declarative OpenBao config, now fully terranetes-based
# (vault-config-operator removed in T16):
#   - the terranetes Configuration (openbao-config, ns secret) + cluster-scoped Provider
#     + the executor's state RBAC in ns secret — terranetes reconciles the OpenTofu module
#     apps/secret/src/openbao-config against the shared kubernetes state (see SPEC →
#     Configuration management).
#   - the OpenBao Ingress + cert-manager Certificate (ns secret).
#
# OpenBao fetches the network cluster's JWKS (jwt-network backend, jwks_url) directly
# over the tailnet at api.network.vgijssel.nl — resolved via the public A record to the
# stable api-network VIP and routed over the cluster's tailnet connectivity. No
# per-service Tailscale egress Service is used (the old tailnet-fqdn egress was a no-op).
#
# Depends on the terraform.appvia.io CRDs (terranetes bundle) and on OpenBao being
# initialised (secret:bootstrap) + configured (secret:configure); until then Fleet
# error-and-retries, which is expected. All namespaced resources set their namespace
# explicitly (secret); defaultNamespace is a harmless fallback.
defaultNamespace: secret
