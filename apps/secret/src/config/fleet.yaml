# Portable Fleet bundle for the secret cluster's ESO wiring + OpenBao exposure:
#   - clustersecretstore-openbao.yaml : the LOCAL ClusterSecretStore `openbao` — ESO
#     reaches OpenBao over the in-cluster ClusterIP service (http://openbao.secret.svc:8200)
#     and authenticates with its ServiceAccount via OpenBao's kubernetes auth method
#     (role external-secrets). No tailnet, no static token.
#   - externalsecret-operator-oauth.yaml : syncs the Tailscale operator OAuth client.
#
# OpenBao is no longer exposed via an Ingress/tailnet: it is reached over the NetBird mesh at
# openbao.secret.vgijssel.nl (BYOP reverse proxy, apps/secret/src/netbird-reverse-proxy). The
# former ingress-openbao.yaml + certificate-secret.yaml (Ingress + per-host LE cert) were
# removed with the tailnet exposure.
#
# The OpenBao configuration itself (mounts, auth methods, roles, policies) is owned by
# Crossplane (src/openbao-config) + self-init, NOT terranetes — the terranetes
# Configuration/Provider/state-RBAC that used to live here were removed in the migration.
#
# Namespaced resources set their namespace explicitly (secret); defaultNamespace is a
# harmless fallback.
defaultNamespace: secret
# secret-ONLY. Declaring targetCustomizations replaces Fleet's implicit
# deploy-everywhere, so global bin/fleet-apply only deploys this on the secret cluster.
targetCustomizations:
  - name: secret
    clusterSelector:
      matchLabels:
        cluster.vgijssel.nl/name: secret
