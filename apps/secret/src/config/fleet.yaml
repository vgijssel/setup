# Portable Fleet bundle for the declarative OpenBao config: the redhatcop CRs
# (SecretEngineMount, Policy, KubernetesAuthEngineRole, AuthEngineMount) that
# vault-config-operator reconciles into OpenBao — the kv v2 engine plus the
# external-secrets and operator policies/roles. Raw manifests (no Chart.yaml); the
# CRs carry their own namespace (vault-config-operator).
#
# These depend on the redhatcop CRDs from the vault-config-operator chart and on
# OpenBao being initialised (secret:init); until then Fleet error-and-retries,
# which is expected.
defaultNamespace: vault-config-operator
