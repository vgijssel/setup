# ClusterSecretStore for the netbird custom secrets engine. Separate from the main
# `openbao` store (which targets kv v2) because the netbird engine is a v1-style
# secrets engine — ESO must read paths directly (no /data/ prefix). Every read to
# a netbird/pat/<role> or netbird/proxy-token/<role> path GENERATES a new credential
# (dynamic secret), so refreshInterval on the ExternalSecrets controls rotation cadence.
#
# Auth: same kubernetes auth as the main store (external-secrets SA, role external-secrets).
# The external-secrets policy already grants read on netbird/pat/*, proxy-token/*, setup-key/*.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao-netbird
spec:
  provider:
    vault:
      server: http://openbao.secret.svc:8200
      path: netbird
      version: v1
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
