# CoreDNS custom server block (imported via `import /etc/coredns/custom/*.server`) that
# resolves the network cluster's operator MagicDNS name to the in-cluster Tailscale
# EGRESS proxy, so OpenBao can fetch the network JWKS (jwt-network jwks_url).
#
# Why this is needed: the vind CoreDNS has no MagicDNS (.ts.net) resolver, so
# network-operator.tail2c33e2.ts.net is NXDOMAIN in-cluster. The Tailscale operator
# egress (service-network-jwks-egress.yaml) exposes the path as the ExternalName Service
# network-jwks.secret.svc, but connecting by that name would send the wrong TLS SNI and
# the operator's API-server proxy (which serves a Let's Encrypt cert for
# network-operator.tail2c33e2.ts.net) rejects it. Rewriting the DNS name — not the URL —
# keeps the client's SNI as the MagicDNS name (so the LE cert validates) while routing the
# TCP through the egress proxy. Must match network_jwks_url in configuration-openbao.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  network-jwks.server: |
    network-operator.tail2c33e2.ts.net:1053 {
        errors
        rewrite name exact network-operator.tail2c33e2.ts.net network-jwks.secret.svc.cluster.local
        kubernetes cluster.local in-addr.arpa ip6.arpa {
            pods insecure
            fallthrough in-addr.arpa ip6.arpa
        }
        forward . /etc/resolv.conf
        cache 30
    }
