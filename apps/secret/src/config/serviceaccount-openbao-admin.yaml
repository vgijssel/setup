# Break-glass administrator login identity. `moon run secret:get_openbao_auth` mints a short-lived token
# for THIS ServiceAccount and exchanges it at OpenBao's kubernetes auth `admin` role
# (created by self-init) for a 1 h administrator token. The SA needs NO Kubernetes RBAC—it is
# purely an OpenBao login identity; OpenBao validates its token via the TokenReview API.
#
# Security model: only a kubectl administrator can create this SA's token (or exec the OpenBao
# pod), and a Kubernetes administrator already has full cluster access (all Secrets, the openbao-seal
# key, pod exec), so binding OpenBao administrator to this SA grants nothing beyond what Kubernetes
# administrator already implies. The 1 h role TTL bounds a leaked token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-admin
  namespace: secret
