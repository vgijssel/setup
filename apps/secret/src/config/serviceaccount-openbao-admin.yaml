# Break-glass admin login identity. `moon run secret:auth` mints a short-lived token
# for THIS ServiceAccount and exchanges it at OpenBao's kubernetes auth `admin` role
# (created by self-init) for a 1h admin token. The SA needs NO Kubernetes RBAC — it is
# purely an OpenBao login identity; OpenBao validates its token via the TokenReview API.
#
# Security model: only a kubectl admin can create this SA's token (or exec the OpenBao
# pod), and a k8s admin already has full cluster access (all Secrets, the openbao-seal
# key, pod exec), so binding OpenBao admin to this SA grants nothing beyond what k8s
# admin already implies. The 1h role TTL bounds a leaked token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-admin
  namespace: secret
