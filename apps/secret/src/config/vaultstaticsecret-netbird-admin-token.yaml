# The NetBird admin token, from kv/netbird, for the netbird engine's root config.
#
# Migrated from External Secrets Operator to Vault Secrets Operator. Nothing about the resulting
# Secret changes -- same name, namespace and keys -- so the consumer needs no edit.
#
# WHY MOVE A STATIC kv SECRET AT ALL, when ESO served it fine: so that ONE operator owns
# everything OpenBao-backed. The dynamic secrets HAD to move (ESO revokes its own auth token
# after every read, which cascades and destroys any leased credential), and leaving kv behind
# would mean two operators, two auth paths and two policies to keep in step for no benefit.
#
# refreshAfter replaces ESO's refreshInterval. There is no lease on a kv entry, so this interval
# is the only thing driving a re-read.
#
# The login ServiceAccount (crossplane-system/vault-secrets-operator) is defined once per cluster in
# ../config/serviceaccounts-vso.yaml.
#
# The ONE token that bootstraps all NetBird credential generation -- every PAT, setup key and
# proxy token is minted from it on demand. Seed it with:
#   bao kv put kv/netbird service_account_token=<admin-scoped NetBird token>
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: netbird-admin-token
  namespace: crossplane-system
spec:
  # kv-v2, so VSO also watches the entry's metadata to notice a new version.
  type: kv-v2
  mount: kv
  path: netbird
  refreshAfter: 1h
  destination:
    name: netbird-admin-token
    create: true
    transformation:
      templates:
        service_account_token:
          text: '{{ get .Secrets "service_account_token" }}'
      # Drop `_raw` (the whole kv entry as JSON) and every source field, leaving only the
      # templated keys the consumer actually reads.
      excludeRaw: true
      excludes:
        - .*
