# Generates a dynamic NetBird PAT for the SECRET cluster's netbird-operator via the
# openbao-plugin-secrets-netbird engine. Each refresh mints a fresh PAT (30-day expiry
# in NetBird); the previous one remains valid until its TTL expires, providing overlap
# for zero-downtime rotation.
#
# refreshInterval controls rotation cadence: 360h (15 days) = new PAT halfway through
# the 30-day TTL, so the old PAT is always valid as a safety net while the operator
# picks up the new one.
#
# The `netbird` namespace is owned by the netbird-operator bundle (Fleet
# defaultNamespace); this ExternalSecret targets it and stays NotReady until that
# namespace exists.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbird-mgmt-api-key
  namespace: netbird
spec:
  refreshInterval: 360h
  secretStoreRef:
    name: openbao-netbird
    kind: ClusterSecretStore
  target:
    name: netbird-mgmt-api-key
    creationPolicy: Owner
  data:
    - secretKey: NB_API_KEY
      remoteRef:
        key: pat/secret-operator
        property: access_token
