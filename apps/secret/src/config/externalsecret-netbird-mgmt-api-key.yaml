# Syncs the SECRET cluster's NetBird management API PAT from OpenBao into the
# `netbird-mgmt-api-key` Secret (key NB_API_KEY) the netbird-operator reads
# (netbirdAPI.keyFromSecret). Per-cluster credential (mirrors the Tailscale
# operator-oauth split): the secret cluster reads kv/secret-netbird-operator, the
# network cluster reads kv/network-netbird-operator, so a rotation/compromise is bounded
# to one cluster and each operator peer has an independent NetBird identity.
#
# The `netbird` namespace is owned by the netbird-operator bundle (Fleet
# defaultNamespace); this ExternalSecret targets it and stays NotReady until that
# namespace exists. On the secret cluster the `openbao` ClusterSecretStore is LOCAL
# (in-cluster kubernetes auth against the local OpenBao).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbird-mgmt-api-key
  namespace: netbird
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: netbird-mgmt-api-key
    creationPolicy: Owner
  data:
    - secretKey: NB_API_KEY
      remoteRef:
        key: secret-netbird-operator
        property: access_token
