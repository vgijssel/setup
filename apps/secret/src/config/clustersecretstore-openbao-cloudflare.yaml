# ClusterSecretStore for the cloudflare custom secrets engine. Separate from the main `openbao`
# store (which targets kv v2) because the cloudflare engine is a v1-style secrets engine — ESO
# must read paths directly, with no /data/ prefix.
#
# Every read of a cloudflare/token/<role> path MINTS A NEW Cloudflare API token (dynamic
# secret), so `refreshInterval` on the consuming ExternalSecret is what sets rotation cadence —
# not a schedule here. The roles use ttl 48h while consumers refresh every 24h, so successive
# tokens overlap by 24h and a consumer is never left holding a revoked credential.
#
# Auth: same kubernetes auth as the main store (external-secrets SA, role external-secrets). Its
# policy grants read on cloudflare/token/* and nothing under cloudflare/config/*.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao-cloudflare
spec:
  provider:
    vault:
      server: http://openbao.secret.svc:8200
      path: cloudflare
      version: v1
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
