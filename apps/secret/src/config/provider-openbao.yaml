# terranetes Provider for the OpenBao config module. source: injected + a
# ServiceAccount means terranetes runs the executor job as terranetes-executor
# (in the controller namespace) and injects NO cloud credentials — the module's
# vault provider authenticates itself to OpenBao by exchanging that pod's
# ServiceAccount JWT for a token via the `terranetes` kubernetes auth role
# (created by secret:configure). No root token in the cluster. Cluster-scoped.
apiVersion: terraform.appvia.io/v1alpha1
kind: Provider
metadata:
  name: openbao
spec:
  provider: vault
  source: injected
  serviceAccount: terranetes-executor
