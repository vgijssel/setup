# terranetes Provider for the OpenBao config module. terranetes always renders the
# provider block (provider.tf.json) from `configuration` below, so the module itself
# declares NO provider block. source: injected + serviceAccount runs the executor job
# as terranetes-executor; the vault provider then exchanges that pod's ServiceAccount
# JWT for a token via the `terranetes` kubernetes auth role (created by secret:configure)
# — no root token in the cluster. Cluster-scoped.
apiVersion: terraform.appvia.io/v1alpha1
kind: Provider
metadata:
  name: openbao
spec:
  provider: vault
  source: injected
  serviceAccount: terranetes-executor
  # Rendered verbatim into provider.tf.json as the vault provider body. auth_login
  # is a list-nested block, so it is a single-element array.
  configuration:
    address: http://openbao.secret.svc:8200
    auth_login:
      - path: auth/kubernetes/login
        method: kubernetes
        parameters:
          role: terranetes
