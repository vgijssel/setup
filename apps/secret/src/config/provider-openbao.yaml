# terranetes Provider for the OpenBao config Configuration. terranetes requires a
# providerRef and always injects a provider block from it — but the OpenTofu module
# (apps/secret/src/openbao-config) owns the real `provider "vault"` block (it needs to
# file()-read the ServiceAccount JWT for kubernetes auth, which a static injected block
# cannot). So this Provider uses a throwaway `null` type: terranetes injects a harmless,
# unused `provider "null" {}` and the module's vault provider does the real work.
#
# source: injected + serviceAccount runs the executor job as terranetes-executor; the
# module's provider then exchanges that pod's ServiceAccount JWT for a token via the
# `terranetes` kubernetes auth role (created by secret:configure) — no root token in the
# cluster. Cluster-scoped.
apiVersion: terraform.appvia.io/v1alpha1
kind: Provider
metadata:
  name: openbao
spec:
  provider: "null"
  source: injected
  serviceAccount: terranetes-executor
