# The terranetes executor runs in the controller namespace (terranetes-system) as
# terranetes-executor, but the shared tfstate lives in a Secret in ns `secret`
# (tfstate-default-openbao-config — see the backend template + secret:configure).
# The kubernetes backend needs get/list/create/update/delete on that state Secret
# and its coordination Lease (state locking), so grant the executor SA exactly that
# in ns `secret`. Without this the runner's tofu init/apply fails writing state.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: terranetes-state
  namespace: secret
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - create
      - update
      - delete
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - create
      - update
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: terranetes-state
  namespace: secret
subjects:
  - kind: ServiceAccount
    name: terranetes-executor
    namespace: terranetes-system
roleRef:
  kind: Role
  name: terranetes-state
  apiGroup: rbac.authorization.k8s.io
