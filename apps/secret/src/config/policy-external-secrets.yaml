# Read-only policy for external-secrets over the kv v2 engine. Mirrors the policy
# the bootstrap.sh script used to write imperatively; now owned by the operator
# so editing this file updates OpenBao. Kept identical to the ClusterSecretStore's
# expectations (reads under kv/data and kv/metadata).
apiVersion: redhatcop.redhat.io/v1alpha1
kind: Policy
metadata:
  name: external-secrets
  namespace: vault-config-operator
spec:
  authentication:
    path: kubernetes
    role: vault-config-operator
    serviceAccount:
      name: controller-manager
  policy: |
    path "kv/data/*" {
      capabilities = ["read"]
    }
    path "kv/metadata/*" {
      capabilities = ["read", "list"]
    }
