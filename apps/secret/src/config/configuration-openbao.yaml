# terranetes Configuration: reconciles the OpenTofu module apps/secret/src/openbao-config
# in-cluster, continuously, against the SAME kubernetes-backend state the local
# secret:configure apply seeded. Named `openbao-config` in ns `secret` so the
# backend template ({{ .name }}/{{ .namespace }}) resolves to the one Secret
# tfstate-default-openbao-config — no second state, no fighting.
#
# The module's vault provider logs into OpenBao with the runner's ServiceAccount + the
# `terranetes` role (auth_method=kubernetes, no root token in-cluster). The first local
# root-token apply created that role, so this login path already exists.
#
# The first-run handoff was verified as a no-op against the shared state (plan showed
# zero changes) before auto-approval was enabled. enableAutoApproval + drift detection
# now let the controller re-apply the module continuously, reverting out-of-band changes.
#
# NOTE: the module `ref` tracks the branch carrying this work; update it to `main`
# once merged (and the future Rancher GitRepo tracks the same path).
apiVersion: terraform.appvia.io/v1alpha1
kind: Configuration
metadata:
  name: openbao-config
  namespace: secret
  annotations:
    # CRITICAL: deleting a terranetes Configuration normally runs a `terraform
    # destroy` (auto-approved here), which would wipe the kv engine + policies/roles
    # out of OpenBao and break ESO. This orphan annotation makes terranetes SKIP the
    # destroy and simply stop managing the resources — so deletion (accidental, Fleet
    # GC, or the eventual Rancher handoff) leaves OpenBao intact. The local root-token
    # secret:configure remains the recovery path if the shared state is ever lost.
    terraform.appvia.io/orphan: "true"
spec:
  module: https://github.com/vgijssel/setup.git//apps/secret/src/openbao-config?ref=feat/network-cluster-omada
  providerRef:
    name: openbao
  enableAutoApproval: true
  enableDriftDetection: true
  variables:
    auth_method: kubernetes
    bao_address: http://openbao.secret.svc:8200
    k8s_auth_role: terranetes
    # network cluster JWT grant inputs. OpenBao fetches the network cluster's JWKS
    # LIVE from network_jwks_url — the network cluster's kube-apiserver reverse proxy
    # exposed on the tailnet at api.network.vgijssel.nl (T18), which serves a valid
    # public Let's Encrypt cert. Nothing has to be re-extracted when the vind cluster is
    # recreated — the api-network Service VIP + DNS name are stable. bound_issuer stays
    # the in-cluster OIDC issuer; only the key-fetch URL is over the tailnet.
    #
    # network_jwks_url is that reverse proxy's JWKS endpoint (a plain public HTTPS name,
    # no MagicDNS). OpenBao reaches it DIRECTLY: the name resolves via the public
    # external-dns A record to the api-network Service's stable tailnet VIP, which the
    # secret cluster routes to over its tailnet connectivity — no per-service Tailscale
    # egress proxy is involved (the old tailnet-fqdn egress Service was a no-op and was
    # removed; a fresh operator rejects a public-name tailnet-fqdn anyway). Empty would
    # disable the jwt-network backend (same gate as before).
    network_oidc_issuer: https://kubernetes.default.svc.cluster.local
    network_jwks_url: https://api.network.vgijssel.nl/openid/v1/jwks
