# terranetes Configuration: reconciles the OpenTofu module apps/secret/src/openbao-config
# in-cluster, continuously, against the SAME kubernetes-backend state the local
# secret:configure apply seeded. Named `openbao-config` in ns `secret` so the
# backend template ({{ .name }}/{{ .namespace }}) resolves to the one Secret
# tfstate-default-openbao-config — no second state, no fighting.
#
# auth_method=kubernetes: the runner logs into OpenBao with its ServiceAccount +
# the `terranetes` role (no root token in-cluster). The first local root-token apply
# created that role, so this login path already exists.
#
# Handoff safety: enableAutoApproval starts false so the first run only PLANs — verify
# it is a no-op against the shared state before flipping to true (T15). Drift detection
# then re-applies the module on the controller interval, reverting out-of-band changes.
#
# NOTE: the module `ref` tracks the branch carrying this work; update it to `main`
# once merged (and the future Rancher GitRepo tracks the same path).
apiVersion: terraform.appvia.io/v1alpha1
kind: Configuration
metadata:
  name: openbao-config
  namespace: secret
spec:
  module: https://github.com/vgijssel/setup.git//apps/secret/src/openbao-config?ref=mg/feat/deploy-gateway
  providerRef:
    name: openbao
  enableAutoApproval: false
  enableDriftDetection: true
  variables:
    auth_method: kubernetes
    bao_address: http://openbao.secret.svc:8200
    k8s_auth_role: terranetes
