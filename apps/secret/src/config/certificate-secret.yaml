# Let's Encrypt cert for secret.vgijssel.nl, issued over Cloudflare DNS-01 by the
# letsencrypt-prod ClusterIssuer. cert-manager writes the chain into the
# secret-vgijssel-nl-tls Secret in the `secret` namespace, which the OpenBao
# Ingress (ingress-openbao.yaml) terminates TLS with. Namespace `secret` is set
# explicitly so the Ingress backend (openbao) and this cert share a namespace.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: secret-vgijssel-nl
  namespace: secret
spec:
  secretName: secret-vgijssel-nl-tls
  dnsNames:
    - secret.vgijssel.nl
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
