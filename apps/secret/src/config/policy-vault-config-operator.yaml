# The operator's own admin policy. Scoped to exactly what it manages: secret- and
# auth-engine mounts, ACL policies, and the kubernetes auth method's config/roles.
# It deliberately grants NO access to kv data — external-secrets reads that, not
# the operator.
#
# This MUST stay byte-for-byte in sync with the policy planted by the
# init-openbao.sh seam: the operator adopts its own policy on reconcile, and a
# matching body is a no-op overwrite (spike-validated: no self-lockout when the
# CR content matches the planted object).
apiVersion: redhatcop.redhat.io/v1alpha1
kind: Policy
metadata:
  name: vault-config-operator
  namespace: vault-config-operator
spec:
  authentication:
    path: kubernetes
    role: vault-config-operator
    serviceAccount:
      name: controller-manager
  policy: |
    # secret engine mounts (kv)
    path "sys/mounts" {
      capabilities = ["read", "list"]
    }
    path "sys/mounts/*" {
      capabilities = ["create", "read", "update", "delete"]
    }
    # auth method mounts (kubernetes)
    path "sys/auth" {
      capabilities = ["read", "list"]
    }
    path "sys/auth/*" {
      capabilities = ["create", "read", "update", "delete", "sudo"]
    }
    # ACL policies (external-secrets, and this policy itself). vault-config-operator
    # reads/writes policies via the legacy sys/policy endpoint; grant it plus the
    # modern sys/policies/acl alias.
    path "sys/policy" {
      capabilities = ["read", "list"]
    }
    path "sys/policy/*" {
      capabilities = ["create", "read", "update", "delete", "list"]
    }
    path "sys/policies/acl" {
      capabilities = ["list"]
    }
    path "sys/policies/acl/*" {
      capabilities = ["create", "read", "update", "delete", "list"]
    }
    # kubernetes auth method config + roles
    path "auth/kubernetes/*" {
      capabilities = ["create", "read", "update", "delete", "list"]
    }
