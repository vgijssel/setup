# Syncs the SECRET cluster's OWN Tailscale operator OAuth client from OpenBao into the
# `operator-oauth` secret the operator expects (Phase 8 / T23). Split out of the shared
# platform-config ExternalSecret so each cluster has an independent credential + tag
# identity (mirrors the T5 ClusterSecretStore split): the secret cluster reads
# kv/secret-tailscale-operator, the network cluster reads kv/network-tailscale-operator.
# This bounds the
# blast radius of a rotation/compromise to one cluster and lets ACLs name direction
# (tag:secret-k8s vs tag:network-k8s) instead of a shared tag:k8s.
#
# Requires kv/secret-tailscale-operator seeded with oauth_client_id/oauth_client_secret
# for the OAuth client tagged tag:secret-operator (created in the Tailscale admin console).
#
# MIGRATION GOTCHA: the target uses creationPolicy: Owner, so the operator-oauth Secret
# carries an ownerReference to its ExternalSecret. Pruning the OLD shared ES therefore
# GARBAGE-COLLECTS the Secret (it is NOT retained) — so this replacement must be applied
# immediately after the prune. The running tailscale operator survives the brief gap only
# because it caches its OAuth creds in memory (it re-reads on pod restart), so do NOT
# restart operators between the prune and T24's deliberate roll. defaultTags flip in T24.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: operator-oauth
  namespace: tailscale
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: operator-oauth
    creationPolicy: Owner
  data:
    - secretKey: client_id
      remoteRef:
        key: secret-tailscale-operator
        property: oauth_client_id
    - secretKey: client_secret
      remoteRef:
        key: secret-tailscale-operator
        property: oauth_client_secret
