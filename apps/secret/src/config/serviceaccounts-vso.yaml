# The ServiceAccounts Vault Secrets Operator logs in to OpenBao as, one per consuming namespace.
#
# WHY THEY ARE ALL HERE rather than beside each consumer: the VaultAuth CRD requires the login SA
# to "reside in the consuming secret's namespace", and several namespaces have consumers spread
# across MORE THAN ONE bundle — crossplane-system is served by both openbao-config and
# cloudflare-config. Defining the SA in each of those would make two bundles claim the same
# object and Fleet would report "not owned by us". One definition, in the cluster's config bundle,
# avoids that entirely.
#
# No dependsOn is needed in either direction. VSO retries a failed login, so a VaultStaticSecret
# or VaultDynamicSecret that reconciles before its SA exists simply succeeds on a later pass —
# the same eventual-consistency the ESO resources relied on for namespaces created by other
# bundles.
#
# A DEDICATED SA rather than `default`: the `vault-secrets-operator` OpenBao role carries the
# lease-management grants (sys/leases/renew|revoke|lookup), and binding `default` would hand those
# to anything able to mint a default-SA token in these namespaces.
#
# Keep this list in step with TWO other places, or logins fail with a confusing permission error:
#   - boundServiceAccountNamespaces in ../openbao-config/role-vault-secrets-operator.yaml
#     (which namespaces may actually log in)
#   - allowedNamespaces on the `secret` target in
#     ../../../platform/src/vault-secrets-operator/fleet.yaml (which may use the default auth)
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets-operator
  namespace: cert-manager
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets-operator
  namespace: crossplane-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets-operator
  namespace: netbird
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets-operator
  namespace: netdata
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets-operator
  namespace: secret
