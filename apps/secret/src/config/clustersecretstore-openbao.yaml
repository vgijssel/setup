# The `secret` cluster's ClusterSecretStore. Moved here (out of the shared
# platform-config bundle) as part of the multi-cluster refactor: the store is the
# ONE piece of ESO config that differs per cluster. `secret` runs OpenBao locally,
# so in-cluster ESO reaches it directly over the ClusterIP service and authenticates
# with the operator's ServiceAccount via OpenBao's Kubernetes auth method — no static
# token on disk. The `network` cluster has no local OpenBao; it owns a REMOTE,
# JWT-auth store of the same name `openbao` under apps/network/src/config, so the
# shared ExternalSecrets (which only reference the store by name) work on both.
#
# This bundle (secret-config) is secret-only, so keeping the store here gates it to
# `secret` without any target selector. The spec below is unchanged from its previous
# home, so secret's rendered ClusterSecretStore is byte-for-byte identical.
#
# Stays NotReady until OpenBao is deployed (apps/secret) and initialised with the
# kubernetes auth method + `external-secrets` role (secret:bootstrap/configure).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: http://openbao.secret.svc:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
