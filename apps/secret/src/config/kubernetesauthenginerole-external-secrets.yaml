# Login role for external-secrets: binds the ESO ServiceAccount
# (external-secrets in the external-secrets namespace) to the read-only
# external-secrets policy. The ClusterSecretStore authenticates against this role
# (mountPath kubernetes, role external-secrets). Mirrors the role the
# init-openbao.sh script used to write imperatively; now owned by the operator.
apiVersion: redhatcop.redhat.io/v1alpha1
kind: KubernetesAuthEngineRole
metadata:
  name: external-secrets
  namespace: vault-config-operator
spec:
  authentication:
    path: kubernetes
    role: vault-config-operator
    serviceAccount:
      name: controller-manager
  path: kubernetes
  policies:
    - external-secrets
  targetServiceAccounts:
    - external-secrets
  targetNamespaces:
    targetNamespaces:
      - external-secrets
