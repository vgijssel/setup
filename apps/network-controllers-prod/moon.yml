language: javascript
layer: application
tags:
  - app
  - terraform
  - hetzner
  - infrastructure
tasks:
  secrets:
    command: op inject --account my.1password.com --force -i .env.tpl -o secrets/.env
    env:
      CWD: apps/network-controllers-prod
    inputs:
      - file: .env.tpl
    outputs:
      - secrets/.env
    options:
      runInCI: false
      cache: false
  init:
    command: set -a && source secrets/.env && set +a && tofu init -backend-config="bucket=$TF_VAR_s3_bucket"
    deps:
      - ~:secrets
    env:
      CWD: apps/network-controllers-prod
    options:
      runInCI: false
  plan:
    command: set -a && source secrets/.env && set +a && tofu plan
    deps:
      - ~:init
    env:
      CWD: apps/network-controllers-prod
    options:
      runInCI: false
  apply:
    command: set -a && source secrets/.env && set +a && tofu apply -auto-approve
    deps:
      - ~:init
    env:
      CWD: apps/network-controllers-prod
    options:
      runInCI: false
      interactive: true
  destroy:
    command: set -a && source secrets/.env && set +a && tofu destroy -auto-approve
    deps:
      - ~:init
    env:
      CWD: apps/network-controllers-prod
    options:
      runInCI: false
      interactive: true
  output:
    command: set -a && source secrets/.env && set +a && tofu output
    deps:
      - ~:init
    env:
      CWD: apps/network-controllers-prod
    options:
      runInCI: false
