# The Home Assistant OS image the guest boots from, on Harvester's DEFAULT backing-image backend.
#
# WHY NOT `backend: cdi`. An earlier revision used CDI to escape the per-image StorageClass name
# `lh-<image UID>`, which a VM manifest cannot predict. That escape was unnecessary:
# `spec.backingImageName` below makes `GetStorageClassName()` return the name verbatim
# (pkg/image/common/operator.go), so the class is called `haos-18-2` and the boot disk can name
# it in git. The field is immutable and valid only with this backend.
#
#     a set backingImageName is returned unchanged, ahead of the lh-<uid> fallback
#
# Choosing CDI to solve a problem this field already solved is what produced every failure that
# followed: a DataVolume sized from an HTTP header, a clone that needed a VolumeSnapshotClass,
# a CDI-owned StorageProfile Helm could not adopt, and a populator wedged by hand. None of that
# machinery exists here. Longhorn downloads the file, inspects it with `qemu-img info`, and VM
# disks are thin deltas on the backing image, so there is also no fully allocated golden PVC
# costing 32 GiB per replica.
#
# ─── THE URL IS STILL WRONG, AND THIS IS THE ONE THING LEFT TO FIX. ──────────────────────────
# Longhorn validates a downloaded file with `qemu-img info` (pkg/util/util.go), and qemu-img
# reads qcow2 and raw - NOT `.xz`, and not `.gz` either: `GunzipFile` exists in
# backing-image-manager but is referenced only by its tests, never on the download path. There
# is no `xz` anywhere in that repository.
#
# So the URL below CANNOT import. It is kept pointing at upstream only so the artifact that is
# wanted is unambiguous, and because the rest of this file is correct and worth landing: fixing
# it is a one-line change once a decompressed copy is hosted somewhere this cluster can reach.
# Home Assistant publishes no uncompressed artifact - every asset is .xz, .ova or .zip - so that
# copy has to be produced once and served, for example as a release asset on this repository
# (~1.09 GiB, inside GitHub's 2 GiB per-asset limit).
#
# Why UPLOAD works and download does not, since the asymmetry is the whole story: an upload hands
# Longhorn the actual bytes, so it writes the file and reads the real virtual size out of the
# qcow2 header. That is why the guest this replaces reported size 1091698688 with virtualSize
# 34359738368 from an uploaded qcow2. A download has to be fetched before it can be inspected,
# and anything qemu-img cannot parse is treated as raw at its on-disk length.
# ────────────────────────────────────────────────────────────────────────────────────────────
#
# `storageClassParameters` are inherited into the per-image StorageClass alongside the backing
# image name (GetImageStorageClassParameters), and match longhorn-ssd deliberately: without them
# the class falls back to Longhorn defaults and loses the ssd disk selector, the three replicas
# and `migratable`, which is what keeps the guest live-migratable during node maintenance.
#
# `checksum` is empty because Home Assistant publishes no checksum assets for its release
# artifacts. Pin it once the URL is final and a real digest exists.
#
# UPGRADING HAOS is a NEW OBJECT, never an edit: `url`, `backend` and `backingImageName` are all
# immutable, so 19.x arrives as a sibling and the VM's imageId annotation and boot-disk
# storageClassName move to it.
apiVersion: harvesterhci.io/v1beta1
kind: VirtualMachineImage
metadata:
  name: haos-18-2
  namespace: haos
  annotations:
    field.cattle.io/description: Home Assistant OS 18.2
  # No labels and no `harvesterhci.io/storageClassName` annotation: the image mutator keeps that
  # annotation in sync with spec.targetStorageClassName itself, and image-type, imageDisplayName
  # and os-type are all populated by the controller once it has inspected the artifact.
spec:
  backend: backingimage
  # Pins both the Longhorn BackingImage name and, through GetStorageClassName, the per-image
  # StorageClass name. This is what the VM's boot disk references.
  backingImageName: haos-18-2
  displayName: haos-os-18.2
  sourceType: download
  url: https://github.com/home-assistant/operating-system/releases/download/18.2/haos_ova-18.2.qcow2.xz
  checksum: ""
  targetStorageClassName: longhorn-ssd
  storageClassParameters:
    diskSelector: ssd
    encrypted: "false"
    migratable: "true"
    numberOfReplicas: "3"
    staleReplicaTimeout: "30"
  retry: 3
