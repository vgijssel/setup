# Fleet bundle for the Home Assistant guest: the namespace, the OS image, the VM, and the
# VLAN 30 network it attaches to. Split from apps/hypervisor/src/config deliberately, because
# Fleet applies a bundle as ONE atomic unit and these two have opposite risk profiles. A failed
# storage-fabric Setting must not be able to roll back a running VM, and a drifting VM
# annotation must not block a storage class. The guest lives under apps/smarthome and the
# fabric it runs on under apps/hypervisor for the same reason: they are owned and changed
# independently.
#
# WHAT THIS BUNDLE IS. A recipe for a bootable Home Assistant guest in namespace `haos`,
# replacing the hand-built one that ran in `default` since 2026-09-25. It builds an EMPTY HAOS
# install that boots to onboarding; the Home Assistant data is restored into it from a Home
# Assistant full backup. That split is deliberate. HA's own backup is the only artifact that
# actually understands the config, database, add-ons and integration state, and it survives an
# OS version change, which is why no part of the old guest's disk is carried across.
#
# ─── THIS WAS A HARD CUTOVER. WHAT IT DELETED, AND WHY THAT WAS SAFE TO DO. ─────────────────
# Harvester is a Fleet DOWNSTREAM cluster (`c-27cxq`) of the Rancher running in k3k, NOT a
# self-managed one. The GitRepo `fleet-default/setup-harvester` watches `paths: [apps]` on
# `branch: main` with `correctDrift: true`, and it names bundles after their PATH, so
# `apps/hypervisor/src/haos` was `setup-harvester-apps-hypervisor-src-haos` with Helm release
# `hypervisor-haos`.
#
# Removing that directory in the same change that added this one deleted its Bundle, which made
# Fleet uninstall the release and with it `vm/haos`, `virtualmachineimage/image-j9gz6` and
# `nad/lan-automation` - `keepResources` was unset. Because the old guest's disk was a thin
# DELTA on Longhorn BackingImage `vmi-29d272bd-...`, losing the image destroyed the data too.
# That was accepted deliberately: a Home Assistant backup was taken first and the instance held
# little state. It is NOT the safe way to migrate a guest in general; the safe way is additive,
# adding the new path, verifying, and deleting the old path last.
#
# Ordering inside the single sync was never a risk despite this VM reusing the old MAC: the old
# VM is deleted in seconds, while this one cannot boot until CDI has imported the artifact and
# cloned a 32 GiB disk.
#
# LEFT BEHIND, NEEDS A MANUAL DELETE: `default/haos-disk-0-xiq8m`. The PVC carried no ownership
# metadata and no ownerReferences, so the Helm uninstall left it alone, and Fleet does not
# manage it. It is 32 GiB of Longhorn capacity backing a volume whose backing image is gone, so
# it is unrecoverable dead weight rather than a fallback. `kubectl -n default delete pvc
# haos-disk-0-xiq8m`.
#
# `correctDrift: true` MEANS HAND EDITS GET REVERTED. Stopping this VM from the Harvester UI, or
# patching it with kubectl, is drift that Fleet corrects. Stop it by committing
# `runStrategy: Halted`, not from a console.
#
# Also note Harvester's OWN embedded Fleet (`fleet-local/local`) is a separate, parallel Fleet
# that manages only `mcc-*` charts. Querying it shows no GitRepo and no repo bundles, which
# proves NOTHING about what this repo deploys. Query the k3k Rancher instead - its kubeconfig
# is `rancher-k3k/k3k-rancher-k3k-cluster-kubeconfig` on the Harvester cluster.
# ────────────────────────────────────────────────────────────────────────────────────────────
#
# NO `helm.takeOwnership`. The bundle this replaced needed it to adopt live objects that
# predated it. Every object here is created by this bundle, so adoption does not apply and the
# ownership check should stay on - it is the thing that would catch an accidental collision
# with an object somebody else made.
#
# NO `diff.comparePatches`. KubeVirt and the Harvester controllers rewrite plenty here,
# including the VM's restart timestamp, its current addresses, the observed API versions, the
# image's detected type and size, and the NAD's probed route. Fleet only compares fields the
# manifest declares, and none of those are. See the measured evidence in
# apps/hypervisor/src/config/fleet.yaml; a new map key is invisible to Fleet's drift check, so
# the fix is to omit controller-owned fields rather than to enumerate them as ignores.
#
# dependsOn hypervisor-config: the boot disk is provisioned on `longhorn-ssd`, which that
# bundle owns, and so is the image's golden PVC. The selector is by label, so the dependency
# survives the two bundles living in different apps.
#
# ─── WHAT TO WATCH AFTER THE MERGE ──────────────────────────────────────────────────────────
# Against the k3k Rancher, confirm `setup-harvester-apps-hypervisor-src-haos` is gone and
# `setup-harvester-apps-smarthome-src-haos` is ready. Against Harvester:
#
#   kubectl -n haos get virtualmachineimage haos-os-18-2 -o jsonpath='{.status.progress}'
#   kubectl -n haos get dv,pvc                 # haos-disk-0 reaches Succeeded / Bound
#   kubectl -n haos get vm,vmi                 # haos Running, then an address on VLAN 30
#
# The image import plus clone takes minutes; the VM stays Pending on its PVC until then, which
# is normal and not a failure. Then reach Home Assistant on 192.168.30.30:8123 and restore the
# backup from HAOS onboarding.
# ────────────────────────────────────────────────────────────────────────────────────────────
labels:
  fleet.blueora.ng/bundle: smarthome-haos
defaultNamespace: haos
helm:
  releaseName: smarthome-haos
dependsOn:
  - selector:
      matchLabels:
        fleet.blueora.ng/bundle: hypervisor-config
# harvester-ONLY. The selector alone restricts nothing under a Rancher GitRepo, which appends
# its own catch-all target. The terminal doNotDeploy entry below is what restricts this.
targetCustomizations:
  - name: harvester
    clusterSelector:
      matchLabels:
        cluster.blueora.ng/name: harvester
  # Terminal catch-all. Targets are first-match-wins and a GitRepo APPENDS its own target
  # after these, so without this a non-matching cluster falls through to it and deploys with
  # default values. Keeps this bundle off every cluster not named here. See bin/fleet-lint-targets.
  - name: none
    doNotDeploy: true
    clusterSelector: {}
