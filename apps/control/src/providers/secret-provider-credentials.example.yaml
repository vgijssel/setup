# TEMPLATE ONLY — do NOT commit real values. The actual Secrets are created at
# bootstrap from OpenBao/1Password (SPEC §4/§10), never from git.
#
# The `credentials` key holds a YAML MAP of environment-variable name -> value.
# terraform-controller (provider: custom) injects every entry as an env var into
# the Terraform executor before `terraform init`, so the provider block picks them
# up (e.g. the `vault`/`tailscale` Terraform providers read VAULT_*/TAILSCALE_*).
---
apiVersion: v1
kind: Secret
metadata:
  name: vault-provider-credentials
  namespace: default
type: Opaque
stringData:
  # NB: a YAML string whose CONTENT is itself a YAML map (env -> value).
  credentials: |
    VAULT_ADDR: https://REPLACE_ME:8200
    VAULT_TOKEN: REPLACE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: tailscale-provider-credentials
  namespace: default
type: Opaque
stringData:
  credentials: |
    TAILSCALE_OAUTH_CLIENT_ID: REPLACE_ME
    TAILSCALE_OAUTH_CLIENT_SECRET: REPLACE_ME
