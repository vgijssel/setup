# P2.1 — the `secret` child vcluster, created BY KubeVela in the base cluster.
#
# A nested vcluster (proven in Task 1.4) via the built-in `helmchart` component
# (no FluxCD), pinned vcluster 0.32.1. The vcluster's API is a ClusterIP Service
# `secret.secret` reachable in-cluster; the root joins it over that endpoint
# (`https://secret.secret:443` — matches the vcluster serving-cert SAN `<name>.<ns>`).
# The join itself is done by control:up (libs/vcluster-join) right after the
# vcluster is Ready — KubeVela has no native vcluster-join step (SPEC §9 #7).
#
# The child's platform + workloads (cert-manager, ESO, tailscale, OpenBao) are
# dispatched by SEPARATE Applications via `topology -> secret` once it is joined
# (P2.2+), keeping "create the child" and "fill the child" as independent slices.
apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: child-secret
  namespace: vela-system
spec:
  components:
    - name: secret
      type: helmchart
      properties:
        chart:
          source: vcluster
          repoURL: https://charts.loft.sh
          version: 0.32.1
        release:
          name: secret
          namespace: secret
        # No options.wait: waiting for the vcluster pod inside the helm reconcile
        # makes it a ~25s blocking reconcile that races the Application status
        # writer (optimistic-lock conflict) and wedges the app at "rendering".
        # We apply fast here and let control:up's join helper do the readiness wait.
