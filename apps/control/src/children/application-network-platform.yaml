# P3.1b — the `network` child's BASE platform, dispatched from the root into the
# child via `topology -> network`. Mirrors the secret child's platform
# (application-secret-platform.yaml) MINUS OpenBao: network has no local secret
# store — it reads the SECRET child's OpenBao over the tailnet (JWT auth). That
# cross-cluster ClusterSecretStore + its ExternalSecrets are added in Task 3.1f,
# after the JWKS-over-tailnet path (api-network + jwt-network backend) exists.
#
# Same patterns as secret-platform: each helm chart is paired with a k8s-objects
# Namespace it dependsOn (helm's own createNamespace does not apply across topology
# dispatch); CRDs for ESO + tailscale are installed out-of-band by control:up
# (libs/eso-crds, libs/tailscale-crds) so both charts run installCRDs=false.
apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: network-platform
  namespace: vela-system
spec:
  components:
    # ── namespaces (created in the child before the charts land) ──────────────
    - name: ns-cert-manager
      type: k8s-objects
      properties:
        objects:
          [
            {
              apiVersion: v1,
              kind: Namespace,
              metadata: { name: cert-manager },
            },
          ]
    - name: ns-external-secrets
      type: k8s-objects
      properties:
        objects:
          [
            {
              apiVersion: v1,
              kind: Namespace,
              metadata: { name: external-secrets },
            },
          ]
    - name: ns-tailscale
      type: k8s-objects
      properties:
        objects:
          [{ apiVersion: v1, kind: Namespace, metadata: { name: tailscale } }]

    # ── cert-manager (CRDs + DNS-01 self-check against public resolvers) ───────
    - name: cert-manager
      type: helmchart
      dependsOn: [ns-cert-manager]
      properties:
        chart:
          {
            source: cert-manager,
            repoURL: https://charts.jetstack.io,
            version: v1.20.3,
          }
        release: { name: cert-manager, namespace: cert-manager }
        values:
          # CRDs installed out-of-band by libs/cert-manager-crds (control:up):
          # KubeVela's dispatch path strips the CRD status subresource, so
          # cert-manager can't persist Issuer/Certificate status and no cert ever
          # issues. Same class of fix as ESO + tailscale CRDs (installCRDs: false).
          crds: { enabled: false }
          dns01RecursiveNameservers: 1.1.1.1:53,8.8.8.8:53
          dns01RecursiveNameserversOnly: true

    # ── external-secrets operator (CRDs installed out-of-band; see secret-platform) ─
    - name: external-secrets
      type: helmchart
      dependsOn: [ns-external-secrets]
      properties:
        chart:
          {
            source: external-secrets,
            repoURL: https://charts.external-secrets.io,
            version: 2.0.1,
          }
        release: { name: external-secrets, namespace: external-secrets }
        values:
          installCRDs: false

    # ── tailscale operator (network cluster identity) ─────────────────────────
    # Distinct per-cluster tags from secret (tag:network-operator/tag:network-k8s) so
    # cross-cluster ACL grants express direction (network -> secret reads, secret ->
    # network JWKS). CRDs out-of-band (installCRDs: false). The operator reads its
    # OAuth from the `operator-oauth` Secret; on network that Secret is seeded
    # out-of-band by libs/network-bringup (Task 3.1c) to break the chicken-and-egg
    # (ESO cannot sync it until the operator's tailnet path exists), then ESO takes
    # it over (Task 3.1f). Stays not-Ready until that Secret exists.
    - name: tailscale-operator
      type: helmchart
      dependsOn: [ns-tailscale]
      properties:
        chart:
          {
            source: tailscale-operator,
            repoURL: https://pkgs.tailscale.com/helmcharts,
            version: 1.90.9,
          }
        release: { name: tailscale-operator, namespace: tailscale }
        values:
          installCRDs: false
          operatorConfig:
            hostname: network-operator
            defaultTags: [tag:network-operator]
          proxyConfig:
            defaultTags: tag:network-k8s

    # ── cert-manager LE-prod ClusterIssuer (Cloudflare DNS-01) ────────────────
    # Used by the Omada cert (Task 3.2). The cloudflare-api-token ExternalSecret it
    # relies on is added with the cross-cluster store in Task 3.1f.
    - name: clusterissuer-letsencrypt-prod
      type: k8s-objects
      dependsOn: [cert-manager]
      properties:
        objects:
          - apiVersion: cert-manager.io/v1
            kind: ClusterIssuer
            metadata: { name: letsencrypt-prod }
            spec:
              acme:
                server: https://acme-v02.api.letsencrypt.org/directory
                email: vassal_preview_4s@icloud.com
                privateKeySecretRef: { name: letsencrypt-prod-account-key }
                solvers:
                  - dns01:
                      cloudflare:
                        apiTokenSecretRef:
                          { name: cloudflare-api-token, key: api-token }
    # ── network kube-API OIDC exposure on the tailnet (Task 3.1d) ─────────────
    # secret's OpenBao validates network JWTs by fetching THIS cluster's JWKS. The
    # old api.network.vgijssel.nl nginx+LE proxy is gone (SPEC §3); instead expose
    # the kube-apiserver as the Tailscale Service `svc:api-network` via a
    # `kube-apiserver` ProxyGroup in `noauth` mode. noauth means requests arrive as
    # system:anonymous, so OpenBao's unauthenticated JWKS GET is authorized ONLY for
    # the two OIDC discovery endpoints by the ClusterRoleBinding below; every other
    # API path stays denied for anonymous. The proxies carry tag:network-k8s
    # (proxyConfig.defaultTags), which the tailnet ACL auto-approves for svc:api-network
    # and grants tag:secret-k8s -> svc:api-network:443 (verified live).
    - name: proxygroup-api-network
      type: k8s-objects
      dependsOn: [tailscale-operator]
      properties:
        objects:
          - apiVersion: tailscale.com/v1alpha1
            kind: ProxyGroup
            metadata: { name: api-network }
            spec:
              type: kube-apiserver
              replicas: 2
              kubeAPIServer:
                mode: noauth
                hostname: api-network
    # Make the OIDC discovery endpoints anonymously readable so secret's OpenBao can
    # fetch this cluster's JWKS without credentials. system:service-account-issuer-discovery
    # grants GET on EXACTLY /openid/v1/jwks + /.well-known/openid-configuration and
    # nothing else; binding it to system:unauthenticated authorizes the anonymous
    # (noauth-proxied) read while leaving every other path denied.
    - name: clusterrolebinding-oidc-discovery
      type: k8s-objects
      properties:
        objects:
          - apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRoleBinding
            metadata: { name: oidc-discovery-unauthenticated }
            roleRef:
              apiGroup: rbac.authorization.k8s.io
              kind: ClusterRole
              name: system:service-account-issuer-discovery
            subjects:
              - apiGroup: rbac.authorization.k8s.io
                kind: Group
                name: system:unauthenticated
    # ── cross-cluster ESO store: read secret's OpenBao over the tailnet (Task 3.1f) ─
    # network has no local OpenBao. Its ClusterSecretStore reaches the SECRET child's
    # OpenBao at the svc:secret Tailscale Service (secret.tail2c33e2.ts.net, Task 3.1a)
    # and authenticates with JWT auth: ESO mints a projected SA token (audience
    # "openbao") for external-secrets and posts it to the jwt-network backend (Task
    # 3.1e); OpenBao validates it against network's JWKS (fetched over the tailnet from
    # svc:api-network) and grants the read-only network-read policy. No static token.
    # In dev the pod reaches the VIP directly (the vind host is the tailnet node).
    - name: clustersecretstore-openbao
      type: k8s-objects
      dependsOn: [external-secrets]
      properties:
        objects:
          - apiVersion: external-secrets.io/v1
            kind: ClusterSecretStore
            metadata: { name: openbao }
            spec:
              provider:
                vault:
                  server: https://secret.tail2c33e2.ts.net
                  path: kv
                  version: v2
                  auth:
                    jwt:
                      path: jwt-network
                      role: network-eso
                      kubernetesServiceAccountToken:
                        serviceAccountRef:
                          {
                            name: external-secrets,
                            namespace: external-secrets,
                          }
                        audiences: [openbao]

    # ESO takes over the operator-oauth Secret that network-bringup seeded out-of-band.
    - name: externalsecret-operator-oauth
      type: k8s-objects
      dependsOn: [clustersecretstore-openbao, ns-tailscale]
      properties:
        objects:
          - apiVersion: external-secrets.io/v1
            kind: ExternalSecret
            metadata: { name: operator-oauth, namespace: tailscale }
            spec:
              refreshInterval: 1h
              secretStoreRef: { name: openbao, kind: ClusterSecretStore }
              target: { name: operator-oauth, creationPolicy: Owner }
              data:
                - {
                    secretKey: client_id,
                    remoteRef:
                      {
                        key: network-tailscale-operator,
                        property: oauth_client_id,
                      },
                  }
                - {
                    secretKey: client_secret,
                    remoteRef:
                      {
                        key: network-tailscale-operator,
                        property: oauth_client_secret,
                      },
                  }

    # cloudflare API token for the LE-prod DNS-01 issuer (used by Omada, Task 3.2).
    - name: externalsecret-cloudflare-api-token
      type: k8s-objects
      dependsOn: [clustersecretstore-openbao, ns-cert-manager]
      properties:
        objects:
          - apiVersion: external-secrets.io/v1
            kind: ExternalSecret
            metadata: { name: cloudflare-api-token, namespace: cert-manager }
            spec:
              refreshInterval: 1h
              secretStoreRef: { name: openbao, kind: ClusterSecretStore }
              target: { name: cloudflare-api-token, creationPolicy: Owner }
              data:
                - {
                    secretKey: api-token,
                    remoteRef: { key: cloudflare, property: credential },
                  }
  policies:
    - name: to-network
      type: topology
      properties:
        clusters: [network]
