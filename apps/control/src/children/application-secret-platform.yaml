# P2.2 — the `secret` child's platform, dispatched from the root into the child
# via `topology -> secret`. Converts the old Fleet bundles (apps/platform/src/*,
# apps/secret/src/openbao) to KubeVela helmchart Components.
#
# Pattern (proven Task 1.4 + P2.2): a helm chart delivered over topology needs its
# release namespace to already exist in the child (helm's own createNamespace does
# not apply across topology dispatch), so each chart is paired with a k8s-objects
# Namespace component it `dependsOn`.
#
# Charts are pinned to the same versions vendir already tracks. The `helmchart`
# component fetches from the upstream repo at reconcile (pinned by version), which
# is why these keep their public repoURLs rather than the vendored copy.
apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: secret-platform
  namespace: vela-system
spec:
  components:
    # ── namespaces (created in the child before the charts land) ──────────────
    - name: ns-cert-manager
      type: k8s-objects
      properties:
        objects:
          [
            {
              apiVersion: v1,
              kind: Namespace,
              metadata: { name: cert-manager },
            },
          ]
    - name: ns-external-secrets
      type: k8s-objects
      properties:
        objects:
          [
            {
              apiVersion: v1,
              kind: Namespace,
              metadata: { name: external-secrets },
            },
          ]
    - name: ns-tailscale
      type: k8s-objects
      properties:
        objects:
          [{ apiVersion: v1, kind: Namespace, metadata: { name: tailscale } }]
    - name: ns-secret
      type: k8s-objects
      properties:
        objects:
          [{ apiVersion: v1, kind: Namespace, metadata: { name: secret } }]

    # ── cert-manager (CRDs + DNS-01 self-check against public resolvers) ───────
    - name: cert-manager
      type: helmchart
      dependsOn: [ns-cert-manager]
      properties:
        chart:
          {
            source: cert-manager,
            repoURL: https://charts.jetstack.io,
            version: v1.20.3,
          }
        release: { name: cert-manager, namespace: cert-manager }
        values:
          crds: { enabled: true }
          dns01RecursiveNameservers: 1.1.1.1:53,8.8.8.8:53
          dns01RecursiveNameserversOnly: true

    # ── external-secrets operator (CRDs installed out-of-band) ─────────────────
    # installCRDs is OFF: two ESO CRDs (clustersecretstores/secretstores) are
    # ~590 KiB each. KubeVela's apply path stamps a last-applied-configuration
    # annotation (a serialized copy of the object) on every dispatched resource,
    # which pushes those CRDs past the API server's 256 KiB annotation limit
    # ("metadata.annotations: Too long"), failing the deploy step. vela-core
    # v1.11.0 has no apply-by-update / server-side-apply mode to avoid that
    # annotation, so the CRDs cannot be delivered as a KubeVela Component.
    # control:up server-side-applies them into the child first (libs/eso-crds,
    # over the same cluster-gateway path) — SSA adds no last-applied annotation.
    - name: external-secrets
      type: helmchart
      dependsOn: [ns-external-secrets]
      properties:
        chart:
          {
            source: external-secrets,
            repoURL: https://charts.external-secrets.io,
            version: 2.0.1,
          }
        release: { name: external-secrets, namespace: external-secrets }
        values:
          installCRDs: false

    # ── tailscale operator (secret cluster identity) ──────────────────────────
    # oauth block intentionally unset: the operator reads its OAuth client from the
    # precreated `operator-oauth` Secret (synced from OpenBao by secret-config).
    # Stays not-Ready until that Secret exists (expected during bootstrap).
    - name: tailscale-operator
      type: helmchart
      dependsOn: [ns-tailscale]
      properties:
        chart:
          {
            source: tailscale-operator,
            repoURL: https://pkgs.tailscale.com/helmcharts,
            version: 1.90.9,
          }
        release: { name: tailscale-operator, namespace: tailscale }
        values:
          operatorConfig:
            hostname: secret-operator
            defaultTags: [tag:secret-operator]
          proxyConfig:
            defaultTags: tag:secret-k8s

    # ── OpenBao (single-node raft, static auto-unseal) ────────────────────────
    # Boots UNSEALED once the `openbao-seal` Secret exists (seeded by the P2.4
    # bootstrap Workflow); until then the pod stays in CreateContainerConfigError.
    - name: openbao
      type: helmchart
      dependsOn: [ns-secret]
      properties:
        chart:
          {
            source: openbao,
            repoURL: https://openbao.github.io/openbao-helm,
            version: 0.28.4,
          }
        release: { name: openbao, namespace: secret }
        values:
          # The agent-injector does sidecar secret injection; this platform uses
          # external-secrets (ESO) instead, so the injector is dead weight.
          injector:
            enabled: false
          server:
            # The chart's default HA podAntiAffinity is a hard (required) rule that
            # spreads server pods across hosts by hostname. On the single-node vind
            # dev cluster it can never be satisfied, so openbao-0 stays Pending.
            # Clear it — one node, one replica. (Prod, multi-node, can restore it.)
            affinity: ""
            extraSecretEnvironmentVars:
              - {
                  envName: SEAL_KEY,
                  secretName: openbao-seal,
                  secretKey: seal-key,
                }
            ha:
              enabled: true
              replicas: 1
              raft:
                enabled: true
                setNodeId: true
                config: |
                  ui = true

                  listener "tcp" {
                    tls_disable = 1
                    address = "[::]:8200"
                    cluster_address = "[::]:8201"
                  }

                  storage "raft" {
                    path = "/openbao/data"
                  }

                  service_registration "kubernetes" {}

                  seal "static" {
                    current_key_id = "secret-2026-07"
                    current_key    = "env://SEAL_KEY"
                  }
            dataStorage:
              enabled: true
              size: 1Gi

    # ── ESO config: the child's ClusterSecretStore (in-cluster k8s auth) ───────
    # secret runs OpenBao locally, so ESO reaches it over the ClusterIP service and
    # authenticates with the operator's ServiceAccount via OpenBao's Kubernetes auth
    # (role `external-secrets`) — no static token. NotReady until OpenBao is
    # initialised + configured (P2.3/P2.4).
    - name: clustersecretstore-openbao
      type: k8s-objects
      dependsOn: [external-secrets]
      properties:
        objects:
          - apiVersion: external-secrets.io/v1
            kind: ClusterSecretStore
            metadata: { name: openbao }
            spec:
              provider:
                vault:
                  server: http://openbao.secret.svc:8200
                  path: kv
                  version: v2
                  auth:
                    kubernetes:
                      mountPath: kubernetes
                      role: external-secrets
                      serviceAccountRef:
                        { name: external-secrets, namespace: external-secrets }

    # ── cert-manager LE-prod ClusterIssuer (Cloudflare DNS-01) ────────────────
    - name: clusterissuer-letsencrypt-prod
      type: k8s-objects
      dependsOn: [cert-manager]
      properties:
        objects:
          - apiVersion: cert-manager.io/v1
            kind: ClusterIssuer
            metadata: { name: letsencrypt-prod }
            spec:
              acme:
                server: https://acme-v02.api.letsencrypt.org/directory
                email: vassal_preview_4s@icloud.com
                privateKeySecretRef: { name: letsencrypt-prod-account-key }
                solvers:
                  - dns01:
                      cloudflare:
                        apiTokenSecretRef:
                          { name: cloudflare-api-token, key: api-token }

    # ── ExternalSecrets sourced from OpenBao (pending until OpenBao configured) ─
    - name: externalsecret-operator-oauth
      type: k8s-objects
      dependsOn: [external-secrets, ns-tailscale]
      properties:
        objects:
          - apiVersion: external-secrets.io/v1
            kind: ExternalSecret
            metadata: { name: operator-oauth, namespace: tailscale }
            spec:
              refreshInterval: 1h
              secretStoreRef: { name: openbao, kind: ClusterSecretStore }
              target: { name: operator-oauth, creationPolicy: Owner }
              data:
                - {
                    secretKey: client_id,
                    remoteRef:
                      {
                        key: secret-tailscale-operator,
                        property: oauth_client_id,
                      },
                  }
                - {
                    secretKey: client_secret,
                    remoteRef:
                      {
                        key: secret-tailscale-operator,
                        property: oauth_client_secret,
                      },
                  }
    - name: externalsecret-cloudflare-api-token
      type: k8s-objects
      dependsOn: [external-secrets, ns-cert-manager]
      properties:
        objects:
          - apiVersion: external-secrets.io/v1
            kind: ExternalSecret
            metadata: { name: cloudflare-api-token, namespace: cert-manager }
            spec:
              refreshInterval: 1h
              secretStoreRef: { name: openbao, kind: ClusterSecretStore }
              target: { name: cloudflare-api-token, creationPolicy: Owner }
              data:
                - {
                    secretKey: api-token,
                    remoteRef: { key: cloudflare, property: credential },
                  }
  policies:
    - name: to-secret
      type: topology
      properties:
        clusters: [secret]
