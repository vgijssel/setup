language: bash
layer: application
project:
  description: network cluster — TP-Link Omada controller on the tailnet
tags:
  - app
  - kubernetes
  - helm
  - network
# Entry points. Each manages external cluster / Docker / tailnet / remote-OpenBao
# state (not file outputs), so none are cached. `start` runs the full bring-up
# end-to-end (create cluster → tailscale_auth → apply); the network cluster is a
# consumer of secrets, not a producer (no configure/producer step). Mirrors `secret`.
tasks:
  # Create (or reconnect to) the vind cluster "network", seed the Tailscale operator
  # OAuth client (tailscale_auth), then install Fleet + apply every bundle (apply).
  # Idempotent. This is the single bring-up command.
  start:
    command: scripts/start.sh
    options:
      runInCI: false
      interactive: true
      cache: false
  # Seed the Tailscale operator OAuth client (oauth_client_id/oauth_client_secret) from
  # the secret cluster's OpenBao (VAULT_TOKEN from .env) into the network cluster's
  # operator-oauth Secret — breaks the operator/ESO chicken-and-egg. Invoked by `start`;
  # also runnable standalone. Idempotent.
  tailscale_auth:
    command: scripts/tailscale_auth.sh
    options:
      runInCI: false
      interactive: true
      cache: false
  # Install the Fleet controller, label the local cluster network, and apply every
  # bundle via bin/fleet-apply. Invoked by `start`; also runnable standalone. Idempotent.
  apply:
    command: scripts/apply.sh
    options:
      runInCI: false
      interactive: true
      cache: false
  # Delete the vind vcluster (tailnet / 1Password / remote-OpenBao state persists).
  stop:
    command: scripts/stop.sh
    options:
      runInCI: false
      interactive: true
      cache: false
