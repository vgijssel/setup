language: javascript
layer: application
tags:
  - app
  - terraform
  - hetzner
  - infrastructure
  - kairos
tasks:
  # --- Image build & local validation (no cloud cost) ---
  build-image:
    # Usage: moon run apps/network:build-image            (arm64 fast loop, default)
    #        moon run apps/network:build-image -- amd64    (amd64 promotion gate)
    command: bash image/build.sh
    options:
      runInCI: false
      cache: false
  # Local QEMU boot + persistence rig (arm64 HVF fast loop; `-- amd64` for the TCG gate).
  vm-up:
    command: bash image/vm.sh up
    options:
      runInCI: false
      cache: false
  vm-verify:
    command: bash image/vm.sh verify
    options:
      runInCI: false
      cache: false
  vm-down:
    command: bash image/vm.sh down
    options:
      runInCI: false
      cache: false

  # --- Secrets + OpenTofu lifecycle (live; incurs cloud cost from `apply`) ---
  # Mirrors apps/network-controllers-prod: each tofu task sources secrets/.env (rendered
  # from 1Password) so HCLOUD/AWS/CF/TS/Netdata creds + TF_VAR_* reach tofu. The S3 bucket
  # is injected at init via -backend-config. `secrets/` is git-ignored and never committed.
  secrets:
    command: mkdir -p secrets && op inject --account my.1password.com --force -i .env.tpl -o secrets/.env
    env:
      CWD: apps/network
    inputs:
      - file: .env.tpl
    outputs:
      - secrets/.env
    options:
      runInCI: false
      cache: false
  init:
    command: set -a && source secrets/.env && set +a && tofu init -backend-config="bucket=$TF_VAR_s3_bucket"
    deps:
      - ~:secrets
    env:
      CWD: apps/network
    options:
      runInCI: false
  plan:
    command: set -a && source secrets/.env && set +a && tofu plan
    deps:
      - ~:init
    env:
      CWD: apps/network
    options:
      runInCI: false
  apply:
    command: set -a && source secrets/.env && set +a && tofu apply -auto-approve
    deps:
      - ~:init
    env:
      CWD: apps/network
    options:
      runInCI: false
      interactive: true
  destroy:
    command: set -a && source secrets/.env && set +a && tofu destroy -auto-approve
    deps:
      - ~:init
    env:
      CWD: apps/network
    options:
      runInCI: false
      interactive: true
  output:
    command: set -a && source secrets/.env && set +a && tofu output
    deps:
      - ~:init
    env:
      CWD: apps/network
    options:
      runInCI: false
