language: javascript
layer: application
tags:
  - app
  - terraform
  - hetzner
  - infrastructure
  - kairos
tasks:
  # --- Image build & local validation (no cloud cost) ---
  build-image:
    # Usage: moon run network:build-image            (arm64 fast loop, default)
    #        moon run network:build-image -- amd64    (amd64 prod artifact)
    command: bash image/build.sh
    options:
      runInCI: false
      cache: false
  # `build`: the shipped PROD artifact = amd64. Built natively on a GitHub Actions x86
  # runner (workflow: .github/workflows/network-deploy.yaml), so the UniFi OS Server
  # rootless-Podman bake runs WITHOUT QEMU emulation — the exact failure that forced the
  # earlier arm64 pivot (T7). Local dev keeps the arm64 fast loop via build-image/vm-*.
  build:
    command: bash image/build.sh amd64
    options:
      runInCI: false
      cache: false
  # Local QEMU boot + persistence rig (arm64 HVF fast loop; `-- amd64` for the TCG gate).
  vm-up:
    command: bash image/vm.sh up
    options:
      runInCI: false
      cache: false
  vm-verify:
    command: bash image/vm.sh verify
    options:
      runInCI: false
      cache: false
  vm-down:
    command: bash image/vm.sh down
    options:
      runInCI: false
      cache: false

  # Upload the built arm64 RAW to Hetzner as a snapshot (LIVE: creates+deletes a temp
  # server, small one-off cost). Sources secrets/.env for HCLOUD_TOKEN. Record the printed
  # snapshot id into var.image_snapshot_id. `-- amd64` only for a future native-amd64 host.
  upload:
    command: set -a && source secrets/.env && set +a && bash image/upload.sh
    deps:
      - ~:secrets
    env:
      CWD: apps/network
    options:
      runInCI: false
      cache: false

  # --- Secrets + OpenTofu lifecycle (live; incurs cloud cost from `apply`) ---
  # Mirrors apps/network-controllers-prod: each tofu task sources secrets/.env (rendered
  # from 1Password) so HCLOUD/AWS/CF/TS/Netdata creds + TF_VAR_* reach tofu. The S3 bucket
  # is injected at init via -backend-config. `secrets/` is git-ignored and never committed.
  secrets:
    # CI (GitHub Actions) authenticates via OP_SERVICE_ACCOUNT_TOKEN; locally there are
    # multiple 1Password accounts so disambiguate with --account. Same rendered output.
    command: mkdir -p secrets && if [ -n "$OP_SERVICE_ACCOUNT_TOKEN" ]; then op inject --force -i .env.tpl -o secrets/.env; else op inject --account my.1password.com --force -i .env.tpl -o secrets/.env; fi
    env:
      CWD: apps/network
    inputs:
      - file: .env.tpl
    outputs:
      - secrets/.env
    options:
      runInCI: false
      cache: false
  init:
    command: set -a && source secrets/.env && set +a && tofu init -backend-config="bucket=$TF_VAR_s3_bucket"
    deps:
      - ~:secrets
    env:
      CWD: apps/network
    options:
      runInCI: false
  plan:
    command: set -a && source secrets/.env && set +a && tofu plan
    deps:
      - ~:init
    env:
      CWD: apps/network
    options:
      runInCI: false
  apply:
    command: set -a && source secrets/.env && set +a && tofu apply -auto-approve
    deps:
      - ~:init
    env:
      CWD: apps/network
    options:
      runInCI: false
      interactive: true
  destroy:
    command: set -a && source secrets/.env && set +a && tofu destroy -auto-approve
    deps:
      - ~:init
    env:
      CWD: apps/network
    options:
      runInCI: false
      interactive: true
  output:
    command: set -a && source secrets/.env && set +a && tofu output
    deps:
      - ~:init
    env:
      CWD: apps/network
    options:
      runInCI: false

  # --- Build + publish image to Hetzner (manual) ------------------------------------
  # `moon run network:deploy` = build the amd64 Kairos image -> upload it to Hetzner as a
  # labelled snapshot (role=network,arch=amd64) via hcloud-upload-image. That is ALL it
  # does — it does NOT run tofu. Provisioning the server is a separate step (the `apply`
  # task), where hcloud_server.image auto-discovers the newest matching snapshot
  # (data.hcloud_image, see main.tf). Runs from GitHub Actions on a native x86 runner (so
  # the UOS bake needs no emulation) or locally. Sources secrets/.env for HCLOUD_TOKEN.
  deploy:
    command: set -a && source secrets/.env && set +a && bash image/upload.sh amd64
    deps:
      - ~:build
      - ~:secrets
    env:
      CWD: apps/network
    options:
      runInCI: false
      cache: false
