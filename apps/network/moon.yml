language: bash
layer: application
project:
  description: network cluster — TP-Link Omada controller on the NetBird mesh
tags:
  - app
  - kubernetes
  - helm
  - network
# Entry points. Each manages external cluster / Docker / NetBird / remote-OpenBao
# state (not file outputs), so none are cached. `start` runs the full bring-up
# end-to-end (create cluster → netbird_auth → apply); the network cluster is a
# consumer of secrets, not a producer (no configure/producer step). Mirrors `secret`.
tasks:
  # Create (or reconnect to) the vind cluster "network", seed the NetBird operator
  # management API PAT (netbird_auth), then install Fleet + apply every bundle (apply).
  # Idempotent. This is the single bring-up command.
  start:
    command: scripts/start.sh
    options:
      runInCI: false
      interactive: true
      cache: false
  # Seed the NetBird operator management API PAT (access_token) from the secret cluster's
  # OpenBao (VAULT_TOKEN from .env) into the network cluster's netbird-mgmt-api-key
  # Secret — breaks the operator/ESO chicken-and-egg. Invoked by `start`; also runnable
  # standalone. Idempotent.
  netbird_auth:
    command: scripts/netbird_auth.sh
    options:
      runInCI: false
      interactive: true
      cache: false
  # Mint the NetBird reverse-proxy proxy token the secret cluster's BYOP proxy authenticates
  # with, and stash it in the secret cluster's OpenBao (kv/secret-netbird-proxy#token) for ESO
  # to surface. Uses VAULT_TOKEN (secret root) from .env. Idempotent (skips if already set;
  # FORCE=1 re-mints). Standalone only — not part of `start`. See scripts/netbird_proxy_auth.sh.
  netbird_proxy_auth:
    command: scripts/netbird_proxy_auth.sh
    options:
      runInCI: false
      interactive: true
      cache: false
  # Install the Fleet controller, label the local cluster network, and apply every
  # bundle via bin/fleet-apply. Invoked by `start`; also runnable standalone. Idempotent.
  apply:
    command: scripts/apply.sh
    options:
      runInCI: false
      interactive: true
      cache: false
  # Delete the vind vcluster (tailnet / 1Password / remote-OpenBao state persists).
  stop:
    command: scripts/stop.sh
    options:
      runInCI: false
      interactive: true
      cache: false
