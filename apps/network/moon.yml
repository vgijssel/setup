language: bash
layer: application
project:
  description: network cluster — TP-Link Omada controller on the tailnet
tags:
  - app
  - kubernetes
  - helm
  - network
# Bring-up entry points, run in order. Each manages external cluster / Docker /
# tailnet / 1Password / remote-OpenBao state (not file outputs), so none are cached.
# Unlike `secret`, there is NO `configure` task here: the network cluster is a
# consumer of secrets, not a producer. The OpenBao grant that lets network read the
# remote OpenBao lives on the secret side (apps/secret/src/openbao-config, applied by
# `moon run secret:configure`).
tasks:
  # 1. Create (or reconnect to) the standalone vind cluster "network". Idempotent.
  start:
    command: scripts/start.sh
    options:
      runInCI: false
      interactive: true
      cache: false
  # 2. Seed operator-oauth from the remote OpenBao (secret-cluster root token) so the
  #    Tailscale operator can start before ESO is functional, then extract this
  #    cluster's OIDC issuer + JWKS for the secret-side JWT grant. Idempotent.
  bootstrap:
    command: scripts/bootstrap.sh
    options:
      runInCI: false
      interactive: true
      cache: false
  # 3. Install the Fleet controller, label the local cluster network, and apply the
  #    network + shared platform bundles (ingress-nginx excluded by its target).
  #    Idempotent.
  apply:
    command: scripts/apply.sh
    options:
      runInCI: false
      interactive: true
      cache: false
  # 4. First out-of-band apply of the tailscale-config OpenTofu module (root token +
  #    tailscale OAuth from OpenBao) — sets the tailnet ACL that lets the in-cluster
  #    runner reach OpenBao, breaking the chicken-and-egg. terranetes reconciles it
  #    thereafter. Analog of secret:configure. Idempotent.
  configure:
    command: scripts/configure.sh
    options:
      runInCI: false
      interactive: true
      cache: false
  # Delete the vind vcluster (tailnet / 1Password / remote-OpenBao state persists).
  stop:
    command: scripts/stop.sh
    options:
      runInCI: false
      interactive: true
      cache: false
