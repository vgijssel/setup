# Minimal Netdata config — only the bits that must differ from the compiled defaults.
# Unlisted options keep Netdata's built-in defaults.
#
# Relocate the persistent dirs onto the DATA VOLUME so metrics history and — critically —
# the Netdata Cloud claim state (cloud.d, under lib) survive a reboot AND a server recreate
# (SPEC §10). Netdata dirs are NOT in this Kairos build's default PERSISTENT_STATE_PATHS,
# so without this they'd sit on the ephemeral /var overlay and reset every boot.
# network-mount-data.sh creates + chowns these to the netdata user before the service starts.
[directories]
	lib = /var/lib/data/netdata
	cache = /var/lib/data/netdata-cache
	registry = /var/lib/data/netdata/registry
