# Relocate tailscaled's state onto the DATA VOLUME.
#
# This Kairos/Ubuntu build's default PERSISTENT_STATE_PATHS already bind /var/lib/tailscale
# onto the OS disk (COS_PERSISTENT) — that survives a reboot but is LOST on a server
# recreate. SPEC §10 requires controller/service state on the retained Volume so a rebuilt
# server restores it, so we point --state/--statedir at /var/lib/data/tailscale (the
# Volume) instead of fighting the default bind. network-mount-data.sh mounts the Volume
# and pre-creates the dir; ordering after cos-setup-boot + RequiresMountsFor guarantees it
# exists before tailscaled starts.
[Unit]
After=cos-setup-boot.service
RequiresMountsFor=/var/lib/data

[Service]
ExecStartPre=/usr/bin/mkdir -p /var/lib/data/tailscale
ExecStart=
ExecStart=/usr/sbin/tailscaled --state=/var/lib/data/tailscale/tailscaled.state --statedir=/var/lib/data/tailscale --socket=/run/tailscale/tailscaled.sock --port=${PORT} $FLAGS
