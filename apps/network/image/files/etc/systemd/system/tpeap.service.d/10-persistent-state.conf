# Ordering for the Omada controller (tpeap.service is generated by systemd's sysv-generator
# from /etc/init.d/tpeap → control.sh). Its data/logs are bind-mounted onto the data Volume
# by network-mount-data.sh during cos-setup-boot; gate the controller on those mounts +
# the network so the embedded mongod opens its DB on the Volume (survives reboot + recreate).
[Unit]
After=cos-setup-boot.service network-online.target
Wants=network-online.target
RequiresMountsFor=/opt/tplink/EAPController/data /opt/tplink/EAPController/logs
