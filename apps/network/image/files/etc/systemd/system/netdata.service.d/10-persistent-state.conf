# Gate netdata on the data volume: its lib/cache/registry dirs (netdata.conf) live on
# /var/lib/data, created + chowned by network-mount-data.sh during cos-setup-boot. Ordering
# after that stage + RequiresMountsFor guarantees the volume is mounted and the dirs are
# ready (owned by the netdata user) before netdata starts.
[Unit]
After=cos-setup-boot.service
RequiresMountsFor=/var/lib/data
