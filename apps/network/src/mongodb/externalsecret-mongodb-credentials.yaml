# Syncs the MongoDB root credentials from OpenBao (kv/mongodb) into the
# `mongodb-credentials` Secret with the env-var key names the mongo image consumes
# (MONGO_INITDB_ROOT_USERNAME / MONGO_INITDB_ROOT_PASSWORD). The chart injects this
# Secret via extraEnvSecrets (envFrom). Requires kv/mongodb (username, password)
# seeded in OpenBao; reads through the network cluster's remote JWT ClusterSecretStore.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mongodb-credentials
  namespace: mongodb
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: mongodb-credentials
    creationPolicy: Owner
  data:
    - secretKey: MONGO_INITDB_ROOT_USERNAME
      remoteRef:
        key: mongodb
        property: username
    - secretKey: MONGO_INITDB_ROOT_PASSWORD
      remoteRef:
        key: mongodb
        property: password
