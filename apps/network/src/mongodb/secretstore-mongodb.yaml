# ESO Kubernetes-provider store that lets the omada namespace's mongodb-uri ExternalSecret
# (T6.1) read the Percona-generated connection-string Secret
# (mongodb-custom-user-secret-conn-str) which lives in THIS mongodb namespace. Percona owns
# credential generation in-cluster, so this is a pure in-cluster copy/transform — no OpenBao
# path for MongoDB (the network cluster stays read-only on OpenBao).
#
# It is a ClusterSecretStore (not a namespaced SecretStore) because the consuming
# ExternalSecret lives in the omada namespace, and a namespaced store is only visible to
# ExternalSecrets in its own namespace. ESO authenticates as the eso-mongodb-reader
# ServiceAccount below (ESO mints a token for it via TokenRequest — the external-secrets
# controller ClusterRole already grants serviceaccounts/token create), which is granted
# read on Secrets in the mongodb namespace only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-mongodb-reader
  namespace: mongodb
---
# Least-privilege read of Secrets in the mongodb namespace (only mongo secrets live here).
# ESO validates a store with a SelfSubjectRulesReview, which every authenticated SA may
# already do via the built-in system:basic-user ClusterRole — so no extra rule is needed.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-mongodb-reader
  namespace: mongodb
rules:
  - apiGroups: [""]
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-mongodb-reader
  namespace: mongodb
subjects:
  - kind: ServiceAccount
    name: eso-mongodb-reader
    namespace: mongodb
roleRef:
  kind: Role
  name: eso-mongodb-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: mongodb
spec:
  provider:
    kubernetes:
      # Read from the mongodb namespace of THIS cluster.
      remoteNamespace: mongodb
      server:
        # In-cluster API server; trust the cluster CA published in every namespace.
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: mongodb
      auth:
        serviceAccount:
          name: eso-mongodb-reader
          namespace: mongodb
