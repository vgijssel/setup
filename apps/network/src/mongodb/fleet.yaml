# Portable Fleet bundle: single-node MongoDB for the Omada controller. Fleet detects
# the umbrella Chart.yaml here and deploys it with values.yaml. The omada bundle
# dependsOn this bundle (label below) so Mongo is up before Omada tries to connect.
#
# Owns the `mongodb` namespace (defaultNamespace). The mongodb-credentials
# ExternalSecret stays NotReady until the network ClusterSecretStore can reach OpenBao
# (ACL-A + T8); MongoDB won't finish first-boot init without those root creds, which
# is expected during bootstrap.
labels:
  fleet.vgijssel.nl/bundle: network-mongodb
defaultNamespace: mongodb
helm:
  releaseName: mongodb
# network-ONLY. bin/fleet-apply applies every bundle globally, so target the network
# cluster explicitly (previously scoped only by network:apply's static list) — this
# keeps the bundle off the secret cluster.
targetCustomizations:
  - name: network
    clusterSelector:
      matchLabels:
        cluster.vgijssel.nl/name: network
