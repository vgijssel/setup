# Raw-manifest Fleet bundle: the PerconaServerMongoDB CR (perconaservermongodb.yaml) + the
# ESO Kubernetes ClusterSecretStore that exposes the operator-generated connection string
# (secretstore-mongodb.yaml). Was an umbrella Helm chart (the old groundhog2k mongo); now
# raw manifests reconciled by the Percona operator.
#
# dependsOn mongodb-operator (label selector): the psmdb.percona.com CRDs come from the
# operator bundle, and Fleet applies a bundle as one atomic release — so the CR must be a
# DOWNSTREAM bundle, applied only after the operator + CRDs are installed.
dependsOn:
  - selector:
      matchLabels:
        fleet.vgijssel.nl/bundle: mongodb-operator
labels:
  fleet.vgijssel.nl/bundle: network-mongodb
defaultNamespace: mongodb
# network-ONLY. bin/fleet-apply applies every bundle globally, so target the network
# cluster explicitly — keeps this off the secret cluster.
targetCustomizations:
  - name: network
    clusterSelector:
      matchLabels:
        cluster.vgijssel.nl/name: network
