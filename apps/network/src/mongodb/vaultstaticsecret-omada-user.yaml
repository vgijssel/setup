# The omada MongoDB user's password, owned by OpenBao and handed to the Percona operator.
#
# This is what let External Secrets Operator be removed from the stack entirely. Before it, the
# operator GENERATED this password into mongodb-custom-user-secret and the only way to get the
# resulting connection string over to Omada (a different namespace, and needing a rewrite) was
# ESO's Kubernetes provider — the one thing Vault Secrets Operator cannot do, since it only
# speaks the Vault API.
#
# Inverting the ownership removes that need: OpenBao holds the password, the operator CONSUMES it
# via users[].passwordSecretRef (see perconaservermongodb.yaml), and Omada's connection string is
# built from the same OpenBao value plus static topology
# (../omada/templates/vaultstaticsecret-mongodb-uri.yaml). Nothing has to copy a Secret between
# namespaces any more.
#
# NOT what Percona's own OpenBao integration does, for the avoidance of doubt: that covers
# data-at-rest ENCRYPTION KEY management (the `vault`/`encryptionKeySecret` settings), not user
# credentials or connection strings.
#
# ── THE PASSWORD MUST STAY URL-SAFE ─────────────────────────────────────────────────────────
# It is interpolated into a mongodb:// URI verbatim, with no percent-encoding. That matches what
# the Percona operator itself did (its generated 18-character alphanumeric password appeared
# unencoded in its own connection string), but it is a real constraint on anyone rotating it by
# hand. Go's `urlquery` is deliberately NOT used: it escapes for query context and turns a space
# into `+`, which is wrong in the userinfo position and would break authentication silently.
#
# Seeded from the operator's EXISTING generated value, so adopting this changed nothing about the
# live credential and Omada never saw a blip. Rotate deliberately later by writing a new value:
#   bao kv put kv/mongodb omada_password=<new URL-safe password>
# The operator then updates the MongoDB user and Omada's URI follows from the same source, though
# Omada needs recycling to pick it up (it reads the URI at startup).
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: mongodb-omada-user
  namespace: mongodb
spec:
  type: kv-v2
  mount: kv
  path: mongodb
  refreshAfter: 1h
  destination:
    name: mongodb-omada-user
    create: true
    transformation:
      templates:
        password:
          text: '{{ get .Secrets "omada_password" }}'
      excludeRaw: true
      excludes:
        - .*
