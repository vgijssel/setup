# The MongoDB cluster backing the Omada controller, managed by the Percona operator
# (src/mongodb-operator) — replaces the single-node groundhog2k `mongo` Helm chart.
#
# Why Percona: the old chart never started because its root credentials were never seeded
# in OpenBao. Percona GENERATES all credentials in-cluster, so MongoDB needs NO OpenBao
# path and the network cluster stays strictly read-only on OpenBao. The custom `omada`
# user below (auto-generated password) is what Omada connects as.
#
# Cluster name `mongodb` is load-bearing: the operator derives its generated Secret names
# from it —
#   mongodb-secrets                       system users (spec.secrets.users)
#   mongodb-custom-user-secret            the omada user's auto-generated password
#   mongodb-custom-user-secret-conn-str   the omada user's connection strings, keys
#                                         omada_rs0_connectionString / …Srv
# The mongodb SecretStore (secretstore-mongodb.yaml) + omada ExternalSecret (T6.1) read the
# conn-str Secret.
#
# KERNEL-GUARD NOTE: pinned to the latest stable percona/percona-server-mongodb:8.0.26-11.
# Percona's build likely lacks the community SERVER-121912 kernel guard that broke
# mongo:8.0.26 on OrbStack/vind (misreads the kernel version and refuses to start). This is
# VALIDATED live during bring-up (P9): if any rs0 member logs a SERVER-121912 / kernel
# refusal, fall back to image percona/percona-server-mongodb:7.0.37-20 (the 7.0 series
# predates the guard) and re-apply.
apiVersion: psmdb.percona.com/v1
kind: PerconaServerMongoDB
metadata:
  name: mongodb
spec:
  crVersion: 1.23.0
  image: percona/percona-server-mongodb:8.0.26-11
  imagePullPolicy: IfNotPresent
  updateStrategy: SmartUpdate
  # Never auto-upgrade the DB image (pinned); no scheduled version checks act on it.
  upgradeOptions:
    apply: disabled
    schedule: 0 2 * * *
  # System users secret (auto-generated by the operator if absent).
  secrets:
    users: mongodb-secrets
  # A 3-member replica set (safe size — no unsafeFlags needed). Per-member PVCs.
  replsets:
    - name: rs0
      size: 3
      volumeSpec:
        persistentVolumeClaim:
          resources:
            requests:
              storage: 2Gi
  # Home-lab minimal footprint: no sharding, no backups, no PMM monitoring.
  sharding:
    enabled: false
  backup:
    enabled: false
  pmm:
    enabled: false
  # Custom application user for Omada. No passwordSecretRef → the operator auto-generates
  # the password (into mongodb-custom-user-secret) and the connection strings (into
  # mongodb-custom-user-secret-conn-str). dbOwner on the `omada` database; authenticates
  # against admin (db: admin).
  users:
    - name: omada
      db: admin
      roles:
        - name: dbOwner
          db: omada
