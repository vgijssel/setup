# Fleet bundle exposing the Omada controller on the mesh at `omada.vpn.blueora.ng`.
#
# This is the exposure that proves the capability's port-space requirement: one peer, one
# hostname, HTTPS on 443 *and* seven raw TCP ports *and* three raw UDP ports, none of them
# arbitrated against any other service. Gateway API v1.6 graduating TCPRoute + UDPRoute to
# Standard is what makes that a single mechanism rather than two.
#
# EVERYTHING USES THIS NAME, including the physical APs and switches that run no mesh client.
# They cannot resolve it through NetBird, so this exposure opts into `publicDns` (below) and
# publishes its current overlay address as a public A record; the devices resolve that publicly
# and reach it because the LAN gateway routes `100.65.0.0/16` via the PiKVM routing peer.
#
# That replaced a separate device hostname backed by a pinned ClusterIP, a device `NBResource` and
# an in-cluster CoreDNS split horizon — three mechanisms whose only job was to give one class of
# consumer a second name. See `publicDns` in apps/platform/src/mesh-service/values.yaml for the
# trade this accepts (the device path now depends on this Envoy pod).
#
# defaultNamespace `omada`: the Gateway's backendRefs resolve in the release namespace, so the
# exposure must live where the backing Service does.
#
# dependsOn:
#   - netbird-operator    : owns the netbird.io CRDs for the Group and SetupKey.
#   - envoy-gateway       : owns the Gateway API v1.6.1 CRDs and the `envoy` GatewayClass.
#   - crossplane-provider : owns the opentofu.upbound.io Provider behind the access policy.
#   - vault-secrets-operator : owns the secrets.hashicorp.com CRDs + the default
#                           VaultConnection/VaultAuth the TLS VaultStaticSecret reads through.
#   - network-omada    : the backing Service. Listed so a fresh cluster brings the controller up
#                        before the Gateway starts resolving backendRefs at it.
labels:
  fleet.vgijssel.nl/bundle: mesh-omada
defaultNamespace: omada
helm:
  releaseName: mesh-omada
  values:
    # The entire per-service declaration, keyed under the subchart name. See
    # apps/platform/src/mesh-service/values.yaml for the documented contract.
    mesh-service:
      name: omada
      domain: vpn.blueora.ng
      # Omada traffic is all trusted homelab traffic (the UI, and device protocols proxied for
      # on-mesh tooling). No cluster group is a source: nothing in Kubernetes consumes Omada.
      #
      # `homelab` is also what admits the PiKVM, which is what makes the device path work: the
      # devices' packets are masqueraded to the PiKVM's own overlay address as they are forwarded
      # into the mesh, so to this policy they ARE the PiKVM. Narrowing this group would cut off
      # the whole physical fleet, not just interactive access.
      sourceGroups:
        - homelab
      # ── The only exposure in the repo that opts into public DNS, and why ─────────────────────
      # The TP-Link gateway, switches and APs run stock firmware with no way to install a mesh
      # client, yet they must dial the controller BY NAME (their inform target). Publishing this
      # peer's current overlay address is what lets them use the same `omada.vpn.blueora.ng` every
      # mesh peer uses, instead of a parallel hostname with its own certificate and its own
      # in-cluster plumbing.
      #
      # Safe for existing consumers, verified rather than assumed (openspec 12.1): a public record
      # does not shadow NetBird's resolver — peers and in-cluster pods still get the overlay
      # address while public resolvers get the published one.
      publicDns:
        enabled: true
      listeners:
        # Admin UI. Envoy terminates the publicly-trusted mesh certificate on :443, then
        # RE-ENCRYPTS to the controller's own HTTPS port :8043 and validates the certificate the
        # controller serves there (`omada.blueora.ng`, the device path's, against the public root
        # store). So the mesh name gets a valid certificate on a single port and the hop to the
        # backend is authenticated rather than merely encrypted.
        #
        # IT MUST NOT TARGET :8088 — measured 2026-10-05, this is the task-7.10 failure. :8088 is
        # the controller's HTTP listener and it answers with an ABSOLUTE redirect to its own HTTPS
        # port, which behind a mesh peer becomes `https://omada.vpn.blueora.ng:8043/` — a port the
        # Gateway does not listen on, so the browser dead-ends. Talking HTTPS to its HTTPS port
        # means the controller never emits the redirect. The alternative considered and rejected
        # was a `protocol: TLS` passthrough on :8043: it connects, but serves
        # `CN=omada.blueora.ng` under the mesh hostname, which is a name mismatch and a direct
        # violation of the capability's "client validates the certificate with no override".
        #
        # Note this is the ONE place the mesh path knows the device path's hostname. The two
        # certificates stay independent — this is a validation target, not a shared certificate.
        - name: https
          protocol: HTTPS
          port: 443
          backend:
            name: omada
            port: 8043
            tls:
              hostname: omada.blueora.ng
              caCertificates: System
              # The Service's port NAME for 8043, NOT the number. Gateway API scopes a
              # BackendTLSPolicy by port name, and a number attaches to nothing SILENTLY —
              # Envoy keeps sending plaintext to the TLS-only port and every request hangs,
              # with no status condition to show for it (measured 2026-10-05). Must stay in
              # step with ../omada/templates/service-omada.yaml.
              portName: manage-https
        # Device management/adoption/upgrade/rtty/monitor. A contiguous range is one listener per
        # port (Gateway API has no port-range concept), expanded by the shared chart. Each is the
        # OBSERVED port: no translation, because the mesh client's WireGuard interface is inside
        # the Envoy pod's own netns. backend.port is omitted, so each reuses its listener port.
        - name: device-tcp
          protocol: TCP
          ports: [29811, 29812, 29813, 29814, 29815, 29816, 29817]
          backend:
            name: omada
        # Discovery + UDP device management. Raw UDP is the half the BYOP reverse proxy could
        # never carry at all.
        - name: device-udp
          protocol: UDP
          ports: [19810, 27001, 29810]
          backend:
            name: omada
dependsOn:
  - selector:
      matchLabels:
        fleet.vgijssel.nl/bundle: netbird-operator
  - selector:
      matchLabels:
        fleet.vgijssel.nl/bundle: envoy-gateway
  - selector:
      matchLabels:
        fleet.vgijssel.nl/bundle: crossplane-provider
  - selector:
      matchLabels:
        fleet.vgijssel.nl/bundle: vault-secrets-operator
  - selector:
      matchLabels:
        fleet.vgijssel.nl/bundle: network-omada
# network-ONLY. bin/fleet-apply applies every bundle globally, so target the network cluster
# explicitly — the Omada controller only exists here.
targetCustomizations:
  - name: network
    clusterSelector:
      matchLabels:
        cluster.vgijssel.nl/name: network
  # Terminal catch-all. Targets are first-match-wins and a GitRepo APPENDS its own target
  # after these, so without this a non-matching cluster falls through to it and deploys with
  # default values. Keeps this bundle off every cluster not named above. See bin/fleet-lint-targets.
  - name: none
    doNotDeploy: true
    clusterSelector: {}
