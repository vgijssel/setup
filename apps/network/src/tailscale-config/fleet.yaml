# Raw-manifest Fleet bundle for the tailnet policy, managed by Crossplane. Carries the
# tailscale ProviderConfig + the ACL managed resource + the api_key ExternalSecret — the
# Crossplane replacement for the old terranetes-reconciled OpenTofu module that used to
# live in this directory.
#
# dependsOn crossplane-provider (label selector): the tailscale.upbound.io CRDs
# (ProviderConfig, ACL) only exist once provider-tailscale is installed + healthy, and
# Fleet applies a bundle as one atomic Helm release — so these CRs must be a DOWNSTREAM
# bundle, never colocated with the Provider.
dependsOn:
  - selector:
      matchLabels:
        fleet.vgijssel.nl/bundle: crossplane-provider
labels:
  fleet.vgijssel.nl/bundle: tailscale-config
defaultNamespace: crossplane-system
# network-ONLY. bin/fleet-apply applies every bundle globally, so target the network
# cluster explicitly — this is the tailnet policy owner and must not deploy elsewhere.
targetCustomizations:
  - name: network
    clusterSelector:
      matchLabels:
        cluster.vgijssel.nl/name: network
