# Syncs the Tailscale API access token that provider-upjet-tailscale authenticates with,
# from the remote OpenBao (kv/network-tailscale-crossplane#api_key) into the
# `tailscale-credentials` Secret in crossplane-system. The tailscale ProviderConfig reads
# the RAW value of this Secret's `api_key` key and passes it verbatim as the Terraform
# provider's api_key (the provider treats the whole credential blob as the token — see
# internal/clients/tailscale.go), so the stored value must be the bare `tskey-api-…`
# token with no wrapping/newline.
#
# Read through the network cluster's REMOTE JWT ClusterSecretStore `openbao`
# (apps/network/src/config/clustersecretstore-openbao.yaml), the same store every other
# network ExternalSecret uses. Stays NotReady until the token is seeded (network:bootstrap,
# T9.1) and the tailnet ACL grant lets network reach OpenBao — expected during bring-up.
#
# The token needs the `policy_file` write scope and expires (≤90d) — reseed via
# network:bootstrap. This REPLACES the terranetes OAuth-client path (kv/network-tailscale-config).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tailscale-apikey
  namespace: crossplane-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: tailscale-credentials
    creationPolicy: Owner
  data:
    - secretKey: api_key
      remoteRef:
        key: network-tailscale-crossplane
        property: api_key
