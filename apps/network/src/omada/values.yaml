# TP-Link Omada controller, run rootless against EXTERNAL MongoDB, with a Let's
# Encrypt cert mounted at /cert (no ingress-nginx on this cluster — the controller
# terminates TLS itself on 8043). Exposure to the tailnet is a separate LoadBalancer
# Service (templates/service-omada.yaml) fronted by the network-ingress ProxyGroup;
# the chart's own Service is ClusterIP-only here.
omada-controller-helm:
  config:
    # Rootless mode is the chart's supported external-MongoDB path.
    rootless: true

    # Mount the cert-manager-issued LE cert (certificate-omada.yaml) at /cert. The
    # controller serves it on 8043, so tailnet clients hitting the VIP get a valid
    # omada.network.vgijssel.nl cert (SPEC R3).
    tlsSecretName: omada-network-vgijssel-nl-tls

    # External MongoDB connection string from the ESO-synced mongodb-uri Secret
    # (built in externalsecret-mongodb-uri.yaml). Mutually exclusive with
    # externalMongoDBUrl.
    externalMongoDBUrlSecret:
      name: mongodb-uri
      key: uri

    timezone: Europe/Amsterdam

  # The tailnet LoadBalancer is a dedicated Service in this umbrella chart's
  # templates/; keep the chart's built-in Service internal.
  service:
    type: ClusterIP

  # Persist controller data + logs (data is still required even with external Mongo,
  # for backups/firmware — chart note).
  persistence:
    data:
      enabled: true
      size: 2Gi
    logs:
      enabled: true
      size: 1Gi
