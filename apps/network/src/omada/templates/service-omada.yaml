# ╔══════════════════════════════════════════════════════════════════════════════════════════╗
# ║ NAMED EXCEPTION — the Omada DEVICE path. This is the one service in the repo that is NOT ║
# ║ exposed as a mesh peer, and it is deliberate, not leftover.                              ║
# ╚══════════════════════════════════════════════════════════════════════════════════════════╝
#
# Omada's controller is reached by TWO disjoint paths that share nothing but the backing pod:
#
#   1. MESH PEERS (humans, on-mesh tooling) — `omada.vpn.blueora.ng`.
#      Owned entirely by ../../mesh-omada/, which runs its own Envoy Gateway pod with its own
#      NetBird client, hence its own overlay address and its own full TCP/UDP port space. It
#      serves the publicly-trusted mesh wildcard certificate. NOTHING in this file participates
#      in that path: the mesh exposure dials this Service only as an ordinary in-cluster
#      backendRef, by name, like any other Kubernetes consumer.
#
#   2. NON-PEER PHYSICAL DEVICES (the gateway, switches and APs) — `omada.blueora.ng`, plus
#      `omada.network.vgijssel.nl` for as long as the already-adopted devices still hold that
#      older inform hostname. Both resolve publicly to the pinned ClusterIP below and are
#      reached from the LAN over a static route through the PiKVM routing peer. This file owns
#      that path, together with nbresource-omada-devices.yaml and configmap-coredns-omada.yaml
#      beside it.
#
# WHY THE DEVICES CANNOT JUST BE PEERS — the reason this exception exists at all:
# TP-Link APs and switches run stock Omada firmware. There is no way to install a NetBird
# client on them, so they can never hold an overlay address or resolve a `vpn.blueora.ng`
# name. They have to be handed an address that is reachable by ordinary LAN routing and that
# does not move: a `100.x` peer address is neither (it is assigned per-enrolment and is not
# publicly resolvable). So devices get a pinned ClusterIP plus a public A record, and the LAN
# gateway carries `10.96.0.20/32 -> PiKVM` as a static route. See apps/network/network.md.
#
# HOW THE DEVICE PATH RESOLVES AND ROUTES:
#   * external-dns (../../external-dns) publishes grey-cloud (DNS-only) Cloudflare A records for
#     the hostnames in the annotation below -> this Service's ClusterIP. Only annotated ClusterIP
#     Services are published, so the annotation is the whole scope. There are currently TWO names
#     during the device migration; see the annotation's own note.
#   * nbresource-omada-devices.yaml declares a HOST-type NetBird resource on the pinned
#     ClusterIP (10.96.0.20/32). That is what installs the /32 route on the PiKVM so it can
#     forward LAN traffic into the mesh. It is deliberately NOT a domain resource: a domain
#     resource's route appears only after the client resolves that domain through NetBird's
#     resolver, and nothing ever makes the PiKVM resolve anything on the devices' behalf. Being
#     addressed by IP also makes the route independent of which hostname the devices dial, which
#     is what lets two names coexist during the migration.
#   * configmap-coredns-omada.yaml keeps the in-cluster `router` peer from resolving that
#     public name back into the mesh.
#
# The ClusterIP is PINNED to a static-band address in the 10.96.0.0/12 service CIDR so it
# survives cluster rebuilds, external-dns always publishes the same stable IP, and the LAN
# static route never has to be re-pointed. clusterIP is immutable — changing it requires
# deleting and recreating this Service, and then re-doing the LAN route.
#
# NO netbird.io/* ANNOTATIONS HERE, on purpose. The operator used to infer both the resource
# and its access policy from annotations on this Service; the resource is now declared
# explicitly beside it so the device exception is visible as a resource rather than as a side
# effect, and so the operator's ingress.allowAutomaticPolicyCreation flag is not load-bearing.
#
# The selector matches the omada-controller subchart pods exactly (a mismatch leaves this
# Service with zero endpoints, which breaks both paths at once).
apiVersion: v1
kind: Service
metadata:
  name: omada
  namespace: {{ .Release.Namespace }}
  annotations:
    # external-dns publishes a grey-cloud (DNS-only) A record for this hostname pointing at
    # the ClusterIP below. proxied=false is required — an orange-cloud record would return
    # Cloudflare edge IPs instead of the mesh-routable ClusterIP.
    #
    # `omada.blueora.ng`, NOT `*.vpn.blueora.ng`: the peer DNS domain must never gain a public
    # address record (a Cloudflare wildcard answers at arbitrary label depth and would make
    # every mesh hostname publicly resolvable). This name sits one level up, beside the apex,
    # so it is publicly resolvable without touching the mesh namespace.
    #
    # ── TRANSITIONAL: TWO NAMES, AND THE SECOND ONE IS LOAD-BEARING RIGHT NOW ────────────────
    # `omada.network.vgijssel.nl` is the inform hostname the ADOPTED DEVICES ALREADY HOLD. A
    # device re-homes only when the controller pushes it a new Controller Hostname/IP, so until
    # that push has happened the OLD name is the only address the gateway, switches and APs will
    # ever dial. Dropping its record (the rename, plus the `*.vgijssel.nl` wildcard going with
    # the reverse-proxy stack) is what took all 7 devices offline at 2026-10-05 14:23 with
    # `Inform timeout`: they were alive and on the LAN the whole time, simply unable to RESOLVE
    # their controller. Publishing both names makes the old one answer again so the fleet can be
    # migrated deliberately instead of being stranded.
    #
    # Both names resolve to the same pinned ClusterIP, so this needs nothing else: the device
    # path's route comes from nbresource-omada-devices.yaml, which is now a HOST resource on
    # 10.96.0.20/32 and therefore hostname-independent — it carries whichever name the devices
    # use. The device protocols on 29810-29817 do not use the :8043 web certificate at all, so
    # serving the `omada.blueora.ng` certificate on both names does not affect adoption (a LAN
    # BROWSER on the old name will see a name mismatch; that is the transition's one rough edge).
    #
    # REMOVE `omada.network.vgijssel.nl` once, and only once, all of this holds:
    #   1. the controller's Controller Hostname/IP is `omada.blueora.ng`, and
    #   2. every device reports Connected with that as its inform target, and
    #   3. a device power-cycle still comes back Connected.
    # Check 2 without the UI via MongoDB (see openspec 7b): `omada.device.last_seen` fresh and
    # `health_score` >= 0 for all 7. Then delete this name, re-apply, and re-verify — external-dns
    # runs `policy: sync`, so removing it here withdraws the record.
    external-dns.alpha.kubernetes.io/hostname: omada.blueora.ng,omada.network.vgijssel.nl
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
spec:
  type: ClusterIP
  # Pinned, static-band ClusterIP (see header). Stable across rebuilds; external-dns
  # publishes this exact address for omada.blueora.ng, and the LAN static route
  # 10.96.0.20/32 -> PiKVM is pinned to it.
  clusterIP: 10.96.0.20
  selector:
    app.kubernetes.io/name: omada-controller
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    # management/portal HTTP (redirects to HTTPS)
    - name: manage-http
      port: 8088
      targetPort: 8088
      protocol: TCP
    # management UI HTTPS — the omada.blueora.ng endpoint (device/LAN path)
    - name: manage-https
      port: 8043
      targetPort: 8043
      protocol: TCP
    # portal HTTPS
    - name: portal-https
      port: 8843
      targetPort: 8843
      protocol: TCP
    # device manager v1
    - name: manager-v1
      port: 29811
      targetPort: 29811
      protocol: TCP
    # device adopt v1
    - name: adopt-v1
      port: 29812
      targetPort: 29812
      protocol: TCP
    # device upgrade v1
    - name: upgrade-v1
      port: 29813
      targetPort: 29813
      protocol: TCP
    # device manager v2
    - name: manager-v2
      port: 29814
      targetPort: 29814
      protocol: TCP
    # device transfer v2
    - name: transfer-v2
      port: 29815
      targetPort: 29815
      protocol: TCP
    # rtty (remote terminal)
    - name: rtty
      port: 29816
      targetPort: 29816
      protocol: TCP
    # device monitor (Omada 6)
    - name: device-monitor
      port: 29817
      targetPort: 29817
      protocol: TCP
    # app discovery
    - name: app-discovery
      port: 27001
      targetPort: 27001
      protocol: UDP
    # device discovery
    - name: udp-discovery
      port: 29810
      targetPort: 29810
      protocol: UDP
    # device management UDP
    - name: udp-management
      port: 19810
      targetPort: 19810
      protocol: UDP
