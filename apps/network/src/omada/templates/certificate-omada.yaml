# Let's Encrypt cert for omada.network.vgijssel.nl, issued over Cloudflare DNS-01 by
# the shared letsencrypt-prod ClusterIssuer (apps/platform/src/config). cert-manager
# writes the chain into omada-network-vgijssel-nl-tls in the `omada` namespace, which
# the Omada controller mounts at /cert (config.tlsSecretName) and serves on 8043 — so
# tailnet clients hitting the VIP get a valid public cert, no *.ts.net in the path
# (SPEC R3). Lives in the omada bundle so it shares the omada namespace with the pod
# that mounts it.
#
# Stays NotReady until the cloudflare-api-token Secret is synced from OpenBao
# (platform-config ExternalSecret) — i.e. until the secrets path is unblocked.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: omada-network-vgijssel-nl
  namespace: omada
spec:
  secretName: omada-network-vgijssel-nl-tls
  dnsNames:
    - omada.network.vgijssel.nl
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
