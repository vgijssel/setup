# The DEVICE path's NetBird resource — exists ONLY for non-peer physical devices.
#
# This is the named exception described in service-omada.yaml's header. Omada's gateway,
# switches and APs run stock TP-Link firmware and cannot run a NetBird client, so they can
# never hold an overlay address or resolve a `vpn.blueora.ng` name. They reach the controller
# at `omada.blueora.ng` -> the pinned ClusterIP, over a `10.96.0.20/32 -> PiKVM` static route
# on the LAN gateway; this resource is what puts that /32 into the PiKVM's routing table.
#
# Humans and on-mesh tooling do NOT use this. They use `omada.vpn.blueora.ng`, served by its
# own peer from ../../mesh-omada/. Nothing here constrains that path's hostname, ports or
# certificate, and nothing there constrains this one.
#
# WHY IT IS DECLARED EXPLICITLY rather than inferred from a `netbird.io/expose` annotation:
#   * The device exception should be visible as a resource someone has to delete on purpose,
#     not as a side effect of an annotation that reads like a normal mesh exposure.
#   * The annotation path also made the operator mint the access policy, which pins
#     ingress.allowAutomaticPolicyCreation=true on for the whole cluster. Naming policyName
#     and policySourceGroups here keeps the policy declared where the resource is. (On
#     operator v0.7.0 `NBPolicy` is an AGGREGATOR that creates nothing standalone — it
#     collects its ports from the NBResources naming it — so an NBResource's own
#     policy* fields are the only working declarative route for a resource-backed policy.
#     The mesh-service chart, which has no NBResource, has to use an OpenTofu Workspace
#     instead; see apps/platform/src/mesh-service/templates/workspace-policy-mesh-service.yaml.)
#
# ADDRESS IS THE PINNED ClusterIP — A HOST RESOURCE, NOT A DOMAIN RESOURCE. This is the whole
# reason the device path works, and getting it wrong silently takes every AP and switch offline.
#
# NetBird installs a DOMAIN resource's route on a client only AFTER that client resolves the
# resource's domain through NetBird's own resolver; the route follows the DNS answer. That is
# fine for an interactive consumer, which looks the name up before connecting. It is useless
# here: the devices send UNSOLICITED inform packets straight to 10.96.0.20, and nothing ever
# makes the PiKVM — the peer that forwards for them — resolve any name at all. So the /32 is
# never installed, the packets die at the forwarder, and the controller reports every device as
# `Disconnected / Inform timeout`.
#
# That is not hypothetical: with `address: omada.blueora.ng` here, ALL SEVEN devices dropped
# within seconds of this resource replacing the old cluster-local ones (2026-10-05 14:23 UTC)
# and stayed down for ~22 h. A HOST resource has no DNS precondition — the route is installed
# on every peer the policy admits, unconditionally and permanently, which is exactly what an
# unsolicited inbound protocol needs.
#
# The earlier note here cited the omada-resolution spike's finding that
# `omada.omada.svc.cluster.local` "never produced a route on the PiKVM" and concluded the
# address had to be the PUBLIC name. The finding was real but the conclusion did not follow: the
# spike had shown a cluster-local DOMAIN cannot be resolved by an off-cluster peer, which argues
# against a domain resource, not in favour of a different domain. Addressing the pinned IP
# literally sidesteps resolution entirely — and the ClusterIP is pinned (service-omada.yaml)
# precisely so it can be hardcoded like this.
#
# The name `omada.blueora.ng` still works for LAN browsers, and needs nothing from this
# resource: it resolves PUBLICLY via the external-dns record to this same 10.96.0.20, then
# follows the same static LAN route. Only the ROUTE comes from here. The override in
# configmap-coredns-omada.yaml is what stops the in-cluster `router` peer from resolving that
# public name back into the mesh.
#
# networkID IS A GENERATED, IMMUTABLE ACCOUNT-SIDE ID and the CRD requires it — there is no
# "network by name" field on operator v0.7.0. It is the Network the operator auto-creates for
# this cluster, named after its --cluster-name ("network"), and it is reported by the routing
# peer: `kubectl get nbroutingpeer router -n netbird -o jsonpath='{.status.networkID}'`. It
# survives cluster rebuilds because the Network lives in the NetBird account, not in the
# cluster. If the account-side Network is ever deleted and recreated, this value must be
# re-read from that status field — the resource will sit NotReady until it is.
apiVersion: netbird.io/v1
kind: NBResource
metadata:
  name: omada-devices
  namespace: {{ .Release.Namespace }}
spec:
  name: omada-devices
  # The pinned ClusterIP from service-omada.yaml, as a /32 host route. Keep the two in step:
  # clusterIP is immutable, so if it ever has to change, this and the LAN gateway's static
  # route change with it. See the ADDRESS note above for why this is an IP and not a name.
  address: 10.96.0.20/32
  networkID: d9irqtifadhs738ttu3g
  groups:
    - omada-devices
  policyName: omada-devices
  # All Omada device traffic is trusted homelab traffic. `homelab` is the group the PiKVM
  # routing peer carries, which is the peer that actually forwards for the devices.
  policySourceGroups:
    - homelab
  # Mirrors service-omada.yaml's port list. The device protocols are the reason this path
  # exists at all; 8088/8043/8843 are kept so a LAN browser that is not a mesh peer can still
  # reach the UI on this name.
  tcpPorts:
    - 8088
    - 8043
    - 8843
    - 29811
    - 29812
    - 29813
    - 29814
    - 29815
    - 29816
    - 29817
  udpPorts:
    - 19810
    - 27001
    - 29810
