# CoreDNS override keeping the in-cluster `router` peer from resolving the DEVICE path's
# public name back into the mesh. Part of the named exception in service-omada.yaml.
#
# nbresource-omada-devices.yaml has to use `omada.blueora.ng` as its address (NetBird installs
# a resource's route only when the client resolves the resource's own domain). But that makes
# the name a NetBird *resource* domain, which the mesh resolver claims — and the `router` peer,
# whose /etc/resolv.conf the operator rewrites to point at that resolver, is the peer that has
# to FORWARD to the real backend. Left alone it would resolve the name through the mesh and
# hand the traffic back to itself. This override answers it with the in-cluster Service
# instead, which is the pinned ClusterIP.
#
# This is a split horizon and it is honest about it: inside the cluster the name is the
# ClusterIP, on the LAN it is the same ClusterIP via the public A record and the PiKVM static
# route. Both arrive at the same endpoint and the same certificate on :8043, so nothing in the
# path has verification disabled to make it work.
#
# WHY `coredns-custom` IN kube-system: the cluster's Corefile ends with
# `import /etc/coredns/custom/*.server`, so a ConfigMap of that name is the supported extension
# point. Note it is a cluster-wide SINGLETON keyed by filename — this bundle owns the whole
# ConfigMap, so a second override on this cluster must be added as another key HERE rather
# than as a second ConfigMap, or the two bundles will fight over one object.
#
# `:1053` is deliberate, not a typo: CoreDNS in a vcluster listens on 1053, and a server block
# on the wrong port is silently never consulted.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  omada.server: |
    omada.blueora.ng:1053 {
        errors
        rewrite name exact omada.blueora.ng omada.{{ .Release.Namespace }}.svc.cluster.local
        kubernetes cluster.local in-addr.arpa ip6.arpa {
            pods insecure
            fallthrough in-addr.arpa ip6.arpa
        }
        cache 30
    }
