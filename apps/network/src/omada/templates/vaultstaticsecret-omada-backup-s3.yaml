# S3 credentials for the Omada backup CronJob, from kv/s3-backup.
#
# Migrated from External Secrets Operator to Vault Secrets Operator. Nothing about the resulting
# Secret changes -- same name, namespace and keys -- so cronjob-omada-backup.yaml needs no edit.
#
# Keys are LOWERCASE and passed straight through (access_key_id, secret_access_key, region,
# bucket, endpoint), matching what the CronJob's secretKeyRefs read. Unlike the OpenBao snapshot
# job this one does no reshaping -- rclone takes the raw values -- so there is no S3_HOST/S3_URI
# templating here.
#
# The property names stay values-driven (.Values.backup.openbao.*) exactly as the ExternalSecret
# had them, so overriding a field name in values.yaml still works.
#
# refreshAfter replaces ESO's refreshInterval. There is no lease on a kv entry, so this interval
# is the only thing driving a re-read.
#
# The login ServiceAccount (omada/vault-secrets-operator) is defined once for the cluster in
# ../../config/serviceaccounts-vso.yaml.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: omada-backup-s3
  namespace: {{ .Release.Namespace }}
spec:
  # kv-v2, so VSO also watches the entry's metadata to notice a new version.
  type: kv-v2
  mount: kv
  path: {{ .Values.backup.openbao.key | quote }}
  refreshAfter: 1h
  destination:
    name: omada-backup-s3
    create: true
    transformation:
      templates:
        access_key_id:
          text: '{{ printf "{{ get .Secrets %q }}" .Values.backup.openbao.accessKeyProperty }}'
        secret_access_key:
          text: '{{ printf "{{ get .Secrets %q }}" .Values.backup.openbao.secretKeyProperty }}'
        region:
          text: '{{ printf "{{ get .Secrets %q }}" .Values.backup.openbao.regionProperty }}'
        bucket:
          text: '{{ printf "{{ get .Secrets %q }}" .Values.backup.openbao.bucketProperty }}'
        endpoint:
          text: '{{ printf "{{ get .Secrets %q }}" .Values.backup.openbao.endpointProperty }}'
      # Drop `_raw` (the whole kv entry as JSON) and every source field, leaving only the
      # templated keys the CronJob reads.
      excludeRaw: true
      excludes:
        - .*
