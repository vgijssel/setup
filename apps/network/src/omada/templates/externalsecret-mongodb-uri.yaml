# Materializes the `mongodb-uri` Secret Omada consumes (config.externalMongoDBUrlSecret),
# now sourced from the PERCONA operator-generated connection string instead of OpenBao.
#
# Percona generates the omada user's credentials + connection strings in-cluster; ESO reads
# the conn-str Secret (mongodb-custom-user-secret-conn-str, mongodb namespace) through the
# `mongodb` Kubernetes ClusterSecretStore (apps/network/src/mongodb/secretstore-mongodb.yaml)
# — no OpenBao path for MongoDB.
#
# The operator's `omada_rs0_connectionString` value looks like:
#   mongodb://omada:<url-encoded-pass>@mongodb-rs0-0.mongodb-rs0.mongodb.svc.cluster.local:27017,…/?authSource=admin&replicaSet=rs0
# i.e. authSource=admin (the omada user's db) but NO database in the path. Omada needs the
# `omada` database, so the template inserts it (`/?` → `/omada?`), reproducing the old URI's
# `…/omada?authSource=admin` shape while keeping replicaSet=rs0.
#
# LIVE-CONFIRM (SPEC Open Question #2): verify against the running operator that the key is
# `omada_rs0_connectionString` and that Omada accepts the composed URI verbatim; adjust the
# key / template here if the live secret differs.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mongodb-uri
  namespace: omada
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: mongodb
    kind: ClusterSecretStore
  target:
    name: mongodb-uri
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Escaped for Helm: this file is rendered by the omada umbrella chart, so the
        # backtick raw-string makes Helm emit the ESO Go-template verbatim — ESO (not Helm)
        # evaluates it at sync time, inserting the omada database into the connection string.
        uri: '{{ `{{ .connstr | replace "/?" "/omada?" }}` }}'
  data:
    - secretKey: connstr
      remoteRef:
        key: mongodb-custom-user-secret-conn-str
        property: omada_rs0_connectionString
