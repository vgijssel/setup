# Syncs the MongoDB connection URI Omada consumes (config.externalMongoDBUrlSecret)
# from OpenBao (kv/mongodb#uri) into the `mongodb-uri` Secret in the omada namespace
# (Omada only reads Secrets in its own namespace). The full URI — user, password, the
# mongo Service DNS name, authSource=admin, database omada — is stored in OpenBao rather
# than templated here: ESO v2's ExternalSecret template did not expose the fetched
# username/password to the URI template, so a direct fetch is used (robust, matches every
# other ExternalSecret). kv/mongodb#uri is kept in sync with username/password by
# network:configure/seeding; rebuild it if the password rotates.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mongodb-uri
  namespace: omada
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: mongodb-uri
    creationPolicy: Owner
  data:
    - secretKey: uri
      remoteRef:
        key: mongodb
        property: uri
