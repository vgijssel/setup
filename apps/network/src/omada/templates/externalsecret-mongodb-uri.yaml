# Builds the MongoDB connection URI Omada consumes (config.externalMongoDBUrlSecret),
# from the same OpenBao kv/mongodb the DB's root user comes from. ESO templates the
# URI so the password never appears in git or values: it points at the mongo Service in
# the mongodb namespace, authSource=admin (root user), database omada. Lives in the
# omada namespace so Omada (which only reads Secrets in its own namespace) can mount it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mongodb-uri
  namespace: omada
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: mongodb-uri
    creationPolicy: Owner
    template:
      engine: v2
      data:
        uri: "mongodb://{{ .username }}:{{ .password }}@mongodb.mongodb.svc.cluster.local:27017/omada?authSource=admin"
  data:
    - secretKey: username
      remoteRef:
        key: mongodb
        property: username
    - secretKey: password
      remoteRef:
        key: mongodb
        property: password
