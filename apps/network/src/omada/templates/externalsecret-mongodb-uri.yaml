# Materializes the `mongodb-uri` Secret Omada consumes (config.externalMongoDBUrlSecret),
# now sourced from the PERCONA operator-generated connection string instead of OpenBao.
#
# Percona generates the omada user's credentials + connection strings in-cluster; ESO reads
# the conn-str Secret (mongodb-custom-user-secret-conn-str, mongodb namespace) through the
# `mongodb` Kubernetes ClusterSecretStore (apps/network/src/mongodb/secretstore-mongodb.yaml)
# — no OpenBao path for MongoDB.
#
# The operator's `omada_rs0_connectionString` value looks like:
#   mongodb://omada:<url-encoded-pass>@mongodb-rs0-0.mongodb-rs0.mongodb.svc.cluster.local:27017,…/?authSource=admin&replicaSet=rs0&tls=true
# i.e. authSource=admin (the omada user's db) but NO database in the path. Omada needs the
# `omada` database, so the template inserts it (`/?` → `/omada?`), reproducing the old URI's
# `…/omada?authSource=admin` shape while keeping replicaSet=rs0.
#
# TLS: Percona enables TLS by default (the conn string carries tls=true) and mongod presents a
# cert from its OWN in-cluster CA. Omada's bundled Mongo Java driver validates that cert against
# the JVM truststore, which lacks the CA, so it crashloops with
#   SSLHandshakeException: PKIX path building failed … unable to find valid certification path.
# The stock Omada image honours tls=true but ignores tlsInsecure/tlsAllowInvalidCertificates and
# offers no way to inject the CA into its truststore, so validation can't be satisfied or skipped
# client-side. Instead strip `tls=true` so Omada connects in PLAINTEXT: mongod runs in Percona's
# default preferTLS mode, which still accepts non-TLS connections, and the omada user authenticates
# with SCRAM (username/password) regardless. This reproduces the old plaintext `mongo` chart exactly,
# and mongod is only reachable in-cluster (ClusterIP). SCRAM creds still come from the operator.
#
# LIVE-CONFIRM (SPEC Open Question #2): verify against the running operator that the key is
# `omada_rs0_connectionString` and that Omada accepts the composed URI verbatim; adjust the
# key / template here if the live secret differs.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mongodb-uri
  namespace: omada
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: mongodb
    kind: ClusterSecretStore
  target:
    name: mongodb-uri
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Escaped for Helm: this file is rendered by the omada umbrella chart, so the
        # backtick raw-string makes Helm emit the ESO Go-template verbatim — ESO (not Helm)
        # evaluates it at sync time, inserting the omada database into the connection string.
        uri: '{{ `{{ .connstr | replace "/?" "/omada?" | replace "&tls=true" "" }}` }}'
  data:
    - secretKey: connstr
      remoteRef:
        key: mongodb-custom-user-secret-conn-str
        property: omada_rs0_connectionString
