# The shared `*.vpn.blueora.ng` wildcard, delivered here for the controller to serve on its own
# :8043. REPLACES the dedicated cert-manager `Certificate` for `omada.blueora.ng`, which went
# with the rest of the old device path (openspec 12.9/12.10).
#
# WHY THE CONTROLLER NEEDS A CERTIFICATE AT ALL, when the mesh already terminates TLS: the mesh
# exposure RE-ENCRYPTS to this backend (`backend.tls` in ../../mesh-omada/fleet.yaml) because
# Omada's :8088 answers every request with an absolute redirect to its own HTTPS port, which
# behind a mesh peer dead-ends on a port no listener binds (the task-7.10 failure). Talking HTTPS
# to :8043 avoids the redirect — but Gateway API requires `validation.hostname`, so Envoy really
# does verify what this controller presents.
#
# Serving the wildcard satisfies that with nothing issued: `*.vpn.blueora.ng` covers
# `omada.vpn.blueora.ng`, which is now the ONLY name anything uses to reach this controller, and
# therefore the name Envoy validates. That collapses what used to be two certificates and two
# hostnames into one, and is why `omada.blueora.ng` could be retired rather than merely unused:
# nothing is left that needs a certificate for it.
#
# Same OpenBao entry every mesh exposure reads (`kv/mesh-tls`, published once by
# apps/secret/src/mesh-tls), so this adds no new source of truth. It is a SEPARATE Secret from
# the one the mesh exposure creates (`omada-mesh-tls`) even though the bytes are identical: that
# one is owned by the mesh-service release and read by Envoy Gateway over xDS, while this one is
# owned by this release and MOUNTED by the controller pod. Two releases must never claim one
# object.
#
# `rolloutRestartTargets` is a StatefulSet, NOT a Deployment: the omada-controller chart renders
# a StatefulSet (`<release>-omada-controller-0`). A `kind: Deployment` target names an object
# that does not exist, so VSO logs a lookup failure and a renewed certificate silently never
# reaches the pod.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: omada-controller-tls
  namespace: {{ .Release.Namespace }}
spec:
  type: kv-v2
  mount: {{ .Values.tls.mount | quote }}
  path: {{ .Values.tls.path | quote }}
  refreshAfter: 1h
  destination:
    name: omada-controller-tls
    create: true
    type: kubernetes.io/tls
    transformation:
      # The kv entry already stores `tls.crt` and `tls.key` under exactly those names; only the
      # operator's `_raw` field needs dropping, which would otherwise ship a second copy of the
      # private key for no consumer.
      excludeRaw: true
  rolloutRestartTargets:
    - kind: StatefulSet
      name: "{{ .Release.Name }}-omada-controller"
