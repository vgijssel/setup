# Omada device-adoption/management L4 ports (TCP 29811-29817 + UDP 27001/29810/19810)
# exposed over NetBird as a *Network Resource* (operator v1 stack), NOT via the BYOP
# reverse proxy. The reverse proxy carries only the HTTPS admin UI as a NetBird-Only private
# service (see apps/network/src/cloudflare-config/workspace-reverse-proxy-services.yaml);
# it CANNOT serve these raw TCP ports on the current image — netbirdio/netbird#6400 makes
# mode=tcp L4 services silently not bind on reverse-proxy 0.72.x, and the private-services
# feature is 0.72-only, so no single proxy version serves both the UI and TCP L4. NetBird
# Networks (routing peer + NBResource) forward all TCP/UDP at L3/L4 and sidestep that entirely.
#
# The netbird.io/expose annotation makes the operator create a domain-type NBResource
# (address omada-adopt.omada.svc.cluster.local) on the `router` NBRoutingPeer's network
# (apps/network/src/netbird-config/nbroutingpeer-router.yaml) plus an access policy from the
# `homelab` group (the Mac + the pikvm routing peer) to it. Requires operator
# ingress.allowAutomaticPolicyCreation=true. Omitting policy-protocol/policy-ports lets the
# auto-policy allow both TCP and UDP on all ports to homelab (all device ports are trusted
# homelab traffic); the routed ports are bound by this Service's port list below.
#
# Physical Omada devices are not NetBird clients: they resolve omada-adopt.network.vgijssel.nl
# via public DNS and route the NetBird range through the pikvm routing peer on their LAN
# (custom domain + external-dns IP sync are wired in follow-up tasks). This Service's ClusterIP
# is what the in-cluster routing peer dials; the selector matches the omada-controller subchart
# pods exactly (a mismatch leaves it with zero endpoints).
apiVersion: v1
kind: Service
metadata:
  name: omada-adopt
  namespace: {{ .Release.Namespace }}
  annotations:
    netbird.io/expose: "true"
    netbird.io/groups: omada-adopt
    netbird.io/policy: omada-adopt
    netbird.io/policy-source-groups: homelab
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: omada-controller
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    # device manager v1
    - name: manager-v1
      port: 29811
      targetPort: 29811
      protocol: TCP
    # device adopt v1
    - name: adopt-v1
      port: 29812
      targetPort: 29812
      protocol: TCP
    # device upgrade v1
    - name: upgrade-v1
      port: 29813
      targetPort: 29813
      protocol: TCP
    # device manager v2
    - name: manager-v2
      port: 29814
      targetPort: 29814
      protocol: TCP
    # device transfer v2
    - name: transfer-v2
      port: 29815
      targetPort: 29815
      protocol: TCP
    # rtty (remote terminal)
    - name: rtty
      port: 29816
      targetPort: 29816
      protocol: TCP
    # device monitor (Omada 6)
    - name: device-monitor
      port: 29817
      targetPort: 29817
      protocol: TCP
    # app discovery
    - name: app-discovery
      port: 27001
      targetPort: 27001
      protocol: UDP
    # device discovery
    - name: udp-discovery
      port: 29810
      targetPort: 29810
      protocol: UDP
    # device management UDP
    - name: udp-management
      port: 19810
      targetPort: 19810
      protocol: UDP
