# The `mongodb-uri` Secret Omada consumes (config.externalMongoDBUrlSecret), built by Vault
# Secrets Operator from OpenBao.
#
# ── WHY THIS IS CONSTRUCTED RATHER THAN COPIED ──────────────────────────────────────────────
# It used to be an ExternalSecret reading the Percona operator's generated
# `mongodb-custom-user-secret-conn-str` out of the mongodb namespace through ESO's KUBERNETES
# provider, rewriting it on the way. That was the LAST thing keeping External Secrets Operator in
# the stack, because VSO only speaks the Vault API and cannot read a Kubernetes Secret.
#
# The insight that removed it: only the PASSWORD is secret. Hosts, port, replica set, authSource
# and database are static topology this chart already knows. So OpenBao owns the password
# (../../mongodb/vaultstaticsecret-omada-user.yaml hands the same value to the Percona operator
# via users[].passwordSecretRef) and the URI is assembled here. Nothing copies a Secret across
# namespaces, and ESO is gone.
#
# ── THE URI SHAPE IS NOT ARBITRARY ──────────────────────────────────────────────────────────
# It reproduces exactly what the operator emitted, minus two deliberate edits that the old ESO
# template also made:
#
#   /omada      the operator's string names NO database (it ends `/?authSource=admin`), but Omada
#               needs the `omada` db in the path.
#   no tls=true Percona enables TLS by default and mongod presents a cert from its OWN in-cluster
#               CA. Omada's bundled Mongo Java driver validates against the JVM truststore, which
#               lacks that CA, and the stock image offers no way to inject it and ignores
#               tlsInsecure — so it crashloops with
#               "SSLHandshakeException: PKIX path building failed". mongod runs in Percona's
#               default preferTLS mode, which still accepts a plaintext connection, so stripping
#               tls=true is what makes Omada able to connect at all.
#
# The seed host list is built by the `omada.mongoSeeds` helper in _helpers.tpl, generated from
# .Values.mongodb so it cannot drift from the replica count in the PerconaServerMongoDB CR.
#
# The password is interpolated VERBATIM, with no percent-encoding — see the URL-safety note in
# ../../mongodb/vaultstaticsecret-omada-user.yaml.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: mongodb-uri
  namespace: {{ .Release.Namespace }}
spec:
  type: kv-v2
  mount: kv
  path: mongodb
  refreshAfter: 1h
  destination:
    name: mongodb-uri
    create: true
    transformation:
      templates:
        uri:
          text: '{{ printf "mongodb://%s:{{ get .Secrets \"omada_password\" }}@%s/%s?authSource=admin&replicaSet=%s" .Values.mongodb.user (include "omada.mongoSeeds" .) .Values.mongodb.database .Values.mongodb.replsetName }}'
      excludeRaw: true
      excludes:
        - .*
  # Omada reads the URI once, at startup, so a rotated password is invisible to the running pod.
  # VSO recycles it rather than leaving that to Reloader.
  rolloutRestartTargets:
    - kind: Deployment
      name: {{ .Release.Name }}
