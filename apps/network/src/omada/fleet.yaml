# Portable Fleet bundle for the Omada controller. Fleet detects the umbrella
# Chart.yaml here and deploys it with values.yaml, plus the sibling raw manifests
# (the LE Certificate, the mongodb-uri ExternalSecret, and the mesh-exposed omada
# Service in templates/). Owns the `omada` namespace.
#
# dependsOn the mongodb bundle so the database is up before Omada connects. The pod also needs
# the mongodb-uri + TLS Secrets (VSO/cert-manager) before it is fully Ready. Fleet
# error-and-retries during bootstrap until the DB + secrets exist, which is expected.
#
# This bundle owns the DEVICE path only — the pinned-ClusterIP Service, its explicit NetBird
# resource, the CoreDNS override and the `omada.blueora.ng` certificate, all for physical APs and
# switches that cannot run a mesh client. Mesh peers reach the controller at
# `omada.vpn.blueora.ng` through the separate ../mesh-omada bundle, which has its own peer and its
# own port space. The split is documented as a named exception in
# ../mesh-omada/. There is no LoadBalancer/VIP dependency and no pinned ClusterIP any more.
labels:
  fleet.vgijssel.nl/bundle: network-omada
defaultNamespace: omada
helm:
  releaseName: omada
dependsOn:
  - selector:
      matchLabels:
        fleet.vgijssel.nl/bundle: vault-secrets-operator
  - selector:
      matchLabels:
        fleet.vgijssel.nl/bundle: network-mongodb
# network-ONLY. bin/fleet-apply applies every bundle globally, so target the network
# cluster explicitly (previously scoped only by network:apply's static list) — this
# keeps the bundle off the secret cluster.
targetCustomizations:
  - name: network
    clusterSelector:
      matchLabels:
        cluster.vgijssel.nl/name: network
  # Terminal catch-all. Targets are first-match-wins and a GitRepo APPENDS its own target
  # after these, so without this a non-matching cluster falls through to it and deploys with
  # default values. Keeps this bundle off every cluster not named above. See bin/fleet-lint-targets.
  - name: none
    doNotDeploy: true
    clusterSelector: {}
