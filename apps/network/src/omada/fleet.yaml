# Portable Fleet bundle for the Omada controller. Fleet detects the umbrella
# Chart.yaml here and deploys it with values.yaml, plus the sibling raw manifests
# (the LE Certificate, the mongodb-uri ExternalSecret, and the mesh-exposed omada
# Service in templates/). Owns the `omada` namespace.
#
# dependsOn the mongodb bundle so the database is up before Omada connects. The pod
# also needs the mongodb-uri + TLS Secrets (ESO/cert-manager) before it is fully Ready;
# Omada is exposed cross-cluster over the NetBird mesh via service-omada.yaml (a ClusterIP
# annotated netbird.io/expose → an NBResource on the netbird-config `router` routing peer),
# so there is no LoadBalancer/VIP dependency. Fleet error-and-retries during
# bootstrap until the DB + secrets exist, which is expected.
labels:
  fleet.vgijssel.nl/bundle: network-omada
defaultNamespace: omada
helm:
  releaseName: omada
dependsOn:
  - selector:
      matchLabels:
        fleet.vgijssel.nl/bundle: network-mongodb
# network-ONLY. bin/fleet-apply applies every bundle globally, so target the network
# cluster explicitly (previously scoped only by network:apply's static list) — this
# keeps the bundle off the secret cluster.
targetCustomizations:
  - name: network
    clusterSelector:
      matchLabels:
        cluster.vgijssel.nl/name: network
