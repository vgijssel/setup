# Plain ClusterIP fronting the JWKS mirror. Nothing mesh-related lives here any more.
#
# The mirror is published to the mesh by ../mesh-jwks/, which runs its own Envoy Gateway pod with
# its own NetBird client and therefore its own overlay address and DNS label
# (`jwks-network.vpn.blueora.ng`). That exposure dials this Service as an ordinary in-cluster
# backendRef, by name, like any other Kubernetes consumer — so this Service needs no annotations,
# no pinned address and no knowledge that it is reachable off-cluster.
#
# NO `netbird.io/*` ANNOTATIONS, on purpose. They used to make the operator infer a domain-type
# NBResource (`jwks-mirror.netbird.svc.cluster.local`) plus an access policy, which the secret
# cluster's socat forwarder dialled directly. That path is gone: the forwarder now relays RAW TCP
# to the published mesh hostname instead, which is what let OpenBao's JWKS leg move from plain
# HTTP to fully validated end-to-end TLS (apps/secret/src/jwks-gateway/). Removing the
# annotations is also what frees the operator's `ingress.allowAutomaticPolicyCreation` flag from
# being load-bearing on this cluster.
apiVersion: v1
kind: Service
metadata:
  name: jwks-mirror
  namespace: netbird
  labels:
    app: jwks-mirror
spec:
  selector:
    app: jwks-mirror
  ports:
    - name: http
      port: 80
      targetPort: 8080
