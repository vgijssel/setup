# external-dns's Cloudflare API token, delivered by Vault Secrets Operator with a LIVE OpenBao
# lease. Replaces the ExternalSecret that used to sit beside this file.
#
# WHY: ESO cannot hold a lease. A secret lease is a CHILD of the auth token that created it, and
# ESO calls RevokeSelf after every read (its own fix for leaking token leases,
# external-secrets#376), so the cascade deletes the credential seconds after it lands in the
# Secret. The ESO workaround was to mint UNLEASED and rely only on Cloudflare's expires_on, so
# nothing could revoke a leaked token early. VSO renews the lease, reissues if it is revoked or
# expires, and hands the credential back when this resource is deleted.
#
# This cluster reaches OpenBao over the NetBird mesh with JWT auth, so VSO's default VaultAuth
# here uses the jwt-network backend and role `network-vso`
# (../../../../platform/src/vault-secrets-operator/fleet.yaml, network target).
#
# The target Secret name, namespace and `api-token` key are UNCHANGED, so values.yaml's
# CF_API_TOKEN env reference keeps working untouched.
---
# The identity VSO logs in as. It must live in THIS namespace, not the operator's — the VaultAuth
# CRD requires the ServiceAccount to "reside in the consuming secret's namespace". OpenBao's JWT
# role binds exactly system:serviceaccount:external-dns:vault-secrets-operator.
#
# A dedicated SA rather than `default`, because that role carries the lease-management grants
# (sys/leases/renew|revoke|lookup).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets-operator
  namespace: {{ .Release.Namespace }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultDynamicSecret
metadata:
  name: external-dns-cloudflare-api-token
  namespace: {{ .Release.Namespace }}
spec:
  mount: cloudflare
  path: token/external-dns
  # A genuinely dynamic, lease-backed credential (the default, stated for clarity). VSO renews
  # the lease at ~67% of its duration and reissues when it is revoked or expires.
  allowStaticCreds: false
  # Hand the lease back on deletion so the Cloudflare token disappears upstream immediately
  # instead of lingering until expires_on. The capability ESO could never provide.
  revoke: true
  destination:
    name: external-dns-cloudflare-api-token
    # VSO creates and owns the Secret. ESO's ExternalSecret used `creationPolicy: Owner`, so
    # removing it DELETES the Secret — the handover is a brief gap, not an overlap, and
    # `create: false` would leave this stuck on "Destination secret does not exist" with
    # external-dns holding nothing.
    create: true
    transformation:
      # The engine returns `api_token`; values.yaml reads `api-token`. ESO did this rename with
      # `secretKey`, which VSO has no equivalent for, so it is a template.
      templates:
        api-token:
          text: '{{ `{{ get .Secrets "api_token" }}` }}'
      # Drop `_raw` (a second copy of the token) and the token_id/expires_on fields nothing reads.
      excludeRaw: true
      excludes:
        - .*
  # external-dns reads CF_API_TOKEN from env ONCE, at startup, so it cannot see a changed Secret
  # at all — it would keep using a token that gets revoked and then CrashLoopBackOff on its
  # startup zone enumeration (exactly what 393 restarts looked like when the old static token
  # died). This REPLACES the Reloader annotation in values.yaml, which is removed with it.
  rolloutRestartTargets:
    - kind: Deployment
      name: {{ .Release.Name }}
