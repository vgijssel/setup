# Mints external-dns's own Cloudflare API token from the cloudflare secrets engine. Replaces the
# shared long-lived token from kv/cloudflare#credential — when that went invalid this Deployment
# sat in CrashLoopBackOff for 393 restarts, because external-dns enumerates zones at startup and
# dies if that call fails.
#
# The role grants DNS Write + Zone Read on the two managed zones (blueora.ng and vgijssel.nl,
# which live in different Cloudflare accounts) and nothing else. Zone Read is what the startup
# zone enumeration needs; cert-manager's role omits it.
#
# ROTATION + RESTART: each read MINTS A NEW token. The role's max_ttl is 48h (which is
# Cloudflare's own expires_on for the token) and this refreshes every 24h, so a fresh token lands
# halfway through the old one's life, overlapping by 24h.
#
# The role is deliberately UNLEASED (manage_lease=false): an OpenBao secret lease belongs to the
# auth token that created it, and ESO revokes its own Vault token after each read, which would
# delete this credential seconds after it lands. Lifetime comes from Cloudflare's expires_on.
#
# external-dns reads CF_API_TOKEN from env at STARTUP (see ../values.yaml), so unlike
# cert-manager it cannot notice a changed Secret on its own. The Deployment therefore carries
# `reloader.stakater.com/auto` so Reloader restarts it when this Secret's contents change. The
# 24h overlap is what makes that restart safe rather than urgent: the running pod's token stays
# valid for another day, so a delayed or failed reload degrades nothing.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-dns-cloudflare-api-token
  namespace: external-dns
spec:
  # Half the role's 48h ttl: rotate every 24h with 24h of overlap.
  refreshInterval: 24h
  secretStoreRef:
    name: openbao-cloudflare
    kind: ClusterSecretStore
  target:
    name: external-dns-cloudflare-api-token
    creationPolicy: Owner
  data:
    - secretKey: api-token
      remoteRef:
        # Reading this path mints the token; `api_token` is the plaintext value.
        key: token/external-dns
        property: api_token
