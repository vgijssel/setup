# external-dns, Cloudflare provider, on the NETWORK cluster. Its ONLY job is to publish the
# current overlay address of mesh exposures that opt into `publicDns`, so that consumers which
# cannot run a mesh client can still resolve a mesh hostname.
#
# A mesh hostname is NOT publicly resolvable by default — the shared mesh-service chart ships
# `publicDns` disabled, and only an exposure with non-peer consumers opts in (today: omada
# alone, for the TP-Link gateway/switches/APs). Each opt-in publishes ONE explicit
# `<service>.vpn.blueora.ng` A record through a `DNSEndpoint` that the chart renders and the
# exposure's own pod patches, so the set of publicly resolvable mesh names is enumerable from
# the zone rather than implied by it.
#
# A WILDCARD IN THIS ZONE REMAINS FORBIDDEN, and these per-name records do not weaken that: a
# Cloudflare wildcard answers at arbitrary label depth, so one `*` would publish every mesh
# hostname that exists or ever will — including every service with no device consumers.
#
# VERIFIED BEFORE ENABLING THIS (openspec 12.1), because the obvious fear is that a public record
# shadows NetBird's resolver for peers: with a deliberately wrong public A record live for a real
# peer name (`pikvm.vpn.blueora.ng` -> `192.0.2.1`), the Mac's SYSTEM resolver, an in-cluster
# peer's resolver and an ordinary in-cluster pod ALL still returned the overlay address, while
# `1.1.1.1` and `8.8.8.8` returned the synthetic one. NetBird's match-domain wins.
#
# triggerLoopOnEvent is what makes this a PUSH path: external-dns runs its loop on
# create/update/delete of a watched source instead of only every --interval. The peer address
# changes exactly when the publishing pod starts, so the pod's own write is the trigger and the
# record follows within seconds rather than up to a minute.
#
# policy=sync lets it create AND remove the records it owns, which is what makes a deleted
# exposure withdraw its name. proxied defaults to false and must stay false: an orange-cloud
# record would hand back Cloudflare edge IPs instead of the mesh-routable overlay address.
#
# The Cloudflare API token is MINTED PER READ by the OpenBao cloudflare secrets engine and
# delivered by Vault Secrets Operator with a LIVE lease
# (templates/vaultdynamicsecret-external-dns.yaml): a token scoped to DNS Write + Zone Read on
# the two managed zones, renewed while in use and revoked upstream when the lease ends. It is no
# longer the long-lived token shared with cert-manager out of kv/cloudflare#credential, nor the
# unleased one ESO had to mint because it destroys its own leases.
#
# domainFilters + txtOwnerId scope external-dns to the managed zones and tag its TXT ownership
# records to THIS cluster — the secret cluster's external-dns MUST use a different owner id or
# the two would delete each other's records (historically observed).
#
# `blueora.ng` is where the mesh peer DNS domain lives, so it is the zone the `publicDns` records
# land in. `vgijssel.nl` stays listed because the zone is still in use for non-mesh groupings,
# though nothing here publishes into it any more (`omada.network.vgijssel.nl`, the last such
# record, was retired 2026-10-07). policy=sync only removes records carrying a matching TXT
# ownership record, so pre-existing entries this cluster never created (the blueora.ng apex,
# cert-manager's transient _acme-challenge TXTs) are not at risk.
external-dns:
  # NOTE no Reloader annotation. external-dns reads CF_API_TOKEN from env ONCE, at startup, so a
  # rotated Secret is invisible to the running pod — but the restart is now driven by VSO's own
  # `rolloutRestartTargets` (templates/vaultdynamicsecret-external-dns.yaml) rather than by
  # Reloader watching the Secret. One mechanism, owned by the thing that rotates the credential.
  provider:
    name: cloudflare
  # ── ONE SOURCE: `crd`. ────────────────────────────────────────────────────────────────────
  # DNSEndpoint CRs, rendered by mesh exposures that opt into `publicDns` and filled in by their
  # publisher sidecars. The chart grants the dnsendpoints RBAC automatically when this source is
  # listed (clusterrole.yaml keys off it), so there is nothing else to add. The CRD is installed
  # cluster-wide already.
  #
  # `service` was removed on 2026-10-07 along with `--publish-internal-services`. It existed for
  # exactly one annotated Service — the Omada device path's pinned ClusterIP — and that Service
  # is deleted, so the source had no remaining input. Leaving it enabled would mean any future
  # Service that happens to carry a hostname annotation gets published silently; requiring a
  # DNSEndpoint makes publication an explicit, reviewable act.
  sources:
    - crd
  # Run the reconcile loop on watched-source changes, not only every `interval`. See the header:
  # this is what turns a peer-address change into a sub-minute DNS update instead of a polled one.
  triggerLoopOnEvent: true
  policy: sync
  registry: txt
  txtOwnerId: network-cluster
  domainFilters:
    - blueora.ng
    - vgijssel.nl
  env:
    - name: CF_API_TOKEN
      valueFrom:
        secretKeyRef:
          name: external-dns-cloudflare-api-token
          key: api-token
