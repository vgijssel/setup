# Portable Fleet bundle for external-dns on the network cluster. Fleet detects the umbrella
# Chart.yaml here and deploys it with values.yaml, plus the sibling ExternalSecret template.
# Needs the external-dns-cloudflare-api-token Secret (synced from OpenBao by the template
# below); until that exists external-dns crash-loops on the missing token, expected during
# bootstrap.
#
# network-ONLY. bin/fleet-apply applies every bundle globally, so target the network cluster
# explicitly — this keeps external-dns (and its network-cluster txtOwnerId) off the secret
# cluster. If the secret cluster ever needs its own external-dns it MUST declare a distinct
# txtOwnerId, or the two clusters would treat each other's records as orphans and delete
# them (a hard boundary observed with the omada record).
labels:
  fleet.vgijssel.nl/bundle: network-external-dns
defaultNamespace: external-dns
helm:
  releaseName: external-dns
# dependsOn the vault-secrets-operator bundle, which installs the secrets.hashicorp.com CRDs.
# Fleet applies a bundle as ONE atomic unit, so a VaultStaticSecret/VaultDynamicSecret here
# cannot land before the CRD that defines it exists — without this a fresh cluster fails the
# bundle with "no matches for kind", the same rule that keeps Crossplane CRs out of the
# provider's own bundle.
dependsOn:
  - selector:
      matchLabels:
        fleet.vgijssel.nl/bundle: vault-secrets-operator
targetCustomizations:
  - name: network
    clusterSelector:
      matchLabels:
        cluster.vgijssel.nl/name: network
  # Terminal catch-all. Targets are first-match-wins and a GitRepo APPENDS its own target
  # after these, so without this a non-matching cluster falls through to it and deploys with
  # default values. Keeps this bundle off every cluster not named above. See bin/fleet-lint-targets.
  - name: none
    doNotDeploy: true
    clusterSelector: {}
