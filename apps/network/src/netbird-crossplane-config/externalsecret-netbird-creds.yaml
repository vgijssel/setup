# Syncs the NetBird admin PAT into the Secret the netbird ProviderConfig references
# (key `credentials`, used directly as the management-API bearer token). Same admin token
# the operator uses (kv/network-netbird-operator#access_token) — the provider needs admin
# to create Networks/Routers/Resources/Groups/Policies. Lives in crossplane-system so the
# provider pod can read it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbird-crossplane-creds
  namespace: crossplane-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: netbird-crossplane-creds
    creationPolicy: Owner
  data:
    - secretKey: credentials
      remoteRef:
        key: network-netbird-operator
        property: access_token
