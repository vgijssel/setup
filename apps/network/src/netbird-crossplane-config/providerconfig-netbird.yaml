# ProviderConfig for netbird-crossplane-provider: token auth against NetBird Cloud, with
# the PAT read from the netbird-crossplane-creds Secret (synced from OpenBao). The
# management URL is kept explicit here (not scattered) so a future self-hosted cutover
# only edits this one value.
apiVersion: netbird.crossplane.io/v1alpha1
kind: ProviderConfig
metadata:
  name: netbird
spec:
  management-uri: https://api.netbird.io:443
  credentials-type: token
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: netbird-crossplane-creds
      key: credentials
