# The terranetes executor runs in terranetes-system as terranetes-executor, and the
# shared tfstate for tailscale-config lives in a Secret in that same namespace
# (tfstate-default-tailscale-config — see the backend template + network:configure). The
# kubernetes backend needs get/list/create/update/delete on that state Secret and its
# coordination Lease (state locking), so grant the executor SA exactly that. Without this
# the runner's tofu init/apply fails writing state.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: terranetes-state
  namespace: terranetes-system
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - create
      - update
      - delete
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - create
      - update
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: terranetes-state
  namespace: terranetes-system
subjects:
  - kind: ServiceAccount
    name: terranetes-executor
    namespace: terranetes-system
roleRef:
  kind: Role
  name: terranetes-state
  apiGroup: rbac.authorization.k8s.io
