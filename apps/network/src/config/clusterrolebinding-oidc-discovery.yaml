# Make the OIDC discovery endpoints anonymously readable so the secret cluster's
# OpenBao can fetch this cluster's JWKS over the tailnet (via the operator's noauth
# API-server proxy) WITHOUT credentials — OpenBao's jwks_url fetch is unauthenticated.
#
# system:service-account-issuer-discovery is a built-in ClusterRole that grants GET on
# EXACTLY two non-resource URLs — /openid/v1/jwks and /.well-known/openid-configuration
# (public key material) — and nothing else. Binding it to the system:unauthenticated
# group lets anonymous callers read only those two endpoints; every other API path stays
# denied for system:anonymous. Reachability is further gated by the tailnet ACL (ACL-C),
# which only permits the secret cluster's egress proxy to reach network-operator:443.
#
# Paired with apiServerProxyConfig.mode=noauth (apps/platform/src/tailscale/fleet.yaml)
# and the jwt-network backend's jwks_url (apps/secret/src/openbao-config).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oidc-discovery-unauthenticated
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:service-account-issuer-discovery
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: system:unauthenticated
