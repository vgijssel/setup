# terranetes Provider for the tailscale-config Configuration. terranetes requires a
# providerRef and always injects a provider block from it — but the OpenTofu module
# (apps/network/src/tailscale-config) owns the real provider blocks (its vault provider
# must file()-read the ServiceAccount JWT for jwt auth, and its tailscale provider is
# configured from a vault data source — neither can be a static injected block). So this
# Provider uses a throwaway `null` type: terranetes injects a harmless, unused
# `provider "null" {}` and the module's own providers do the real work.
#
# source: injected + serviceAccount runs the executor job as terranetes-executor; the
# module's vault provider then exchanges that pod's ServiceAccount JWT for a token via the
# remote `network-terranetes` jwt-network role. Cluster-scoped.
apiVersion: terraform.appvia.io/v1alpha1
kind: Provider
metadata:
  name: tailscale
spec:
  provider: "null"
  source: injected
  serviceAccount: terranetes-executor
