# The ClusterSecretStore the network cluster reads ALL secrets from. Unlike the
# secret cluster (in-cluster kubernetes auth against a local OpenBao), network is
# REMOTE: it has no OpenBao of its own and reaches the secret cluster's OpenBao over
# the tailnet at https://openbao.secret.vgijssel.nl, authenticating with JWT auth. ESO mints a
# projected ServiceAccount token (audience "openbao") for external-secrets and posts
# it to the jwt-network backend; OpenBao validates the signature against the network
# cluster's live JWKS (the jwt-network backend on the secret side fetches it over the
# tailnet) and grants the read-only network-read policy. No static Vault token is ever
# written to disk.
#
# Named `openbao` to match the store the shared ExternalSecrets reference by name
# (apps/platform/src/config) — that is what lets one ExternalSecret set serve both
# clusters. In-cluster egress to openbao.secret.vgijssel.nl (SNI preserved) is provided by the
# Tailscale operator egress in service-openbao-egress.yaml (SPEC R8).
#
# Stays NotReady until: the tailnet egress is approved (ACL-A grant so network-operator
# may reach svc:secret), the operator is up, and the jwt-network backend/role exist on
# OpenBao (T8 applied via secret:configure).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: https://openbao.secret.vgijssel.nl
      path: kv
      version: v2
      auth:
        jwt:
          path: jwt-network
          role: network-eso
          kubernetesServiceAccountToken:
            serviceAccountRef:
              name: external-secrets
              namespace: external-secrets
            audiences:
              - openbao
