# ClusterSecretStore for the cloudflare custom secrets engine (network cluster). Separate from
# the main `openbao` store (kv v2) because the cloudflare engine is v1-style — ESO reads paths
# directly, with no /data/ prefix.
#
# Every read of a cloudflare/token/<role> path MINTS A NEW Cloudflare API token, so
# `refreshInterval` on the consuming ExternalSecret sets the rotation cadence. The roles use
# ttl 48h while consumers refresh every 24h, so successive tokens overlap by 24h.
#
# This cluster is where external-dns runs, and external-dns reads its token from env at STARTUP —
# so rotation here is paired with a Reloader annotation on the Deployment (see
# ../external-dns/values.yaml), which restarts it when the Secret changes. cert-manager needs no
# such restart: it re-reads the Secret from the API on each challenge.
#
# Auth: same JWT auth as the main store (jwt-network backend, network-eso role) over the NetBird
# mesh via the eso-sidecar peer. The network-read policy must include cloudflare/token/* for this
# to work — it does.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao-cloudflare
spec:
  provider:
    vault:
      server: https://openbao.secret.vgijssel.nl
      path: cloudflare
      version: v1
      auth:
        jwt:
          path: jwt-network
          role: network-eso
          kubernetesServiceAccountToken:
            serviceAccountRef:
              name: external-secrets
              namespace: external-secrets
            audiences:
              - openbao
