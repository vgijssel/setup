# Portable Fleet bundle for the network cluster's per-cluster secret-consumer wiring:
#   - serviceaccounts-vso.yaml : one ServiceAccount per consuming namespace for Vault Secrets
#     Operator to log in as. The connection itself is NOT here — it is the shared
#     apps/platform/src/vault-secrets-operator bundle's per-cluster
#     `defaultVaultConnection.address`, which on this cluster points at
#     https://openbao.vpn.blueora.ng (the secret cluster's mesh exposure). Reachability is the
#     routing peer in ../netbird-config, with no sidecar on the VSO pod.
#   - clusterrolebinding-oidc-discovery.yaml : makes /openid/v1/jwks anonymously
#     readable so secret's OpenBao can fetch this cluster's JWKS live over the mesh
#     (relayed through apps/network/src/mesh-jwks -> jwks-network.vpn.blueora.ng).
#   - vaultdynamicsecret-netbird-mgmt-api-key.yaml : the NetBird operator PAT.
#
# The ESO ClusterSecretStore this bundle was built around is gone — External Secrets Operator was
# removed entirely, and so was the eso-sidecar bundle that gave it a mesh identity. Its one
# remaining trace is `defaultNamespace: external-secrets` below, kept because every resource here
# names its own namespace explicitly (so the value is a dead fallback) and because changing a raw
# bundle's defaultNamespace moves the Helm release, which risks ownership-metadata conflicts on
# re-adoption — not worth it for a cosmetic gain. The leftover empty `external-secrets` namespace
# on this cluster is from the same root.
defaultNamespace: external-secrets
# network-ONLY. bin/fleet-apply applies every bundle globally, so target the network
# cluster explicitly (previously scoped only by network:apply's static list).
# dependsOn the vault-secrets-operator bundle, which installs the secrets.hashicorp.com CRDs.
# Fleet applies a bundle as ONE atomic unit, so a VaultStaticSecret/VaultDynamicSecret here
# cannot land before the CRD that defines it exists — without this a fresh cluster fails the
# bundle with "no matches for kind", the same rule that keeps Crossplane CRs out of the
# provider's own bundle.
dependsOn:
  - selector:
      matchLabels:
        fleet.vgijssel.nl/bundle: vault-secrets-operator
targetCustomizations:
  - name: network
    clusterSelector:
      matchLabels:
        cluster.vgijssel.nl/name: network
  # Terminal catch-all. Targets are first-match-wins and a GitRepo APPENDS its own target
  # after these, so without this a non-matching cluster falls through to it and deploys with
  # default values. Keeps this bundle off every cluster not named above. See bin/fleet-lint-targets.
  - name: none
    doNotDeploy: true
    clusterSelector: {}
