# Syncs the NETWORK cluster's OWN Tailscale operator OAuth client from OpenBao into the
# `operator-oauth` secret the operator expects (Phase 8 / T23). Split out of the shared
# platform-config ExternalSecret so each cluster has an independent credential + tag
# identity (mirrors the T5 ClusterSecretStore split): the network cluster reads
# kv/tailscale-network, the secret cluster reads kv/tailscale-secret. This bounds the
# blast radius of a rotation/compromise to one cluster and lets ACLs name direction
# (tag:network-k8s vs tag:secret-k8s) instead of a shared tag:k8s.
#
# Requires kv/tailscale-network seeded in OpenBao with oauth_client_id/oauth_client_secret
# for the OAuth client tagged tag:network-operator (created in the Tailscale admin
# console). Until then this ExternalSecret error-and-retries; the existing operator-oauth
# secret is RETAINED (deletionPolicy defaults to Retain), so the running operator keeps
# working. defaultTags are NOT flipped until T24 — see apps/platform/src/tailscale.
#
# NOTE: distinct from kv/network-tailscale-config — that is the all:write OAuth client the
# terranetes tailscale provider uses to manage the tailnet ACL (apps/network/scripts/
# configure.sh), NOT the operator client. Leave it untouched.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: operator-oauth
  namespace: tailscale
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: operator-oauth
    creationPolicy: Owner
  data:
    - secretKey: client_id
      remoteRef:
        key: tailscale-network
        property: oauth_client_id
    - secretKey: client_secret
      remoteRef:
        key: tailscale-network
        property: oauth_client_secret
