# Mints cert-manager's Cloudflare API token from the cloudflare secrets engine, replacing the
# single long-lived token that used to be shared here from kv/cloudflare#credential. When that
# token went invalid, DNS-01 broke on BOTH clusters at once with no symptom beyond a 9109 — one
# credential, one blast radius. This one is cert-manager's alone, scoped to DNS Write on the two
# managed zones, and self-expiring after 48h.
#
# ROTATION: each read MINTS A NEW token. The role's max_ttl is 48h (which is Cloudflare's own
# expires_on for the token) and this refreshes every 24h, so a fresh token arrives halfway
# through the previous one's life and the two overlap by a full day.
#
# cert-manager needs a RESTART to pick it up — measured, not assumed. After this Secret was
# updated with a valid token, a pending challenge kept failing against the PREVIOUS token for
# over 10 minutes while that same new token worked by hand; a `rollout restart` then issued the
# certificate in 105 seconds. The solver keeps the credential it read when the challenge began.
# The restart is wired via a Reloader annotation in ../cert-manager/values.yaml, and the 24h
# overlap is what makes it safe rather than urgent.
#
# NOTE the role is deliberately UNLEASED (manage_lease=false). An OpenBao secret lease belongs to
# the auth token that created it, and ESO revokes its own Vault token after each read — so a
# leased credential is deleted seconds after landing here. Measured: this Secret once held a
# token that answered 9109 twenty seconds after a successful sync. Lifetime is enforced by
# Cloudflare's expires_on instead.
#
# NETWORK CLUSTER ONLY. This was a shared apps/platform/src/config manifest serving both
# clusters, but the secret cluster has moved to Vault Secrets Operator
# (apps/secret/src/config/vaultdynamicsecret-cloudflare-api-token.yaml), which holds a real
# OpenBao lease. That bundle is raw manifests and cannot vary per cluster, so the resource was
# split rather than gated. Converge the two back into one bundle once VSO lands here too, at
# which point this file and the `manage_lease = false` lines in the engine's role config both go.
#
# Reaches OpenBao over the NetBird mesh via the `openbao-cloudflare` ClusterSecretStore in this
# directory (JWT auth, jwt-network backend).
#
# Reads `token/cert-manager-network`, NOT `token/cert-manager`. A role is global — both clusters
# read the same path — so the secret cluster could not flip its role to leased while this consumer
# still destroys its own leases. The two roles carry identical permissions; this one exists purely
# because ESO cannot hold a lease, and it disappears with this file.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
spec:
  # Half the role's 48h ttl: rotate every 24h with 24h of overlap.
  refreshInterval: 24h
  secretStoreRef:
    name: openbao-cloudflare
    kind: ClusterSecretStore
  target:
    name: cloudflare-api-token
    creationPolicy: Owner
  data:
    - secretKey: api-token
      remoteRef:
        # Reading this path mints the token; `api_token` is the plaintext value, returned only
        # at creation. The engine also returns token_id and expires_on, which we do not need.
        key: token/cert-manager-network
        property: api_token
