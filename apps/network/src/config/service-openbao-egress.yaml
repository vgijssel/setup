# In-cluster tailnet egress to the secret cluster's OpenBao (SPEC R8). The network
# cluster's external-secrets must reach https://secret.vgijssel.nl over the tailnet
# with the Let's Encrypt SNI preserved (so the cert stays valid). The Tailscale
# operator provisions that path from this Service: the `tailnet-fqdn` annotation makes
# the operator stand up an egress proxy that transparently forwards TCP to the tailnet
# node behind secret.vgijssel.nl, so the client's TLS handshake — including SNI
# secret.vgijssel.nl — passes straight through and the secret-ingress serves the
# matching LE cert. The ClusterSecretStore's server URL keeps the real hostname
# (secret.vgijssel.nl), resolved in-cluster via the operator's egress.
#
# Requires ACL-A: the tailnet policy must grant the network-operator tag access to
# svc:secret, otherwise the egress node is not approved and this stays pending. The
# operator itself comes up from the bootstrap-seeded operator-oauth Secret before ESO
# needs this path.
apiVersion: v1
kind: Service
metadata:
  name: openbao
  namespace: external-secrets
  annotations:
    tailscale.com/tailnet-fqdn: secret.vgijssel.nl
spec:
  type: ExternalName
  # Placeholder; the Tailscale operator rewrites this to the egress proxy target.
  externalName: placeholder.tailnet-fqdn.ts.net
