# ClusterSecretStore for the netbird custom secrets engine (network cluster). Separate
# from the main `openbao` store (kv v2) because the netbird engine is v1-style — ESO
# reads paths directly (no /data/ prefix). Every read GENERATES a new credential, so
# refreshInterval on the ExternalSecrets controls rotation cadence.
#
# Auth: same JWT auth as the main store (jwt-network backend, network-eso role) over
# the NetBird mesh via the eso-sidecar peer. The network-read policy must include
# netbird/* paths for this to work.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao-netbird
spec:
  provider:
    vault:
      server: https://openbao.secret.vgijssel.nl
      path: netbird
      version: v1
      auth:
        jwt:
          path: jwt-network
          role: network-eso
          kubernetesServiceAccountToken:
            serviceAccountRef:
              name: external-secrets
              namespace: external-secrets
            audiences:
              - openbao
