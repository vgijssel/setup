# The ServiceAccounts Vault Secrets Operator logs in to OpenBao as, one per consuming namespace.
#
# WHY THEY ARE ALL HERE rather than beside each consumer: the VaultAuth CRD requires the login SA
# to "reside in the consuming secret's namespace", and some namespaces have consumers spread
# across more than one bundle. Defining the SA in each would make two bundles claim the same
# object and Fleet would report "not owned by us". One definition, in the cluster's config bundle.
#
# No dependsOn is needed in either direction: VSO retries a failed login, so a consumer that
# reconciles before its SA exists succeeds on a later pass.
#
# A DEDICATED SA rather than `default`: the `vault-secrets-operator` OpenBao policy carries the
# lease-management grants (sys/leases/renew|revoke|lookup).
#
# ── THESE NAMES ARE PART OF THE OPENBAO ROLE ────────────────────────────────────────────────
# This cluster authenticates by JWT, and OpenBao matches the token's `sub` claim against a
# comma-separated list on the role. So every SA below must appear verbatim as
# `system:serviceaccount:<namespace>:vault-secrets-operator` in boundClaims.sub on
# ../../../secret/src/openbao-config/role-network-vso.yaml, and the namespace must also appear in
# allowedNamespaces on the `network` target of
# ../../../platform/src/vault-secrets-operator/fleet.yaml. Three lists, kept in step by hand.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets-operator
  namespace: cert-manager
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets-operator
  namespace: crossplane-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets-operator
  namespace: external-dns
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets-operator
  namespace: netbird
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets-operator
  namespace: netdata
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets-operator
  namespace: omada
