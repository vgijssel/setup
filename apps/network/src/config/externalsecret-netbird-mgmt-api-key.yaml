# Syncs the NETWORK cluster's NetBird management API PAT from OpenBao into the
# `netbird-mgmt-api-key` Secret (key NB_API_KEY) the netbird-operator reads
# (netbirdAPI.keyFromSecret). Per-cluster credential (mirrors the former
# operator-oauth split): the network cluster reads kv/network-netbird-operator, the
# secret cluster reads kv/secret-netbird-operator, so a rotation/compromise is bounded
# to one cluster and each operator peer has an independent NetBird identity.
#
# The `netbird` namespace is owned by the netbird-operator bundle (Fleet
# defaultNamespace); this ExternalSecret targets it and stays NotReady until that
# namespace exists and the `openbao` ClusterSecretStore is Ready. On the network
# cluster the store is the REMOTE JWT store reaching the secret cluster's OpenBao over
# the NetBird mesh; it stays NotReady until the operator peer is Connected.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbird-mgmt-api-key
  namespace: netbird
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: netbird-mgmt-api-key
    creationPolicy: Owner
  data:
    - secretKey: NB_API_KEY
      remoteRef:
        key: network-netbird-operator
        property: access_token
