# TEMPORARY parallel Omada controller — see Chart.yaml for why this exists and what deletes it.
#
# Differences from the real ../omada bundle, all deliberate:
#   * its own EMBEDDED MongoDB, sharing nothing with the real controller's replica set;
#   * ONE exposure path (the mesh, via ../mesh-omada-temp). No pinned-ClusterIP Service, no
#     device `NBResource`, no CoreDNS override, no external-dns annotation and no nightly backup
#     CronJob — the whole point of group 12 is that a mesh peer needs none of that, and a
#     throwaway controller needs its state backed up even less;
#   * it serves the SHARED MESH WILDCARD on its own :8043 rather than a dedicated cert-manager
#     certificate (see tlsSecretName below), so no ACME interaction is needed to stand it up.
omada-controller-helm:
  config:
    # Rootless mode is the chart's supported external-MongoDB path.
    rootless: true

    # ── IT SERVES THE MESH WILDCARD ON ITS OWN :8043, AND THAT IS WHY NO CERTIFICATE IS ISSUED ──
    # The mesh exposure's HTTPS listener terminates the wildcard on :443 and then RE-ENCRYPTS to
    # this controller's own :8043, validating the name it presents (see
    # ../mesh-omada-temp/fleet.yaml's `backend.tls`). That validation is not optional — Gateway
    # API requires `validation.hostname` — so :8043 must present a certificate valid for
    # `omada-temp.vpn.blueora.ng`.
    #
    # The shared `*.vpn.blueora.ng` wildcard already covers that name, so mounting it here
    # satisfies the check with nothing new issued: no Certificate, no DNS-01, no ClusterIssuer,
    # and no new name in a Certificate Transparency log for a controller that gets deleted.
    # The real ../omada bundle instead validates `omada.blueora.ng`, its device-facing
    # cert-manager certificate — a dedicated certificate makes sense there because that name is
    # permanent and also faces LAN browsers.
    tlsSecretName: omada-temp-controller-tls

    # ── NO externalMongoDBUrl / externalMongoDBUrlSecret: THE EMBEDDED mongod IS THE POINT ─────
    # Setting neither is what makes this controller run its own bundled mongod. The chart emits
    # `EAP_MONGOD_URI` + `MONGO_EXTERNAL=true` only when one of those two values is set
    # (third_party/vendir/charts/omada-controller-helm/templates/statefulset.yaml); with both
    # absent the image falls back to the internal mongod on `../data/db` (port 27217 per the
    # controller's own omada.properties), i.e. ON THIS RELEASE'S OWN data PVC.
    #
    # That is deliberate TOTAL isolation, chosen over a second database on the shared replica set:
    # its own mongod process, its own storage, no shared credential, no `dbOwner` grant in
    # ../mongodb/perconaservermongodb.yaml, and no chance of two controllers ever touching one
    # dataset. It also makes teardown exact — deleting this bundle and its PVCs leaves NOTHING
    # behind in the real MongoDB to find and drop later.
    #
    # Worth knowing if this is ever copied for something permanent: the real ../omada controller
    # uses the external replica set precisely because its data matters — it gets real replication,
    # and Omada additionally derives a sibling `<db>_data` database for statistics (which is why
    # that bundle's user holds `dbOwner` on BOTH `omada` and `omada_data`). An embedded mongod is
    # the right call for a throwaway and the wrong one for anything you intend to keep.
    timezone: Europe/Amsterdam

  # ClusterIP only. The mesh exposure dials this Service by name as an ordinary in-cluster
  # backendRef; nothing else reaches this controller, so there is no second Service to pin.
  service:
    type: ClusterIP

  # The data volume now holds the EMBEDDED MongoDB as well as the controller's own files, so it
  # is sized for both rather than trimmed to the minimum. For reference the real controller's
  # databases are small — ~11 MB of config plus ~35 MB of statistics — and this one only ever
  # holds one site for the duration of a migration.
  #
  # Still deliberately modest: the OrbStack VM disk is shared by BOTH clusters, and above 85% it
  # puts DiskPressure on each of them simultaneously (openspec 9e), so a throwaway should not
  # claim space it will not use.
  #
  # NOTE these PVCs are StatefulSet volumeClaimTemplates, so deleting the bundle does NOT delete
  # them. Teardown has to remove them explicitly — see Chart.yaml's teardown list.
  persistence:
    data:
      enabled: true
      size: 2Gi
    logs:
      enabled: true
      size: 512Mi

# Where the shared mesh wildcard is read from, matching apps/platform/src/mesh-service's own
# `tls` contract so both read the same OpenBao entry.
tls:
  mount: kv
  path: mesh-tls
