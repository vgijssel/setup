# The connection string for the TEMPORARY controller, assembled the same way the real one is
# (../../omada/templates/vaultstaticsecret-mongodb-uri.yaml — read that file's header for why the
# URI is CONSTRUCTED rather than copied, and why `tls=true` must be absent).
#
# Only the DATABASE differs: `omada_temp` instead of `omada`, so the two controllers share a
# replica set and a credential but never a dataset. That isolation is the whole point — the
# migration has to move devices between two genuinely separate controller states.
#
# The matching `dbOwner db: omada_temp` grant lives in ../../mongodb/perconaservermongodb.yaml.
# Without it this URI authenticates successfully and then fails on the first write, which
# presents as a Mongo fault rather than a missing role.
#
# Named `omada-temp-mongodb-uri` rather than `mongodb-uri`: this shares the `omada` namespace with
# the real controller (see Chart.yaml), so an unprefixed name would collide with its Secret and
# the two Helm releases would fight over one object.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: omada-temp-mongodb-uri
  namespace: {{ .Release.Namespace }}
spec:
  type: kv-v2
  mount: kv
  path: mongodb
  refreshAfter: 1h
  destination:
    name: omada-temp-mongodb-uri
    create: true
    transformation:
      templates:
        uri:
          text: '{{ printf "mongodb://%s:{{ get .Secrets \"omada_password\" }}@%s/%s?authSource=admin&replicaSet=%s" .Values.mongodb.user (include "omada-temp.mongoSeeds" .) .Values.mongodb.database .Values.mongodb.replsetName }}'
      excludeRaw: true
      excludes:
        - .*
  # Omada reads the URI once, at startup, so a rotated password is invisible to the running pod.
  # StatefulSet, NOT Deployment — the omada-controller chart renders a StatefulSet (its pod is
  # `<release>-omada-controller-0`). A `kind: Deployment` target names an object that does not
  # exist, so VSO logs a lookup failure and the rotation silently never recycles the pod.
  rolloutRestartTargets:
    - kind: StatefulSet
      name: "{{ .Release.Name }}-omada-controller"
