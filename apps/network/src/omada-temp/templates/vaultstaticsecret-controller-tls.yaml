# The shared `*.vpn.blueora.ng` wildcard, delivered into this namespace for the TEMPORARY
# controller to serve on its own :8043.
#
# WHY THE CONTROLLER NEEDS A CERTIFICATE AT ALL, when the mesh already terminates TLS: the mesh
# exposure RE-ENCRYPTS to the backend (`backend.tls` in ../../mesh-omada-temp/fleet.yaml) because
# Omada's :8088 answers every request with an absolute redirect to its own HTTPS port, which
# behind a mesh peer dead-ends on a port no listener binds (the task-7.10 failure). Talking HTTPS
# to :8043 avoids the redirect entirely — but Gateway API requires `validation.hostname` on a
# BackendTLSPolicy, so Envoy really does verify what this controller presents.
#
# Serving the wildcard satisfies that with nothing issued: `*.vpn.blueora.ng` covers
# `omada-temp.vpn.blueora.ng`, which is the name Envoy is told to validate. The real controller
# instead presents its permanent, device-facing `omada.blueora.ng` certificate; a throwaway does
# not warrant its own ACME order, nor its own entry in a public Certificate Transparency log.
#
# Same OpenBao entry every mesh exposure reads (`kv/mesh-tls`, published once by
# apps/secret/src/mesh-tls), so this adds no new source of truth. It is a SEPARATE Secret from
# the one the mesh exposure creates (`omada-temp-mesh-tls`) even though the bytes are identical:
# that one is owned by the mesh-service release and read by Envoy Gateway over xDS, while this one
# is owned by this release and MOUNTED by the controller pod. Two releases must never claim one
# object.
#
# `type: kubernetes.io/tls` because the chart mounts it as a keypair, and `rolloutRestartTargets`
# because the controller reads its certificate from disk at startup only.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: omada-temp-controller-tls
  namespace: {{ .Release.Namespace }}
spec:
  type: kv-v2
  mount: {{ .Values.tls.mount | quote }}
  path: {{ .Values.tls.path | quote }}
  refreshAfter: 1h
  destination:
    name: omada-temp-controller-tls
    create: true
    type: kubernetes.io/tls
    transformation:
      # The kv entry already stores `tls.crt` and `tls.key` under exactly those names; only the
      # operator's `_raw` field needs dropping, which would otherwise ship a second copy of the
      # private key for no consumer.
      excludeRaw: true
  # StatefulSet, NOT Deployment — the omada-controller chart renders a StatefulSet (its pod is
  # `<release>-omada-controller-0`). A `kind: Deployment` target names an object that does not
  # exist, so VSO logs a lookup failure and the rotation silently never recycles the pod.
  rolloutRestartTargets:
    - kind: StatefulSet
      name: "{{ .Release.Name }}-omada-controller"
