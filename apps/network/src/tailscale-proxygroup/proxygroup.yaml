# The network cluster's ingress ProxyGroup, giving the Omada Tailscale
# LoadBalancer Service a STABLE tailnet identity (a Service VIP). The Omada Service
# (apps/network/src/omada) is annotated `tailscale.com/proxy-group: network-ingress`
# so its address stays put as the underlying proxy Pods churn — which is what keeps
# the omada.network.vgijssel.nl A record from churning (SPEC success criteria).
#
# This is the network analogue of the secret cluster's `secret-ingress` ProxyGroup;
# each cluster owns its own so the two never collide on the tailnet.
#
# type: ingress -> expose in-cluster Services to the tailnet.
# replicas: 2   -> survives a proxy Pod restart with no VIP downtime.
#
# Cluster-scoped CR in its own bundle that dependsOn the tailscale-operator bundle, so
# the ProxyGroup CRD is established before this applies (a fresh-cluster install of the
# operator+CR in one Helm release would deadlock).
apiVersion: tailscale.com/v1alpha1
kind: ProxyGroup
metadata:
  name: network-ingress
spec:
  type: ingress
  replicas: 2
