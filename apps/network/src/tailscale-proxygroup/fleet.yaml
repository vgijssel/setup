# Raw-manifest Fleet bundle carrying the network cluster's ProxyGroups (cluster-scoped
# tailscale.com CRs): network-ingress (type: ingress — fronts Omada's Service VIP) and
# api-network (type: kube-apiserver — exposes the kube-apiserver on the tailnet at
# api-network.tail2c33e2.ts.net, replacing the retired nginx apiserver-proxy).
# dependsOn the tailscale-operator bundle (label selector, portable across the standalone
# Fleet -> Rancher GitRepo move) so Fleet only deploys it once the operator's CRDs are
# established — otherwise a fresh-cluster install deadlocks.
#
# Applied only on the network cluster (network:apply lists it); the secret cluster runs
# its own secret-ingress ProxyGroup instead.
dependsOn:
  - selector:
      matchLabels:
        fleet.vgijssel.nl/bundle: tailscale-operator
# network-ONLY. bin/fleet-apply applies every bundle globally, so target the network
# cluster explicitly (previously scoped only by network:apply's static list) — this
# keeps the bundle off the secret cluster.
targetCustomizations:
  - name: network
    clusterSelector:
      matchLabels:
        cluster.vgijssel.nl/name: network
