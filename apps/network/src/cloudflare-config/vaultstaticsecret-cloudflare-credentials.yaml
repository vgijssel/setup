# Cloudflare credential for the provider-opentofu Workspaces, from kv/cloudflare.
#
# Migrated from External Secrets Operator to Vault Secrets Operator. Nothing about the resulting
# Secret changes -- same name, namespace and keys -- so the consumer needs no edit.
#
# refreshAfter replaces ESO's refreshInterval. There is no lease on a kv entry, so this interval
# is the only thing driving a re-read.
#
# The login ServiceAccount is defined once per cluster in ../config/serviceaccounts-vso.yaml.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: cloudflare-credentials
  namespace: crossplane-system
spec:
  type: kv-v2
  mount: kv
  path: cloudflare
  refreshAfter: 1h
  destination:
    name: cloudflare-credentials
    create: true
    transformation:
      templates:
        token:
          text: '{{ get .Secrets "credential" }}'
      excludeRaw: true
      excludes:
        - .*
