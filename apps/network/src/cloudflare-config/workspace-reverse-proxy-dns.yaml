# ReverseProxyDNS: a single inline-OpenTofu Workspace that, in one module, queries NetBird
# for its reverse-proxy cluster address, registers vgijssel.nl as a NetBird custom
# reverse-proxy domain, AND points the Cloudflare wildcard CNAME at that cluster — the full
# "own the reverse-proxy DNS" resource. Replaces external-dns for this name and keeps
# everything in lock-step with NetBird: no hardcoded target.
#
# Providers:
#   - netbirdio/netbird: data.netbird_reverse_proxy_clusters -> clusters[].address (the value
#     NetBird documents as the CNAME target, currently "eu1.netbird.services"), and
#     netbird_reverse_proxy_domain to register vgijssel.nl (validated against that cluster via
#     the wildcard CNAME below). Auth: NB_PAT env (ESO netbird-mgmt-api-token); management_url
#     defaults to https://api.netbird.io. We take clusters[0] (single-region homelab).
#   - cloudflare/cloudflare v5: cloudflare_dns_record. Auth: CLOUDFLARE_API_TOKEN env (ESO
#     cloudflare-credentials). proxied=false (DNS-only / grey-cloud); ttl=1 = automatic.
# record_name is the apex wildcard covering the NetBird-minted per-service hostnames; the
# reverse_proxy_domain is validated via that wildcard, so it depends_on the CNAME.
# `tofu init` pulls both plugins (arm64) at runtime; state is the shared kubernetes backend
# (ProviderConfig). Reconciles only when the network cluster can reach api.netbird.io.
apiVersion: opentofu.upbound.io/v1beta1
kind: Workspace
metadata:
  name: reverse-proxy-dns
spec:
  forProvider:
    source: Inline
    env:
      - name: NB_PAT
        secretKeyRef:
          namespace: crossplane-system
          name: netbird-mgmt-api-token
          key: token
      - name: CLOUDFLARE_API_TOKEN
        secretKeyRef:
          namespace: crossplane-system
          name: cloudflare-credentials
          key: token
    vars:
      - key: zone_id
        value: 8e5a9db0a62108e5fff87072dbb939d0 # vgijssel.nl
      - key: record_name
        value: "*.vgijssel.nl"
      - key: proxy_domain
        value: vgijssel.nl
    module: |
      terraform {
        required_providers {
          netbird = {
            source  = "netbirdio/netbird"
            version = "~> 0.0.9"
          }
          cloudflare = {
            source  = "cloudflare/cloudflare"
            version = "~> 5.0"
          }
        }
      }

      provider "netbird" {}
      provider "cloudflare" {}

      variable "zone_id" { type = string }
      variable "record_name" { type = string }
      variable "proxy_domain" { type = string }

      data "netbird_reverse_proxy_clusters" "all" {}

      resource "cloudflare_dns_record" "reverse_proxy" {
        zone_id = var.zone_id
        name    = var.record_name
        type    = "CNAME"
        content = data.netbird_reverse_proxy_clusters.all.clusters[0].address
        ttl     = 1
        proxied = false
      }

      # Register vgijssel.nl as a NetBird custom reverse-proxy domain, validated against the
      # cluster via the wildcard CNAME above — hence depends_on, so the DNS record exists
      # before NetBird attempts validation. `validated` flips true async once NetBird checks.
      resource "netbird_reverse_proxy_domain" "vgijssel" {
        domain         = var.proxy_domain
        target_cluster = data.netbird_reverse_proxy_clusters.all.clusters[0].address

        depends_on = [cloudflare_dns_record.reverse_proxy]
      }

      output "cluster_address" {
        value = data.netbird_reverse_proxy_clusters.all.clusters[0].address
      }
      output "record_id" {
        value = cloudflare_dns_record.reverse_proxy.id
      }
      output "domain_id" {
        value = netbird_reverse_proxy_domain.vgijssel.id
      }
      output "domain_validated" {
        value = netbird_reverse_proxy_domain.vgijssel.validated
      }
  providerConfigRef:
    name: default
