# Raw-manifest Fleet bundle: the provider-opentofu ProviderConfig + the ESO ExternalSecrets
# feeding it the Cloudflare + NetBird tokens, and the inline-OpenTofu Workspace MRs that manage
# the NetBird reverse-proxy DNS/domains and services:
#   - reverse-proxy-dns.yaml            : vgijssel.nl domain + *.vgijssel.nl CNAME.
#   - reverse-proxy-dns-secret.yaml     : secret.vgijssel.nl domain + *.secret.vgijssel.nl CNAME
#                                         (the secret cluster's proxy domain).
#   - reverse-proxy-services.yaml       : the OpenBao NetBird-only private service
#                                         (Mastercard/restapi), openbao.secret.vgijssel.nl.
#
# dependsOn crossplane-provider (label selector): the opentofu.upbound.io CRDs (ProviderConfig,
# Workspace) are registered by the provider, so it must be installed before these CRs apply —
# else the atomic Helm release fails on unknown CRDs. (Same split/ordering as secret's
# openbao-config -> crossplane-provider.)
dependsOn:
  - selector:
      matchLabels:
        fleet.vgijssel.nl/bundle: crossplane-provider
labels:
  fleet.vgijssel.nl/bundle: cloudflare-config
defaultNamespace: crossplane-system
# network-ONLY. bin/fleet-apply applies every bundle globally, so target the network
# cluster explicitly.
targetCustomizations:
  - name: network
    clusterSelector:
      matchLabels:
        cluster.vgijssel.nl/name: network
