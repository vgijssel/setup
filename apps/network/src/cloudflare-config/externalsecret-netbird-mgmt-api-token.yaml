# Syncs the network cluster's NetBird management PAT from OpenBao into crossplane-system so
# the reverse-proxy-dns Workspace can read it as the NB_PAT env var (the netbirdio/netbird
# TF provider's admin token). Same source the operator uses (kv/network-netbird-operator#
# access_token — a per-cluster admin PAT); synced into crossplane-system (not reused from the
# netbird namespace) so the provider-opentofu SA's RBAC — scoped to crossplane-system — can
# read it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbird-mgmt-api-token
  namespace: crossplane-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: netbird-mgmt-api-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: network-netbird-operator
        property: access_token
