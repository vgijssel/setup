# SidecarProfile that injects a netbird client sidecar into the external-secrets CONTROLLER
# pod (network cluster), turning it into a first-class NetBird peer so it can resolve + reach
# OpenBao's private NetBird-only reverse-proxy service (openbao.secret.vgijssel.nl) over the
# mesh — the cross-cluster secret path. A routing peer alone can't do this: the workload must
# ORIGINATE traffic onto the overlay as itself, which is exactly what a client sidecar is for
# (https://docs.netbird.io/use-cases/kubernetes, "Client Sidecar").
#
# podSelector matches ONLY the controller (app.kubernetes.io/name=external-secrets) — the
# webhook + cert-controller pods have distinct name labels and don't touch OpenBao, so they
# stay off the mesh (one peer per pod is the sidecar cost).
#
# On operator v0.7.0 the injected sidecar rewrites /etc/resolv.conf IN PLACE (no shared-volume
# indirection), so the controller container inherits the mesh resolver directly — no manual
# resolv-conf mount and no Deployment volume-collision (both of which the v0.8.0 sidecar-DNS
# regression #383 would force; that's why the operator is pinned to 0.7.0, see
# third_party/vendir/vendir.yml). The profile must exist before the pod is (re)created, so a
# rollout of the ESO controller triggers injection.
apiVersion: netbird.io/v1alpha1
kind: SidecarProfile
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  setupKeyRef:
    name: external-secrets
  podSelector:
    matchLabels:
      app.kubernetes.io/name: external-secrets
  injectionMode: Sidecar
