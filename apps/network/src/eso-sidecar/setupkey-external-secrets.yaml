# SetupKey enrolling the external-secrets controller's injected netbird sidecar into group
# `network-k8s` — one of the access_groups on the OpenBao NetBird-only reverse-proxy service
# (apps/secret/src/cloudflare-config/workspace-reverse-proxy-services.yaml). Membership in an
# access_group is what lets this peer reach the private service over the mesh.
#
# Referenced by the SidecarProfile via setupKeyRef (which points at THIS SetupKey CR; the
# operator mints the key in NetBird and stores it in Secret `setup-key-external-secrets`, which
# the injected sidecar consumes as NB_SETUP_KEY). `ephemeral: true` because the ESO controller
# is a Deployment — a per-replica peer that NetBird auto-reaps after the pod goes away, so a
# rollout/restart doesn't accumulate stale peers. autoGroups references the group by name.
apiVersion: netbird.io/v1alpha1
kind: SetupKey
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  name: external-secrets
  ephemeral: true
  autoGroups:
    - name: network-k8s
