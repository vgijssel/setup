# TEMPORARY bundle — exposes the parallel ../omada-temp controller on the mesh as
# `omada-temp.vpn.blueora.ng`. Deleted together with ../omada-temp once the migration round-trip
# has moved the fleet onto `omada.vpn.blueora.ng`. See ../omada-temp/Chart.yaml for the plan.
#
# It carries the FULL device port space, not just the UI, because the devices genuinely inform to
# this controller while they are parked on it — the whole point of the detour is that both
# migration legs are ordinary supported migrations between two real controllers, and a
# destination the devices cannot actually reach would fail the first leg.
#
# It also opts into `publicDns`, for the same reason the real exposure does: the APs and switches
# cannot run a mesh client, so they resolve this hostname from PUBLIC DNS to the peer's current
# overlay address and reach it over the LAN gateway's `100.65.0.0/16 -> PiKVM` static route. That
# route is a /16, so it already covers this second peer with no routing change.
#
# ONE single-level `file://` dependency, never a nested umbrella: `.gitignore` ignores
# `apps/**/charts/`, and `bin/fleet-apply` builds only the TOP-LEVEL bundle chart — helm does not
# recurse into a subchart's own `file://` deps, so a wrapped subchart would silently vanish.
#
# Chart.lock + charts/*.tgz are gitignored under apps/network/src (Fleet builds the dep at apply
# time); do not commit them.
apiVersion: v2
name: mesh-omada-temp
description: TEMPORARY — parallel Omada controller on the mesh at omada-temp.vpn.blueora.ng
type: application
version: 1.0.0
dependencies:
  - name: mesh-service
    version: 1.0.0
    repository: file://../../../platform/src/mesh-service
