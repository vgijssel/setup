# RBAC for the routing-peer GROUP reconciler (cronjob-router-groups.yaml).
#
# Distinct from the sibling netbird-router-watchdog SA on purpose: the watchdog only needs to
# observe and recycle the pod, while this one additionally reads the operator's NetBird PAT and
# the netbird.io CR statuses. Keeping them apart means the watchdog — which runs an exec into a
# pod — never holds a credential that can rewrite account state.
#
# Namespaced to `netbird`; it never touches anything outside this namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: netbird-router-groups
  namespace: netbird
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: netbird-router-groups
  namespace: netbird
rules:
  # The operator's management PAT. resourceNames-scoped: this is an account-admin credential, so
  # the reconciler gets exactly the one Secret it needs and no blanket secret read.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
    resourceNames: [netbird-mgmt-api-key]
  # `.status.setupKeyID` of the routing peer, and `.status.groupID` of both groups. Every id this
  # job uses is read from a CR status rather than hardcoded, so it survives a cluster rebuild
  # (which regenerates all of them).
  - apiGroups: [netbird.io]
    resources: [nbroutingpeers, nbgroups, groups]
    verbs: [get, list]
  # Recycle the routing peer via `kubectl rollout restart` — auto_groups apply at ENROLMENT only,
  # so a key change does nothing until the peer re-registers.
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: netbird-router-groups
  namespace: netbird
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: netbird-router-groups
subjects:
  - kind: ServiceAccount
    name: netbird-router-groups
    namespace: netbird
