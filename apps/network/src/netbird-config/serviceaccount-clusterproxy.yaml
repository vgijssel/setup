# Impersonation ServiceAccount for the NetBird ClusterProxy. The proxy peers
# authenticate to the kube-apiserver AS this ServiceAccount and inject
# Impersonate-User/Impersonate-Group headers derived from the CALLER's NetBird identity
# (their peer + groups), so kubectl through the ClusterProxy (netbird kubernetes
# write-kubeconfig; no custom domain) maps a NetBird identity onto Kubernetes RBAC. The SA
# therefore needs only the `impersonate` verb; what
# an impersonated identity may actually do is governed by ordinary RBAC bindings
# (e.g. the OpenBao group bound to system:service-account-issuer-discovery for JWKS).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: netbird-clusterproxy
  namespace: netbird
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: netbird-clusterproxy-impersonator
rules:
  - apiGroups: [""]
    resources: [users, groups, serviceaccounts]
    verbs: [impersonate]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: netbird-clusterproxy-impersonator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: netbird-clusterproxy-impersonator
subjects:
  - kind: ServiceAccount
    name: netbird-clusterproxy
    namespace: netbird
