# NetBird ClusterProxy exposing this cluster's kube-apiserver over the mesh, replacing
# the retired tailnet kube-apiserver exposure. The operator provisions a
# Deployment of NetBird proxy peers (group network-k8s) that front the apiserver with
# per-caller impersonation (see serviceaccount-clusterproxy.yaml). Reachable NetBird-
# natively via `netbird kubernetes write-kubeconfig`. NOTE: NetBird ClusterProxy does not
# support custom domains yet, so there is NO api.network.vgijssel.nl endpoint — kubectl
# uses the write-kubeconfig endpoint only. clusterName is immutable.
#
# The network cluster's anonymous JWKS (/openid/v1/jwks) does NOT ride this proxy — it is
# served by the separate jwks-mirror bundle (anonymous apiserver read) and reached
# cross-cluster via the jwks-gateway over NetBird. The anonymous
# clusterrolebinding-oidc-discovery in ../config stays to authorize that read.
apiVersion: netbird.io/v1alpha1
kind: ClusterProxy
metadata:
  name: api-network
  namespace: netbird
spec:
  clusterName: network
  apiServer: https://kubernetes.default.svc.cluster.local/
  serviceAccountName: netbird-clusterproxy
  groups:
    - localRef:
        name: network-k8s
