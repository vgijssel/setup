# Tailnet exposure for this cluster's Kubernetes API: a single Tailscale LoadBalancer
# Service fronted by the network-ingress ProxyGroup (a stable VIP), advertising the
# svc:api-network Service. external-dns publishes the VIP as the A record for
# api.network.vgijssel.nl. The backing Pod (nginx, apiserver-proxy) terminates the LE
# cert and reverse-proxies to the in-cluster kube-apiserver — this is the network
# analogue of the Omada Service, reusing the same network-ingress ProxyGroup (one
# ProxyGroup can advertise several Service VIPs).
#
# L3/TCP only (port 443 -> 8443): TLS is terminated by nginx with the public LE cert, so
# no *.ts.net cert ever appears in the path.
#
# Requires the tailnet policy (apps/network/src/tailscale-config): the svc:api-network
# autoApprover (so the ProxyGroup may advertise the VIP) + a group:admin grant (kubectl
# over the tailnet) + a tag:k8s grant (so the SECRET cluster's egress can reach the JWKS
# here — used in T19). Without the autoApprover the VIP is never advertised.
apiVersion: v1
kind: Service
metadata:
  name: apiserver-proxy
  namespace: apiserver-proxy
  annotations:
    tailscale.com/hostname: api-network
    tailscale.com/proxy-group: network-ingress
    external-dns.alpha.kubernetes.io/hostname: api.network.vgijssel.nl
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app.kubernetes.io/name: apiserver-proxy
  ports:
    - name: https
      port: 443
      targetPort: 8443
      protocol: TCP
