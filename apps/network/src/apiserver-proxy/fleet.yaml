# Portable Fleet bundle for the kube-apiserver reverse proxy that exposes this cluster's
# Kubernetes API on the tailnet at https://api.network.vgijssel.nl with a valid LE cert
# (SPEC Extension T18). Raw manifests: nginx ConfigMap + Deployment, the Tailscale
# LoadBalancer Service (svc:api-network VIP), and the cert-manager Certificate. Owns the
# apiserver-proxy namespace.
#
# dependsOn the tailscale-operator bundle (label selector, portable across the standalone
# Fleet -> Rancher GitRepo move) so the operator + its loadBalancerClass=tailscale are
# established before the LoadBalancer Service applies. The Certificate needs the
# cert-manager CRDs and the cloudflare-api-token Secret; until those exist Fleet
# error-and-retries, which is expected during bootstrap.
labels:
  fleet.vgijssel.nl/bundle: network-apiserver-proxy
defaultNamespace: apiserver-proxy
dependsOn:
  - selector:
      matchLabels:
        fleet.vgijssel.nl/bundle: tailscale-operator
# network-ONLY. bin/fleet-apply applies every bundle globally, so target the network
# cluster explicitly (previously scoped only by network:apply's static list) — this
# keeps the bundle off the secret cluster.
targetCustomizations:
  - name: network
    clusterSelector:
      matchLabels:
        cluster.vgijssel.nl/name: network
