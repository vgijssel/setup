# The nginx reverse proxy that terminates the api.network.vgijssel.nl LE cert and
# forwards to the in-cluster kube-apiserver (see configmap-apiserver-proxy.yaml).
# Fronted by the Tailscale LoadBalancer Service (service-apiserver-proxy.yaml) on the
# network-ingress ProxyGroup, so it gets the stable svc:api-network VIP.
#
# Hardened: pinned by digest, unprivileged (uid 101, the nginx-unprivileged default),
# read-only root filesystem with writable emptyDir scratch (/tmp, /var/cache/nginx).
# The default ServiceAccount token is mounted only for its ca.crt (upstream TLS
# verification) — the proxy never calls the API with it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apiserver-proxy
  namespace: apiserver-proxy
  labels:
    app.kubernetes.io/name: apiserver-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: apiserver-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apiserver-proxy
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          # nginxinc/nginx-unprivileged:1.27.3-alpine (multi-arch incl. arm64 for vind).
          image: nginxinc/nginx-unprivileged:1.27.3-alpine@sha256:9e7238f579a54582263a960d1b0094b4a3ecce641342eda3f8e2ff82b1703d2b
          ports:
            - name: https
              containerPort: 8443
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            tcpSocket:
              port: 8443
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8443
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: tls
              mountPath: /tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
      volumes:
        - name: config
          configMap:
            name: apiserver-proxy
        - name: tls
          secret:
            # Written by cert-manager from certificate-apiserver-proxy.yaml.
            secretName: api-network-vgijssel-nl-tls
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
