# nginx config for the kube-apiserver reverse proxy. This is what makes
# https://api.network.vgijssel.nl a first-class tailnet endpoint for THIS cluster's
# Kubernetes API with a *valid public* Let's Encrypt cert (SPEC Extension T18):
#
#   tailnet client ──TLS(api.network.vgijssel.nl)──▶ this nginx ──TLS──▶ kube-apiserver
#
# nginx terminates the LE cert (mounted at /tls from the cert-manager Secret
# api-network-vgijssel-nl-tls) and reverse-proxies every path to the in-cluster
# apiserver at https://kubernetes.default.svc, verifying the upstream against the
# ServiceAccount CA. It does NOT authenticate — the client's Authorization header is
# passed straight through and the apiserver applies its own authn/authz (anonymous
# callers can still read only the two OIDC discovery URLs, per
# ../config/clusterrolebinding-oidc-discovery.yaml). This is why OpenBao on the secret
# cluster can fetch this cluster's JWKS here over a plain, publicly-trusted HTTPS URL —
# no MagicDNS name, no CoreDNS rewrite, no SNI gymnastics (T19 retires those).
#
# Runs read-only-rootfs + unprivileged (uid 101), so pid/temp paths point at writable
# emptyDir mounts (/tmp) and it listens on 8443 (mapped to 443 by the Service).
apiVersion: v1
kind: ConfigMap
metadata:
  name: apiserver-proxy
  namespace: apiserver-proxy
data:
  nginx.conf: |
    worker_processes auto;
    error_log /dev/stderr warn;
    pid /tmp/nginx.pid;

    events {
        worker_connections 1024;
    }

    http {
        access_log /dev/stdout;

        # Unprivileged, read-only-rootfs friendly: keep all scratch under /tmp (emptyDir).
        client_body_temp_path /tmp/client_temp;
        proxy_temp_path       /tmp/proxy_temp;
        fastcgi_temp_path     /tmp/fastcgi_temp;
        uwsgi_temp_path       /tmp/uwsgi_temp;
        scgi_temp_path        /tmp/scgi_temp;

        server {
            listen 8443 ssl;
            server_name api.network.vgijssel.nl;

            ssl_certificate     /tls/tls.crt;
            ssl_certificate_key /tls/tls.key;

            # kube API needs unbuffered streaming (watch/log/exec) and large bodies (apply).
            proxy_buffering         off;
            proxy_request_buffering off;
            client_max_body_size    0;

            location / {
                # Static upstream name — nginx resolves kubernetes.default.svc once at
                # startup via the cluster DNS in /etc/resolv.conf.
                proxy_pass https://kubernetes.default.svc:443;

                # Verify the apiserver's serving cert against the in-cluster CA and send
                # the matching SNI so validation succeeds.
                proxy_ssl_verify              on;
                proxy_ssl_trusted_certificate /var/run/secrets/kubernetes.io/serviceaccount/ca.crt;
                proxy_ssl_name                kubernetes.default.svc;
                proxy_ssl_server_name         on;

                proxy_http_version 1.1;
                proxy_set_header   Host kubernetes.default.svc;
                # Pass the caller's bearer token through untouched — the apiserver authenticates.
                proxy_pass_request_headers on;
                # Support watch/exec/port-forward upgrades.
                proxy_set_header Connection "";
                proxy_set_header Upgrade    $http_upgrade;

                proxy_read_timeout 1h;
                proxy_send_timeout 1h;
            }
        }
    }
