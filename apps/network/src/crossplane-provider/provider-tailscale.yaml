# millstonehq/provider-upjet-tailscale — the Crossplane provider that reconciles the
# tailnet policy file (src/tailscale-config), replacing the terranetes OpenTofu module.
# It wraps the tailscale/tailscale Terraform provider (0.22.0) and is arm64-native.
#
# Pinned by tag AND multi-arch index digest (v0.1.0 is the only published version and
# has no git tags/releases). runtimeConfigRef points at the DeploymentRuntimeConfig
# that fixes the pod's ServiceAccount name to `provider-tailscale`.
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-tailscale
spec:
  package: ghcr.io/millstonehq/provider-tailscale:v0.1.0@sha256:71b2e9b3a664d4bbb6c5708176cb0f19cd20ae8e8bf2edcc6bc07bb3faa5c599
  runtimeConfigRef:
    apiVersion: pkg.crossplane.io/v1beta1
    kind: DeploymentRuntimeConfig
    name: provider-tailscale
