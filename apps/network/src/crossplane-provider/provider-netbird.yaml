# netbird-crossplane-provider — the Crossplane provider that reconciles NetBird account
# config (Networks, NetworkRouters, NetworkResources, Groups, Policies, ...) declaratively
# via the NetBird management API, replacing imperative API calls. Pinned by tag AND
# multi-arch index digest (v0.4.5 publishes linux/amd64 + linux/arm64, so it runs on this
# arm64 vind host; Crossplane's amd64 package-fetch still resolves the runtime pod to
# arm64 — see [[crossplane-amd64-package-fetch]]).
#
# Beta provider: pinned to v0.4.5 (latest). The ProviderConfig (a
# netbird.crossplane.io CR) lives in the separate netbird-config bundle so this bundle's
# atomic Helm release doesn't fail on a CR whose CRD the Provider hasn't installed yet.
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-netbird
spec:
  package: ghcr.io/netbirdio/netbird-crossplane-provider:v0.4.5@sha256:c118695957dfec2f4a42b8bc9f0827b9f62b2f916c6789a1f72afc65bd55bace
