# Raw-manifest Fleet bundle: the netbird-crossplane-provider Provider (a
# pkg.crossplane.io kind, whose CRD comes from crossplane core). Installing the provider
# is what registers the netbird.crossplane.io CRDs (NbNetwork, NbNetworkRouter,
# NbNetworkResource, NbGroup, NbPolicy, ...).
#
# The NetBird ProviderConfig (a netbird.crossplane.io CR) deliberately lives in the
# netbird-config bundle, NOT here: Fleet deploys each bundle as one atomic Helm release,
# so a ProviderConfig in the same bundle as the Provider would fail the whole release
# (its CRD doesn't exist until the Provider is installed). Splitting lets this bundle
# apply cleanly; netbird-config then dependsOn it and carries the ProviderConfig + the
# Nb* managed resources.
#
# dependsOn crossplane (label selector): the pkg.crossplane.io CRDs must exist first.
dependsOn:
  - selector:
      matchLabels:
        fleet.vgijssel.nl/bundle: crossplane
labels:
  fleet.vgijssel.nl/bundle: crossplane-provider
defaultNamespace: crossplane-system
# network-ONLY.
targetCustomizations:
  - name: network
    clusterSelector:
      matchLabels:
        cluster.vgijssel.nl/name: network
