# Raw-manifest Fleet bundle: the provider-tailscale Provider + its DeploymentRuntimeConfig
# (both pkg.crossplane.io kinds, whose CRDs come from crossplane core). Installing the
# provider is what registers the acl.tailscale.upbound.io CRDs.
#
# The tailscale ProviderConfig + the ACL managed resource deliberately live in the
# tailscale-config bundle, NOT here: Fleet deploys each bundle as one atomic Helm
# release, so a ProviderConfig/ACL in the same bundle as the Provider would fail the
# whole release (their CRDs don't exist until the Provider is installed) and the
# Provider would never get created. Splitting lets this bundle apply cleanly;
# tailscale-config then dependsOn it and carries the ProviderConfig + ACL.
#
# dependsOn crossplane (label selector): the pkg.crossplane.io CRDs (Provider,
# DeploymentRuntimeConfig) must exist before these CRs apply.
dependsOn:
  - selector:
      matchLabels:
        fleet.vgijssel.nl/bundle: crossplane
labels:
  fleet.vgijssel.nl/bundle: crossplane-provider
defaultNamespace: crossplane-system
# network-ONLY (see crossplane bundle): the secret cluster runs its own provider-vault.
targetCustomizations:
  - name: network
    clusterSelector:
      matchLabels:
        cluster.vgijssel.nl/name: network
