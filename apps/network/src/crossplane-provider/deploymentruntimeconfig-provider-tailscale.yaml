# Pin the provider-tailscale pod's ServiceAccount to a STABLE name. Without this,
# Crossplane names the provider SA after the ProviderRevision hash
# (provider-tailscale-<hash>), which changes on every provider upgrade. Fixing the
# serviceAccountTemplate name makes Crossplane create + own an SA called exactly
# `provider-tailscale` in crossplane-system (and bind the provider RBAC to it), giving
# a stable identity the ProviderConfig / any RBAC can rely on across upgrades — mirrors
# the provider-vault pattern in apps/secret/src/crossplane-provider.
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-tailscale
spec:
  serviceAccountTemplate:
    metadata:
      name: provider-tailscale
