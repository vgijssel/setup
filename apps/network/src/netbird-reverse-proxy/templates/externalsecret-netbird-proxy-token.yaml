# Surfaces the BYOP proxy's management token from OpenBao into the `netbird` namespace as a
# Secret named `netbird-proxy-token` (key `token`), which the netbird-reverse-proxy chart
# consumes via proxy.managementServer.auth.existingSecret. The token was minted once via
# POST /api/reverse-proxies/proxy-tokens (name network-byop-proxy) and written to
# kv/network-netbird-proxy#token — it is shown only once by the API, so it lives in OpenBao,
# not in git. Reads over the mesh via the `openbao` ClusterSecretStore (same store the rest
# of the network cluster's ExternalSecrets use).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbird-proxy-token
  namespace: netbird
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: netbird-proxy-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: network-netbird-proxy
        property: token
