# Portable Fleet bundle for Crossplane core on the network cluster. Fleet detects the
# umbrella Chart.yaml here and deploys it with values.yaml into crossplane-system,
# resolving the file:// chart dependency against the vendored chart at build time.
#
# New on the network cluster (secret already had its own): core provides the
# pkg.crossplane.io CRDs (Provider, DeploymentRuntimeConfig, ...) that the
# crossplane-provider bundle (netbird-crossplane-provider, and later Cloudflare)
# dependsOn.
labels:
  fleet.vgijssel.nl/bundle: crossplane
defaultNamespace: crossplane-system
helm:
  releaseName: crossplane
# network-ONLY. Under bin/fleet-apply the selector alone is enough, but a Rancher GitRepo
# appends its own catch-all target — so the terminal doNotDeploy entry below is what yields
# no BundleDeployment on a cluster that is not labelled `network`.
targetCustomizations:
  - name: network
    clusterSelector:
      matchLabels:
        cluster.vgijssel.nl/name: network
  # Terminal catch-all. Targets are first-match-wins and a GitRepo APPENDS its own target
  # after these, so without this a non-matching cluster falls through to it and deploys with
  # default values. Keeps this bundle off every cluster not named above. See bin/fleet-lint-targets.
  - name: none
    doNotDeploy: true
    clusterSelector: {}
