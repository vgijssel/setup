# Crossplane core runs with upstream defaults (single replica). Values are nested
# under the `crossplane` dependency key.
#
# Providers are NOT auto-installed here: provider.packages stays empty and the
# netbird-crossplane-provider Provider + ProviderConfig are a separate bundle
# (src/crossplane-provider) that dependsOn this one, so the pkg.crossplane.io CRDs
# are established by core before the Provider CR applies. The image is multi-arch
# (arm64), so no nodeSelector/qemu is needed on this host.
crossplane:
  provider:
    packages: []
  configuration:
    packages: []
