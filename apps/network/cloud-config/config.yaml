# Kairos cloud-config for `network` — passed at boot as user_data.
#
# SKELETON (T0): minimal admin access only (user + SSH key). This file is an OpenTofu
# templatefile() template: ${...} placeholders are single-line scalars substituted
# before boot, so secrets (Tailscale authkey, Cloudflare token, Netdata claim) land only
# in user_data / private TF state — never on disk or in git. Locally (QEMU), the same
# file is rendered with test values and delivered via a NoCloud datasource (see the
# vm-up task in moon.yml).
#
# First-boot service wiring (authkey join, Netdata claim, etc.) is added per service in
# later tasks (T2-T6).

#cloud-config

users:
  - name: kairos
    # Kairos' default admin group set; passwordless sudo for the operator.
    groups:
      - admin
    ssh_authorized_keys:
      - "${ssh_public_key}"

stages:
  boot:
    # Mount the persistent data Volume at /var/lib/data and bind every service state dir
    # onto it (runs every boot — /var is an ephemeral overlay on this immutable OS).
    - name: Mount data volume + service bind mounts
      commands:
        - /usr/bin/network-mount-data.sh ${data_device}
    # T2 Tailscale: reusable TAGGED authkey from 1Password (single-line scalars only, so
    # nothing disturbs YAML indentation). tailscale-up.service (oneshot) consumes this
    # after tailscaled is up; the file gates the join (no file → no external join).
    - name: Tailscale authkey (from 1Password via user_data)
      files:
        - path: /etc/tailscale/authkey.env
          permissions: "0600"
          owner: root:root
          content: |
            TS_AUTHKEY=${tailscale_authkey}
            TS_HOSTNAME=${tailscale_hostname}
            TS_TAG=${tailscale_tag}
    # T3 Netdata: claim into Netdata Cloud. netdata reads claim.conf on start and connects
    # via ACLK; the claim state lives under lib (relocated onto the Volume), so it survives
    # reboot/recreate. Secrets are single-line scalars from 1Password.
    - name: Netdata Cloud claim (from 1Password via user_data)
      files:
        - path: /etc/netdata/claim.conf
          permissions: "0640"
          owner: netdata:netdata
          content: |
            [global]
            url = ${netdata_claim_url}
            token = ${netdata_claim_token}
            rooms = ${netdata_claim_rooms}
    # T4 Caddy: non-secret config (admin FQDNs, ACME contact) + the zone-scoped Cloudflare
    # API token used for the DNS-01 challenge. network-caddy-run.sh adds TS_IP at start.
    - name: Caddy config + Cloudflare token (from 1Password via user_data)
      files:
        - path: /etc/caddy/caddy.env
          permissions: "0640"
          owner: root:root
          content: |
            CADDY_EMAIL=admin@${base_domain}
            CADDY_OMADA_FQDN=${omada_fqdn}
            CADDY_UNIFI_FQDN=${unifi_fqdn}
            CLOUDFLARE_API_TOKEN=${cloudflare_api_token}
