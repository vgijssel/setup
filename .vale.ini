StylesPath = .vale/styles
MinAlertLevel = warning
Packages = https://github.com/vale-cli/Google/releases/download/v0.6.3/Google.zip

[formats]
py = md

[*.{md,markdown,py}]
BasedOnStyles = Google
Google.Spelling = NO

[*.{md,markdown}]
TokenIgnores = (\b(?:SHALL|MUST|SHOULD|MAY|MUST NOT|SHALL NOT|GIVEN|WHEN|THEN|AND)\b)
BlockIgnores = (?m)(^## (?:ADDED|MODIFIED|REMOVED|RENAMED) Requirements$)
